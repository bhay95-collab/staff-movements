Screens:
  Data_Health:
    Properties:
      Fill: =RGBA(235, 242, 248, 1)
      ImagePosition: =ImagePosition.Fill
      OnVisible: |-
        =// Data health. Loads the wards, stock, open loans and audits; Select(btnBuild_Dh) lists every problem.
        Set(dhGroup, "All");
        Set(dhSev, "All");
        Set(dhWard, "All");
        Set(dhKind, "");
        Set(dhQ, "");
        Set(dhKpi, {Total: 0, High: 0, Ward: 0, Equip: 0, Audit: 0, Clean: 100, Patients: 0});
        ClearCollect(colDhWardOpts, Table({ Value: "All wards" }, { Value: "4A" }, { Value: "4B" }, { Value: "5A" }, { Value: "6A" }));
        Select(btnLoad_Dh)
    Children:
      - btnLoad_Dh:
          Control: Button@0.0.45
          Properties:
            Height: =10
            Width: =10
            Text: =""
            Visible: =false
            OnSelect: |-
              =Set(dhLoading, true);

              // every patient on every ward
              ClearCollect(colDhW, ForAll(
                      Ward_4A_Shared As w,
                      {
                          ID: w.ID, Ward: "4A", Patient: Trim(Coalesce(w.Patient, "")), UrnT: Trim(Text(w.URN)), BedT: Trim(Text(w.Bed)),
                          HasDOB: !IsBlank(w.DOB), HasDiag: !IsBlank(w.Diagnosis), Admit: w.'Admission Date', EDD: w.EDD,
                          HasPT: !(IsBlank(w.PT_Users) || CountRows(w.PT_Users) = 0)
                      }
                  ));
              Collect(colDhW, ForAll(
                      Ward_4B_Shared As w,
                      {
                          ID: w.ID, Ward: "4B", Patient: Trim(Coalesce(w.Patient, "")), UrnT: Trim(Text(w.URN)), BedT: Trim(Text(w.Bed)),
                          HasDOB: !IsBlank(w.DOB), HasDiag: !IsBlank(w.Diagnosis), Admit: w.'Admission Date', EDD: w.EDD,
                          HasPT: !(IsBlank(w.PT_Users) || CountRows(w.PT_Users) = 0)
                      }
                  ));
              Collect(colDhW, ForAll(
                      Ward_5A_Shared As w,
                      {
                          ID: w.ID, Ward: "5A", Patient: Trim(Coalesce(w.Patient, "")), UrnT: Trim(Text(w.URN)), BedT: Trim(Text(w.Bed)),
                          HasDOB: !IsBlank(w.DOB), HasDiag: !IsBlank(w.Diagnosis), Admit: w.'Admission Date', EDD: w.EDD,
                          HasPT: !(IsBlank(w.PT_Users) || CountRows(w.PT_Users) = 0)
                      }
                  ));
              Collect(colDhW, ForAll(
                      Ward_6A_Shared As w,
                      {
                          ID: w.ID, Ward: "6A", Patient: Trim(Coalesce(w.Patient, "")), UrnT: Trim(Text(w.URN)), BedT: Trim(Text(w.Bed)),
                          HasDOB: !IsBlank(w.DOB), HasDiag: !IsBlank(w.Diagnosis), Admit: w.'Admission Date', EDD: w.EDD,
                          HasPT: !(IsBlank(w.PT_Users) || CountRows(w.PT_Users) = 0)
                      }
                  ));
              RemoveIf(colDhW, IsBlank(Patient));

              // stock today
              ClearCollect(
                  colDhInv,
                  AddColumns(
                      Filter(Equipment_Inventory_SharePoint, IsActive <> false),
                      iCat, Coalesce(Category.Value, ""),
                      iType, Coalesce('Wheelchair Type'.Value, ""),
                      iWidth, Coalesce(Width.Value, ""),
                      iStatus, Coalesce(Status.Value, ""),
                      iWard, Coalesce(Ward.Value, ""),
                      iLoc, Coalesce(Location.Value, ""),
                      iDesc, Trim(Brand & " " & Model),
                      iUrn, Trim(Coalesce(URN, "")),
                      iPat, Trim(Coalesce('Patient Name', ""))
                  )
              );

              // items marked In Service and the service rows that are still open
              ClearCollect(colDhSvc, Filter(Service_Log, ServiceStatus.Value = "In Service"));

              // last 90 days: failed audits nobody was told about, and returns that matched no loan
              ClearCollect(
                  colDhAud,
                  Filter(Equipment_Audits, EscalationRequired = true && AuditDateTime >= DateAdd(Today(), -90, TimeUnit.Days))
              );
              ClearCollect(
                  colDhLeg,
                  Filter(Equipment_Usage_Log, EpisodeStatus.Value = "Legacy unmatched" && EventDateTime >= DateAdd(Today(), -90, TimeUnit.Days))
              );

              Set(dhLoading, false);
              Select(btnBuild_Dh)
      - btnBuild_Dh:
          Control: Button@0.0.45
          Properties:
            Height: =10
            Width: =10
            Text: =""
            Visible: =false
            OnSelect: |-
              =ClearCollect(
                  colDhIssues,
                  FirstN(
                      Table({ Group: "", Kind: "", Sev: "", SevN: 0, WardCode: "", Ref: "", Where: "", Who: "", Detail: "" }),
                      0
                  )
              );

              // ---------------- patients on the wards
              ForAll(
                  Filter(colDhW, UrnT = "") As p,
                  Collect(colDhIssues, { Group: "Ward", Kind: "No URN", Sev: "Medium", SevN: 2, WardCode: p.Ward, Ref: p.Ward & "|" & p.ID,
                      Where: "Ward " & p.Ward & If(p.BedT = "", "", "  ·  Bed " & p.BedT), Who: p.Patient, Detail: "The URN is empty, so equipment and audits cannot be matched to this patient." })
              );

              ForAll(
                  Filter(colDhW, !HasDOB) As p,
                  Collect(colDhIssues, { Group: "Ward", Kind: "No date of birth", Sev: "Low", SevN: 1, WardCode: p.Ward, Ref: p.Ward & "|" & p.ID,
                      Where: "Ward " & p.Ward & If(p.BedT = "", "", "  ·  Bed " & p.BedT), Who: p.Patient, Detail: "Date of birth is empty." })
              );

              ForAll(
                  Filter(colDhW, !HasDiag) As p,
                  Collect(colDhIssues, { Group: "Ward", Kind: "No diagnosis", Sev: "Medium", SevN: 2, WardCode: p.Ward, Ref: p.Ward & "|" & p.ID,
                      Where: "Ward " & p.Ward & If(p.BedT = "", "", "  ·  Bed " & p.BedT), Who: p.Patient, Detail: "No diagnosis chosen, so the patient is missing from the ward charts and staffing." })
              );

              ForAll(
                  Filter(colDhW, IsBlank(Admit)) As p,
                  Collect(colDhIssues, { Group: "Ward", Kind: "No admission date", Sev: "Medium", SevN: 2, WardCode: p.Ward, Ref: p.Ward & "|" & p.ID,
                      Where: "Ward " & p.Ward & If(p.BedT = "", "", "  ·  Bed " & p.BedT), Who: p.Patient, Detail: "Length of stay cannot be worked out." })
              );

              ForAll(
                  Filter(colDhW, !IsBlank(Admit) && Admit > Today()) As p,
                  Collect(colDhIssues, { Group: "Ward", Kind: "Admission date in the future", Sev: "Medium", SevN: 2, WardCode: p.Ward, Ref: p.Ward & "|" & p.ID,
                      Where: "Ward " & p.Ward & If(p.BedT = "", "", "  ·  Bed " & p.BedT), Who: p.Patient, Detail: "Admission date is " & Text(p.Admit, "d mmm yyyy") & "." })
              );

              ForAll(
                  Filter(colDhW, !HasPT) As p,
                  Collect(colDhIssues, { Group: "Ward", Kind: "No physio assigned", Sev: "Medium", SevN: 2, WardCode: p.Ward, Ref: p.Ward & "|" & p.ID,
                      Where: "Ward " & p.Ward & If(p.BedT = "", "", "  ·  Bed " & p.BedT), Who: p.Patient, Detail: "No physiotherapist is attached to this patient." })
              );

              ForAll(
                  Filter(colDhW, !IsBlank(EDD) && EDD < Today()) As p,
                  Collect(colDhIssues, { Group: "Ward", Kind: "EDD has passed", Sev: "High", SevN: 3, WardCode: p.Ward, Ref: p.Ward & "|" & p.ID,
                      Where: "Ward " & p.Ward & If(p.BedT = "", "", "  ·  Bed " & p.BedT), Who: p.Patient, Detail: "EDD was " & Text(p.EDD, "d mmm yyyy") & " (" & DateDiff(p.EDD, Today(), TimeUnit.Days) & " days ago). Update it or discharge the patient." })
              );

              ForAll(
                  Filter(colDhW, !IsBlank(EDD) && !IsBlank(Admit) && EDD < Admit) As p,
                  Collect(colDhIssues, { Group: "Ward", Kind: "EDD before admission", Sev: "High", SevN: 3, WardCode: p.Ward, Ref: p.Ward & "|" & p.ID,
                      Where: "Ward " & p.Ward & If(p.BedT = "", "", "  ·  Bed " & p.BedT), Who: p.Patient, Detail: "EDD " & Text(p.EDD, "d mmm yyyy") & " is before admission " & Text(p.Admit, "d mmm yyyy") & "." })
              );

              ForAll(
                  Filter(colDhW, IsBlank(EDD)) As p,
                  Collect(colDhIssues, { Group: "Ward", Kind: "No EDD", Sev: "Low", SevN: 1, WardCode: p.Ward, Ref: p.Ward & "|" & p.ID,
                      Where: "Ward " & p.Ward & If(p.BedT = "", "", "  ·  Bed " & p.BedT), Who: p.Patient, Detail: "No expected discharge date." })
              );

              ForAll(
                  Filter(colDhW As q, q.UrnT <> "" && CountRows(Filter(colDhW, UrnT = q.UrnT)) > 1) As p,
                  Collect(colDhIssues, { Group: "Ward", Kind: "Same URN twice", Sev: "High", SevN: 3, WardCode: p.Ward, Ref: p.Ward & "|" & p.ID,
                      Where: "Ward " & p.Ward & If(p.BedT = "", "", "  ·  Bed " & p.BedT), Who: p.Patient, Detail: "This URN is on " & CountRows(Filter(colDhW, UrnT = p.UrnT)) & " ward rows (" & Concat(Filter(colDhW, UrnT = p.UrnT), Ward, ", ") & ")." })
              );

              ForAll(
                  Filter(colDhW As q, q.BedT <> "" && CountRows(Filter(colDhW, Ward = q.Ward && BedT = q.BedT)) > 1) As p,
                  Collect(colDhIssues, { Group: "Ward", Kind: "Same bed twice", Sev: "High", SevN: 3, WardCode: p.Ward, Ref: p.Ward & "|" & p.ID,
                      Where: "Ward " & p.Ward & If(p.BedT = "", "", "  ·  Bed " & p.BedT), Who: p.Patient, Detail: "More than one patient is in bed " & p.BedT & " on ward " & p.Ward & "." })
              );

              // ---------------- stock
              ForAll(
                  Filter(colDhInv, iStatus = "Allocated" && !IsBlank('Date Signed Out') && DateDiff('Date Signed Out', Today(), TimeUnit.Days) > 42) As e,
                  Collect(colDhIssues, { Group: "Equipment", Kind: "Out over 6 weeks", Sev: "Medium", SevN: 2, WardCode: e.iWard, Ref: "E|" & e.ID,
                      Where: If(e.iWard = "", "No ward", "Ward " & e.iWard) & "  ·  " & e.iStatus, Who: e.Title & If(e.iDesc = "", "", "  ·  " & e.iDesc), Detail: "Out for " & DateDiff(e.'Date Signed Out', Today(), TimeUnit.Days) & " days with " & Coalesce(e.Physiotherapist, "no physio recorded") & "." })
              );

              ForAll(
                  Filter(colDhInv, iStatus = "Allocated" && IsBlank('Date Signed Out')) As e,
                  Collect(colDhIssues, { Group: "Equipment", Kind: "Allocated with no date", Sev: "Medium", SevN: 2, WardCode: e.iWard, Ref: "E|" & e.ID,
                      Where: If(e.iWard = "", "No ward", "Ward " & e.iWard) & "  ·  " & e.iStatus, Who: e.Title & If(e.iDesc = "", "", "  ·  " & e.iDesc), Detail: "Allocated but there is no sign-out date, so its time out cannot be counted." })
              );

              ForAll(
                  Filter(colDhInv, iStatus = "Allocated" && iUrn = "") As e,
                  Collect(colDhIssues, { Group: "Equipment", Kind: "Allocated with no URN", Sev: "High", SevN: 3, WardCode: e.iWard, Ref: "E|" & e.ID,
                      Where: If(e.iWard = "", "No ward", "Ward " & e.iWard) & "  ·  " & e.iStatus, Who: e.Title & If(e.iDesc = "", "", "  ·  " & e.iDesc), Detail: "Allocated to " & Coalesce(e.iPat, "nobody recorded") & " with no URN, so an audit cannot match it." })
              );

              ForAll(
                  Filter(colDhInv, iStatus = "Allocated" && IsBlank(Physiotherapist)) As e,
                  Collect(colDhIssues, { Group: "Equipment", Kind: "Allocated with no physio", Sev: "Medium", SevN: 2, WardCode: e.iWard, Ref: "E|" & e.ID,
                      Where: If(e.iWard = "", "No ward", "Ward " & e.iWard) & "  ·  " & e.iStatus, Who: e.Title & If(e.iDesc = "", "", "  ·  " & e.iDesc), Detail: "No physio is recorded, so a failed audit has nobody to be escalated to." })
              );

              ForAll(
                  Filter(colDhInv, OutOfService = true && iStatus in ["Available", "Allocated"]) As e,
                  Collect(colDhIssues, { Group: "Equipment", Kind: "Marked out of service but in use", Sev: "High", SevN: 3, WardCode: e.iWard, Ref: "E|" & e.ID,
                      Where: If(e.iWard = "", "No ward", "Ward " & e.iWard) & "  ·  " & e.iStatus, Who: e.Title & If(e.iDesc = "", "", "  ·  " & e.iDesc), Detail: "The out of service flag is set but the status is " & e.iStatus & "." })
              );

              ForAll(
                  Filter(colDhInv, iStatus = "In Service" && IsBlank(LookUp(colDhSvc, EquipmentItemID = ID))) As e,
                  Collect(colDhIssues, { Group: "Equipment", Kind: "In Service with no service record", Sev: "Medium", SevN: 2, WardCode: e.iWard, Ref: "E|" & e.ID,
                      Where: If(e.iWard = "", "No ward", "Ward " & e.iWard) & "  ·  " & e.iStatus, Who: e.Title & If(e.iDesc = "", "", "  ·  " & e.iDesc), Detail: "Status is In Service but there is no open Service_Log row." })
              );

              ForAll(
                  Filter(colDhInv, iCat = "") As e,
                  Collect(colDhIssues, { Group: "Equipment", Kind: "No category", Sev: "Medium", SevN: 2, WardCode: e.iWard, Ref: "E|" & e.ID,
                      Where: If(e.iWard = "", "No ward", "Ward " & e.iWard) & "  ·  " & e.iStatus, Who: e.Title & If(e.iDesc = "", "", "  ·  " & e.iDesc), Detail: "Category is empty so it will not appear in Find or Availability." })
              );

              ForAll(
                  Filter(colDhInv, iCat in ["Wheelchair", "Cushion", "Backrest"] && iWidth = "") As e,
                  Collect(colDhIssues, { Group: "Equipment", Kind: "No width", Sev: "Medium", SevN: 2, WardCode: e.iWard, Ref: "E|" & e.ID,
                      Where: If(e.iWard = "", "No ward", "Ward " & e.iWard) & "  ·  " & e.iStatus, Who: e.Title & If(e.iDesc = "", "", "  ·  " & e.iDesc), Detail: "Width is empty so it is missing from the size tables." })
              );

              ForAll(
                  Filter(colDhInv, iCat = "Wheelchair" && iType = "") As e,
                  Collect(colDhIssues, { Group: "Equipment", Kind: "No wheelchair type", Sev: "Low", SevN: 1, WardCode: e.iWard, Ref: "E|" & e.ID,
                      Where: If(e.iWard = "", "No ward", "Ward " & e.iWard) & "  ·  " & e.iStatus, Who: e.Title & If(e.iDesc = "", "", "  ·  " & e.iDesc), Detail: "Wheelchair type is empty." })
              );

              ForAll(
                  Filter(colDhInv, IsBlank(Brand) || IsBlank(Model)) As e,
                  Collect(colDhIssues, { Group: "Equipment", Kind: "No brand or model", Sev: "Low", SevN: 1, WardCode: e.iWard, Ref: "E|" & e.ID,
                      Where: If(e.iWard = "", "No ward", "Ward " & e.iWard) & "  ·  " & e.iStatus, Who: e.Title & If(e.iDesc = "", "", "  ·  " & e.iDesc), Detail: "Brand or model is empty." })
              );

              ForAll(
                  Filter(colDhInv, iStatus = "Available" && iLoc = "") As e,
                  Collect(colDhIssues, { Group: "Equipment", Kind: "Available with no location", Sev: "Low", SevN: 1, WardCode: e.iWard, Ref: "E|" & e.ID,
                      Where: If(e.iWard = "", "No ward", "Ward " & e.iWard) & "  ·  " & e.iStatus, Who: e.Title & If(e.iDesc = "", "", "  ·  " & e.iDesc), Detail: "No location recorded, so staff cannot find it." })
              );

              // ---------------- audits and returns
              ForAll(
                  Filter(colDhAud, EscalationSent <> true) As a,
                  Collect(
                      colDhIssues,
                      {
                          Group: "Audit", Kind: "Failed audit not escalated", Sev: "High", SevN: 3, WardCode: Coalesce(a.ActualWard.Value, ""), Ref: "A|" & a.ID,
                          Where: Text(a.AuditDateTime, "d mmm yyyy") & "  ·  Ward " & Coalesce(a.ActualWard.Value, "?"), Who: a.Barcode,
                          Detail: a.AuditOutcome.Value & ". " & If(IsBlank(a.TreatingPTNames), "No treating physio is recorded.", "Treating physio: " & a.TreatingPTNames & ", not yet told.")
                      }
                  )
              );
              ForAll(
                  colDhLeg As l,
                  Collect(
                      colDhIssues,
                      {
                          Group: "Audit", Kind: "Return matched no loan", Sev: "Low", SevN: 1, WardCode: Coalesce(l.Ward, ""), Ref: "L|" & l.ID,
                          Where: Text(l.EventDateTime, "d mmm yyyy") & "  ·  " & If(IsBlank(l.Ward), "No ward", "Ward " & l.Ward), Who: l.EquipmentTitle,
                          Detail: "Returned with no matching sign-out, so its days in use could not be counted."
                      }
                  )
              );

              // headline numbers
              Set(
                  dhKpi,
                  {
                      Total: CountRows(colDhIssues),
                      High: CountRows(Filter(colDhIssues, Sev = "High")),
                      Ward: CountRows(Filter(colDhIssues, Group = "Ward")),
                      Equip: CountRows(Filter(colDhIssues, Group = "Equipment")),
                      Audit: CountRows(Filter(colDhIssues, Group = "Audit")),
                      Patients: CountRows(colDhW),
                      Clean: If(
                          CountRows(colDhW) = 0,
                          100,
                          Round(100 * (1 - CountRows(Distinct(Filter(colDhIssues, Group = "Ward" && Sev <> "Low"), Ref)) / CountRows(colDhW)), 0)
                      )
                  }
              );

              Select(btnShow_Dh)
      - btnShow_Dh:
          Control: Button@0.0.45
          Properties:
            Height: =10
            Width: =10
            Text: =""
            Visible: =false
            OnSelect: |-
              =// issues that match the filters (the kind list ignores the kind chosen)
              ClearCollect(
                  colDhPool,
                  Filter(
                      colDhIssues,
                      (dhGroup = "All" || Group = dhGroup) &&
                      (dhSev = "All" || Sev = dhSev) &&
                      (dhWard = "All" || WardCode = dhWard) &&
                      (dhQ = "" || dhQ in Lower(Who) || dhQ in Lower(Detail) || dhQ in Lower(Where))
                  )
              );
              ClearCollect(
                  colDhKinds,
                  SortByColumns(
                      AddColumns(
                          GroupBy(AddColumns(colDhPool, KindKey, Kind), KindKey, Rows),
                          N, CountRows(Rows),
                          KSev, First(Rows).Sev,
                          KSevN, First(Rows).SevN,
                          KGroup, First(Rows).Group
                      ),
                      "KSevN", SortOrder.Descending,
                      "N", SortOrder.Descending
                  )
              );
              ClearCollect(
                  colDhShow,
                  SortByColumns(Filter(colDhPool, dhKind = "" || Kind = dhKind), "SevN", SortOrder.Descending, "Where", SortOrder.Ascending)
              )
      - Dh_Title:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.Regular
            Fill: =RGBA(7, 95, 115, 1)
            Height: =70
            Width: =1333
            X: =18
            Y: =12
            RadiusBottomLeft: =18
            RadiusBottomRight: =18
            RadiusTopLeft: =18
            RadiusTopRight: =18
          Children:
            - imgHeaderGradient_Dh:
                Control: Image@2.2.3
                Properties:
                  Height: =Parent.Height
                  Image: ="data:image/svg+xml;utf8," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' width='1333' height='70' viewBox='0 0 1333 70' preserveAspectRatio='none'><defs><linearGradient id='a' x1='0' y1='0' x2='1' y2='0'><stop offset='0' stop-color='#001D46'/><stop offset='0.48' stop-color='#075F73'/><stop offset='1' stop-color='#00838A'/></linearGradient><linearGradient id='b' x1='0' y1='0' x2='1' y2='0'><stop offset='0' stop-color='#001B36' stop-opacity='0.46'/><stop offset='0.45' stop-color='#002036' stop-opacity='0.18'/><stop offset='1' stop-color='#002036' stop-opacity='0.06'/></linearGradient></defs><rect width='1333' height='70' rx='18' fill='url(#a)'/><rect width='1333' height='70' rx='18' fill='url(#b)'/></svg>")
                  ImagePosition: =ImagePosition.Fill
                  Width: =Parent.Width
            - lblTitle_DhHdr:
                Control: Text@0.0.51
                Properties:
                  Font: =Font.'Segoe UI'
                  FontColor: =RGBA(255, 255, 255, 1)
                  Height: =36
                  Size: =28
                  Text: ="Data Health"
                  VerticalAlign: =VerticalAlign.Middle
                  Weight: ='TextCanvas.Weight'.Bold
                  Width: =700
                  X: =76
                  Y: =8
            - lblSub_DhHdr:
                Control: Text@0.0.51
                Properties:
                  Font: =Font.'Segoe UI'
                  FontColor: =RGBA(255, 255, 255, 0.88)
                  Height: =20
                  Size: =12
                  Text: =If(dhLoading, "Checking the wards, stock and audits...", dhKpi.Total & " things to fix  ·  " & dhKpi.Patients & " patients and " & CountRows(colDhInv) & " equipment items checked")
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =800
                  X: =76
                  Y: =42
            - btnBack_Dh:
                Control: Button@0.0.45
                Properties:
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  FontColor: =RGBA(255, 255, 255, 1)
                  FontSize: =50
                  Height: =70
                  Icon: ="ChevronLeft"
                  Text: =""
                  X: =1
                  OnSelect: =Back(ScreenTransition.Fade)
            - conReload_Dh:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =40
                  Width: =140
                  X: =1177
                  Y: =15
                  RadiusBottomLeft: =20
                  RadiusBottomRight: =20
                  RadiusTopLeft: =20
                  RadiusTopRight: =20
                  BorderColor: =RGBA(14, 42, 70, 0.12)
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =1
                Children:
                  - btnReload_Dh:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Transparent
                        BorderRadius: =20
                        Font: =Font.'Segoe UI'
                        FontColor: =RGBA(58, 80, 104, 1)
                        FontSize: =13
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        Width: =140
                        Text: ="Reload"
                        OnSelect: =Select(btnLoad_Dh)
                        Icon: ="ArrowClockwise"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        Layout: ='ButtonCanvas.Layout'.IconBefore
      - Dh_CardFilters:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.Light
            Fill: =RGBA(255, 255, 255, 1)
            Height: =84
            Width: =1333
            X: =18
            Y: =95
            RadiusBottomLeft: =18
            RadiusBottomRight: =18
            RadiusTopLeft: =18
            RadiusTopRight: =18
            BorderColor: =RGBA(14, 42, 70, 0.12)
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =1
          Children:
            - capGrp_Dh:
                Control: Label@2.5.1
                Properties:
                  Font: =Font.'Segoe UI'
                  Color: =RGBA(140, 155, 174, 1)
                  Size: =11
                  FontWeight: =FontWeight.Bold
                  Height: =16
                  Text: ="WHAT"
                  Width: =200
                  X: =20
