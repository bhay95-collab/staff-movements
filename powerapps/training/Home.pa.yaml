Screens:
  Home:
    Properties:
      Fill: =C_Bg
      OnVisible: |-
        =// Upcoming sessions (both types) with how full they are, and my own bookings
        Refresh(TrainingSessions);
        Refresh(TrainingBookings);
        ClearCollect(
            colHmBookings,
            Filter(TrainingBookings, BookingStatus.Value = "Booked" && SessionDate >= Today())
        );
        ClearCollect(
            colHmSessions,
            AddColumns(
                AddColumns(
                    SortByColumns(
                        Filter(TrainingSessions, IsActive = true && SessionDate >= Today()),
                        "SessionDate",
                        SortOrder.Ascending
                    ),
                    SesKey, Text(ID),
                    TypeText, TrainingType.Value,
                    CapV, Coalesce(Capacity, If(TrainingType.Value = "Manual Handling", 8, 6))
                ),
                Booked, CountRows(Filter(colHmBookings, SessionID = SesKey))
            )
        );
        ClearCollect(
            colHmMine,
            SortByColumns(
                Filter(colHmBookings, Lower(BookedUserEmail) = MeEmail),
                "SessionDate",
                SortOrder.Ascending
            )
        )
    Children:
      - conHdr_Hm:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(7, 95, 115, 1)
            Height: =Round(129 * UI, 0)
            Width: =Parent.Width
            X: =0
            Y: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            DropShadow: =DropShadow.None
          Children:
            - imgHdr_Hm:
                Control: Image@2.2.3
                Properties:
                  Height: =Parent.Height
                  Image: =HeaderImage
                  ImagePosition: =ImagePosition.Fill
                  Width: =Parent.Width
                  X: =0
                  Y: =0
            - lblKicker_Hm:
                Control: Label@2.5.1
                Properties:
                  Font: =AppFont
                  Color: =RGBA(255, 255, 255, 0.8)
                  Size: =Round(14 * UI, 0)
                  FontWeight: =FontWeight.Bold
                  Height: =Round(23 * UI, 0)
                  Text: ="STARS PHYSIOTHERAPY"
                  Width: =PageW - Round(50 * UI, 0)
                  X: =Gutter + Round(25 * UI, 0)
                  Y: =Round(18 * UI, 0)
                  Wrap: =false
            - lblTitle_Hm:
                Control: Label@2.5.1
                Properties:
                  Font: =AppFont
                  Color: =C_White
                  Size: =Round(32 * UI, 0)
                  FontWeight: =FontWeight.Bold
                  Height: =Round(50 * UI, 0)
                  Text: ="Training Register"
                  Width: =PageW - Round(50 * UI, 0)
                  X: =Gutter + Round(25 * UI, 0)
                  Y: =Round(40 * UI, 0)
                  Wrap: =false
            - lblHello_Hm:
                Control: Label@2.5.1
                Properties:
                  Font: =AppFont
                  Color: =RGBA(255, 255, 255, 0.9)
                  Size: =Round(16 * UI, 0)
                  Height: =Round(28 * UI, 0)
                  Text: ="Hi " & First(Split(MeName, " ")).Value & "  ·  " & Text(Today(), "dddd d mmmm")
                  Width: =PageW - Round(50 * UI, 0)
                  X: =Gutter + Round(25 * UI, 0)
                  Y: =Round(90 * UI, 0)
                  Wrap: =false
