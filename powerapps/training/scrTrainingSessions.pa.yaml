Screens:
  scrTrainingSessions:
    Properties:
      Fill: =C_Bg
      OnVisible: |-
        =Set(tsShowAdd, false);
        Set(tsShowWait, false);
        Set(tsShowEmail, false);
        Set(tsShowConfirm, false);
        If(IsBlank(varSelectedTrainingType), Set(varSelectedTrainingType, "Basic Life Support"));
        Select(btnLoad_Ts)
    Children:
      - btnLoad_Ts:
          Control: Button@0.0.45
          Properties:
            Height: =1
            Width: =1
            X: =0
            Y: =0
            Text: =""
            Visible: =false
            OnSelect: |-
              =// everything on this screen is read once here, then worked out on the device
              Set(tsLoading, true);
              Refresh(TrainingSessions);
              Refresh(TrainingBookings);
              Refresh(TrainingWaitlist);
              ClearCollect(
                  colTsBookings,
                  Filter(
                      TrainingBookings,
                      BookingStatus.Value = "Booked" && TrainingType = varSelectedTrainingType && SessionDate >= Today()
                  )
              );
              ClearCollect(colTsWait, Filter(TrainingWaitlist, WaitlistStatus.Value = "Waiting"));
              ClearCollect(
                  colTsSessions,
                  AddColumns(
                      AddColumns(
                          AddColumns(
                              SortByColumns(
                                  Filter(
                                      TrainingSessions,
                                      IsActive = true && TrainingType.Value = varSelectedTrainingType && SessionDate >= Today()
                                  ),
                                  "SessionDate",
                                  SortOrder.Ascending
                              ),
                              SesKey, Text(ID),
                              Cap, Coalesce(Capacity, If(varSelectedTrainingType = "Manual Handling", 8, 6))
                          ),
                          Booked, CountRows(Filter(colTsBookings, SessionID = SesKey)),
                          MyBookingID, LookUp(colTsBookings, SessionID = SesKey && Lower(BookedUserEmail) = MeEmail).ID,
                          MyWaitID, LookUp(colTsWait, SessionID = SesKey && Lower(WaitlistUserEmail) = MeEmail).ID,
                          MyWaitOn, LookUp(colTsWait, SessionID = SesKey && Lower(WaitlistUserEmail) = MeEmail).AddedOn,
                          WaitCount, CountRows(Filter(colTsWait, SessionID = SesKey))
                      ),
                      Free, Cap - Booked,
                      MyWaitPos, If(IsBlank(MyWaitOn), 0, CountRows(Filter(colTsWait, SessionID = SesKey && AddedOn <= MyWaitOn)))
                  )
              );

              // keep the chosen date selected (with fresh numbers), or open the one asked for from Home
              If(
                  !IsBlank(varOpenSessionID),
                  Set(varSelectedSession, LookUp(colTsSessions, ID = varOpenSessionID));
                  Set(varOpenSessionID, Blank()),

                  !IsBlank(varSelectedSession),
                  Set(varSelectedSession, LookUp(colTsSessions, ID = varSelectedSession.ID))
              );
              // on wide screens the right-hand side is never empty
              If(Wide && IsBlank(varSelectedSession), Set(varSelectedSession, First(colTsSessions)));
              Set(tsLoading, false);
              Select(btnSlots_Ts)
      - btnSlots_Ts:
          Control: Button@0.0.45
          Properties:
            Height: =1
            Width: =1
            X: =0
            Y: =0
            Text: =""
            Visible: =false
            OnSelect: |-
              =ClearCollect(
                  colTsSlots,
                  ForAll(
                      Sequence(Coalesce(varSelectedSession.Cap, 0)) As n,
                      {
                          SlotNo: n.Value,
                          Booking: LookUp(
                              colTsBookings,
                              SessionID = Coalesce(varSelectedSession.SesKey, "") && SlotNumber = n.Value
                          )
                      }
                  )
              )
      - btnDoBook_Ts:
          Control: Button@0.0.45
          Properties:
            Height: =1
            Width: =1
            X: =0
            Y: =0
            Text: =""
            Visible: =false
            OnSelect: |-
              =With(
                  { s: varSelectedSession },
                  Refresh(TrainingBookings);
                  With(
                      { bookedNow: Filter(TrainingBookings, SessionID = s.SesKey && BookingStatus.Value = "Booked") },
                      If(
                          !IsBlank(LookUp(bookedNow, Lower(BookedUserEmail) = MeEmail)),
                          Notify("You are already booked into this session.", NotificationType.Warning);
                          Select(btnLoad_Ts),

                          CountRows(bookedNow) >= s.Cap,
                          Notify("Sorry, that session has just filled up.", NotificationType.Warning);
                          Select(btnLoad_Ts),

                          With(
                              {
                                  slot: First(
                                      Filter(
                                          ForAll(Sequence(s.Cap) As n, { SlotNo: n.Value }),
                                          IsBlank(LookUp(bookedNow, SlotNumber = SlotNo))
                                      )
                                  ).SlotNo
                              },
                              With(
                                  {
                                      rec: Patch(
                                          TrainingBookings,
                                          Defaults(TrainingBookings),
                                          {
                                              Title: varSelectedTrainingType & " - " & MeName,
                                              SessionID: s.SesKey,
                                              TrainingType: varSelectedTrainingType,
                                              SessionDate: s.SessionDate,
                                              SlotNumber: slot,
                                              BookedUserName: MeName,
                                              BookedUserEmail: MeEmail,
                                              BookingStatus: { Value: "Booked" },
                                              BookedOn: Now()
                                          }
                                      )
                                  },
                                  If(
                                      !IsEmpty(Errors(TrainingBookings)),
                                      Notify("Could not book. Please try again.", NotificationType.Error),

                                      // two people can take the same slot at the same moment: the earlier booking keeps it
                                      Refresh(TrainingBookings);
                                      If(
                                          rec.ID > Min(
                                              Filter(TrainingBookings, SessionID = s.SesKey && SlotNumber = slot && BookingStatus.Value = "Booked"),
                                              ID
                                          ),
                                          Patch(TrainingBookings, LookUp(TrainingBookings, ID = rec.ID), { BookingStatus: { Value: "Cancelled" } });
                                          Notify("Someone else just took that place. Please try again.", NotificationType.Warning),

                                          If(
                                              !IsBlank(s.MyWaitID),
                                              Patch(TrainingWaitlist, LookUp(TrainingWaitlist, ID = s.MyWaitID), { WaitlistStatus: { Value: "Removed" } })
                                          );
                                          IfError(
                                              TrainingBookingConfirmationEmail.Run("Booked", MeName, MeEmail, s.SesKey, varSelectedTrainingType, ""),
                                              Notify("You are booked, but the confirmation email could not be sent.", NotificationType.Warning)
                                          );
                                          Notify("You are booked into this session.", NotificationType.Success)
                                      );
                                      Select(btnLoad_Ts)
                                  )
                              )
                          )
                      )
                  )
              )
      - btnDoCancel_Ts:
          Control: Button@0.0.45
          Properties:
            Height: =1
            Width: =1
            X: =0
            Y: =0
            Text: =""
            Visible: =false
            OnSelect: |-
              =With(
                  { s: varSelectedSession },
                  With(
                      { b: LookUp(TrainingBookings, ID = s.MyBookingID) },
                      If(
                          IsBlank(b),
                          Notify("That booking could not be found.", NotificationType.Warning);
                          Set(tsShowConfirm, false);
                          Select(btnLoad_Ts),

                          Patch(TrainingBookings, b, { BookingStatus: { Value: "Cancelled" } });
                          If(
                              !IsEmpty(Errors(TrainingBookings)),
                              Notify("Could not remove the booking. Please try again.", NotificationType.Error),

                              IfError(
                                  TrainingBookingConfirmationEmail.Run("Cancelled", b.BookedUserName, b.BookedUserEmail, s.SesKey, varSelectedTrainingType, Text(b.ID)),
                                  Notify("The booking was removed, but the email could not be sent.", NotificationType.Warning)
                              );
                              IfError(TrainingWaitlistNotification.Run(s.SesKey, varSelectedTrainingType), Blank());
                              Set(tsShowConfirm, false);
                              Notify("Your booking has been removed.", NotificationType.Success);
                              Select(btnLoad_Ts)
                          )
                      )
                  )
              )
      - btnDoRemove_Ts:
          Control: Button@0.0.45
          Properties:
            Height: =1
            Width: =1
            X: =0
            Y: =0
            Text: =""
            Visible: =false
            OnSelect: |-
              =With(
                  { s: varSelectedSession },
                  With(
                      { b: LookUp(TrainingBookings, ID = varSlotBooking.ID) },
                      If(
                          IsBlank(b),
                          Notify("That booking could not be found.", NotificationType.Warning);
                          Set(tsShowConfirm, false);
                          Select(btnLoad_Ts),

                          Patch(TrainingBookings, b, { BookingStatus: { Value: "Cancelled" } });
                          If(
                              !IsEmpty(Errors(TrainingBookings)),
                              Notify("Could not remove the booking. Please try again.", NotificationType.Error),

                              IfError(
                                  TrainingBookingConfirmationEmail.Run("Cancelled", b.BookedUserName, b.BookedUserEmail, s.SesKey, varSelectedTrainingType, Text(b.ID)),
                                  Notify("The booking was removed, but the email could not be sent.", NotificationType.Warning)
                              );
                              IfError(TrainingWaitlistNotification.Run(s.SesKey, varSelectedTrainingType), Blank());
                              Set(tsShowConfirm, false);
                              Notify("The booking has been removed.", NotificationType.Success);
                              Select(btnLoad_Ts)
                          )
                      )
                  )
              )
      - btnDoDelete_Ts:
          Control: Button@0.0.45
          Properties:
            Height: =1
            Width: =1
            X: =0
            Y: =0
            Text: =""
            Visible: =false
            OnSelect: |-
              =With(
                  { s: varSelectedSession },
                  Refresh(TrainingBookings);
                  Refresh(TrainingWaitlist);
                  If(
                      CountRows(Filter(TrainingBookings, SessionID = s.SesKey && BookingStatus.Value = "Booked")) > 0 ||
                      CountRows(Filter(TrainingWaitlist, SessionID = s.SesKey && WaitlistStatus.Value = "Waiting")) > 0,
                      Notify("This date cannot be deleted while people are booked or waiting. Remove them first.", NotificationType.Warning);
                      Set(tsShowConfirm, false),

                      // the date is hidden, not erased, so the history is kept
                      Patch(TrainingSessions, LookUp(TrainingSessions, ID = s.ID), { IsActive: false });
                      If(
                          !IsEmpty(Errors(TrainingSessions)),
                          Notify("Could not delete the date. Please try again.", NotificationType.Error),
                          Set(tsShowConfirm, false);
                          Set(varSelectedSession, Blank());
                          Notify("Training date deleted.", NotificationType.Success);
                          Select(btnLoad_Ts)
                      )
                  )
              )
      - btnDoJoin_Ts:
          Control: Button@0.0.45
          Properties:
            Height: =1
            Width: =1
            X: =0
            Y: =0
            Text: =""
            Visible: =false
            OnSelect: |-
              =With(
                  { s: varSelectedSession },
                  If(
                      !IsBlank(s.MyWaitID) || !IsBlank(s.MyBookingID),
                      Blank(),
                      Patch(
                          TrainingWaitlist,
                          Defaults(TrainingWaitlist),
                          {
                              Title: varSelectedTrainingType & " - " & MeName,
                              SessionID: s.SesKey,
                              WaitlistUserName: MeName,
                              WaitlistUserEmail: MeEmail,
                              WaitlistStatus: { Value: "Waiting" },
                              AddedOn: Now()
                          }
                      );
                      If(
                          !IsEmpty(Errors(TrainingWaitlist)),
                          Notify("Could not join the waitlist. Please try again.", NotificationType.Error),
                          Notify("You are on the waitlist. You will get an email if a place opens.", NotificationType.Success);
                          Select(btnLoad_Ts)
                      )
                  )
              )
      - btnDoLeave_Ts:
          Control: Button@0.0.45
          Properties:
            Height: =1
            Width: =1
            X: =0
            Y: =0
            Text: =""
            Visible: =false
            OnSelect: |-
              =With(
                  { s: varSelectedSession },
                  Patch(TrainingWaitlist, LookUp(TrainingWaitlist, ID = s.MyWaitID), { WaitlistStatus: { Value: "Removed" } });
                  If(
                      !IsEmpty(Errors(TrainingWaitlist)),
                      Notify("Could not leave the waitlist. Please try again.", NotificationType.Error),
                      IfError(
                          TrainingBookingConfirmationEmail.Run("WaitlistRemoved", MeName, MeEmail, s.SesKey, varSelectedTrainingType, ""),
                          Blank()
                      );
                      Notify("You have been removed from the waitlist.", NotificationType.Success);
                      Select(btnLoad_Ts)
                  )
              )
      - btnDoAdd_Ts:
          Control: Button@0.0.45
          Properties:
            Height: =1
            Width: =1
            X: =0
            Y: =0
            Text: =""
            Visible: =false
            OnSelect: |-
              =With(
                  {
                      t: ddType_Ts.Selected.Value,
                      d: dpDate_Ts.SelectedDate,
                      loc: Trim(txtLoc_Ts.Text)
                  },
                  With(
                      { when: d + Time(Value(ddHour_Ts.Selected.Value), Value(ddMin_Ts.Selected.Value), 0) },
                      If(
                          IsBlank(t),
                          Notify("Please select a training type.", NotificationType.Warning),

                          IsBlank(d),
                          Notify("Please select a date.", NotificationType.Warning),

                          IsBlank(loc),
                          Notify("Please enter a location.", NotificationType.Warning),

                          when < Now(),
                          Notify("That date and time has already passed.", NotificationType.Warning),

                          !IsBlank(LookUp(TrainingSessions, TrainingType.Value = t && SessionDate = when && IsActive = true)),
                          Notify("A session already exists for that date and time.", NotificationType.Warning),

                          Patch(
                              TrainingSessions,
                              Defaults(TrainingSessions),
                              {
                                  Title: t & " - " & Text(when, "dd/mm/yyyy hh:mm"),
                                  TrainingType: { Value: t },
                                  SessionDate: when,
                                  Location: loc,
                                  Capacity: If(t = "Manual Handling", 8, 6),
                                  IsActive: true
                              }
                          );
                          If(
                              !IsEmpty(Errors(TrainingSessions)),
                              Notify("Could not save the date. Please try again.", NotificationType.Error),
                              Set(tsShowAdd, false);
                              Set(varSelectedTrainingType, t);
                              Set(varSelectedSession, Blank());
                              Notify("Training date added.", NotificationType.Success);
                              Select(btnLoad_Ts)
                          )
                      )
                  )
              )
      - btnDoSend_Ts:
          Control: Button@0.0.45
          Properties:
            Height: =1
            Width: =1
            X: =0
            Y: =0
            Text: =""
            Visible: =false
            OnSelect: |-
              =With(
                  { to: Concat(Filter(colTsBookings, SessionID = varSelectedSession.SesKey), BookedUserEmail, ";") },
                  If(
                      IsBlank(to),
                      Notify("Nobody is booked into this date yet.", NotificationType.Warning),
                      IfError(
                          With(
                              {
                                  subj: Trim(txtEmailSubject_Ts.Text),
                                  msg: Substitute(Substitute(Substitute(Substitute(txtEmailBody_Ts.Text, "&", "&amp;"), "<", "&lt;"), Char(13), ""), Char(10), "<br>")
                              },
                              Office365Outlook.SendEmailV2(
                                  to,
                                  subj,
                                  Substitute(Substitute(EmailHead, "{{TITLE}}", Substitute(Substitute(subj, "&", "&amp;"), "<", "&lt;")), "{{SUB}}", varSelectedTrainingType & "&nbsp;&nbsp;|&nbsp;&nbsp;" & Text(varSelectedSession.SessionDate, "ddd d mmm yyyy") & "&nbsp;&nbsp;|&nbsp;&nbsp;" & Text(varSelectedSession.SessionDate, "h:mm AM/PM")) &
                                  "<tr><td style='padding:28px 32px 0 32px;font-size:15px;line-height:23px;color:#3A5068;'>" & msg & "</td></tr>" &
                                  "<tr><td style='padding:20px 32px 0 32px;'><div style='font-size:11px;font-weight:700;letter-spacing:1px;color:#8C9BAE;padding:0 0 8px 2px;'>SESSION</div><table role='presentation' width='100%' cellpadding='0' cellspacing='0' border='0' style='border-collapse:separate;border-spacing:0;width:100%;border:1px solid #E3EAF1;border-radius:14px;overflow:hidden;'>" & "<tr><td style='width:190px;padding:10px 14px;background-color:#F7FAFC;font-size:11px;font-weight:600;letter-spacing:1px;color:#8C9BAE;'>COURSE</td><td style='padding:10px 14px;font-size:14px;color:#0E1C2A;'>" & varSelectedTrainingType & "</td></tr>" & "<tr><td style='width:190px;padding:10px 14px;background-color:#F7FAFC;font-size:11px;font-weight:600;letter-spacing:1px;color:#8C9BAE;border-top:1px solid #E3EAF1;'>DATE</td><td style='padding:10px 14px;font-size:14px;color:#0E1C2A;border-top:1px solid #E3EAF1;'>" & Text(varSelectedSession.SessionDate, "dddd d mmmm yyyy") & "</td></tr>" & "<tr><td style='width:190px;padding:10px 14px;background-color:#F7FAFC;font-size:11px;font-weight:600;letter-spacing:1px;color:#8C9BAE;border-top:1px solid #E3EAF1;'>TIME</td><td style='padding:10px 14px;font-size:14px;color:#0E1C2A;border-top:1px solid #E3EAF1;'>" & Text(varSelectedSession.SessionDate, "h:mm AM/PM") & "</td></tr>" & "<tr><td style='width:190px;padding:10px 14px;background-color:#F7FAFC;font-size:11px;font-weight:600;letter-spacing:1px;color:#8C9BAE;border-top:1px solid #E3EAF1;'>LOCATION</td><td style='padding:10px 14px;font-size:14px;color:#0E1C2A;border-top:1px solid #E3EAF1;'>" & Coalesce(varSelectedSession.Location, "To be confirmed") & "</td></tr>" & "</table></td></tr>" &
                                  "<tr><td style='padding:8px 32px 20px 32px;'>&nbsp;</td></tr>" &
                                  Substitute(EmailFoot, "{{NOTE}}", "You are receiving this because you are booked into this session."),
                                  { IsHtml: true }
                              )
                          );
                          Set(tsShowEmail, false);
                          Notify("Email sent to the booked attendees.", NotificationType.Success),
                          Notify("The email could not be sent. Please try again.", NotificationType.Error)
                      )
                  )
              )
      - btnDoSendWait_Ts:
          Control: Button@0.0.45
          Properties:
            Height: =1
            Width: =1
            X: =0
            Y: =0
            Text: =""
            Visible: =false
            OnSelect: |-
              =With(
                  { to: Concat(Filter(colTsWait, SessionID = varSelectedSession.SesKey), WaitlistUserEmail, ";") },
                  If(
                      IsBlank(to),
                      Notify("There are no waitlist users to email.", NotificationType.Warning),
                      IfError(
                          Office365Outlook.SendEmailV2(
                              to,
                              varSelectedTrainingType & " training: a place may be available (" & Text(varSelectedSession.SessionDate, "dd/mm/yyyy h:mm AM/PM") & ")",
                              Substitute(Substitute(EmailHead, "{{TITLE}}", "A place may be available"), "{{SUB}}", varSelectedTrainingType & "&nbsp;&nbsp;|&nbsp;&nbsp;" & Text(varSelectedSession.SessionDate, "ddd d mmm yyyy") & "&nbsp;&nbsp;|&nbsp;&nbsp;" & Text(varSelectedSession.SessionDate, "h:mm AM/PM")) &
                              "<tr><td style='padding:28px 32px 0 32px;font-size:15px;line-height:23px;color:#3A5068;'>Hi all,<br><br>A place may have opened up for the <b style='color:#0E1C2A;'>" & varSelectedTrainingType & "</b> session below. " &
                              "If you would like it, open the <b style='color:#0E1C2A;'>Training Register</b> app and book a place. " &
                              "Places are given to whoever books first.</td></tr>" &
                              "<tr><td style='padding:20px 32px 0 32px;'><div style='font-size:11px;font-weight:700;letter-spacing:1px;color:#8C9BAE;padding:0 0 8px 2px;'>SESSION</div><table role='presentation' width='100%' cellpadding='0' cellspacing='0' border='0' style='border-collapse:separate;border-spacing:0;width:100%;border:1px solid #E3EAF1;border-radius:14px;overflow:hidden;'>" & "<tr><td style='width:190px;padding:10px 14px;background-color:#F7FAFC;font-size:11px;font-weight:600;letter-spacing:1px;color:#8C9BAE;'>COURSE</td><td style='padding:10px 14px;font-size:14px;color:#0E1C2A;'>" & varSelectedTrainingType & "</td></tr>" & "<tr><td style='width:190px;padding:10px 14px;background-color:#F7FAFC;font-size:11px;font-weight:600;letter-spacing:1px;color:#8C9BAE;border-top:1px solid #E3EAF1;'>DATE</td><td style='padding:10px 14px;font-size:14px;color:#0E1C2A;border-top:1px solid #E3EAF1;'>" & Text(varSelectedSession.SessionDate, "dddd d mmmm yyyy") & "</td></tr>" & "<tr><td style='width:190px;padding:10px 14px;background-color:#F7FAFC;font-size:11px;font-weight:600;letter-spacing:1px;color:#8C9BAE;border-top:1px solid #E3EAF1;'>TIME</td><td style='padding:10px 14px;font-size:14px;color:#0E1C2A;border-top:1px solid #E3EAF1;'>" & Text(varSelectedSession.SessionDate, "h:mm AM/PM") & "</td></tr>" & "<tr><td style='width:190px;padding:10px 14px;background-color:#F7FAFC;font-size:11px;font-weight:600;letter-spacing:1px;color:#8C9BAE;border-top:1px solid #E3EAF1;'>LOCATION</td><td style='padding:10px 14px;font-size:14px;color:#0E1C2A;border-top:1px solid #E3EAF1;'>" & Coalesce(varSelectedSession.Location, "To be confirmed") & "</td></tr>" & "</table></td></tr>" &
                              "<tr><td style='padding:24px 32px 28px 32px;font-size:15px;line-height:22px;color:#3A5068;'>Thanks,<br><b style='color:#0E1C2A;'>" & MeName & "</b></td></tr>" &
                              Substitute(EmailFoot, "{{NOTE}}", "You are receiving this because you are on the waitlist for this session."),
                              { IsHtml: true }
                          );
                          Notify("Email sent to the waitlist.", NotificationType.Success),
                          Notify("The email could not be sent. Please try again.", NotificationType.Error)
                      )
                  )
              )
      - conHdr_Ts:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(7, 95, 115, 1)
            Height: =Round(95 * UI, 0)
            Width: =Parent.Width
            X: =0
            Y: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            DropShadow: =DropShadow.None
          Children:
            - imgHdr_Ts:
                Control: Image@2.2.3
                Properties:
                  Height: =Parent.Height
                  Image: =HeaderImage
                  ImagePosition: =ImagePosition.Fill
                  Width: =Parent.Width
                  X: =0
                  Y: =0
            - btnBack_Ts:
                Control: Button@0.0.45
                Properties:
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  FontColor: =C_White
                  FontSize: =Round(32 * UI, 0)
                  Height: =Round(60 * UI, 0)
                  Icon: ="ChevronLeft"
                  Text: =""
                  Width: =Round(60 * UI, 0)
                  X: =Gutter + Round(5 * UI, 0)
                  Y: =Round(18 * UI, 0)
                  OnSelect: =If(!Wide && !IsBlank(varSelectedSession), Set(varSelectedSession, Blank()), Back())
            - lblHdrT_Ts:
                Control: Label@2.5.1
                Properties:
                  Font: =AppFont
                  Color: =C_White
                  Size: =Round(24 * UI, 0)
                  FontWeight: =FontWeight.Bold
                  Height: =Round(35 * UI, 0)
                  Text: =varSelectedTrainingType & " training"
                  Width: =PageW - Round(253 * UI, 0)
                  X: =Gutter + Round(65 * UI, 0)
                  Y: =Round(18 * UI, 0)
                  Wrap: =false
            - lblHdrS_Ts:
                Control: Label@2.5.1
                Properties:
                  Font: =AppFont
                  Color: =RGBA(255, 255, 255, 0.85)
                  Size: =Round(15 * UI, 0)
                  Height: =Round(25 * UI, 0)
                  Text: =If(Wide || IsBlank(varSelectedSession), CountRows(colTsSessions) & If(CountRows(colTsSessions) = 1, " upcoming date", " upcoming dates"), Text(varSelectedSession.SessionDate, "dddd d mmmm"))
                  Width: =PageW - Round(253 * UI, 0)
                  X: =Gutter + Round(65 * UI, 0)
                  Y: =Round(53 * UI, 0)
                  Wrap: =false
            - conAdd_Ts:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  Fill: =C_White
                  Height: =Round(50 * UI, 0)
                  Width: =Round(138 * UI, 0)
                  X: =Gutter + PageW - Round(158 * UI, 0)
                  Y: =Round(23 * UI, 0)
                  RadiusBottomLeft: =Round(25 * UI, 0)
                  RadiusBottomRight: =Round(25 * UI, 0)
                  RadiusTopLeft: =Round(25 * UI, 0)
                  RadiusTopRight: =Round(25 * UI, 0)
                  BorderColor: =C_White
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Visible: =Coalesce(varCanManageTraining, false) && (Wide || IsBlank(varSelectedSession))
                Children:
                  - btnAdd_Ts:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Transparent
                        BorderRadius: =Round(25 * UI, 0)
                        Font: =Font.'Segoe UI'
                        FontColor: =C_Accent
                        FontSize: =Round(16 * UI, 0)
                        FontWeight: =FontWeight.Bold
                        Height: =Parent.Height
                        Width: =Parent.Width
                        Text: ="+ Add date"
                        OnSelect: |-
                          =Set(tsShowAdd, true);
                          Reset(ddType_Ts);
                          Reset(dpDate_Ts);
                          Reset(ddHour_Ts);
                          Reset(ddMin_Ts);
                          Reset(txtLoc_Ts)
      - conBody_Ts:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
