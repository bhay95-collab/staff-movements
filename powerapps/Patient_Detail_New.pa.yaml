Screens:
  Patient_Detail_New:
    Properties:
      Fill: =RGBA(235, 242, 248, 1)
      ImagePosition: =ImagePosition.Fill
      OnHidden: =Set(varSelectedItem, Blank())
      OnVisible: |-
        =Set(varSearchCode_1, "");
        Set(varSelectedItem, Blank());
        Reset(TextInput_SearchCode_1);

        // Re-read this patient's row from their ward list
        // (also refreshes it when coming back from Exercise Setups / Outcome Measures)
        With(
            { id: varSelectedPatient.ID },
            Switch(
                varSelectedList,
                "Ward_4A_Shared", Set(varSelectedPatient, LookUp(Ward_4A_Shared, ID = id)),
                "Ward_4B_Shared", Set(varSelectedPatient, LookUp(Ward_4B_Shared, ID = id)),
                "Ward_5A_Shared", Set(varSelectedPatient, LookUp(Ward_5A_Shared, ID = id)),
                "Ward_6A_Shared", Set(varSelectedPatient, LookUp(Ward_6A_Shared, ID = id))
            )
        );

        // Start the editable copy only when the patient changed
        // (so unsaved edits survive a trip to another screen and back)
        With(
            { key: varSelectedList & "|" & varSelectedPatient.ID },
            If(
                pdLoadedKey <> key,
                Set(pdLoadedKey, key);
                Set(pdEDD, varSelectedPatient.EDD);
                Set(pdMaint, Coalesce(varSelectedPatient.Maintenance, false));
                Set(pdFalls, Coalesce(varSelectedPatient.'Falls Risk', false));
                Set(pdContact, Coalesce(varSelectedPatient.Contact, false))
            )
        );
        Set(pdSaving, false);

        // -------------------------------
        // Email popup reset (used by other screens)
        // -------------------------------
        Set(locShowEmailPopup, false);
        Clear(colEmailRecipients);
        Set(locEmailDefaultSubject, "");
        Set(locEmailDefaultBody, "");
        Set(
            varUserIsPhysio,
            !IsBlank(
                LookUp(
                    ClinicianDirectory,
                    Lower(Person.Email) = Lower(User().Email) &&
                    Discipline.Value = "Physio"
                )
            )
        )
    Children:
      - PD_Title:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.Regular
            Fill: =RGBA(7, 95, 115, 1)
            Height: =70
            Width: =1333
            X: =18
            Y: =12
            RadiusBottomLeft: =18
            RadiusBottomRight: =18
            RadiusTopLeft: =18
            RadiusTopRight: =18
          Children:
            - imgHeaderGradient_PD:
                Control: Image@2.2.3
                Properties:
                  Height: =Parent.Height
                  Image: ="data:image/svg+xml;utf8," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' width='1333' height='70' viewBox='0 0 1333 70' preserveAspectRatio='none'><defs><linearGradient id='a' x1='0' y1='0' x2='1' y2='0'><stop offset='0' stop-color='#001D46'/><stop offset='0.48' stop-color='#075F73'/><stop offset='1' stop-color='#00838A'/></linearGradient><linearGradient id='b' x1='0' y1='0' x2='1' y2='0'><stop offset='0' stop-color='#001B36' stop-opacity='0.46'/><stop offset='0.45' stop-color='#002036' stop-opacity='0.18'/><stop offset='1' stop-color='#002036' stop-opacity='0.06'/></linearGradient></defs><rect width='1333' height='70' rx='18' fill='url(#a)'/><rect width='1333' height='70' rx='18' fill='url(#b)'/></svg>")
                  ImagePosition: =ImagePosition.Fill
                  Width: =Parent.Width
            - lblTitle_PD:
                Control: Text@0.0.51
                Properties:
                  Font: =Font.'Segoe UI'
                  FontColor: =RGBA(255, 255, 255, 1)
                  Height: =36
                  Size: =28
                  Text: =varSelectedPatient.field_2
                  VerticalAlign: =VerticalAlign.Middle
                  Weight: ='TextCanvas.Weight'.Bold
                  Width: =600
                  X: =76
                  Y: =8
            - lblSub_PD:
                Control: Text@0.0.51
                Properties:
                  Font: =Font.'Segoe UI'
                  FontColor: =RGBA(255, 255, 255, 0.88)
                  Height: =20
                  Size: =12
                  Text: ="URN " & Coalesce(varSelectedPatient.URN, "-") & "  ·  DOB " & If(IsBlank(varSelectedPatient.DOB), "-", Text(DateValue(varSelectedPatient.DOB), "dd/mm/yyyy")) & "  ·  Ward " & Mid(varSelectedList, 6, 2) & "  ·  Bed " & Coalesce(varSelectedPatient.Bed, "-")
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =600
                  X: =76
                  Y: =42
            - btnBack_PD:
                Control: Button@0.0.45
                Properties:
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  FontColor: =RGBA(255, 255, 255, 1)
                  FontSize: =50
                  Height: =70
                  Icon: ="ChevronLeft"
                  Text: =""
                  X: =1
                  OnSelect: |-
                    =If(
                        (pdEDD <> varSelectedPatient.EDD || pdMaint <> Coalesce(varSelectedPatient.Maintenance, false) || pdFalls <> Coalesce(varSelectedPatient.'Falls Risk', false) || pdContact <> Coalesce(varSelectedPatient.Contact, false)),
                        Notify(
                            "You have unsaved changes. Please Save or Discard before leaving.",
                            NotificationType.Warning
                        ),
                        Back(ScreenTransition.Fade)
                    )
            - conSave_PD:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.Regular
                  Fill: =RGBA(12, 122, 82, 1)
                  Height: =46
                  Visible: =(pdEDD <> varSelectedPatient.EDD || pdMaint <> Coalesce(varSelectedPatient.Maintenance, false) || pdFalls <> Coalesce(varSelectedPatient.'Falls Risk', false) || pdContact <> Coalesce(varSelectedPatient.Contact, false))
                  Width: =100
                  X: =700
                  Y: =12
                  RadiusBottomLeft: =23
                  RadiusBottomRight: =23
                  RadiusTopLeft: =23
                  RadiusTopRight: =23
                Children:
                  - btnSave_PD:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Transparent
                        BorderRadius: =23
                        Font: =Font.'Segoe UI'
                        FontColor: =RGBA(255, 255, 255, 1)
                        FontSize: =14
                        FontWeight: =FontWeight.Bold
                        Height: =46
                        Icon: ="Save"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        Layout: ='ButtonCanvas.Layout'.IconBefore
                        DisplayMode: =If(pdSaving, DisplayMode.Disabled, DisplayMode.Edit)
                        OnSelect: |-
                          =// Saves the four editable fields straight to this patient's ward list
                          Set(pdSaving, true);
                          Switch(
                              varSelectedList,
                              "Ward_4A_Shared",
                                  With(
                                      {
                                          spRow:
                                              Patch(
                                                  Ward_4A_Shared,
                                                  LookUp(Ward_4A_Shared, ID = varSelectedPatient.ID),
                                                  {
                                                      EDD: pdEDD,
                                                      Maintenance: pdMaint,
                                                      'Falls Risk': pdFalls,
                                                      Contact: pdContact
                                                  }
                                              )
                                      },
                                      If(
                                          !IsEmpty(Errors(Ward_4A_Shared, spRow)),
                                          Notify(
                                              "Could not save: " & First(Errors(Ward_4A_Shared, spRow)).Message,
                                              NotificationType.Error
                                          ),
                                          Set(varSelectedPatient, spRow);
                                          Notify("Patient details saved.", NotificationType.Success)
                                      )
                                  ),
                              "Ward_4B_Shared",
                                  With(
                                      {
                                          spRow:
                                              Patch(
                                                  Ward_4B_Shared,
                                                  LookUp(Ward_4B_Shared, ID = varSelectedPatient.ID),
                                                  {
                                                      EDD: pdEDD,
                                                      Maintenance: pdMaint,
                                                      'Falls Risk': pdFalls,
                                                      Contact: pdContact
                                                  }
                                              )
                                      },
                                      If(
                                          !IsEmpty(Errors(Ward_4B_Shared, spRow)),
                                          Notify(
                                              "Could not save: " & First(Errors(Ward_4B_Shared, spRow)).Message,
                                              NotificationType.Error
                                          ),
                                          Set(varSelectedPatient, spRow);
                                          Notify("Patient details saved.", NotificationType.Success)
                                      )
                                  ),
                              "Ward_5A_Shared",
                                  With(
                                      {
                                          spRow:
                                              Patch(
                                                  Ward_5A_Shared,
                                                  LookUp(Ward_5A_Shared, ID = varSelectedPatient.ID),
                                                  {
                                                      EDD: pdEDD,
                                                      Maintenance: pdMaint,
                                                      'Falls Risk': pdFalls,
                                                      Contact: pdContact
                                                  }
                                              )
                                      },
                                      If(
                                          !IsEmpty(Errors(Ward_5A_Shared, spRow)),
                                          Notify(
                                              "Could not save: " & First(Errors(Ward_5A_Shared, spRow)).Message,
                                              NotificationType.Error
                                          ),
                                          Set(varSelectedPatient, spRow);
                                          Notify("Patient details saved.", NotificationType.Success)
                                      )
                                  ),
                              "Ward_6A_Shared",
                                  With(
                                      {
                                          spRow:
                                              Patch(
                                                  Ward_6A_Shared,
                                                  LookUp(Ward_6A_Shared, ID = varSelectedPatient.ID),
                                                  {
                                                      EDD: pdEDD,
                                                      Maintenance: pdMaint,
                                                      'Falls Risk': pdFalls,
                                                      Contact: pdContact
                                                  }
                                              )
                                      },
                                      If(
                                          !IsEmpty(Errors(Ward_6A_Shared, spRow)),
                                          Notify(
                                              "Could not save: " & First(Errors(Ward_6A_Shared, spRow)).Message,
                                              NotificationType.Error
                                          ),
                                          Set(varSelectedPatient, spRow);
                                          Notify("Patient details saved.", NotificationType.Success)
                                      )
                                  )
                          );
                          Set(pdSaving, false)
                        Text: ="Save"
                        Width: =100
            - conDiscard_PD:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
