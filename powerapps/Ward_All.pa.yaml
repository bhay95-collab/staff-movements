                        FontSize: =18
                        FontWeight: =FontWeight.Bold
                        Height: =56
                        Icon: ="CheckmarkCircle"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        Layout: ='ButtonCanvas.Layout'.TextOnly
                        OnSelect: |-
                          =// Require all 3 identifiers
                          If(
                              IsBlank(Trim(TextInput_ID_Name.Text)) ||
                              IsBlank(Trim(TextInput_ID_URN.Text)) ||
                              IsBlank(TextInput_ID_DOB_Day.Text) ||
                              IsBlank(TextInput_ID_DOB_Month.Text) ||
                              IsBlank(TextInput_ID_DOB_Year.Text),

                              Notify(
                                  "Please complete Name, URN and DOB.",
                                  NotificationType.Warning
                              ),

                              // Basic validation for URN & DOB
                              If(
                                  !IsNumeric(TextInput_ID_URN.Text) ||
                                  Value(TextInput_ID_DOB_Day.Text) < 1 ||
                                  Value(TextInput_ID_DOB_Day.Text) > 31 ||
                                  Value(TextInput_ID_DOB_Month.Text) < 1 ||
                                  Value(TextInput_ID_DOB_Month.Text) > 12 ||
                                  Value(TextInput_ID_DOB_Year.Text) < 1900 ||
                                  Value(TextInput_ID_DOB_Year.Text) > Year(Today()),

                                  Notify(
                                      "Please check URN and DOB values.",
                                      NotificationType.Warning
                                  ),

                                  // All good → patch into the local collection
                                  With(
                                      {
                                          newDOB: Date(
                                              Value(TextInput_ID_DOB_Year.Text),
                                              Value(TextInput_ID_DOB_Month.Text),
                                              Value(TextInput_ID_DOB_Day.Text)
                                          ),
                                          newURN: Trim(TextInput_ID_URN.Text)   // keep leading zeros as text
                                      },
                                      Patch(
                                          colWard,
                                          LookUp(colWard, ID = wdIDRowID),
                                          {
                                              Patient: Trim(TextInput_ID_Name.Text),
                                              URN: newURN,      // text URN, leading 0 preserved
                                              DOB: newDOB,
                                              IsDirty: true
                                          }
                                      );

                                      // close popup & clear fields
                                      Set(wdShowIDPopup, false);
                                      Reset(TextInput_ID_Name);
                                      Reset(TextInput_ID_URN);
                                      Reset(TextInput_ID_DOB_Day);
                                      Reset(TextInput_ID_DOB_Month);
                                      Reset(TextInput_ID_DOB_Year)
                                  )
                              )
                          );
