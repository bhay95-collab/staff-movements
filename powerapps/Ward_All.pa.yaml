Screens:
  Ward_All:
    Properties:
      ImagePosition: =ImagePosition.Fill
      OnVisible: |-
        =// =======================================================
        // WARD SCREEN – shared by 4A / 4B / 5A / 6A
        // Home sets the ward before navigating:
        //     Set(varWard, "4A"); Navigate(Ward_All, ScreenTransition.Fade)
        //
        // Hidden buttons hold the shared code (one copy each):
        //   btnLoadData_Ward         -> reload the ward + clinician lists, then charts
        //   btnRebuildCharts_Ward    -> rebuild the chart collections
        //   btnCleanupDischarged_Ward-> delete related data for discharged patients (after Save)
        // =======================================================

        If(IsBlank(varWard), Set(varWard, "4A"));

        Set(wdLoading, true);

        // Per-ward layout differences (6A has no NDIS / AROC EDD)
        Set(wdShowNDIS, varWard <> "6A");
        Set(wdShowAROC, varWard <> "6A");

        // Reset popups / state left over from the previous ward
        Set(wdShowIDPopup, false);
        Set(wdShowClearWarning, false);
        Set(wdShowDiscardWarning, false);
        Set(wdShowPatientList, false);
        Set(wdIsSaving, false);
        Set(wdPulseOn, false);

        // Discharge clean-up queue (matched on Name + URN + DOB when Save succeeds)
        ClearCollect(
            colWardPendingDischarge,
            FirstN(
                Table({ PatientName: "", PatientURN: "", PatientDOB: Date(1900, 1, 1) }),
                0
            )
        );

        Select(btnLoadData_Ward)
      Fill: =RGBA(235, 242, 248, 1)
    Children:
      - btnCleanupDischarged_Ward:
          Control: Button@0.0.45
          Properties:
            Height: =10
            Visible: =false
            Width: =10
            X: =20
            Y: =0
            Text: ="Cleanup"
            OnSelect: |-
              =// =======================================================
              // DELETE RELATED DATA FOR DISCHARGED PATIENTS (runs only after Save succeeds)
              // A record is matched on Name + URN + DOB, so a different patient with the
              // same name is never touched.
              //
              // !! Check the column names on the RIGHT-hand side of each "=" below match your
              // !! Patient_Outcome_Measures and Patient_Exercise_Setups lists.
              // =======================================================
              ForAll(
                  colWardPendingDischarge As d,
                  If(
                      // skip anyone who is back on the ward (re-admitted before saving)
                      IsBlank(
                          LookUp(
                              colWard,
                              Patient = d.PatientName && URN = d.PatientURN && DOB = d.PatientDOB
                          )
                      ),
                      RemoveIf(
                          Patient_Outcome_Measures,
                          PatientName = d.PatientName && URN = d.PatientURN && DOB = d.PatientDOB
                      );
                      RemoveIf(
                          Patient_Exercise_Setups,
                          Patient = d.PatientName && URN = d.PatientURN && DOB = d.PatientDOB
                      )
                  )
              );
              Clear(colWardPendingDischarge);

              If(
                  !IsEmpty(Errors(Patient_Outcome_Measures)) || !IsEmpty(Errors(Patient_Exercise_Setups)),
                  Notify(
                      "Ward saved, but some related patient data could not be deleted. Please tell an admin.",
                      NotificationType.Warning
                  )
              )
      - btnRebuildCharts_Ward:
          Control: Button@0.0.45
          Properties:
            Height: =10
            Visible: =false
            Width: =10
            X: =10
            Y: =0
            Text: ="Charts"
            OnSelect: |-
              =// =======================================================
              // REBUILD WARD CHARTS (shared: load + after successful Save)
              // Source of truth: colWard
              // =======================================================

              // Typed empty People table (keeps schema so DisplayName/Email are recognised)
              Set(
                  varEmptyPeople,
                  FirstN(
                      Table(
                          {
                              Claims: "",
                              DisplayName: "",
                              Email: "",
                              Department: "",
                              JobTitle: "",
                              Picture: ""
                          }
                      ),
                      0
                  )
              );

              // Base set of real patients on this ward
              Set(wdBasePatients, Filter(colWard, !IsBlank(Patient)));

              // ------------------------------
              // 1) Diagnosis Summary (Pie)
              // ------------------------------
              Set(wdDiagTotal, CountRows(wdBasePatients));
              Clear(colWardDiagnosisSummary);

              ForAll(
                  Table(
                      {Diag: "Ortho"},
                      {Diag: "Recon"},
                      {Diag: "TBI"},
                      {Diag: "Amp"},
                      {Diag: "SCI"},
                      {Diag: "Trauma"},
                      {Diag: "Stroke"},
                      {Diag: "Neuro"}
                  ) As d,
                  With(
                      {
                          thisCount:
                              CountRows(
                                  Filter(
                                      wdBasePatients,
                                      !IsBlank(Diagnosis) && Diagnosis.Value = d.Diag
                                  )
                              )
                      },
                      With(
                          {
                              thisPercent:
                                  If(
                                      wdDiagTotal = 0,
                                      0,
                                      Round(thisCount * 100 / wdDiagTotal, 0)
                                  )
                          },
                          Collect(
                              colWardDiagnosisSummary,
                              {
                                  Label: d.Diag,
                                  Count: thisCount,
                                  DisplayLabel: d.Diag & " (" & thisPercent & "%)"
                              }
                          )
                      )
                  )
              );

              // ------------------------------
              // 2) Flatten PT assignments (one row per patient x clinician)
              // ------------------------------
              Clear(colWardPT_Assign);

              ForAll(
                  wdBasePatients As p,
                  ForAll(
                      If(IsBlank(p.PT_Users) || CountRows(p.PT_Users) = 0, varEmptyPeople, p.PT_Users) As u,
                      If(
                          !IsBlank(u.Claims),
                          Collect(
                              colWardPT_Assign,
                              {
                                  PatientID: p.ID,
                                  ClinicianClaims: Lower(Trim(u.Claims)),
                                  ClinicianName: Coalesce(u.DisplayName, u.Email, "<unknown>"),
                                  Acuity: Coalesce(p.'Acuity Score', 0)
                              }
                          )
                      )
                  )
              );

              // ------------------------------
              // 3) Patients per PT (distinct by PatientID)
              // ------------------------------
              Clear(colWardPatientsPerPT);
              ForAll(
                  GroupBy(colWardPT_Assign, ClinicianName, Rows) As g,
                  Collect(
                      colWardPatientsPerPT,
                      {
                          Label: g.ClinicianName,
                          Count: CountRows(Distinct(g.Rows, PatientID)),
                          DisplayLabel: g.ClinicianName & " (" & CountRows(Distinct(g.Rows, PatientID)) & ")"
                      }
                  )
              );

              // ------------------------------
              // 4) Total acuity per PT
              // ------------------------------
              Clear(colWardAcuityPerPT);
              ForAll(
                  GroupBy(colWardPT_Assign, ClinicianName, Rows) As g,
                  Collect(
                      colWardAcuityPerPT,
                      {
                          Label: g.ClinicianName,
                          TotalAcuity: Sum(g.Rows, Acuity)
                      }
                  )
              );

              Set(wdLoading, false)
      - btnLoadData_Ward:
          Control: Button@0.0.45
          Properties:
            Height: =10
            Visible: =false
            Width: =10
            X: =0
            Y: =0
            Text: ="Load"
            OnSelect: |-
              =// =======================================================
              // LOAD WARD DATA (shared: OnVisible + Discard)
              // Ward comes from varWard. Stable key = Claims
              // =======================================================

              // --------------------------------------
              // 1) Raw rows for the selected ward
              // --------------------------------------
              If(
                  varWard = "4A",
                  ClearCollect(
                      colWardBase,
                      ForAll(
                          SortByColumns(Ward_4A_Shared, "field_1", SortOrder.Ascending),
                          {
                              ID: ID,
                              Patient: Patient,
                              URN: URN,
                              DOB: DOB,
                              Diagnosis: If(IsBlank(Diagnosis), Blank(), { Value: Diagnosis.Value }),
                              PT_Users: PT_Users,
                              OT_Users: OT_Users,
                              SP_Users: SP_Users,
                              'Acuity Score': 'Acuity Score',
                              Bed: Bed,
                              NDIS: NDIS,
                              Maintenance: Maintenance,
                              'Link Worker': 'Link Worker',
                              'Falls Risk': 'Falls Risk',
                              Contact: Contact,
                              'Admission Date': 'Admission Date',
                              'AROC EDD': 'AROC EDD',
                              EDD: EDD,
                              WeekStartDate: WeekStartDate,
                              'Morning Handover': 'Morning Handover',
                              'CC Handover': 'CC Handover',
                              Monday: Monday,
                              Tuesday: Tuesday,
                              Wednesday: Wednesday,
                              Thursday: Thursday,
                              Friday: Friday
                          }
                      )
                  )
              );
              If(
                  varWard = "4B",
                  ClearCollect(
                      colWardBase,
                      ForAll(
                          SortByColumns(Ward_4B_Shared, "field_1", SortOrder.Ascending),
                          {
                              ID: ID,
                              Patient: Patient,
                              URN: URN,
                              DOB: DOB,
                              Diagnosis: If(IsBlank(Diagnosis), Blank(), { Value: Diagnosis.Value }),
                              PT_Users: PT_Users,
                              OT_Users: OT_Users,
                              SP_Users: SP_Users,
                              'Acuity Score': 'Acuity Score',
                              Bed: Bed,
                              NDIS: NDIS,
                              Maintenance: Maintenance,
                              'Link Worker': 'Link Worker',
                              'Falls Risk': 'Falls Risk',
                              Contact: Contact,
                              'Admission Date': 'Admission Date',
                              'AROC EDD': 'AROC EDD',
                              EDD: EDD,
                              WeekStartDate: WeekStartDate,
                              'Morning Handover': 'Morning Handover',
                              'CC Handover': 'CC Handover',
                              Monday: Monday,
                              Tuesday: Tuesday,
                              Wednesday: Wednesday,
                              Thursday: Thursday,
                              Friday: Friday
                          }
                      )
                  )
              );
              If(
                  varWard = "5A",
                  ClearCollect(
                      colWardBase,
                      ForAll(
                          SortByColumns(Ward_5A_Shared, "field_1", SortOrder.Ascending),
                          {
                              ID: ID,
                              Patient: Patient,
                              URN: URN,
                              DOB: DOB,
                              Diagnosis: If(IsBlank(Diagnosis), Blank(), { Value: Diagnosis.Value }),
                              PT_Users: PT_Users,
                              OT_Users: OT_Users,
                              SP_Users: SP_Users,
                              'Acuity Score': 'Acuity Score',
                              Bed: Bed,
                              NDIS: NDIS,
                              Maintenance: Maintenance,
                              'Link Worker': 'Link Worker',
                              'Falls Risk': 'Falls Risk',
                              Contact: Contact,
                              'Admission Date': 'Admission Date',
                              'AROC EDD': 'AROC EDD',
                              EDD: EDD,
                              WeekStartDate: WeekStartDate,
                              'Morning Handover': 'Morning Handover',
                              'CC Handover': 'CC Handover',
                              Monday: Monday,
                              Tuesday: Tuesday,
                              Wednesday: Wednesday,
                              Thursday: Thursday,
                              Friday: Friday
                          }
                      )
                  )
              );
              If(
                  varWard = "6A",
                  ClearCollect(
                      colWardBase,
                      ForAll(
                          SortByColumns(Ward_6A_Shared, "field_1", SortOrder.Ascending),
                          {
                              ID: ID,
                              Patient: Patient,
                              URN: URN,
                              DOB: DOB,
                              Diagnosis: If(IsBlank(Diagnosis), Blank(), { Value: Diagnosis.Value }),
                              PT_Users: PT_Users,
                              OT_Users: OT_Users,
                              SP_Users: SP_Users,
                              'Acuity Score': 'Acuity Score',
                              Bed: Bed,
                              NDIS: NDIS,
                              Maintenance: Maintenance,
                              'Link Worker': 'Link Worker',
                              'Falls Risk': 'Falls Risk',
                              Contact: Contact,
                              'Admission Date': 'Admission Date',
                              'AROC EDD': 'AROC EDD',
                              EDD: EDD,
                              WeekStartDate: WeekStartDate,
                              'Morning Handover': 'Morning Handover',
                              'CC Handover': 'CC Handover',
                              Monday: Monday,
                              Tuesday: Tuesday,
                              Wednesday: Wednesday,
                              Thursday: Thursday,
                              Friday: Friday
                          }
                      )
                  )
              );

              // --------------------------------------
              // 2) Working copy + typed Key tables used by ComboBox defaults
              // --------------------------------------
              ClearCollect(
                  colWard,
                  AddColumns(
                      colWardBase,
                      IsDirty, false,

                      PTKeys,
                      If(
                          IsBlank(PT_Users) || CountRows(PT_Users) = 0,
                          FirstN(Table({ Key: "" }), 0),
                          ForAll(PT_Users, { Key: Lower(Trim(Claims)) })
                      ),

                      OTKeys,
                      If(
                          IsBlank(OT_Users) || CountRows(OT_Users) = 0,
                          FirstN(Table({ Key: "" }), 0),
                          ForAll(OT_Users, { Key: Lower(Trim(Claims)) })
                      ),

                      SPKeys,
                      If(
                          IsBlank(SP_Users) || CountRows(SP_Users) = 0,
                          FirstN(Table({ Key: "" }), 0),
                          ForAll(SP_Users, { Key: Lower(Trim(Claims)) })
                      )
                  )
              );
              Clear(colWardBase);

              // --------------------------------------
              // 0a) Clinician option collections (flat schema)
              //     These MUST use same key: Person.Claims
              // --------------------------------------

              // Physio options
              ClearCollect(
                  colClinicians_Physio,
                  AddColumns(
                      Filter(ClinicianDirectory, Discipline.Value = "Physio" && !IsBlank(Person)),
                      DisplayNameFlat, Coalesce(Person.DisplayName, Person.Email, ""),
                      DisplayKey, Lower(Trim(Person.Claims)),
                      PersonRec, Person
                  )
              );

              // OT options
              ClearCollect(
                  colClinicians_OT,
                  AddColumns(
                      Filter(ClinicianDirectory, Discipline.Value = "OT" && !IsBlank(Person)),
                      DisplayNameFlat, Coalesce(Person.DisplayName, Person.Email, ""),
                      DisplayKey, Lower(Trim(Person.Claims)),
                      PersonRec, Person
                  )
              );

              // SP options
              ClearCollect(
                  colClinicians_SP,
                  AddColumns(
                      Filter(ClinicianDirectory, Discipline.Value = "SP" && !IsBlank(Person)),
                      DisplayNameFlat, Coalesce(Person.DisplayName, Person.Email, ""),
                      DisplayKey, Lower(Trim(Person.Claims)),
                      PersonRec, Person
                  )
              );

              // --------------------------------------
              // 0b) Who am I? (optional)
              // --------------------------------------
              Set(
                  varMeDirectory,
                  LookUp(ClinicianDirectory, Lower(Person.Email) = Lower(User().Email))
              );

              // Chart collections are rebuilt from the fresh data
              Select(btnRebuildCharts_Ward)
