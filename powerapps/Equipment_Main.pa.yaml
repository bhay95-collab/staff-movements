                        Text: =varDischargedEquipment.'Patient Name' & " could not be found on any current ward list. They may have been discharged." & Char(10) & Char(10) & "Return this equipment, or leave it allocated?"
                        Width: =560
                        X: =40
                        Y: =76
                  - conNfLeave_Eq:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =RGBA(14, 42, 70, 0.12)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =52
                        Width: =220
                        X: =90
                        Y: =196
                        RadiusBottomLeft: =26
                        RadiusBottomRight: =26
                        RadiusTopLeft: =26
                        RadiusTopRight: =26
                      Children:
                        - btnNfLeave_Eq:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Transparent
                              BorderRadius: =26
                              Font: =Font.'Segoe UI'
                              FontColor: =RGBA(58, 80, 104, 1)
                              FontSize: =17
                              FontWeight: =FontWeight.Bold
                              Height: =52
                              Layout: ='ButtonCanvas.Layout'.TextOnly
                              OnSelect: |-
                                =Set(varShowDischargedEquipmentPopup, false);
                                Set(varDischargedEquipment, Blank())
                              Text: ="Leave allocated"
                              Width: =220
                  - conNfReturn_Eq:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =1
                        DropShadow: =DropShadow.Regular
                        Fill: =RGBA(26, 90, 153, 1)
                        Height: =52
                        Width: =220
                        X: =330
                        Y: =196
                        RadiusBottomLeft: =26
                        RadiusBottomRight: =26
                        RadiusTopLeft: =26
                        RadiusTopRight: =26
                      Children:
                        - btnNfReturn_Eq:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Transparent
                              BorderRadius: =26
                              Font: =Font.'Segoe UI'
                              FontColor: =RGBA(255, 255, 255, 1)
                              FontSize: =17
                              FontWeight: =FontWeight.Bold
                              Height: =52
                              Layout: ='ButtonCanvas.Layout'.TextOnly
                              OnSelect: |-
                                =If(
                                    IsBlank(varDischargedEquipment) ||
                                    Coalesce(varDischargedEquipment.Status.Value, "") <> "Allocated" ||
                                    IsBlank(varDischargedEquipment.'Date Signed Out'),

                                    Notify(
                                        "This equipment cannot be returned because the allocation details are incomplete.",
                                        NotificationType.Error
                                    ),

                                    With(
                                        {
                                            returnDate: Today(),
                                            actionTime: Now(),

                                            episodeKey:
                                                Coalesce(
                                                    varDischargedEquipment.CurrentEpisodeKey,
                                                    Concatenate(
                                                        "LEGACY-RETURN-",
                                                        Text(varDischargedEquipment.ID),
                                                        "-",
                                                        Text(Now(), "yyyymmddhhmmss"),
                                                        "-",
                                                        Left(Text(GUID()), 8)
                                                    )
                                                ),

                                            daysThisEpisode:
                                                Max(
                                                    0,
                                                    DateDiff(
                                                        varDischargedEquipment.'Date Signed Out',
                                                        Today(),
                                                        "Days"
                                                    )
                                                )
                                        },

                                        With(
                                            {
                                                newTotalDays:
                                                    Coalesce(
                                                        varDischargedEquipment.TotalDaysSignedOut,
                                                        0
                                                    ) +
                                                    daysThisEpisode
                                            },

                                            // ===================================================
                                            // RETURN EQUIPMENT
                                            // ===================================================
                                            Patch(
                                                Equipment_Inventory_SharePoint,
                                                varDischargedEquipment,
                                                {
                                                    Status: {
                                                        Value: "Available"
                                                    },

                                                    'Patient Name': "",
                                                    URN: "",
                                                    Physiotherapist: "",
                                                    DOB: Blank(),

                                                    'Date Returned': returnDate,

                                                    Ward: Blank(),

                                                    'Signed In By': User().FullName,

                                                    CurrentEpisodeKey: Blank(),

                                                    TotalDaysSignedOut: newTotalDays
                                                }
                                            );


                                            // ===================================================
                                            // CREATE SIGN-IN LOG
                                            // ===================================================
                                            Patch(
                                                Equipment_Usage_Log,
                                                Defaults(Equipment_Usage_Log),
                                                {
                                                    Title:
                                                        Concatenate(
                                                            episodeKey,
                                                            " - Sign In"
                                                        ),

                                                    EpisodeKey: episodeKey,

                                                    EventType: {
                                                        Value: "Sign In"
                                                    },

                                                    EpisodeStatus: {
                                                        Value:
                                                            If(
                                                                IsBlank(
                                                                    varDischargedEquipment.CurrentEpisodeKey
                                                                ),
                                                                "Legacy unmatched",
                                                                "Closed"
                                                            )
                                                    },

                                                    EventDateTime: actionTime,

                                                    EquipmentItemID:
                                                        varDischargedEquipment.ID,

                                                    EquipmentTitle:
                                                        varDischargedEquipment.Title,

                                                    Category:
                                                        Coalesce(
                                                            varDischargedEquipment.Category.Value,
                                                            ""
                                                        ),

                                                    Brand:
                                                        Coalesce(
                                                            varDischargedEquipment.Brand,
                                                            ""
                                                        ),

                                                    Model:
                                                        Coalesce(
                                                            varDischargedEquipment.Model,
                                                            ""
                                                        ),

                                                    Width:
                                                        Coalesce(
                                                            varDischargedEquipment.Width.Value,
                                                            ""
                                                        ),

                                                    Depth:
                                                        Coalesce(
                                                            varDischargedEquipment.Depth.Value,
                                                            ""
                                                        ),

                                                    Height:
                                                        Coalesce(
                                                            varDischargedEquipment.Height.Value,
                                                            ""
                                                        ),

                                                    SWL:
                                                        Coalesce(
                                                            varDischargedEquipment.SWL,
                                                            ""
                                                        ),

                                                    WheelchairType:
                                                        Coalesce(
                                                            varDischargedEquipment.'Wheelchair Type'.Value,
                                                            ""
                                                        ),

                                                    LocationAtEvent:
                                                        Coalesce(
                                                            varDischargedEquipment.Location.Value,
                                                            ""
                                                        ),

                                                    Ward:
                                                        Coalesce(
                                                            varDischargedEquipment.Ward.Value,
                                                            ""
                                                        ),

                                                    PatientName:
                                                        Coalesce(
                                                            varDischargedEquipment.'Patient Name',
                                                            ""
                                                        ),

                                                    URN:
                                                        Coalesce(
                                                            varDischargedEquipment.URN,
                                                            ""
                                                        ),

                                                    DOB:
                                                        varDischargedEquipment.DOB,

                                                    Physiotherapist:
                                                        Coalesce(
                                                            varDischargedEquipment.Physiotherapist,
                                                            ""
                                                        ),

                                                    DateSignedOut:
                                                        varDischargedEquipment.'Date Signed Out',

                                                    DateReturned:
                                                        returnDate,

                                                    DaysSignedOutThisEpisode:
                                                        daysThisEpisode,

                                                    TotalDaysSignedOutAfterEvent:
                                                        newTotalDays,

                                                    Over100DaysAfterEvent:
                                                        newTotalDays > 100,

                                                    ServiceRequired:
                                                        newTotalDays > 100,

                                                    IsHighRiskEquipment:
                                                        Coalesce(
                                                            varDischargedEquipment.IsHighRiskEquipment,
                                                            false
                                                        ),

                                                    OutOfService:
                                                        Coalesce(
                                                            varDischargedEquipment.OutOfService,
                                                            false
                                                        ),

                                                    IsActive:
                                                        Coalesce(
                                                            varDischargedEquipment.IsActive,
                                                            true
                                                        ),

                                                    StatusAfterEvent:
                                                        "Available",

                                                    ActionedByName:
                                                        User().FullName,

                                                    ActionedByEmail:
                                                        User().Email,

                                                    SourceApp: {
                                                        Value: "Web"
                                                    },

                                                    Notes:
                                                        If(
                                                            IsBlank(
                                                                varDischargedEquipment.CurrentEpisodeKey
                                                            ),
                                                            "Return completed without an existing CurrentEpisodeKey. This is likely a pre-log allocation.",
                                                            ""
                                                        )
                                                }
                                            );


                                            // ===================================================
                                            // CLOSE ORIGINAL SIGN-OUT LOG
                                            // ===================================================
                                            With(
                                                {
                                                    signOutLogRow:
                                                        LookUp(
                                                            Equipment_Usage_Log,
                                                            EpisodeKey = episodeKey &&
                                                            EventType.Value = "Sign Out"
                                                        )
                                                },

                                                If(
                                                    !IsBlank(signOutLogRow.ID),

                                                    Patch(
                                                        Equipment_Usage_Log,
                                                        signOutLogRow,
                                                        {
                                                            EpisodeStatus: {
                                                                Value: "Closed"
                                                            },

                                                            DateReturned:
                                                                returnDate,

                                                            DaysSignedOutThisEpisode:
                                                                daysThisEpisode,

                                                            TotalDaysSignedOutAfterEvent:
                                                                newTotalDays,

                                                            Over100DaysAfterEvent:
                                                                newTotalDays > 100,

                                                            ServiceRequired:
                                                                newTotalDays > 100
                                                        }
                                                    )
                                                )
                                            );


                                            // ===================================================
                                            // SUCCESS
                                            // ===================================================
                                            Notify(
                                                "Equipment returned successfully.",
                                                NotificationType.Success
                                            );

                                            If(
                                                newTotalDays > 100,

                                                Notify(
                                                    "This equipment has been used for >100 days this year and requires a Full Service. Please set equipment aside and contact CA for details.",
                                                    NotificationType.Warning
                                                )
                                            );


                                            // ===================================================
                                            // REMOVE RETURNED ITEM FROM LOCAL EQUIPMENT COLLECTION
                                            // ===================================================
                                            RemoveIf(
                                                colGroupedEquipment,
                                                ID = varDischargedEquipment.ID
                                            );

                                            Refresh(
                                                Equipment_Inventory_SharePoint
                                            );


                                            // ===================================================
                                            // CLOSE POPUP
                                            // ===================================================
                                            Set(
                                                varShowDischargedEquipmentPopup,
                                                false
                                            );

                                            Set(
                                                varDischargedEquipment,
                                                Blank()
                                            )
                                        )
                                    )
                                )
                              Text: ="Return equipment"
                              Width: =220
