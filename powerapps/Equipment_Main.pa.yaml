                        Height: =76
                        Width: =Parent.TemplateWidth - 20
                        X: =10
                        Y: =4
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                      Children:
                        - lblMy1_Eq:
                            Control: Label@2.5.1
                            Properties:
                              Font: =Font.'Segoe UI'
                              Color: =RGBA(14, 28, 42, 1)
                              Size: =14
                              FontWeight: =FontWeight.Bold
                              Height: =24
                              Text: =ThisItem.Brand & " " & ThisItem.Model
                              Width: =Parent.Width - 84
                              X: =14
                              Y: =8
                        - lblMy2_Eq:
                            Control: Label@2.5.1
                            Properties:
                              Font: =Font.'Segoe UI'
                              Color: =RGBA(58, 80, 104, 1)
                              Size: =11
                              Height: =18
                              Text: ="Barcode " & ThisItem.Title
                              Width: =Parent.Width - 84
                              X: =14
                              Y: =32
                        - lblMy3_Eq:
                            Control: Label@2.5.1
                            Properties:
                              Font: =Font.'Segoe UI'
                              Color: =RGBA(140, 155, 174, 1)
                              Size: =11
                              Height: =18
                              Text: |-
                                ="Patient: " & ThisItem.'Patient Name' & "  ·  Signed out " & Text(ThisItem.'Date Signed Out', "dd mmm yyyy")
                              Width: =Parent.Width - 84
                              X: =14
                              Y: =52
                        - conPt_Eq:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =RGBA(14, 42, 70, 0.12)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =44
                              Width: =48
                              X: =Parent.Width - 62
                              Y: =16
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - btnPt_Eq:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderRadius: =12
                                    FontColor: =RGBA(26, 90, 153, 1)
                                    FontSize: =22
                                    Height: =44
                                    Icon: ="BookContacts"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                    Layout: ='ButtonCanvas.Layout'.TextOnly
                                    Text: =""
                                    Width: =48
                                    OnSelect: |-
                                      =// Find this equipment's patient on the four ward lists (Name + URN + DOB where the equipment record has them)
                                      With(
                                          {
                                              n: ThisItem.'Patient Name',
                                              u: ThisItem.URN,
                                              d: ThisItem.DOB
                                          },
                                          With(
                                              {
                                                  r4A: LookUp(Ward_4A_Shared, Patient = n && (IsBlank(u) || URN = u) && (IsBlank(d) || DOB = d)),
                                                  r4B: LookUp(Ward_4B_Shared, Patient = n && (IsBlank(u) || URN = u) && (IsBlank(d) || DOB = d)),
                                                  r5A: LookUp(Ward_5A_Shared, Patient = n && (IsBlank(u) || URN = u) && (IsBlank(d) || DOB = d)),
                                                  r6A: LookUp(Ward_6A_Shared, Patient = n && (IsBlank(u) || URN = u) && (IsBlank(d) || DOB = d))
                                              },
                                              If(
                                                  IsBlank(Trim(n)),
                                                  Notify(
                                                      "No patient is associated with this equipment.",
                                                      NotificationType.Warning
                                                  ),

                                                  !IsBlank(r4A),
                                                  Set(varSelectedPatient, r4A);
                                                  Set(varSelectedList, "Ward_4A_Shared");
                                                  Set(varWardCode, "4A");
                                                  Navigate(Patient_Detail_Screen, ScreenTransition.Fade),

                                                  !IsBlank(r4B),
                                                  Set(varSelectedPatient, r4B);
                                                  Set(varSelectedList, "Ward_4B_Shared");
                                                  Set(varWardCode, "4B");
                                                  Navigate(Patient_Detail_Screen, ScreenTransition.Fade),

                                                  !IsBlank(r5A),
                                                  Set(varSelectedPatient, r5A);
                                                  Set(varSelectedList, "Ward_5A_Shared");
                                                  Set(varWardCode, "5A");
                                                  Navigate(Patient_Detail_Screen, ScreenTransition.Fade),

                                                  !IsBlank(r6A),
                                                  Set(varSelectedPatient, r6A);
                                                  Set(varSelectedList, "Ward_6A_Shared");
                                                  Set(varWardCode, "6A");
                                                  Navigate(Patient_Detail_Screen, ScreenTransition.Fade),

                                                  // PATIENT NOT FOUND on any ward
                                                  Set(varDischargedEquipment, ThisItem);
                                                  Set(varShowDischargedEquipmentPopup, true)
                                              )
                                          )
                                      )
