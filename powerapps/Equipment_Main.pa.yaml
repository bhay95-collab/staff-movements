Screens:
  Equipment_Main:
    Properties:
      Fill: =RGBA(235, 242, 248, 1)
      ImagePosition: =ImagePosition.Fill
      OnVisible: |-
        =Set(eqLoading, true);

        // =======================================================
        // SHARED INITIALISATION
        // (Patient Detail relies on these even if no Ward screen was opened first)
        // NOTE: the four ward caches that used to be built here are gone.
        // They all wrote into the same collection and overwrote each other.
        // Patients are now looked up straight from the ward lists when needed.
        // =======================================================

        // Typed empty People table
        Set(
            varEmptyPeople,
            FirstN(
                Table(
                    {
                        Claims: "",
                        DisplayName: "",
                        Email: "",
                        Department: "",
                        JobTitle: "",
                        Picture: ""
                    }
                ),
                0
            )
        );

        Concurrent(
            // Clinician option lists
            ClearCollect(
                colClinicians_Physio,
                AddColumns(
                    Filter(ClinicianDirectory, Discipline.Value = "Physio" && !IsBlank(Person)),
                    DisplayNameFlat, Coalesce(Person.DisplayName, Person.Email, ""),
                    DisplayKey, Lower(Trim(Person.Claims)),
                    PersonRec, Person
                )
            ),
            ClearCollect(
                colClinicians_OT,
                AddColumns(
                    Filter(ClinicianDirectory, Discipline.Value = "OT" && !IsBlank(Person)),
                    DisplayNameFlat, Coalesce(Person.DisplayName, Person.Email, ""),
                    DisplayKey, Lower(Trim(Person.Claims)),
                    PersonRec, Person
                )
            ),
            ClearCollect(
                colClinicians_SP,
                AddColumns(
                    Filter(ClinicianDirectory, Discipline.Value = "SP" && !IsBlank(Person)),
                    DisplayNameFlat, Coalesce(Person.DisplayName, Person.Email, ""),
                    DisplayKey, Lower(Trim(Person.Claims)),
                    PersonRec, Person
                )
            ),

            // Equipment I signed out today
            ClearCollect(
                colGroupedEquipment,
                Filter(
                    Equipment_Inventory_SharePoint,
                    Status.Value = "Allocated" &&
                    DateDiff(DateValue('Date Signed Out'), Today()) = 0 &&
                    Physiotherapist = User().FullName
                )
            )
        );

        // Current user directory record
        Set(
            varMeDirectory,
            LookUp(ClinicianDirectory, Lower(Person.Email) = Lower(User().Email))
        );

        // Reset the screen
        Set(varSearchPatient, "");
        Set(varSearchCode, "");
        Set(varSelectedItem, Blank());
        Set(varShowDischargedEquipmentPopup, false);
        Reset(TextInput_SearchPatient);

        Set(eqLoading, false)
    Children:
      - Eq_Title:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.Regular
            Fill: =RGBA(7, 95, 115, 1)
            Height: =70
            Width: =1333
            X: =18
            Y: =12
            RadiusBottomLeft: =18
            RadiusBottomRight: =18
            RadiusTopLeft: =18
            RadiusTopRight: =18
          Children:
            - imgHeaderGradient_Eq:
                Control: Image@2.2.3
                Properties:
                  Height: =Parent.Height
                  Image: ="data:image/svg+xml;utf8," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' width='1333' height='70' viewBox='0 0 1333 70' preserveAspectRatio='none'><defs><linearGradient id='a' x1='0' y1='0' x2='1' y2='0'><stop offset='0' stop-color='#001D46'/><stop offset='0.48' stop-color='#075F73'/><stop offset='1' stop-color='#00838A'/></linearGradient><linearGradient id='b' x1='0' y1='0' x2='1' y2='0'><stop offset='0' stop-color='#001B36' stop-opacity='0.46'/><stop offset='0.45' stop-color='#002036' stop-opacity='0.18'/><stop offset='1' stop-color='#002036' stop-opacity='0.06'/></linearGradient></defs><rect width='1333' height='70' rx='18' fill='url(#a)'/><rect width='1333' height='70' rx='18' fill='url(#b)'/></svg>")
                  ImagePosition: =ImagePosition.Fill
                  Width: =Parent.Width
