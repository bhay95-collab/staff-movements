Screens:
  Usage_Log:
    Properties:
      Fill: =RGBA(235, 242, 248, 1)
      ImagePosition: =ImagePosition.Fill
      OnVisible: |-
        =// Usage log oversight. Loads the log for the period, then Select(btnBuild_Ul) builds every summary.
        Set(ulPreset, "90");
        Set(ulFrom, DateAdd(Today(), -89));
        Set(ulTo, Today());
        Set(ulCat, "All");
        Set(ulWard, "All");
        Set(ulQ, "");
        Set(ulTab, "Used");
        Set(ulSort, "Loans");
        Set(ulLogFilter, "All");
        Set(ulShowDetail, false);
        Set(ulKpi, {Out: 0, Back: 0, Now: 0, AvgDays: 0, Service: 0, OOS: 0});

        ClearCollect(colUlCats, Table({ Value: "All categories" }, { Value: "Wheelchair" }, { Value: "Cushion" }, { Value: "Backrest" }));
        ClearCollect(colUlWardOpts, Table({ Value: "All wards" }));
        Collect(colUlWardOpts, SortByColumns(Choices(Equipment_Inventory_SharePoint.Ward), "Value", SortOrder.Ascending));

        Select(btnLoad_Ul)
    Children:
      - btnLoad_Ul:
          Control: Button@0.0.45
          Properties:
            Height: =10
            Width: =10
            Text: =""
            Visible: =false
            OnSelect: |-
              =Set(ulLoading, true);

              // The log is read in 14-day slices so each request stays under the 500 / 2000 row limit
              Clear(colUlLog);
              ForAll(
                  Sequence(RoundUp((DateDiff(ulFrom, ulTo, TimeUnit.Days) + 1) / 14, 0)) As c,
                  Collect(
                      colUlLog,
                      Filter(
                          Equipment_Usage_Log,
                          EventDateTime >= DateAdd(ulFrom, (c.Value - 1) * 14, TimeUnit.Days) &&
                          EventDateTime < DateAdd(ulFrom, c.Value * 14, TimeUnit.Days) &&
                          EventDateTime < DateAdd(ulTo, 1, TimeUnit.Days)
                      )
                  )
              );

              // Loans that are still open, whatever the period
              ClearCollect(
                  colUlOpen,
                  Filter(Equipment_Usage_Log, EventType.Value = "Sign Out" && EpisodeStatus.Value = "Open")
              );

              // Stock today (for service, out of service and the size table)
              ClearCollect(
                  colUlInv,
                  AddColumns(
                      Equipment_Inventory_SharePoint,
                      iCat, Coalesce(Category.Value, ""),
                      iType, If(Category.Value = "Wheelchair", Coalesce('Wheelchair Type'.Value, ""), ""),
                      iWidth, Coalesce(Width.Value, ""),
                      iStatus, Coalesce(Status.Value, ""),
                      iDays, Coalesce(TotalDaysSignedOut, 0)
                  )
              );

              Set(ulLoading, false);
              Select(btnBuild_Ul)
      - btnBuild_Ul:
          Control: Button@0.0.45
          Properties:
            Height: =10
            Width: =10
            Text: =""
            Visible: =false
            OnSelect: |-
              =// 1) the log rows that match the filters
              ClearCollect(colUlF, Filter(colUlLog, (ulCat = "All" || Category = ulCat) && (ulWard = "All" || Ward = ulWard) && (ulQ = "" || ulQ in Lower(EquipmentTitle) || ulQ in Lower(Brand) || ulQ in Lower(Model) || ulQ in Lower(Coalesce(Physiotherapist, "")))));

              // 2) headline numbers
              Set(
                  ulKpi,
                  {
                      Out: CountRows(Filter(colUlF, EventType.Value = "Sign Out")),
                      Back: CountRows(Filter(colUlF, EventType.Value = "Sign In")),
                      Now: CountRows(Filter(colUlOpen, (ulCat = "All" || Category = ulCat) && (ulWard = "All" || Ward = ulWard) && (ulQ = "" || ulQ in Lower(EquipmentTitle) || ulQ in Lower(Brand) || ulQ in Lower(Model) || ulQ in Lower(Coalesce(Physiotherapist, ""))))),
                      AvgDays: With(
                          { r: Filter(colUlF, EventType.Value = "Sign In" && !IsBlank(DaysSignedOutThisEpisode)) },
                          If(CountRows(r) = 0, 0, Round(Average(r, DaysSignedOutThisEpisode), 1))
                      ),
                      Service: CountRows(Filter(colUlInv, iDays > 100 && (ulCat = "All" || iCat = ulCat))),
                      OOS: CountRows(Filter(colUlInv, OutOfService = true && (ulCat = "All" || iCat = ulCat)))
                  }
              );

              // 3) most used items (one row per item)
              ClearCollect(
                  colUlItems,
                  SortByColumns(
                      AddColumns(
                          GroupBy(Filter(colUlF, EventType.Value = "Sign Out"), EquipmentItemID, Rows),
                          Loans, CountRows(Rows),
                          Days, (Sum(Rows, If(IsBlank(DaysSignedOutThisEpisode), If(EpisodeStatus.Value = "Open", DateDiff(DateSignedOut, Today(), TimeUnit.Days), 0), DaysSignedOutThisEpisode))),
                          Code, First(Rows).EquipmentTitle,
                          Desc, Trim(First(Rows).Brand & " " & First(Rows).Model),
                          Cat, First(Rows).Category,
                          Size, First(Rows).Width,
                          NowStatus, Coalesce(LookUp(colUlInv, ID = EquipmentItemID).iStatus, "—"),
                          YearDays, Coalesce(LookUp(colUlInv, ID = EquipmentItemID).iDays, 0)
                      ),
                      If(ulSort = "Days", "Days", "Loans"),
                      SortOrder.Descending
                  )
              );

              // 4) demand by size: stock, out now, free, and loans in the period
              ClearCollect(
                  colUlSize,
                  SortByColumns(
                      AddColumns(
                          GroupBy(
                              AddColumns(
                                  Filter(colUlInv, iWidth <> "" && iCat in ["Wheelchair", "Cushion", "Backrest"] && (ulCat = "All" || iCat = ulCat)),
                                  gKey, iCat & "|" & iType & "|" & iWidth
                              ),
                              gKey,
                              Rows
                          ),
                          Cat, First(Rows).iCat,
                          GType, First(Rows).iType,
                          GWidth, First(Rows).iWidth,
                          Stock, CountRows(Rows),
                          Free, CountRows(Filter(Rows, iStatus = "Available")),
                          OutNow, CountRows(Filter(Rows, iStatus = "Allocated")),
                          Label, If(First(Rows).iCat = "Wheelchair", First(Rows).iType & "  ·  " & First(Rows).iWidth, First(Rows).iCat & "  ·  " & First(Rows).iWidth),
                          Loans, CountRows(
                              Filter(
                                  colUlF,
                                  EventType.Value = "Sign Out" && Category = First(Rows).iCat && Width = First(Rows).iWidth &&
                                  (First(Rows).iCat <> "Wheelchair" || WheelchairType = First(Rows).iType)
                              )
                          )
                      ),
                      "Free", SortOrder.Ascending,
                      "Loans", SortOrder.Descending
                  )
              );

              // 5) wards and physios
              ClearCollect(
                  colUlWard,
                  SortByColumns(
                      AddColumns(
                          GroupBy(AddColumns(Filter(colUlF, EventType.Value = "Sign Out" && !IsBlank(Ward)), WardKey, Ward), WardKey, Rows),
                          Loans, CountRows(Rows),
                          AvgDays, With(
                              { r: Filter(Rows, !IsBlank(DaysSignedOutThisEpisode)) },
                              If(CountRows(r) = 0, 0, Round(Average(r, DaysSignedOutThisEpisode), 1))
                          ),
                          OutNow, CountRows(Filter(colUlOpen, Ward = WardKey))
                      ),
                      "Loans", SortOrder.Descending
                  )
              );
              ClearCollect(
                  colUlPhysio,
                  FirstN(
                      SortByColumns(
                          AddColumns(
                              GroupBy(Filter(colUlF, EventType.Value = "Sign Out" && !IsBlank(Physiotherapist)), Physiotherapist, Rows),
                              Loans, CountRows(Rows),
                              Days, (Sum(Rows, If(IsBlank(DaysSignedOutThisEpisode), If(EpisodeStatus.Value = "Open", DateDiff(DateSignedOut, Today(), TimeUnit.Days), 0), DaysSignedOutThisEpisode)))
                          ),
                          "Loans", SortOrder.Descending
                      ),
                      12
                  )
              )
