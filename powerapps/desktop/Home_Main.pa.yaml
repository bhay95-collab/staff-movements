Screens:
  Home_Main:
    Properties:
      BackgroundImage: ='Standard JPG-Upper limb rehabilitation equipment in the ability centre'
      ImagePosition: =ImagePosition.Stretch
      OnVisible: |-
        =Set(varHomeMenu, false);
        // Latest ward status colours from SharePoint
        Refresh(Home_Colors_Shared);
        ClearCollect(HomeColorCollection, Home_Colors_Shared);
        // Who am I? (decides whether the acuity number is shown)
        If(
            IsBlank(varMeDirectory),
            Set(
                varMeDirectory,
                LookUp(ClinicianDirectory, Lower(Person.Email) = Lower(User().Email))
            )
        );
        // At-a-glance numbers per ward: beds, patients, total acuity, EDD within 3 days
        ClearCollect(
            colHomeStats,
            With(
                { rows: Ward_4A_Shared },
                {
                    Key: "Ward4A",
                    Beds: CountRows(rows),
                    Patients: CountRows(Filter(rows, !IsBlank(Patient))),
                    Acuity: Sum(Filter(rows, !IsBlank(Patient)), 'Acuity Score'),
                    EddSoon: CountRows(
                        Filter(
                            rows,
                            !IsBlank(Patient),
                            !IsBlank(EDD),
                            EDD >= Today(),
                            EDD <= DateAdd(Today(), 3)
                        )
                    )
                }
            ),
            With(
                { rows: Ward_4B_Shared },
                {
                    Key: "Ward4B",
                    Beds: CountRows(rows),
                    Patients: CountRows(Filter(rows, !IsBlank(Patient))),
                    Acuity: Sum(Filter(rows, !IsBlank(Patient)), 'Acuity Score'),
                    EddSoon: CountRows(
                        Filter(
                            rows,
                            !IsBlank(Patient),
                            !IsBlank(EDD),
                            EDD >= Today(),
                            EDD <= DateAdd(Today(), 3)
                        )
                    )
                }
            ),
            With(
                { rows: Ward_5A_Shared },
                {
                    Key: "Ward5A",
                    Beds: CountRows(rows),
                    Patients: CountRows(Filter(rows, !IsBlank(Patient))),
                    Acuity: Sum(Filter(rows, !IsBlank(Patient)), 'Acuity Score'),
                    EddSoon: CountRows(
                        Filter(
                            rows,
                            !IsBlank(Patient),
                            !IsBlank(EDD),
                            EDD >= Today(),
                            EDD <= DateAdd(Today(), 3)
                        )
                    )
                }
            ),
            With(
                { rows: Ward_6A_Shared },
                {
                    Key: "Ward6A",
                    Beds: CountRows(rows),
                    Patients: CountRows(Filter(rows, !IsBlank(Patient))),
                    Acuity: Sum(Filter(rows, !IsBlank(Patient)), 'Acuity Score'),
                    EddSoon: CountRows(
                        Filter(
                            rows,
                            !IsBlank(Patient),
                            !IsBlank(EDD),
                            EDD >= Today(),
                            EDD <= DateAdd(Today(), 3)
                        )
                    )
                }
            )
        )
    Children:
      - Rectangle_HomeVeil:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(235, 242, 248, 0.6)
            Height: =Parent.Height
            Width: =Parent.Width
      - Home_Title:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.Regular
            Fill: =RGBA(7, 95, 115, 1)
            Height: =70 * SY
            RadiusBottomLeft: =18 * SR
            RadiusBottomRight: =18 * SR
            RadiusTopLeft: =18 * SR
            RadiusTopRight: =18 * SR
            Width: =1333 * SX
            X: =18 * SX
            Y: =12 * SY
          Children:
            - imgHeaderGradient_Home:
                Control: Image@2.2.3
                Properties:
                  Height: =Parent.Height
