                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =18 * SY
                  Size: =Round(11 * SF, 0)
                  Text: ="DIAGNOSIS"
                  Width: =200 * SX
                  X: =20 * SX
                  Y: =60 * SY
            - conDiag_PD:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
