                        Width: =40 * SX
                        X: =Parent.Width - 56 * SX
                        Y: =8 * SY
            - conTgFalls_PD:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(14, 42, 70, 0.12)
                  BorderThickness: =1
                  Fill: =If(pdFalls, RGBA(26, 90, 153, 0.08), RGBA(244, 249, 252, 1))
                  Height: =56 * SY
                  RadiusBottomLeft: =14 * SR
                  RadiusBottomRight: =14 * SR
                  RadiusTopLeft: =14 * SR
                  RadiusTopRight: =14 * SR
                  Width: =360 * SX
                  X: =20 * SX
                  Y: =408 * SY
                Children:
                  - lblTgFalls_PD:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(14, 28, 42, 1)
