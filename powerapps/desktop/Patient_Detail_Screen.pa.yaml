                  RadiusTopLeft: =14 * SR
                  RadiusTopRight: =14 * SR
                  Width: =360 * SX
                  X: =20 * SX
                  Y: =340 * SY
                Children:
                  - lblTgMaint_PD:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(14, 28, 42, 1)
