Screens:
  Patient_Detail_Screen:
    Properties:
      Fill: =RGBA(235, 242, 248, 1)
      ImagePosition: =ImagePosition.Fill
      OnHidden: =Set(varSelectedItem, Blank())
      OnVisible: |-
        =Set(pdShowRet, false);
        Set(varSearchCode_1, "");
        Set(varSelectedItem, Blank());
        Reset(TextInput_SearchCode_1);
        // Re-read this patient's row from their ward list (also when coming back from another screen).
        // The editable copy (pd...) is only restarted when the patient changed,
        // so unsaved edits survive a trip to another screen and back.
        With(
            {
                id: varSelectedPatient.ID,
                key: varSelectedList & "|" & varSelectedPatient.ID
            },
            Switch(
                varSelectedList,
                "Ward_4A_Shared",
                With(
                    { r: LookUp(Ward_4A_Shared, ID = id) },
                    Set(varSelectedPatient, r);
                    Set(pdBed, r.Bed);
                    If(
                        pdLoadedKey <> key,
                        Set(pdLoadedKey, key);
                        Set(pdEDD, r.EDD);
                        Set(pdMaint, Coalesce(r.Maintenance, false));
                        Set(pdFalls, Coalesce(r.'Falls Risk', false));
                        Set(pdContact, Coalesce(r.Contact, false));
                        Set(pdBaseEDD, r.EDD);
                        Set(pdBaseMaint, Coalesce(r.Maintenance, false));
                        Set(pdBaseFalls, Coalesce(r.'Falls Risk', false));
                        Set(pdBaseContact, Coalesce(r.Contact, false))
                    )
                ),
                "Ward_4B_Shared",
                With(
                    { r: LookUp(Ward_4B_Shared, ID = id) },
                    Set(varSelectedPatient, r);
                    Set(pdBed, r.Bed);
                    If(
                        pdLoadedKey <> key,
                        Set(pdLoadedKey, key);
                        Set(pdEDD, r.EDD);
                        Set(pdMaint, Coalesce(r.Maintenance, false));
                        Set(pdFalls, Coalesce(r.'Falls Risk', false));
                        Set(pdContact, Coalesce(r.Contact, false));
                        Set(pdBaseEDD, r.EDD);
                        Set(pdBaseMaint, Coalesce(r.Maintenance, false));
                        Set(pdBaseFalls, Coalesce(r.'Falls Risk', false));
                        Set(pdBaseContact, Coalesce(r.Contact, false))
                    )
                ),
                "Ward_5A_Shared",
                With(
                    { r: LookUp(Ward_5A_Shared, ID = id) },
                    Set(varSelectedPatient, r);
                    Set(pdBed, r.Bed);
                    If(
                        pdLoadedKey <> key,
                        Set(pdLoadedKey, key);
                        Set(pdEDD, r.EDD);
                        Set(pdMaint, Coalesce(r.Maintenance, false));
                        Set(pdFalls, Coalesce(r.'Falls Risk', false));
                        Set(pdContact, Coalesce(r.Contact, false));
                        Set(pdBaseEDD, r.EDD);
                        Set(pdBaseMaint, Coalesce(r.Maintenance, false));
                        Set(pdBaseFalls, Coalesce(r.'Falls Risk', false));
                        Set(pdBaseContact, Coalesce(r.Contact, false))
                    )
                ),
                "Ward_6A_Shared",
                With(
                    { r: LookUp(Ward_6A_Shared, ID = id) },
                    Set(varSelectedPatient, r);
                    Set(pdBed, r.Bed);
                    If(
                        pdLoadedKey <> key,
                        Set(pdLoadedKey, key);
                        Set(pdEDD, r.EDD);
                        Set(pdMaint, Coalesce(r.Maintenance, false));
                        Set(pdFalls, Coalesce(r.'Falls Risk', false));
                        Set(pdContact, Coalesce(r.Contact, false));
                        Set(pdBaseEDD, r.EDD);
                        Set(pdBaseMaint, Coalesce(r.Maintenance, false));
                        Set(pdBaseFalls, Coalesce(r.'Falls Risk', false));
                        Set(pdBaseContact, Coalesce(r.Contact, false))
                    )
                )
            )
        );
        Set(pdSaving, false);
        // -------------------------------
        // Email popup reset (used by other screens)
        // -------------------------------
        Set(locShowEmailPopup, false);
        Clear(colEmailRecipients);
        Set(locEmailDefaultSubject, "");
        Set(locEmailDefaultBody, "");
        Set(
            varUserIsPhysio,
            !IsBlank(
                LookUp(
                    ClinicianDirectory,
                    Lower(Person.Email) = Lower(User().Email) &&
                    Discipline.Value = "Physio"
                )
            )
        )
    Children:
      - PD_Title:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.Regular
            Fill: =RGBA(7, 95, 115, 1)
            Height: =70 * SY
            RadiusBottomLeft: =18 * SR
            RadiusBottomRight: =18 * SR
            RadiusTopLeft: =18 * SR
            RadiusTopRight: =18 * SR
            Width: =1333 * SX
            X: =18 * SX
            Y: =12 * SY
          Children:
            - imgHeaderGradient_PD:
                Control: Image@2.2.3
                Properties:
                  Height: =Parent.Height
                  Image: ="data:image/svg+xml;utf8," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' width='1333' height='70' viewBox='0 0 1333 70' preserveAspectRatio='none'><defs><linearGradient id='a' x1='0' y1='0' x2='1' y2='0'><stop offset='0' stop-color='#001D46'/><stop offset='0.48' stop-color='#075F73'/><stop offset='1' stop-color='#00838A'/></linearGradient><linearGradient id='b' x1='0' y1='0' x2='1' y2='0'><stop offset='0' stop-color='#001B36' stop-opacity='0.46'/><stop offset='0.45' stop-color='#002036' stop-opacity='0.18'/><stop offset='1' stop-color='#002036' stop-opacity='0.06'/></linearGradient></defs><rect width='1333' height='70' rx='18' fill='url(#a)'/><rect width='1333' height='70' rx='18' fill='url(#b)'/></svg>")
                  ImagePosition: =ImagePosition.Fill
                  Width: =Parent.Width
            - lblTitle_PD:
                Control: ModernText@1.0.0
                Properties:
                  Color: =RGBA(255, 255, 255, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =44 * SY
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Size: =Round(28 * SF, 0)
                  Text: =varSelectedPatient.field_2
                  Width: =600 * SX
                  X: =76 * SX
                  Y: =5 * SY
            - lblSub_PD:
                Control: ModernText@1.0.0
                Properties:
                  Color: =RGBA(255, 255, 255, 0.88)
                  Font: =Font.'Segoe UI'
                  Height: =20 * SY
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Size: =Round(12 * SF, 0)
                  Text: ="URN " & Coalesce(varSelectedPatient.URN, "-") & "  ·  DOB " & If(IsBlank(varSelectedPatient.DOB), "-", Text(DateValue(varSelectedPatient.DOB), "dd/mm/yyyy")) & "  ·  Ward " & Mid(varSelectedList, 6, 2) & "  ·  Bed " & If(IsBlank(pdBed), "-", Text(pdBed))
                  Width: =600 * SX
                  X: =76 * SX
                  Y: =42 * SY
            - btnBack_PD:
                Control: ModernButton@1.0.0
                Properties:
                  Align: =Align.Center
                  Appearance: =ButtonAppearance.Transparent
                  Color: =RGBA(255, 255, 255, 1)
                  FontWeight: =""
                  Height: =70 * SY
                  Icon: ="ChevronLeft"
                  OnSelect: |-
                    =If(
                        (pdEDD <> pdBaseEDD || pdMaint <> pdBaseMaint || pdFalls <> pdBaseFalls || pdContact <> pdBaseContact),
                        Notify(
                            "You have unsaved changes. Please Save or Discard before leaving.",
                            NotificationType.Warning
                        ),
                        Back(ScreenTransition.Fade)
                    )
                  PaddingBottom: =5
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =5
                  RadiusBottomLeft: =4
                  RadiusBottomRight: =4
                  RadiusTopLeft: =4
                  RadiusTopRight: =4
                  Size: =Round(35 * SF, 0)
                  Text: =""
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =96 * SX
                  X: =1 * SX
            - conSave_PD:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.Regular
                  Fill: =RGBA(12, 122, 82, 1)
                  Height: =46 * SY
                  RadiusBottomLeft: =23 * SR
                  RadiusBottomRight: =23 * SR
                  RadiusTopLeft: =23 * SR
                  RadiusTopRight: =23 * SR
                  Visible: =(pdEDD <> pdBaseEDD || pdMaint <> pdBaseMaint || pdFalls <> pdBaseFalls || pdContact <> pdBaseContact)
                  Width: =100 * SX
                  X: =700 * SX
                  Y: =12 * SY
                Children:
                  - btnSave_PD:
                      Control: ModernButton@1.0.0
                      Properties:
                        Align: =Align.Center
                        Appearance: =ButtonAppearance.Transparent
                        Color: =RGBA(255, 255, 255, 1)
                        DisplayMode: =If(pdSaving, DisplayMode.Disabled, DisplayMode.Edit)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =46 * SY
                        Icon: ="Save"
                        IconStyle: =IconStyle.Filled
                        OnSelect: |-
                          =// Saves the four editable fields straight to this patient's ward list
                          Set(pdSaving, true);
                          Switch(
                              varSelectedList,
                              "Ward_4A_Shared",
                                  With(
                                      {
                                          spRow:
                                              Patch(
                                                  Ward_4A_Shared,
                                                  LookUp(Ward_4A_Shared, ID = varSelectedPatient.ID),
                                                  {
                                                      EDD: pdEDD,
                                                      Maintenance: pdMaint,
                                                      'Falls Risk': pdFalls,
                                                      Contact: pdContact
                                                  }
                                              )
                                      },
                                      If(
                                          !IsEmpty(Errors(Ward_4A_Shared, spRow)),
                                          Notify(
                                              "Could not save: " & First(Errors(Ward_4A_Shared, spRow)).Message,
                                              NotificationType.Error
                                          ),
                                          Set(varSelectedPatient, spRow);
                                          Set(pdBaseEDD, pdEDD);
                                          Set(pdBaseMaint, pdMaint);
                                          Set(pdBaseFalls, pdFalls);
                                          Set(pdBaseContact, pdContact);
                                          Notify("Patient details saved.", NotificationType.Success)
                                      )
                                  ),
                              "Ward_4B_Shared",
                                  With(
                                      {
                                          spRow:
                                              Patch(
                                                  Ward_4B_Shared,
                                                  LookUp(Ward_4B_Shared, ID = varSelectedPatient.ID),
                                                  {
                                                      EDD: pdEDD,
                                                      Maintenance: pdMaint,
                                                      'Falls Risk': pdFalls,
                                                      Contact: pdContact
                                                  }
                                              )
                                      },
                                      If(
                                          !IsEmpty(Errors(Ward_4B_Shared, spRow)),
                                          Notify(
                                              "Could not save: " & First(Errors(Ward_4B_Shared, spRow)).Message,
                                              NotificationType.Error
                                          ),
                                          Set(varSelectedPatient, spRow);
                                          Set(pdBaseEDD, pdEDD);
                                          Set(pdBaseMaint, pdMaint);
                                          Set(pdBaseFalls, pdFalls);
                                          Set(pdBaseContact, pdContact);
                                          Notify("Patient details saved.", NotificationType.Success)
                                      )
                                  ),
                              "Ward_5A_Shared",
                                  With(
                                      {
                                          spRow:
                                              Patch(
                                                  Ward_5A_Shared,
                                                  LookUp(Ward_5A_Shared, ID = varSelectedPatient.ID),
                                                  {
                                                      EDD: pdEDD,
                                                      Maintenance: pdMaint,
                                                      'Falls Risk': pdFalls,
                                                      Contact: pdContact
                                                  }
                                              )
                                      },
                                      If(
                                          !IsEmpty(Errors(Ward_5A_Shared, spRow)),
                                          Notify(
                                              "Could not save: " & First(Errors(Ward_5A_Shared, spRow)).Message,
                                              NotificationType.Error
                                          ),
                                          Set(varSelectedPatient, spRow);
                                          Set(pdBaseEDD, pdEDD);
                                          Set(pdBaseMaint, pdMaint);
                                          Set(pdBaseFalls, pdFalls);
                                          Set(pdBaseContact, pdContact);
                                          Notify("Patient details saved.", NotificationType.Success)
                                      )
                                  ),
                              "Ward_6A_Shared",
                                  With(
                                      {
                                          spRow:
                                              Patch(
                                                  Ward_6A_Shared,
                                                  LookUp(Ward_6A_Shared, ID = varSelectedPatient.ID),
                                                  {
                                                      EDD: pdEDD,
                                                      Maintenance: pdMaint,
                                                      'Falls Risk': pdFalls,
                                                      Contact: pdContact
                                                  }
                                              )
                                      },
                                      If(
                                          !IsEmpty(Errors(Ward_6A_Shared, spRow)),
                                          Notify(
                                              "Could not save: " & First(Errors(Ward_6A_Shared, spRow)).Message,
                                              NotificationType.Error
                                          ),
                                          Set(varSelectedPatient, spRow);
                                          Set(pdBaseEDD, pdEDD);
                                          Set(pdBaseMaint, pdMaint);
                                          Set(pdBaseFalls, pdFalls);
                                          Set(pdBaseContact, pdContact);
                                          Notify("Patient details saved.", NotificationType.Success)
                                      )
                                  )
                          );
                          Set(pdSaving, false)
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =5
                        RadiusBottomLeft: =23 * SR
                        RadiusBottomRight: =23 * SR
                        RadiusTopLeft: =23 * SR
                        RadiusTopRight: =23 * SR
                        Size: =Round(14 * SF, 0)
                        Text: ="Save"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =100 * SX
            - conDiscard_PD:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.Regular
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =46 * SY
                  RadiusBottomLeft: =23 * SR
                  RadiusBottomRight: =23 * SR
                  RadiusTopLeft: =23 * SR
                  RadiusTopRight: =23 * SR
                  Visible: =(pdEDD <> pdBaseEDD || pdMaint <> pdBaseMaint || pdFalls <> pdBaseFalls || pdContact <> pdBaseContact)
                  Width: =120 * SX
                  X: =810 * SX
                  Y: =12 * SY
                Children:
                  - btnDiscard_PD:
                      Control: ModernButton@1.0.0
                      Properties:
                        Align: =Align.Center
                        Appearance: =ButtonAppearance.Transparent
                        Color: =RGBA(180, 26, 26, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =46 * SY
                        Icon: ="DismissCircle"
                        IconStyle: =IconStyle.Filled
                        OnSelect: |-
                          =Set(pdEDD, pdBaseEDD);
                          Set(pdMaint, pdBaseMaint);
                          Set(pdFalls, pdBaseFalls);
                          Set(pdContact, pdBaseContact);
                          Notify("Changes discarded.", NotificationType.Information)
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =5
                        RadiusBottomLeft: =23 * SR
                        RadiusBottomRight: =23 * SR
                        RadiusTopLeft: =23 * SR
                        RadiusTopRight: =23 * SR
                        Size: =Round(14 * SF, 0)
                        Text: ="Discard"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =120 * SX
      - PD_CardPatient:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(14, 42, 70, 0.12)
            BorderThickness: =1
