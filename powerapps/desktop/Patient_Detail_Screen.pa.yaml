            - conAlloc_PD:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =1
                  DropShadow: =DropShadow.Regular
                  Fill: =RGBA(26, 90, 153, 1)
                  Height: =48 * SY
                  RadiusBottomLeft: =24 * SR
                  RadiusBottomRight: =24 * SR
                  RadiusTopLeft: =24 * SR
                  RadiusTopRight: =24 * SR
                  Width: =200 * SX
                  X: =20 * SX
                  Y: =590 * SY
                Children:
                  - btnAlloc_PD:
                      Control: ModernButton@1.0.0
                      Properties:
                        Align: =Align.Center
                        Appearance: =ButtonAppearance.Transparent
                        Color: =RGBA(255, 255, 255, 1)
                        DisplayMode: =If(!IsBlank(varSelectedItem) && varSelectedItem.Status.Value = "Available", DisplayMode.Edit, DisplayMode.Disabled)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =48 * SY
                        Layout: =ButtonLayout.TextOnly
                        OnSelect: |-
                          =If(
                              IsBlank(varSelectedItem) ||
                              Coalesce(LookUp(Equipment_Inventory_SharePoint, ID = varSelectedItem.ID).Status.Value, "") <> "Available",
                              Notify(
                                  "Please select an available piece of equipment before allocating.",
                                  NotificationType.Error
                              ),
                              With(
                                  {
                                      episodeKey: Concatenate(
                                          "EQ-",
                                          Text(varSelectedItem.ID),
                                          "-",
                                          Text(Now(), "yyyymmddhhmmss"),
                                          "-",
                                          Left(Text(GUID()), 8)
                                      ),
                                      actionTime: Now(),
                                      wardChoice: Mid(varSelectedList, 6, 2)     // "4A", "4B", "5A", "6A" = the patient's own ward
                                  },
                                  Patch(
                                      Equipment_Inventory_SharePoint,
                                      varSelectedItem,
                                      {
                                          'Patient Name': varSelectedPatient.field_2,
                                          URN: varSelectedPatient.URN,
                                          DOB: varSelectedPatient.DOB,
                                          Physiotherapist: User().FullName,
                                          'Date Signed Out': Today(),
                                          Ward: { Value: wardChoice },
                                          Status: { Value: "Allocated" },
                                          CurrentEpisodeKey: episodeKey
                                      }
                                  );
                                  Patch(
                                      Equipment_Usage_Log,
                                      Defaults(Equipment_Usage_Log),
                                      {
                                          Title: Concatenate(episodeKey, " - Sign Out"),
                                          EpisodeKey: episodeKey,
                                          EventType: { Value: "Sign Out" },
                                          EpisodeStatus: { Value: "Open" },
                                          EventDateTime: actionTime,
                                          EquipmentItemID: varSelectedItem.ID,
                                          EquipmentTitle: varSelectedItem.Title,
                                          Category: Coalesce(varSelectedItem.Category.Value, ""),
                                          Brand: Coalesce(varSelectedItem.Brand, ""),
                                          Model: Coalesce(varSelectedItem.Model, ""),
                                          Width: Coalesce(varSelectedItem.Width.Value, ""),
                                          Depth: Coalesce(varSelectedItem.Depth.Value, ""),
                                          Height: Coalesce(varSelectedItem.Height.Value, ""),
                                          SWL: Coalesce(varSelectedItem.SWL, ""),
                                          WheelchairType: Coalesce(varSelectedItem.'Wheelchair Type'.Value, ""),
                                          LocationAtEvent: Coalesce(varSelectedItem.Location.Value, ""),
                                          Ward: wardChoice,
                                          PatientName: varSelectedPatient.field_2,
                                          URN: varSelectedPatient.URN,
                                          DOB: varSelectedPatient.DOB,
                                          Physiotherapist: User().FullName,
                                          DateSignedOut: Today(),
                                          DateReturned: Blank(),
                                          DaysSignedOutThisEpisode: Blank(),
                                          TotalDaysSignedOutAfterEvent: Coalesce(varSelectedItem.TotalDaysSignedOut, 0),
                                          Over100DaysAfterEvent: Coalesce(varSelectedItem.TotalDaysSignedOut, 0) > 100,
                                          ServiceRequired: Coalesce(varSelectedItem.TotalDaysSignedOut, 0) > 100,
                                          IsHighRiskEquipment: Coalesce(varSelectedItem.IsHighRiskEquipment, false),
                                          OutOfService: Coalesce(varSelectedItem.OutOfService, false),
                                          IsActive: Coalesce(varSelectedItem.IsActive, true),
                                          StatusAfterEvent: "Allocated",
                                          ActionedByName: User().FullName,
                                          ActionedByEmail: User().Email,
                                          SourceApp: { Value: "Web" },
                                          Notes: ""
                                      }
                                  );
                                  Notify(
                                      "Equipment successfully allocated.",
                                      NotificationType.Success
                                  );
                                  ClearCollect(
                                      colGroupedEquipment,
                                      Filter(
                                          Equipment_Inventory_SharePoint,
                                          Status.Value = "Allocated" &&
                                          DateDiff(DateValue('Date Signed Out'), Today()) = 0 &&
                                          Physiotherapist = User().FullName
                                      )
                                  );
                                  Set(varSelectedItem, Blank());
                                  Set(varSearchCode_1, "");
                                  Reset(TextInput_SearchCode_1)
                              )
                          )
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =5
                        RadiusBottomLeft: =24 * SR
                        RadiusBottomRight: =24 * SR
                        RadiusTopLeft: =24 * SR
                        RadiusTopRight: =24 * SR
                        Size: =Round(18 * SF, 0)
                        Text: ="Allocate"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =200 * SX
            - conReturn_PD:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(14, 42, 70, 0.12)
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(254, 242, 242, 1)
                  Height: =48 * SY
                  RadiusBottomLeft: =24 * SR
                  RadiusBottomRight: =24 * SR
                  RadiusTopLeft: =24 * SR
                  RadiusTopRight: =24 * SR
                  Width: =200 * SX
                  X: =233 * SX
                  Y: =590 * SY
                Children:
                  - btnReturn_PD:
                      Control: ModernButton@1.0.0
                      Properties:
                        Align: =Align.Center
                        Appearance: =ButtonAppearance.Transparent
                        Color: =RGBA(180, 26, 26, 1)
                        DisplayMode: =If(!IsBlank(varSelectedItem) && varSelectedItem.Status.Value = "Allocated", DisplayMode.Edit, DisplayMode.Disabled)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =48 * SY
                        Layout: =ButtonLayout.TextOnly
                        OnSelect: |-
                          =If(
                              IsBlank(varSelectedItem) ||
                              Coalesce(varSelectedItem.Status.Value, "") <> "Allocated" ||
                              IsBlank(varSelectedItem.'Date Signed Out'),
                              Notify(
                                  "Please select an allocated piece of equipment with a valid signed-out date before returning.",
                                  NotificationType.Error
                              ),
                              Set(pdShowRet, true)
                          )
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =5
                        RadiusBottomLeft: =24 * SR
                        RadiusBottomRight: =24 * SR
                        RadiusTopLeft: =24 * SR
                        RadiusTopRight: =24 * SR
                        Size: =Round(18 * SF, 0)
                        Text: ="Return"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =200 * SX
                  - btnReturnGo_PD:
                      Control: ModernButton@1.0.0
                      Properties:
                        Align: =Align.Center
                        FontWeight: =""
                        Height: =10 * SY
                        OnSelect: |-
                          =If(
                              IsBlank(varSelectedItem) ||
                              Coalesce(LookUp(Equipment_Inventory_SharePoint, ID = varSelectedItem.ID).Status.Value, "") <> "Allocated" ||
                              IsBlank(varSelectedItem.'Date Signed Out'),
                              Notify(
                                  "Please select an allocated piece of equipment with a valid signed-out date before returning.",
                                  NotificationType.Error
                              ),
                              With(
                                  {
                                      returnDate: Today(),
                                      actionTime: Now(),
                                      episodeKey: Coalesce(
                                          varSelectedItem.CurrentEpisodeKey,
                                          Concatenate(
                                              "LEGACY-RETURN-",
                                              Text(varSelectedItem.ID),
                                              "-",
                                              Text(Now(), "yyyymmddhhmmss"),
                                              "-",
                                              Left(Text(GUID()), 8)
                                          )
                                      ),
                                      daysThisEpisode: Max(
                                          0,
                                          DateDiff(
                                              varSelectedItem.'Date Signed Out',
                                              Today(),
                                              "Days"
                                          )
                                      )
                                  },
                                  With(
                                      {
                                          newTotalDays:
                                              Coalesce(varSelectedItem.TotalDaysSignedOut, 0) +
                                              daysThisEpisode
                                      },
                                      Patch(
                                          Equipment_Inventory_SharePoint,
                                          varSelectedItem,
                                          {
                                              Status: { Value: "Available" },
                                              'Patient Name': "",
                                              URN: "",
                                              Physiotherapist: "",
                                              DOB: Blank(),
                                              'Date Returned': returnDate,
                                              Location: If(IsBlank(ddRetLoc_PD.Selected.Value), varSelectedItem.Location, { Value: ddRetLoc_PD.Selected.Value }),
                                              Ward: Blank(),
                                              'Signed In By': User().FullName,
                                              CurrentEpisodeKey: Blank(),
                                              TotalDaysSignedOut: newTotalDays
                                          }
                                      );
                                      Patch(
                                          Equipment_Usage_Log,
                                          Defaults(Equipment_Usage_Log),
                                          {
                                              Title: Concatenate(episodeKey, " - Sign In"),
                                              EpisodeKey: episodeKey,
                                              EventType: { Value: "Sign In" },
                                              EpisodeStatus: {
                                                  Value: If(
                                                      IsBlank(varSelectedItem.CurrentEpisodeKey),
                                                      "Legacy unmatched",
                                                      "Closed"
                                                  )
                                              },
                                              EventDateTime: actionTime,
                                              EquipmentItemID: varSelectedItem.ID,
                                              EquipmentTitle: varSelectedItem.Title,
                                              Category: Coalesce(varSelectedItem.Category.Value, ""),
                                              Brand: Coalesce(varSelectedItem.Brand, ""),
                                              Model: Coalesce(varSelectedItem.Model, ""),
                                              Width: Coalesce(varSelectedItem.Width.Value, ""),
                                              Depth: Coalesce(varSelectedItem.Depth.Value, ""),
                                              Height: Coalesce(varSelectedItem.Height.Value, ""),
                                              SWL: Coalesce(varSelectedItem.SWL, ""),
                                              WheelchairType: Coalesce(varSelectedItem.'Wheelchair Type'.Value, ""),
                                              LocationAtEvent: Coalesce(ddRetLoc_PD.Selected.Value, varSelectedItem.Location.Value, ""),
                                              Ward: Coalesce(varSelectedItem.Ward.Value, ""),
                                              PatientName: Coalesce(varSelectedItem.'Patient Name', ""),
                                              URN: Coalesce(varSelectedItem.URN, ""),
                                              DOB: varSelectedItem.DOB,
                                              Physiotherapist: Coalesce(varSelectedItem.Physiotherapist, ""),
                                              DateSignedOut: varSelectedItem.'Date Signed Out',
                                              DateReturned: returnDate,
                                              DaysSignedOutThisEpisode: daysThisEpisode,
                                              TotalDaysSignedOutAfterEvent: newTotalDays,
                                              Over100DaysAfterEvent: newTotalDays > 100,
                                              ServiceRequired: newTotalDays > 100,
                                              IsHighRiskEquipment: Coalesce(varSelectedItem.IsHighRiskEquipment, false),
                                              OutOfService: Coalesce(varSelectedItem.OutOfService, false),
                                              IsActive: Coalesce(varSelectedItem.IsActive, true),
                                              StatusAfterEvent: "Available",
                                              ActionedByName: User().FullName,
                                              ActionedByEmail: User().Email,
                                              SourceApp: { Value: "Web" },
                                              Notes: If(
                                                  IsBlank(varSelectedItem.CurrentEpisodeKey),
                                                  "Return completed without an existing CurrentEpisodeKey. This is likely a pre-log allocation.",
                                                  ""
                                              )
                                          }
                                      );
                                      With(
                                          {
                                              signOutLogRow: LookUp(
                                                  Equipment_Usage_Log,
                                                  EpisodeKey = episodeKey &&
                                                  EventType.Value = "Sign Out"
                                              )
                                          },
                                          If(
                                              !IsBlank(signOutLogRow.ID),
                                              Patch(
                                                  Equipment_Usage_Log,
                                                  signOutLogRow,
                                                  {
                                                      EpisodeStatus: { Value: "Closed" },
                                                      DateReturned: returnDate,
                                                      DaysSignedOutThisEpisode: daysThisEpisode,
                                                      TotalDaysSignedOutAfterEvent: newTotalDays,
                                                      Over100DaysAfterEvent: newTotalDays > 100,
                                                      ServiceRequired: newTotalDays > 100
                                                  }
                                              )
                                          )
                                      );
                                      Notify(
                                          "Equipment returned successfully.",
                                          NotificationType.Success
                                      );
                                      If(
                                          newTotalDays > 100,
                                          Notify(
                                              "This equipment has been used for >100 days this year and requires a Full Service. Please set equipment aside and contact CA for details.",
                                              NotificationType.Warning
                                          )
                                      );
                                      ClearCollect(
                                          colGroupedEquipment,
                                          Filter(
                                              Equipment_Inventory_SharePoint,
                                              Status.Value = "Allocated" &&
                                              DateDiff(DateValue('Date Signed Out'), Today()) = 0 &&
                                              Physiotherapist = User().FullName
                                          )
                                      );
                                      Set(varSelectedItem, Blank());
                                      Set(varSearchCode_1, "");
                                      Reset(TextInput_SearchCode_1)
                                  )
                              )
                          )
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =5
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Size: =Round(14 * SF, 0)
                        Text: =""
                        VerticalAlign: =VerticalAlign.Middle
                        Visible: =false
                        Width: =10 * SX
