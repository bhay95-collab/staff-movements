                  Text: ="EXPECTED DISCHARGE DATE (EDD)"
                  Width: =360 * SX
                  X: =20 * SX
                  Y: =246 * SY
            - conEdd_PD:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(14, 42, 70, 0.12)
                  BorderThickness: =1
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =40 * SY
                  RadiusBottomLeft: =10 * SR
                  RadiusBottomRight: =10 * SR
                  RadiusTopLeft: =10 * SR
                  RadiusTopRight: =10 * SR
                  Width: =200 * SX
                  X: =20 * SX
                  Y: =268 * SY
                Children:
                  - dpEdd_PD:
