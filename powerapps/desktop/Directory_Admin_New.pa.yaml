                        Items: |-
                          =AddColumns(
                              Office365Users.SearchUserV2({ searchTerm: cmbAddUser_Ad.SearchText }).value,
                              DisplayText,
                              DisplayName & " • " & Coalesce(JobTitle, "") & " • " & Coalesce(Mail, UserPrincipalName, "")
                          )
                        SearchFields: =["DisplayText","DisplayName","Mail","JobTitle"]
                        SelectMultiple: =false
                        SelectionFill: =RGBA(26, 90, 153, 1)
                        Size: =Round(14 * SF, 0)
                        Width: =618 * SX
            - capAcc_Ad:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(140, 155, 174, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =16 * SY
