                        - boxRowAccess_Ad:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =RGBA(14, 42, 70, 0.22)
                              BorderThickness: =1
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =40 * SY
                              RadiusBottomLeft: =10 * SR
                              RadiusBottomRight: =10 * SR
                              RadiusTopLeft: =10 * SR
                              RadiusTopRight: =10 * SR
                              Width: =170 * SX
                              X: =Parent.Width - 296 * SX
                              Y: =14 * SY
                            Children:
                              - ddRowAccess_Ad:
                                  Control: Classic/DropDown@2.3.1
                                  Properties:
                                    BorderStyle: =BorderStyle.None
                                    ChevronBackground: =RGBA(26, 90, 153, 1)
                                    ChevronFill: =RGBA(255, 255, 255, 1)
                                    Color: =RGBA(14, 28, 42, 1)
                                    Default: =ThisItem.Access.Value
                                    DisplayMode: =If(Lower(ThisItem.PersonEmail) = Lower(User().Email), DisplayMode.Disabled, DisplayMode.Edit)
                                    Font: =Font.'Segoe UI'
                                    Height: =40 * SY
                                    Items: =Choices(ClinicianDirectory.Access).Value
                                    Items.Value: =Value
                                    OnChange: |-
                                      =With(
                                          { sel: ddRowAccess_Ad.Selected.Value },
                                          If(
                                              sel <> ThisItem.AccessText,
                                              Patch(
                                                  ClinicianDirectory,
                                                  LookUp(ClinicianDirectory, ID = ThisItem.ID),
                                                  { Access: LookUp(Choices(ClinicianDirectory.Access), Value = sel) }
                                              );
                                              If(
                                                  IsEmpty(Errors(ClinicianDirectory)),
                                                  UpdateIf(
                                                      colDirectory,
                                                      ID = ThisItem.ID,
                                                      {
                                                          Access: LookUp(Choices(ClinicianDirectory.Access), Value = sel),
                                                          AccessText: sel
                                                      }
                                                  );
                                                  Select(btnPie_Ad);
                                                  Notify("Access updated.", NotificationType.Success),
                                                  Reset(ddRowAccess_Ad);
                                                  Notify("Could not update access. Please try again.", NotificationType.Error)
                                              )
                                          )
                                      )
                                    Size: =Round(14 * SF, 0)
                                    Width: =170 * SX
