                  Text: ="ACCESS LEVEL"
                  Width: =300 * SX
                  X: =20 * SX
                  Y: =118 * SY
            - boxAcc_Ad:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(14, 42, 70, 0.22)
                  BorderThickness: =1
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =40 * SY
                  RadiusBottomLeft: =10 * SR
