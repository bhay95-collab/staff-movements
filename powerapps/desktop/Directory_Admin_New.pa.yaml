                  Y: =68 * SY
                Children:
                  - cmbAddUser_Ad:
                      Control: Classic/ComboBox@2.4.0
                      Properties:
                        BorderStyle: =BorderStyle.None
                        ChevronBackground: =RGBA(26, 90, 153, 1)
                        ChevronHoverBackground: =RGBA(18, 64, 112, 1)
