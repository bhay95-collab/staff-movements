Screens:
  Equipment_Main:
    Properties:
      Fill: =RGBA(235, 242, 248, 1)
      ImagePosition: =ImagePosition.Fill
      OnVisible: |-
        =Set(eqLoading, true);
        // =======================================================
        // SHARED INITIALISATION
        // (Patient Detail relies on these even if no Ward screen was opened first)
        // NOTE: the four ward caches that used to be built here are gone.
        // They all wrote into the same collection and overwrote each other.
        // Patients are now looked up straight from the ward lists when needed.
        // =======================================================
        // Typed empty People table
        Set(
            varEmptyPeople,
            FirstN(
                Table(
                    {
                        Claims: "",
                        DisplayName: "",
                        Email: "",
                        Department: "",
                        JobTitle: "",
                        Picture: ""
                    }
                ),
                0
            )
        );
        Concurrent(
            // Clinician option lists
            ClearCollect(
                colClinicians_Physio,
                AddColumns(
                    Filter(ClinicianDirectory, Discipline.Value = "Physio" && !IsBlank(Person)),
                    DisplayNameFlat, Coalesce(Person.DisplayName, Person.Email, ""),
                    DisplayKey, Lower(Trim(Person.Claims)),
                    PersonRec, Person
                )
            ),
            ClearCollect(
                colClinicians_OT,
                AddColumns(
                    Filter(ClinicianDirectory, Discipline.Value = "OT" && !IsBlank(Person)),
                    DisplayNameFlat, Coalesce(Person.DisplayName, Person.Email, ""),
                    DisplayKey, Lower(Trim(Person.Claims)),
                    PersonRec, Person
                )
            ),
            ClearCollect(
                colClinicians_SP,
                AddColumns(
                    Filter(ClinicianDirectory, Discipline.Value = "SP" && !IsBlank(Person)),
                    DisplayNameFlat, Coalesce(Person.DisplayName, Person.Email, ""),
                    DisplayKey, Lower(Trim(Person.Claims)),
                    PersonRec, Person
                )
            ),
            // Equipment I signed out today
            ClearCollect(
                colGroupedEquipment,
                Filter(
                    Equipment_Inventory_SharePoint,
                    Status.Value = "Allocated" &&
                    DateDiff(DateValue('Date Signed Out'), Today()) = 0 &&
                    Physiotherapist = User().FullName
                )
            )
        );
        // Current user directory record
        Set(
            varMeDirectory,
            LookUp(ClinicianDirectory, Lower(Person.Email) = Lower(User().Email))
        );
        // Reset the screen
        Set(varSearchPatient, "");
        Set(varSearchCode, "");
        Set(varSelectedItem, Blank());
        Set(varShowDischargedEquipmentPopup, false);
        Reset(TextInput_SearchPatient);
        Set(eqLoading, false)
    Children:
      - Eq_Title:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.Regular
            Fill: =RGBA(7, 95, 115, 1)
            Height: =70 * SY
            RadiusBottomLeft: =18 * SR
            RadiusBottomRight: =18 * SR
            RadiusTopLeft: =18 * SR
            RadiusTopRight: =18 * SR
            Width: =1333 * SX
            X: =18 * SX
