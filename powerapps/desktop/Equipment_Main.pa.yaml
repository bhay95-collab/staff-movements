                            Children:
                              - btnPt_Eq:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Appearance: =ButtonAppearance.Transparent
                                    Color: =RGBA(26, 90, 153, 1)
                                    FontWeight: =""
                                    Height: =44 * SY
                                    Icon: ="BookContacts"
                                    IconStyle: =IconStyle.Filled
                                    OnSelect: |-
                                      =// Find this equipment's patient on the four ward lists (Name + URN + DOB where the equipment record has them)
                                      With(
                                          {
                                              n: ThisItem.'Patient Name',
                                              u: ThisItem.URN,
                                              d: ThisItem.DOB
                                          },
                                          With(
                                              {
                                                  r4A: LookUp(Filter(Ward_4A_Shared, Patient = n), (IsBlank(u) || Text(URN) = Text(u)) && (IsBlank(d) || Text(DOB, "yyyymmdd") = Text(d, "yyyymmdd"))),
                                                  r4B: LookUp(Filter(Ward_4B_Shared, Patient = n), (IsBlank(u) || Text(URN) = Text(u)) && (IsBlank(d) || Text(DOB, "yyyymmdd") = Text(d, "yyyymmdd"))),
                                                  r5A: LookUp(Filter(Ward_5A_Shared, Patient = n), (IsBlank(u) || Text(URN) = Text(u)) && (IsBlank(d) || Text(DOB, "yyyymmdd") = Text(d, "yyyymmdd"))),
                                                  r6A: LookUp(Filter(Ward_6A_Shared, Patient = n), (IsBlank(u) || Text(URN) = Text(u)) && (IsBlank(d) || Text(DOB, "yyyymmdd") = Text(d, "yyyymmdd")))
                                              },
                                              If(
                                                  IsBlank(Trim(n)),
                                                  Notify(
                                                      "No patient is associated with this equipment.",
                                                      NotificationType.Warning
                                                  ),
                                                  !IsBlank(r4A),
                                                  Set(varSelectedPatient, r4A);
                                                  Set(varSelectedList, "Ward_4A_Shared");
                                                  Set(varWardCode, "4A");
                                                  Navigate(Patient_Detail_Screen, ScreenTransition.Fade),
                                                  !IsBlank(r4B),
                                                  Set(varSelectedPatient, r4B);
                                                  Set(varSelectedList, "Ward_4B_Shared");
                                                  Set(varWardCode, "4B");
                                                  Navigate(Patient_Detail_Screen, ScreenTransition.Fade),
                                                  !IsBlank(r5A),
                                                  Set(varSelectedPatient, r5A);
                                                  Set(varSelectedList, "Ward_5A_Shared");
                                                  Set(varWardCode, "5A");
                                                  Navigate(Patient_Detail_Screen, ScreenTransition.Fade),
                                                  !IsBlank(r6A),
                                                  Set(varSelectedPatient, r6A);
                                                  Set(varSelectedList, "Ward_6A_Shared");
                                                  Set(varWardCode, "6A");
                                                  Navigate(Patient_Detail_Screen, ScreenTransition.Fade),
                                                  // PATIENT NOT FOUND on any ward
                                                  Set(varDischargedEquipment, ThisItem);
                                                  Set(varShowDischargedEquipmentPopup, true)
                                              )
                                          )
                                      )
