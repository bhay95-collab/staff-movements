            - lblKOut_Eq:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(140, 155, 174, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =26 * SY
                  Size: =Round(11 * SF, 0)
                  Text: ="SIGNED OUT"
                  Visible: =varSelectedItem.Status.Value = "Allocated"
                  Width: =110 * SX
                  X: =20 * SX
                  Y: =514 * SY
            - lblVOut_Eq:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(14, 28, 42, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =26 * SY
                  Size: =Round(14 * SF, 0)
                  Text: =If(IsBlank(varSelectedItem.'Date Signed Out'), "-", Text(varSelectedItem.'Date Signed Out', "dd/mm/yyyy"))
                  Visible: =varSelectedItem.Status.Value = "Allocated"
                  Width: =280 * SX
                  X: =134 * SX
                  Y: =514 * SY
            - lblNoSo_Eq:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(140, 155, 174, 1)
                  Font: =Font.'Segoe UI'
                  Height: =48 * SY
                  Size: =Round(13 * SF, 0)
                  Text: =If(IsBlank(varSelectedItem), "Select an item from a list to see its details.", "This item is not currently signed out.")
                  Visible: =!(varSelectedItem.Status.Value = "Allocated")
                  Width: =391 * SX
                  X: =20 * SX
                  Y: =322 * SY
      - conNotFound_Eq:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(14, 28, 42, 0.42)
            Height: =768 * SY
            Visible: =varShowDischargedEquipmentPopup
            Width: =1366 * SX
          Children:
            - conNotFoundCard_Eq:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.Bold
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =360 * SY
                  RadiusBottomLeft: =20 * SR
                  RadiusBottomRight: =20 * SR
                  RadiusTopLeft: =20 * SR
                  RadiusTopRight: =20 * SR
                  Width: =640 * SX
                  X: =363 * SX
                  Y: =204 * SY
                Children:
                  - lblNfTitle_Eq:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(14, 28, 42, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =40 * SY
                        Size: =Round(22 * SF, 0)
                        Text: ="Patient no longer found"
                        Width: =560 * SX
                        X: =40 * SX
                        Y: =16
                  - lblNfBody_Eq:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(58, 80, 104, 1)
                        Font: =Font.'Segoe UI'
                        Height: =116
                        Size: =Round(13 * SF, 0)
                        Text: =varDischargedEquipment.'Patient Name' & " could not be found on any current ward list. They may have been discharged." & Char(10) & Char(10) & "Is the equipment cleaned and ready to return, or should it stay allocated?"
                        Width: =560 * SX
                        X: =40 * SX
                        Y: =56
                  - lblNfLocCap_Eq:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        Color: =RGBA(58, 80, 104, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =42 * SY
                        Size: =Round(14 * SF, 0)
                        Text: ="Where is it going back to?"
                        Width: =240 * SX
                        X: =50 * SX
                        Y: =176 * SY
                  - boxNfLoc_Eq:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =RGBA(14, 42, 70, 0.22)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =42 * SY
                        RadiusBottomLeft: =10 * SR
                        RadiusBottomRight: =10 * SR
                        RadiusTopLeft: =10 * SR
                        RadiusTopRight: =10 * SR
                        Width: =300 * SX
                        X: =300 * SX
                        Y: =176 * SY
                      Children:
                        - ddNfLoc_Eq:
                            Control: Classic/DropDown@2.3.1
                            Properties:
                              BorderStyle: =BorderStyle.None
                              ChevronBackground: =RGBA(26, 90, 153, 1)
                              ChevronFill: =RGBA(255, 255, 255, 1)
                              Color: =RGBA(14, 28, 42, 1)
                              Default: =Coalesce(varDischargedEquipment.Location.Value, "")
                              Font: =Font.'Segoe UI'
                              Height: =Parent.Height
                              Items: =Choices(Equipment_Inventory_SharePoint.Location)
                              Items.Value: =Value
                              Size: =Round(14 * SF, 0)
                              Width: =Parent.Width
                  - conNfLeave_Eq:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =RGBA(14, 42, 70, 0.12)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =52 * SY
                        RadiusBottomLeft: =26 * SR
                        RadiusBottomRight: =26 * SR
                        RadiusTopLeft: =26 * SR
                        RadiusTopRight: =26 * SR
                        Width: =220 * SX
                        X: =90 * SX
                        Y: =266 * SY
                      Children:
                        - btnNfLeave_Eq:
                            Control: ModernButton@1.0.0
                            Properties:
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Transparent
                              Color: =RGBA(58, 80, 104, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =52 * SY
                              Layout: =ButtonLayout.TextOnly
                              OnSelect: |-
                                =Set(varShowDischargedEquipmentPopup, false);
                                Set(varDischargedEquipment, Blank())
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =26 * SR
                              RadiusBottomRight: =26 * SR
                              RadiusTopLeft: =26 * SR
                              RadiusTopRight: =26 * SR
                              Size: =Round(17 * SF, 0)
                              Text: ="Leave allocated"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =220 * SX
                  - conNfReturn_Eq:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =1
                        DropShadow: =DropShadow.Regular
                        Fill: =RGBA(26, 90, 153, 1)
                        Height: =52 * SY
                        RadiusBottomLeft: =26 * SR
                        RadiusBottomRight: =26 * SR
                        RadiusTopLeft: =26 * SR
                        RadiusTopRight: =26 * SR
                        Width: =220 * SX
                        X: =330 * SX
                        Y: =266 * SY
                      Children:
                        - btnNfReturn_Eq:
                            Control: ModernButton@1.0.0
                            Properties:
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Transparent
                              Color: =RGBA(255, 255, 255, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =52 * SY
                              Layout: =ButtonLayout.TextOnly
                              OnSelect: |-
                                =If(
                                    IsBlank(varDischargedEquipment) ||
                                    Coalesce(LookUp(Equipment_Inventory_SharePoint, ID = varDischargedEquipment.ID).Status.Value, "") <> "Allocated" ||
                                    IsBlank(varDischargedEquipment.'Date Signed Out'),
                                    Notify(
                                        "This equipment cannot be returned because the allocation details are incomplete.",
                                        NotificationType.Error
                                    ),
                                    With(
                                        {
                                            returnDate: Today(),
                                            actionTime: Now(),
                                            episodeKey:
                                                Coalesce(
                                                    varDischargedEquipment.CurrentEpisodeKey,
                                                    Concatenate(
                                                        "LEGACY-RETURN-",
                                                        Text(varDischargedEquipment.ID),
                                                        "-",
                                                        Text(Now(), "yyyymmddhhmmss"),
                                                        "-",
                                                        Left(Text(GUID()), 8)
                                                    )
                                                ),
                                            daysThisEpisode:
                                                Max(
                                                    0,
                                                    DateDiff(
                                                        varDischargedEquipment.'Date Signed Out',
                                                        Today(),
                                                        "Days"
                                                    )
                                                )
                                        },
                                        With(
                                            {
                                                newTotalDays:
                                                    Coalesce(
                                                        varDischargedEquipment.TotalDaysSignedOut,
                                                        0
                                                    ) +
                                                    daysThisEpisode
                                            },
                                            // ===================================================
                                            // RETURN EQUIPMENT
                                            // ===================================================
                                            Patch(
                                                Equipment_Inventory_SharePoint,
                                                varDischargedEquipment,
                                                {
                                                    Status: {
                                                        Value: "Available"
                                                    },
                                                    'Patient Name': "",
                                                    URN: "",
                                                    Physiotherapist: "",
                                                    DOB: Blank(),
                                                    'Date Returned': returnDate,
                                                    Location: If(IsBlank(ddNfLoc_Eq.Selected.Value), varDischargedEquipment.Location, { Value: ddNfLoc_Eq.Selected.Value }),
                                                    Ward: Blank(),
                                                    'Signed In By': User().FullName,
                                                    CurrentEpisodeKey: Blank(),
                                                    TotalDaysSignedOut: newTotalDays
                                                }
                                            );
                                            // ===================================================
                                            // CREATE SIGN-IN LOG
                                            // ===================================================
                                            Patch(
                                                Equipment_Usage_Log,
                                                Defaults(Equipment_Usage_Log),
                                                {
                                                    Title:
                                                        Concatenate(
                                                            episodeKey,
                                                            " - Sign In"
                                                        ),
                                                    EpisodeKey: episodeKey,
                                                    EventType: {
                                                        Value: "Sign In"
                                                    },
                                                    EpisodeStatus: {
                                                        Value:
                                                            If(
                                                                IsBlank(
                                                                    varDischargedEquipment.CurrentEpisodeKey
                                                                ),
                                                                "Legacy unmatched",
                                                                "Closed"
                                                            )
                                                    },
                                                    EventDateTime: actionTime,
                                                    EquipmentItemID:
                                                        varDischargedEquipment.ID,
                                                    EquipmentTitle:
                                                        varDischargedEquipment.Title,
                                                    Category:
                                                        Coalesce(
                                                            varDischargedEquipment.Category.Value,
                                                            ""
                                                        ),
                                                    Brand:
                                                        Coalesce(
                                                            varDischargedEquipment.Brand,
                                                            ""
                                                        ),
                                                    Model:
                                                        Coalesce(
                                                            varDischargedEquipment.Model,
                                                            ""
                                                        ),
                                                    Width:
                                                        Coalesce(
                                                            varDischargedEquipment.Width.Value,
                                                            ""
                                                        ),
                                                    Depth:
                                                        Coalesce(
                                                            varDischargedEquipment.Depth.Value,
                                                            ""
                                                        ),
                                                    Height:
                                                        Coalesce(
                                                            varDischargedEquipment.Height.Value,
                                                            ""
                                                        ),
                                                    SWL:
                                                        Coalesce(
                                                            varDischargedEquipment.SWL,
                                                            ""
                                                        ),
                                                    WheelchairType:
                                                        Coalesce(
                                                            varDischargedEquipment.'Wheelchair Type'.Value,
                                                            ""
                                                        ),
                                                    LocationAtEvent: Coalesce(ddNfLoc_Eq.Selected.Value, varDischargedEquipment.Location.Value, ""),
                                                    Ward:
                                                        Coalesce(
                                                            varDischargedEquipment.Ward.Value,
                                                            ""
                                                        ),
                                                    PatientName:
                                                        Coalesce(
                                                            varDischargedEquipment.'Patient Name',
                                                            ""
                                                        ),
                                                    URN:
                                                        Coalesce(
                                                            varDischargedEquipment.URN,
                                                            ""
                                                        ),
                                                    DOB:
                                                        varDischargedEquipment.DOB,
                                                    Physiotherapist:
                                                        Coalesce(
                                                            varDischargedEquipment.Physiotherapist,
                                                            ""
                                                        ),
                                                    DateSignedOut:
                                                        varDischargedEquipment.'Date Signed Out',
                                                    DateReturned:
                                                        returnDate,
                                                    DaysSignedOutThisEpisode:
                                                        daysThisEpisode,
                                                    TotalDaysSignedOutAfterEvent:
                                                        newTotalDays,
                                                    Over100DaysAfterEvent:
                                                        newTotalDays > 100,
                                                    ServiceRequired:
                                                        newTotalDays > 100,
                                                    IsHighRiskEquipment:
                                                        Coalesce(
                                                            varDischargedEquipment.IsHighRiskEquipment,
                                                            false
                                                        ),
                                                    OutOfService:
                                                        Coalesce(
                                                            varDischargedEquipment.OutOfService,
                                                            false
                                                        ),
                                                    IsActive:
                                                        Coalesce(
                                                            varDischargedEquipment.IsActive,
                                                            true
                                                        ),
                                                    StatusAfterEvent:
                                                        "Available",
                                                    ActionedByName:
                                                        User().FullName,
                                                    ActionedByEmail:
                                                        User().Email,
                                                    SourceApp: {
                                                        Value: "Web"
                                                    },
                                                    Notes:
                                                        If(
                                                            IsBlank(
                                                                varDischargedEquipment.CurrentEpisodeKey
                                                            ),
                                                            "Return completed without an existing CurrentEpisodeKey. This is likely a pre-log allocation.",
                                                            ""
                                                        )
                                                }
                                            );
                                            // ===================================================
                                            // CLOSE ORIGINAL SIGN-OUT LOG
                                            // ===================================================
                                            With(
                                                {
                                                    signOutLogRow:
                                                        LookUp(
                                                            Equipment_Usage_Log,
                                                            EpisodeKey = episodeKey &&
                                                            EventType.Value = "Sign Out"
                                                        )
                                                },
                                                If(
                                                    !IsBlank(signOutLogRow.ID),
                                                    Patch(
                                                        Equipment_Usage_Log,
                                                        signOutLogRow,
                                                        {
                                                            EpisodeStatus: {
                                                                Value: "Closed"
                                                            },
                                                            DateReturned:
                                                                returnDate,
                                                            DaysSignedOutThisEpisode:
                                                                daysThisEpisode,
                                                            TotalDaysSignedOutAfterEvent:
                                                                newTotalDays,
                                                            Over100DaysAfterEvent:
                                                                newTotalDays > 100,
                                                            ServiceRequired:
                                                                newTotalDays > 100
                                                        }
                                                    )
                                                )
                                            );
                                            // ===================================================
                                            // SUCCESS
                                            // ===================================================
                                            Notify(
                                                "Equipment returned successfully.",
                                                NotificationType.Success
                                            );
                                            If(
                                                newTotalDays > 100,
                                                Notify(
                                                    "This equipment has been used for >100 days this year and requires a Full Service. Please set equipment aside and contact CA for details.",
                                                    NotificationType.Warning
                                                )
                                            );
                                            // ===================================================
                                            // REMOVE RETURNED ITEM FROM LOCAL EQUIPMENT COLLECTION
                                            // ===================================================
                                            RemoveIf(
                                                colGroupedEquipment,
                                                ID = varDischargedEquipment.ID
                                            );
                                            Refresh(
                                                Equipment_Inventory_SharePoint
                                            );
                                            // ===================================================
                                            // CLOSE POPUP
                                            // ===================================================
                                            Set(
                                                varShowDischargedEquipmentPopup,
                                                false
                                            );
                                            Set(
                                                varDischargedEquipment,
                                                Blank()
                                            )
                                        )
                                    )
                                )
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =26 * SR
                              RadiusBottomRight: =26 * SR
                              RadiusTopLeft: =26 * SR
                              RadiusTopRight: =26 * SR
                              Size: =Round(17 * SF, 0)
                              Text: ="Return equipment"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =220 * SX
