                  RadiusTopLeft: =22 * SR
                  RadiusTopRight: =22 * SR
                  Width: =391 * SX
                  X: =20 * SX
                  Y: =262 * SY
                Children:
                  - btnEmail_Eq:
                      Control: ModernButton@1.0.0
                      Properties:
                        Align: =Align.Center
                        Appearance: =ButtonAppearance.Transparent
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =44 * SY
                        Icon: ="Mail"
                        IconStyle: =IconStyle.Filled
                        OnSelect: "=// \"Email today's allocation\" button > OnSelect  (Equipment_Main).  Needs EmailHead and EmailFoot (App > Formulas).\nIf(\n    IsEmpty(colGroupedEquipment),\n    Notify(\"Nothing allocated today to email.\", NotificationType.Information),\n    Set(\n        varEmailBody,\n        Substitute(\n            Substitute(EmailHead, \"{{TITLE}}\", \"Equipment you allocated today\"),\n            \"{{SUB}}\",\n            Text(Today(), \"dddd d mmmm yyyy\") & \"&nbsp;&nbsp;|&nbsp;&nbsp;\" & CountRows(colGroupedEquipment) & If(CountRows(colGroupedEquipment) = 1, \" item\", \" items\")\n        ) &\n    \n        // greeting\n        \"<tr><td style='padding:28px 32px 8px 32px;font-size:15px;line-height:22px;color:#3A5068;'>\" &\n            \"Hi \" & First(Split(User().FullName, \" \")).Value & \",<br><br>\" &\n            \"Here is the equipment you allocated today.\" &\n        \"</td></tr>\" &\n    \n        // list (one row per item, sorted by patient)\n        \"<tr><td style='padding:16px 32px 8px 32px;'>\" &\n        \"<table role='presentation' width='100%' cellpadding='0' cellspacing='0' border='0' style='border-collapse:separate;border-spacing:0;width:100%;font-size:14px;border:1px solid #E3EAF1;border-radius:14px;overflow:hidden;'>\" &\n            \"<tr bgcolor='#F2F6FA' style='background-color:#F2F6FA;'>\" &\n                \"<th align='left' style='padding:10px 12px;font-size:11px;letter-spacing:1px;color:#8C9BAE;border-bottom:2px solid #1A5A99;border-radius:14px 0 0 0;'>PATIENT</th>\" &\n                \"<th align='left' style='padding:10px 12px;font-size:11px;letter-spacing:1px;color:#8C9BAE;border-bottom:2px solid #1A5A99;border-radius:0 14px 0 0;'>EQUIPMENT</th>\" &\n            \"</tr>\" &\n            Concat(\n                SortByColumns(colGroupedEquipment, \"field_11\", SortOrder.Ascending),\n                \"<tr>\" &\n                    \"<td style='padding:12px;border-top:1px solid #E3EAF1;'><b style='color:#0E1C2A;'>\" & 'Patient Name' & \"</b><br>\" &\n                        \"<span style='font-size:12px;color:#8C9BAE;'>URN \" & If(IsBlank(URN), \"—\", Text(URN)) & \"&nbsp;&nbsp;|&nbsp;&nbsp;Ward \" & If(IsBlank(Ward.Value), \"—\", Ward.Value) & \"</span></td>\" &\n                    \"<td style='padding:12px;border-top:1px solid #E3EAF1;'><b style='color:#0E1C2A;'>\" & Title & \"</b><br>\" &\n                        \"<span style='font-size:12px;color:#8C9BAE;'>\" & Category.Value & \"&nbsp;&nbsp;|&nbsp;&nbsp;\" & Trim(Brand & \" \" & Model) & \"</span></td>\" &\n                \"</tr>\"\n            ) &\n        \"</table>\" &\n        \"</td></tr>\" &\n    \n        // reminder box\n        \"<tr><td style='padding:12px 32px 8px 32px;'>\" &\n        \"<table role='presentation' width='100%' cellpadding='0' cellspacing='0' border='0' style='border-collapse:separate;border-spacing:0;'><tr>\" &\n            \"<td bgcolor='#E8F1FA' style='background-color:#E8F1FA;border-radius:12px;padding:14px 18px;font-size:14px;line-height:20px;color:#1A5A99;'>\" &\n                \"<b>Reminder:</b> please add these to your patients' Interactive View in ieMR.\" &\n            \"</td></tr></table>\" &\n        \"</td></tr>\" &\n    \n        // sign-off\n        \"<tr><td style='padding:20px 32px 28px 32px;font-size:15px;line-height:22px;color:#3A5068;'>Thanks,<br><b style='color:#0E1C2A;'>\" & User().FullName & \"</b></td></tr>\" &\n    \n        Substitute(EmailFoot, \"{{NOTE}}\", \"This email contains patient information. Please handle it in line with your privacy policy.\")\n    );\n    Office365Outlook.SendEmailV2(\n        User().Email,\n        \"Equipment you allocated today (\" & Text(Today(), \"d mmm yyyy\") & \")\",\n        varEmailBody,\n        { IsHtml: true }\n    );\n    Notify(\"Email Sent\", NotificationType.Success)\n)"
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =5
                        RadiusBottomLeft: =22 * SR
                        RadiusBottomRight: =22 * SR
                        RadiusTopLeft: =22 * SR
                        RadiusTopRight: =22 * SR
                        Size: =Round(15 * SF, 0)
                        Text: ="Email Today's Allocation"
