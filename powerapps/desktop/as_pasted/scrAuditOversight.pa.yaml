Screens:
  scrAuditOversight:
    Properties:
      Fill: =RGBA(235, 242, 248, 1)
      ImagePosition: =ImagePosition.Fill
      OnVisible: |-
        =// AUDIT SCREEN
        // Loads audits for the date range, then Select(btnFilter_Au) builds what the screen shows.
        Set(auFrom, DateAdd(Today(), -60));
        Set(auTo, Today());
        Set(auWard, "");
        Set(auOutcome, "");
        Set(auClin, "");
        Set(auRisks, false);
        Set(auMismatch, false);
        Set(auUntagged, false);
        Set(auPopup, false);
        Set(auKpi, {Total: 0, Passed: 0, Risk: 0, Removed: 0, Untagged: 0});
        ClearCollect(colAuWards, Table({Value: "All wards"}));
        Collect(colAuWards, SortByColumns(Choices(Equipment_Audits.ActualWard), "Value", SortOrder.Ascending));
        ClearCollect(colAuOutcomes, Table({Value: "All outcomes"}));
        Collect(colAuOutcomes, SortByColumns(Choices(Equipment_Audits.AuditOutcome), "Value", SortOrder.Ascending));
        Select(btnLoad_Au_1)
    Children:
      - btnLoad_Au_1:
          Control: Button@0.0.45
          Properties:
            Height: =10
            OnSelect: |-
              =ClearCollect(
                  colAuServer,
                  Filter(
                      Equipment_Audits,
                      AuditDateTime >= auFrom &&
                      AuditDateTime < DateAdd(auTo, 1, TimeUnit.Days)
                  )
              );
              Clear(colAuClinIdx);
              ForAll(
                  colAuServer As a,
                  ForAll(
                      a.TreatingPTs As p,
                      If(
                          !IsBlank(p.Email),
                          Collect(colAuClinIdx, {Mail: Lower(p.Email), DisplayName: Coalesce(p.DisplayName, p.Email)})
                      )
                  )
              );
              ClearCollect(
                  colAuClin,
                  SortByColumns(
                      DropColumns(
                          AddColumns(GroupBy(colAuClinIdx, Mail, Rows), DisplayName, First(Rows).DisplayName),
                          Rows
                      ),
                      "DisplayName",
                      SortOrder.Ascending
                  )
              );
              Select(btnFilter_Au_1)
            Text: =""
            Visible: =false
            Width: =10
      - btnFilter_Au_1:
          Control: Button@0.0.45
          Properties:
            Height: =10
            OnSelect: |-
              =ClearCollect(
                  colAuPool,
                  Filter(
                      colAuServer,
                      (auClin = "" || CountIf(TreatingPTs, Lower(Email) = auClin) > 0) &&
                      (auOutcome = "" || AuditOutcome.Value = auOutcome) &&
                      (!auRisks || ImmediateRisk = true || RemovedFromUse = true) &&
                      (!auMismatch || AllocationMatch = false) &&
                      (!auUntagged || Coalesce(TagResult.Value, "") <> "OK")
                  )
              );
              ClearCollect(
                  colAuScope,
                  Filter(colAuPool, auWard = "" || Coalesce(ActualWard.Value, "Unknown") = auWard)
              );
              Set(
                  auKpi,
                  {
                      Total: CountRows(colAuScope),
                      Passed: CountRows(Filter(colAuScope, AuditOutcome.Value = "Pass")),
                      Risk: CountRows(Filter(colAuScope, ImmediateRisk = true)),
                      Removed: CountRows(Filter(colAuScope, RemovedFromUse = true)),
                      Untagged: CountRows(Filter(colAuScope, Coalesce(TagResult.Value, "") <> "OK"))
                  }
              )
            Text: =""
            Visible: =false
            Width: =10
