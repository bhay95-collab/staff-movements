                              Height: =26
                              Size: =16
                              Text: =Max(0, DateDiff(ThisItem.'Date Signed Out', Today(), TimeUnit.Days)) & " days out"
                              Width: =Parent.Width - 20
                              Y: =38
                        - btnRow_Al:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Transparent
                              BorderStyle: =BorderStyle.None
                              Height: =Parent.Height
                              OnSelect: |-
                                =// Find this equipment's patient on the four ward lists (Name + URN + DOB where the equipment record has them)
                                With(
                                    {
                                        n: ThisItem.'Patient Name',
                                        u: ThisItem.URN,
                                        d: ThisItem.DOB
                                    },
                                    With(
                                        {
                                            r4A: LookUp(Filter(Ward_4A_Shared, Patient = n), (IsBlank(u) || Text(URN) = Text(u)) && (IsBlank(d) || Text(DOB, "yyyymmdd") = Text(d, "yyyymmdd"))),
                                            r4B: LookUp(Filter(Ward_4B_Shared, Patient = n), (IsBlank(u) || Text(URN) = Text(u)) && (IsBlank(d) || Text(DOB, "yyyymmdd") = Text(d, "yyyymmdd"))),
                                            r5A: LookUp(Filter(Ward_5A_Shared, Patient = n), (IsBlank(u) || Text(URN) = Text(u)) && (IsBlank(d) || Text(DOB, "yyyymmdd") = Text(d, "yyyymmdd"))),
                                            r6A: LookUp(Filter(Ward_6A_Shared, Patient = n), (IsBlank(u) || Text(URN) = Text(u)) && (IsBlank(d) || Text(DOB, "yyyymmdd") = Text(d, "yyyymmdd")))
                                        },
                                        If(
                                            IsBlank(Trim(n)),
                                            Notify(
                                                "No patient is associated with this equipment.",
                                                NotificationType.Warning
                                            ),
                                            !IsBlank(r4A),
                                            Set(varSelectedPatient, r4A);
                                            Set(varSelectedList, "Ward_4A_Shared");
                                            Set(varWardCode, "4A");
                                            Set(varDischargedEquipment, Blank());
                                            Set(varShowDischargedEquipmentPopup, false);
                                            Navigate(Patient_Detail_Screen, ScreenTransition.Fade),
                                            !IsBlank(r4B),
                                            Set(varSelectedPatient, r4B);
                                            Set(varSelectedList, "Ward_4B_Shared");
                                            Set(varWardCode, "4B");
                                            Set(varDischargedEquipment, Blank());
                                            Set(varShowDischargedEquipmentPopup, false);
                                            Navigate(Patient_Detail_Screen, ScreenTransition.Fade),
                                            !IsBlank(r5A),
                                            Set(varSelectedPatient, r5A);
                                            Set(varSelectedList, "Ward_5A_Shared");
                                            Set(varWardCode, "5A");
                                            Set(varDischargedEquipment, Blank());
                                            Set(varShowDischargedEquipmentPopup, false);
                                            Navigate(Patient_Detail_Screen, ScreenTransition.Fade),
                                            !IsBlank(r6A),
                                            Set(varSelectedPatient, r6A);
                                            Set(varSelectedList, "Ward_6A_Shared");
                                            Set(varWardCode, "6A");
                                            Set(varDischargedEquipment, Blank());
                                            Set(varShowDischargedEquipmentPopup, false);
                                            Navigate(Patient_Detail_Screen, ScreenTransition.Fade),
                                            // PATIENT NOT FOUND on any ward.
                                            // Use a clean copy of the real SharePoint record, NOT the gallery ThisItem.
                                            Set(varDischargedEquipment, LookUp(Equipment_Inventory_SharePoint, ID = ThisItem.ID));
                                            Set(varShowDischargedEquipmentPopup, true)
                                        )
                                    )
                                )
                              Text: =""
                              Width: =Parent.Width
            - lblEmpty_Al:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =RGBA(140, 155, 174, 1)
                  Font: =Font.'Segoe UI'
                  Height: =30
                  Size: =14
                  Text: ="No allocated equipment matches these filters."
                  Visible: =IsEmpty(Gallery_Allocated.AllItems)
                  Width: =913
                  Y: =120
      - conNotFound_Al:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(14, 28, 42, 0.42)
            Height: =768
            Visible: =varShowDischargedEquipmentPopup
            Width: =1366
          Children:
            - conNotFoundCard_Al:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.Bold
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =360
                  RadiusBottomLeft: =20
                  RadiusBottomRight: =20
                  RadiusTopLeft: =20
                  RadiusTopRight: =20
                  Width: =640
                  X: =363
                  Y: =204
                Children:
                  - lblNfTitle_Al:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(14, 28, 42, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Size: =22
                        Text: ="Patient no longer found"
                        Width: =560
                        X: =40
                        Y: =26
                  - lblNfBody_Al:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(58, 80, 104, 1)
                        Font: =Font.'Segoe UI'
                        Height: =96
                        Size: =15
                        Text: =varDischargedEquipment.'Patient Name' & " could not be found on any current ward list. They may have been discharged." & Char(10) & Char(10) & "Is the equipment cleaned and ready to return, or should it stay allocated?"
                        Width: =560
                        X: =40
                        Y: =76
                  - lblNfLocCap_Al:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        Color: =RGBA(58, 80, 104, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =42
                        Size: =14
                        Text: ="Where is it going back to?"
                        Width: =240
                        X: =50
                        Y: =176
                  - boxNfLoc_Al:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =RGBA(14, 42, 70, 0.22)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =42
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Width: =300
                        X: =300
                        Y: =176
                      Children:
                        - ddNfLoc_Al:
                            Control: Classic/DropDown@2.3.1
                            Properties:
                              BorderStyle: =BorderStyle.None
                              ChevronBackground: =RGBA(26, 90, 153, 1)
                              ChevronFill: =RGBA(255, 255, 255, 1)
                              Color: =RGBA(14, 28, 42, 1)
                              Default: =Coalesce(varDischargedEquipment.Location.Value, "")
                              Font: =Font.'Segoe UI'
                              Height: =Parent.Height
                              Items: =Choices(Equipment_Inventory_SharePoint.Location)
                              Items.Value: =Value
                              Size: =14
                              Width: =Parent.Width
                  - conNfLeave_Al:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =RGBA(14, 42, 70, 0.12)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =52
                        RadiusBottomLeft: =26
                        RadiusBottomRight: =26
                        RadiusTopLeft: =26
                        RadiusTopRight: =26
                        Width: =220
                        X: =90
                        Y: =266
                      Children:
                        - btnNfLeave_Al:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Transparent
                              BorderRadius: =26
                              Font: =Font.'Segoe UI'
                              FontColor: =RGBA(58, 80, 104, 1)
                              FontSize: =17
                              FontWeight: =FontWeight.Bold
                              Height: =52
                              Layout: ='ButtonCanvas.Layout'.TextOnly
                              OnSelect: |-
                                =Set(varShowDischargedEquipmentPopup, false);
                                Set(varDischargedEquipment, Blank());
                                Set(varSelectedPatient, Blank())
                              Text: ="Leave allocated"
                              Width: =220
                  - conNfReturn_Al:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =1
                        DropShadow: =DropShadow.Regular
                        Fill: =RGBA(26, 90, 153, 1)
                        Height: =52
                        RadiusBottomLeft: =26
                        RadiusBottomRight: =26
                        RadiusTopLeft: =26
                        RadiusTopRight: =26
                        Width: =220
                        X: =330
                        Y: =266
                      Children:
                        - btnNfReturn_Al:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Transparent
                              BorderRadius: =26
                              Font: =Font.'Segoe UI'
                              FontColor: =RGBA(255, 255, 255, 1)
                              FontSize: =17
                              FontWeight: =FontWeight.Bold
                              Height: =52
                              Layout: ='ButtonCanvas.Layout'.TextOnly
                              OnSelect: |-
                                =With(
                                    {
                                        equipmentRecord:
                                            If(
                                                !IsBlank(varDischargedEquipment),
                                                LookUp(
                                                    Equipment_Inventory_SharePoint,
                                                    ID = varDischargedEquipment.ID
                                                )
                                            )
                                    },
                                    If(
                                        IsBlank(varDischargedEquipment) ||
                                        IsBlank(equipmentRecord) ||
                                        Coalesce(equipmentRecord.Status.Value, "") <> "Allocated" ||
                                        IsBlank(equipmentRecord.'Date Signed Out'),
                                        // ===================================================
                                        // INVALID RETURN
                                        // ===================================================
                                        Notify(
                                            "This equipment cannot be returned because the allocation details are incomplete.",
                                            NotificationType.Error
                                        ),
                                        // ===================================================
                                        // VALID RETURN
                                        // ===================================================
                                        With(
                                            {
                                                returnDate: Today(),
                                                actionTime: Now(),
                                                episodeKey:
                                                    Coalesce(
                                                        equipmentRecord.CurrentEpisodeKey,
                                                        Concatenate(
                                                            "LEGACY-RETURN-",
                                                            Text(equipmentRecord.ID),
                                                            "-",
                                                            Text(Now(), "yyyymmddhhmmss"),
                                                            "-",
                                                            Left(Text(GUID()), 8)
                                                        )
                                                    ),
                                                daysThisEpisode:
                                                    Max(
                                                        0,
                                                        DateDiff(
                                                            equipmentRecord.'Date Signed Out',
                                                            Today(),
                                                            "Days"
                                                        )
                                                    )
                                            },
                                            With(
                                                {
                                                    newTotalDays:
                                                        Coalesce(
                                                            equipmentRecord.TotalDaysSignedOut,
                                                            0
                                                        ) +
                                                        daysThisEpisode
                                                },
                                                // ===================================================
                                                // 1. RETURN EQUIPMENT
                                                // ===================================================
                                                Patch(
                                                    Equipment_Inventory_SharePoint,
                                                    equipmentRecord,
                                                    {
                                                        Status: {
                                                            Value: "Available"
                                                        },
                                                        'Patient Name': "",
                                                        URN: "",
                                                        Physiotherapist: "",
                                                        DOB: Blank(),
                                                        'Date Returned': returnDate,
                                                        Location: If(IsBlank(ddNfLoc_Al.Selected.Value), equipmentRecord.Location, { Value: ddNfLoc_Al.Selected.Value }),
                                                        Ward: Blank(),
                                                        'Signed In By': User().FullName,
                                                        CurrentEpisodeKey: Blank(),
                                                        TotalDaysSignedOut: newTotalDays
                                                    }
                                                );
                                                // ===================================================
                                                // 2. CREATE SIGN-IN LOG ENTRY
                                                // ===================================================
                                                Patch(
                                                    Equipment_Usage_Log,
                                                    Defaults(Equipment_Usage_Log),
                                                    {
                                                        Title:
                                                            Concatenate(
                                                                episodeKey,
                                                                " - Sign In"
                                                            ),
                                                        EpisodeKey:
                                                            episodeKey,
                                                        EventType: {
                                                            Value: "Sign In"
                                                        },
                                                        EpisodeStatus: {
                                                            Value:
                                                                If(
                                                                    IsBlank(
                                                                        equipmentRecord.CurrentEpisodeKey
                                                                    ),
                                                                    "Legacy unmatched",
                                                                    "Closed"
                                                                )
                                                        },
                                                        EventDateTime:
                                                            actionTime,
                                                        EquipmentItemID:
                                                            equipmentRecord.ID,
                                                        EquipmentTitle:
                                                            equipmentRecord.Title,
                                                        Category:
                                                            Coalesce(
                                                                equipmentRecord.Category.Value,
                                                                ""
                                                            ),
                                                        Brand:
                                                            Coalesce(
                                                                equipmentRecord.Brand,
                                                                ""
                                                            ),
                                                        Model:
                                                            Coalesce(
                                                                equipmentRecord.Model,
                                                                ""
                                                            ),
                                                        Width:
                                                            Coalesce(
                                                                equipmentRecord.Width.Value,
                                                                ""
                                                            ),
                                                        Depth:
                                                            Coalesce(
                                                                equipmentRecord.Depth.Value,
                                                                ""
                                                            ),
                                                        Height:
                                                            Coalesce(
                                                                equipmentRecord.Height.Value,
                                                                ""
                                                            ),
                                                        SWL:
                                                            Coalesce(
                                                                equipmentRecord.SWL,
                                                                ""
                                                            ),
                                                        WheelchairType:
                                                            Coalesce(
                                                                equipmentRecord.'Wheelchair Type'.Value,
                                                                ""
                                                            ),
                                                        LocationAtEvent: Coalesce(ddNfLoc_Al.Selected.Value, equipmentRecord.Location.Value, ""),
                                                        Ward:
                                                            Coalesce(
                                                                equipmentRecord.Ward.Value,
                                                                ""
                                                            ),
                                                        PatientName:
                                                            Coalesce(
                                                                equipmentRecord.'Patient Name',
                                                                ""
                                                            ),
                                                        URN:
                                                            Coalesce(
                                                                equipmentRecord.URN,
                                                                ""
                                                            ),
                                                        DOB:
                                                            equipmentRecord.DOB,
                                                        Physiotherapist:
                                                            Coalesce(
                                                                equipmentRecord.Physiotherapist,
                                                                ""
                                                            ),
                                                        DateSignedOut:
                                                            equipmentRecord.'Date Signed Out',
                                                        DateReturned:
                                                            returnDate,
                                                        DaysSignedOutThisEpisode:
                                                            daysThisEpisode,
                                                        TotalDaysSignedOutAfterEvent:
                                                            newTotalDays,
                                                        Over100DaysAfterEvent:
                                                            newTotalDays > 100,
                                                        ServiceRequired:
                                                            newTotalDays > 100,
                                                        IsHighRiskEquipment:
                                                            Coalesce(
                                                                equipmentRecord.IsHighRiskEquipment,
                                                                false
                                                            ),
                                                        OutOfService:
                                                            Coalesce(
                                                                equipmentRecord.OutOfService,
                                                                false
                                                            ),
                                                        IsActive:
                                                            Coalesce(
                                                                equipmentRecord.IsActive,
                                                                true
                                                            ),
                                                        StatusAfterEvent:
                                                            "Available",
                                                        ActionedByName:
                                                            User().FullName,
                                                        ActionedByEmail:
                                                            User().Email,
                                                        SourceApp: {
                                                            Value: "Web"
                                                        },
                                                        Notes:
                                                            If(
                                                                IsBlank(
                                                                    equipmentRecord.CurrentEpisodeKey
                                                                ),
                                                                "Return completed from Equipment screen after patient was no longer found on a current ward list. No existing CurrentEpisodeKey was present; likely a pre-log allocation.",
                                                                "Return completed from Equipment screen after patient was no longer found on a current ward list."
                                                            )
                                                    }
                                                );
                                                // ===================================================
                                                // 3. CLOSE ORIGINAL SIGN-OUT LOG
                                                // ===================================================
                                                With(
                                                    {
                                                        signOutLogRow:
                                                            LookUp(
                                                                Equipment_Usage_Log,
                                                                EpisodeKey = episodeKey &&
                                                                EventType.Value = "Sign Out"
                                                            )
                                                    },
                                                    If(
                                                        !IsBlank(signOutLogRow.ID),
                                                        Patch(
                                                            Equipment_Usage_Log,
                                                            signOutLogRow,
                                                            {
                                                                EpisodeStatus: {
                                                                    Value: "Closed"
                                                                },
                                                                DateReturned:
                                                                    returnDate,
                                                                DaysSignedOutThisEpisode:
                                                                    daysThisEpisode,
                                                                TotalDaysSignedOutAfterEvent:
                                                                    newTotalDays,
                                                                Over100DaysAfterEvent:
                                                                    newTotalDays > 100,
                                                                ServiceRequired:
                                                                    newTotalDays > 100
                                                            }
                                                        )
                                                    )
                                                );
                                                // ===================================================
                                                // 4. SUCCESS MESSAGE
                                                // ===================================================
                                                Notify(
                                                    "Equipment returned successfully.",
                                                    NotificationType.Success
                                                );
                                                // ===================================================
                                                // 5. >100 DAY SERVICE WARNING
                                                // ===================================================
                                                If(
                                                    newTotalDays > 100,
                                                    Notify(
                                                        "This equipment has been used for >100 days this year and requires a Full Service. Please set equipment aside and contact CA for details.",
                                                        NotificationType.Warning
                                                    )
                                                );
                                                // ===================================================
                                                // 6. REFRESH EQUIPMENT DATA
                                                // ===================================================
                                                Refresh(
                                                    Equipment_Inventory_SharePoint
                                                );
                                                RemoveIf(
                                                    colGroupedEquipment,
                                                    ID = equipmentRecord.ID
                                                );
                                                // ===================================================
                                                // 7. CLEAR SELECTION / CLOSE POPUP
                                                // ===================================================
                                                Set(
                                                    varShowDischargedEquipmentPopup,
                                                    false
                                                );
                                                Set(
                                                    varDischargedEquipment,
                                                    Blank()
                                                );
                                                Set(
                                                    varSelectedItem,
                                                    Blank()
                                                );
                                                Set(
                                                    varSelectedPatient,
                                                    Blank()
                                                )
                                            )
                                        )
                                    )
                                )
                              Text: ="Return equipment"
                              Width: =220
