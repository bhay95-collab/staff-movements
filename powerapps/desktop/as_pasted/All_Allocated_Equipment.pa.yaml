            - Gallery_Allocated:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  Height: =598
                  Items: |-
                    =With(
                        {
                            typeFilter:   ddType_Al.Selected.Value,
                            wcTypeFilter: ddWCType_Al.Selected.Value,
                            widthFilter:  ddWidth_Al.Selected.Value,
                            depthFilter:  ddDepth_Al.Selected.Value,
                            heightFilter: ddHeight_Al.Selected.Value,
                            patientFilter: Lower(Trim(txtPatient_Al.Text)),
                            urnFilter:     Lower(Trim(txtURN_Al.Text)),
                            codeFilter:    Lower(Trim(txtCode_Al.Text))
                        },
                        SortByColumns(
                            AddColumns(
                                Filter(
                                    Equipment_Inventory_SharePoint,
                                    Status.Value = "Allocated",
                                    ( typeFilter   = "All" || Category.Value          = typeFilter ),
                                    ( wcTypeFilter = "All" || 'Wheelchair Type'.Value = wcTypeFilter ),
                                    ( widthFilter  = "All" || Width.Value             = widthFilter ),
                                    ( depthFilter  = "All" || Depth.Value             = depthFilter ),
                                    ( heightFilter = "All" || Height.Value            = heightFilter ),
                                    ( IsBlank(patientFilter) || patientFilter in Lower(Coalesce('Patient Name', "")) ),
                                    ( IsBlank(urnFilter)     || urnFilter     in Lower(Coalesce(URN, "")) ),
                                    ( IsBlank(codeFilter)    || codeFilter    in Lower(Coalesce(Title, "")) )
                                ),
                                // helper text columns for sorting
                                _CategoryText, Category.Value,
                                _CodeText,     Title
                            ),
                            "_CategoryText", SortOrder.Ascending,
                            "_CodeText",     SortOrder.Ascending
                        )
                    )
