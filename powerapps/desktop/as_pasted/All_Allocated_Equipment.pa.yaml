        =// Reset every filter back to "All" / empty
        Reset(ddType_Al);
        Reset(ddWCType_Al);
        Reset(ddWidth_Al);
        Reset(ddDepth_Al);
        Reset(ddHeight_Al);
        Reset(txtCode_Al);
        Reset(txtPatient_Al);
        Reset(txtURN_Al);
        Set(varShowDischargedEquipmentPopup, false);
        Set(varDischargedEquipment, Blank())
