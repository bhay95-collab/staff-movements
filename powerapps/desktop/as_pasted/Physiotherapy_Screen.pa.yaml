            - conDash_Pt:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(14, 42, 70, 0.12)
                  BorderThickness: =1
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =40
                  RadiusBottomLeft: =20
                  RadiusBottomRight: =20
                  RadiusTopLeft: =20
                  RadiusTopRight: =20
                  Width: =160
                  X: =997
                  Y: =15
                Children:
                  - btnDash_Pt:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Transparent
                        BorderRadius: =20
                        Font: =Font.'Segoe UI'
                        FontColor: =RGBA(58, 80, 104, 1)
                        FontSize: =13
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        Icon: ="Database"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        Layout: ='ButtonCanvas.Layout'.IconBefore
                        OnSelect: |-
                          =// 1) Build a unified collection for all wards (keeps all original columns)
                          ClearCollect(
                              colAllWardData,
                              AddColumns(Filter(Ward_4A_Shared, !IsBlank(Patient)), WardCode, "4A"),
                              AddColumns(Filter(Ward_4B_Shared, !IsBlank(Patient)), WardCode, "4B"),
                              AddColumns(Filter(Ward_5A_Shared, !IsBlank(Patient)), WardCode, "5A"),
                              AddColumns(Filter(Ward_6A_Shared, !IsBlank(Patient)), WardCode, "6A")
                          );
                          // 2) Config for the 4 tiles on the data screen
                          ClearCollect(
                              colWardSummaryConfig,
                              { WardCode: "4A", Title: "Ward 4A" },
                              { WardCode: "4B", Title: "Ward 4B" },
                              { WardCode: "5A", Title: "Ward 5A" },
                              { WardCode: "6A", Title: "Ward 6A" }
                          );
                          // 3) Diagnosis summary for each ward. Shape: City (diagnosis text), Area (count)
                          ClearCollect(
                              colPieDiagnoses,
                              { Diag: "Ortho" }, { Diag: "Recon" }, { Diag: "TBI" }, { Diag: "Amp" },
                              { Diag: "SCI" }, { Diag: "Trauma" }, { Diag: "Stroke" }, { Diag: "Neuro" }
                          );
                          ClearCollect(col4A_PieData, ForAll(colPieDiagnoses As d, { City: d.Diag, Area: CountRows(Filter(colAllWardData, WardCode = "4A" && field_3.Value = d.Diag)) }));
                          ClearCollect(col4B_PieData, ForAll(colPieDiagnoses As d, { City: d.Diag, Area: CountRows(Filter(colAllWardData, WardCode = "4B" && field_3.Value = d.Diag)) }));
                          ClearCollect(col5A_PieData, ForAll(colPieDiagnoses As d, { City: d.Diag, Area: CountRows(Filter(colAllWardData, WardCode = "5A" && field_3.Value = d.Diag)) }));
                          ClearCollect(col6A_PieData, ForAll(colPieDiagnoses As d, { City: d.Diag, Area: CountRows(Filter(colAllWardData, WardCode = "6A" && field_3.Value = d.Diag)) }));
                          // 4) Navigate to the data screen
                          Navigate(Physiotherapy_Screen, ScreenTransition.Fade)
                        Text: ="Data Dashboard"
                        Width: =160
