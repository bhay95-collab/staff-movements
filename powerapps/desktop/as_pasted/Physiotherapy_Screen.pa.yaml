Screens:
  Physiotherapy_Screen:
    Properties:
      Fill: =RGBA(235, 242, 248, 1)
      ImagePosition: =ImagePosition.Fill
      OnVisible: |-
        =// Call flow and parse JSON
        Set(
            varTeamBriefJson,
            GetTeamBriefFiles.Run().filesjson
        );
        Clear(colTeamBriefFiles);
        If(
            !IsBlank(varTeamBriefJson),
            ForAll(
                ParseJSON(varTeamBriefJson) As fileRow,
                Collect(
                    colTeamBriefFiles,
                    {
                        Id:        Text(fileRow.ItemInternalId),
                        Name:      Text(fileRow.'{Name}'),
                        FileName:  Text(fileRow.'{FilenameWithExtension}'),
                        // Folder path only, e.g. "Shared Documents/Team Brief/" or ".../Team Brief/Archive/"
                        Path:      Text(fileRow.'{Path}'),
                        // Full path including file/folder name, e.g. ".../Team Brief/Archive/" or ".../file.pdf"
                        FullPath:  Text(fileRow.'{FullPath}'),
                        Link:      Text(fileRow.'{Link}'),
                        // True for folders, false for files
                        IsFolder:  fileRow.'{IsFolder}'
                    }
                )
            )
        );
        // Start in the Team Brief root folder
        Set(varCurrentFolderPath, "Shared Documents/Team Brief/");
        Set(varDirectorOverride, false);
        Set(varDiscipline, "Physio");
        Set(
            varTeamNotesRecord,
            LookUp(Discipline_Team_Notes, Title = varDiscipline)
        );
        Set(varUserEmail, Lower(User().Email));
        // Who am I? (decides Manage Staff and notes editing)
        Set(
            varMeDirectory,
            LookUp(ClinicianDirectory, Lower(Person.Email) = varUserEmail)
        );
        Set(
            varMeProfile,
            Office365Users.UserProfileV2(varUserEmail)
        );
        Set(
            varMeSP,
            {
                '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                Claims: "i:0#.f|membership|" & varUserEmail,
                DisplayName: Coalesce(varMeProfile.displayName, User().FullName, varUserEmail),
                Email: varUserEmail,
                Department: Coalesce(varMeProfile.department, ""),
                JobTitle: Coalesce(varMeProfile.jobTitle, ""),
                Picture: ""
            }
        )
    Children:
      - Pt_Title:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.Regular
            Fill: =RGBA(7, 95, 115, 1)
            Height: =70
            RadiusBottomLeft: =18
            RadiusBottomRight: =18
            RadiusTopLeft: =18
            RadiusTopRight: =18
            Width: =1333
            X: =18
            Y: =12
          Children:
            - imgHeaderGradient_Pt:
                Control: Image@2.2.3
                Properties:
                  Height: =Parent.Height
                  Image: ="data:image/svg+xml;utf8," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' width='1333' height='70' viewBox='0 0 1333 70' preserveAspectRatio='none'><defs><linearGradient id='a' x1='0' y1='0' x2='1' y2='0'><stop offset='0' stop-color='#001D46'/><stop offset='0.48' stop-color='#075F73'/><stop offset='1' stop-color='#00838A'/></linearGradient><linearGradient id='b' x1='0' y1='0' x2='1' y2='0'><stop offset='0' stop-color='#001B36' stop-opacity='0.46'/><stop offset='0.45' stop-color='#002036' stop-opacity='0.18'/><stop offset='1' stop-color='#002036' stop-opacity='0.06'/></linearGradient></defs><rect width='1333' height='70' rx='18' fill='url(#a)'/><rect width='1333' height='70' rx='18' fill='url(#b)'/></svg>")
                  ImagePosition: =ImagePosition.Fill
                  Width: =Parent.Width
            - lblTitle_PtHdr:
