                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              Layout: ='ButtonCanvas.Layout'.IconBefore
                              OnSelect: |-
                                =// Patients on this ward with an EDD in the next 7 days (as shown on screen)
                                ClearCollect(
                                    colWardEDD,
                                    Filter(
                                        colWard,
                                        !IsBlank(Patient),
                                        !IsBlank(EDD),
                                        EDD >= Today(),
                                        EDD <= DateAdd(Today(), 7)
                                    )
                                );
                                If(
                                    CountRows(colWardEDD) > 0,
                                    Set(
                                        varEmailBody,
                                        "<html><body style='font-family:Segoe UI, Arial, sans-serif; font-size:12pt;'>" &
                                        "Hi " & User().FullName & ",<br><br>" &
                                        "The patients with an EDD in the next 7 days are listed below.<br><br>" &
                                        "<table style='border-collapse:collapse; width:100%;' border='1' cellpadding='6'>" &
                                            "<tr style='background-color:#f2f2f2; font-weight:600;'>" &
                                                "<th align='left'>Name</th>" &
                                                "<th align='left'>URN</th>" &
                                                "<th align='left'>DOB</th>" &
                                                "<th align='left'>EDD</th>" &
                                                "<th align='left'>Physio</th>" &
                                                "<th align='left'>OT</th>" &
                                                "<th align='left'>SP</th>" &
                                            "</tr>" &
                                            Concat(
                                                SortByColumns(colWardEDD, "EDD", SortOrder.Ascending),
                                                With(
                                                    {
                                                        ptNames: If(
                                                            IsBlank(PT_Users) || CountRows(PT_Users) = 0,
                                                            "",
                                                            Concat(PT_Users, Coalesce(DisplayName, Email) & "; ")
                                                        ),
                                                        otNames: If(
                                                            IsBlank(OT_Users) || CountRows(OT_Users) = 0,
                                                            "",
                                                            Concat(OT_Users, Coalesce(DisplayName, Email) & "; ")
                                                        ),
                                                        spNames: If(
                                                            IsBlank(SP_Users) || CountRows(SP_Users) = 0,
                                                            "",
                                                            Concat(SP_Users, Coalesce(DisplayName, Email) & "; ")
                                                        )
                                                    },
                                                    "<tr>" &
                                                        "<td>" & Coalesce(Text(Patient), "") & "</td>" &
                                                        "<td>" & Coalesce(Text(URN), "") & "</td>" &
                                                        "<td>" & If(IsBlank(DOB), "", Text(DateValue(DOB), "dd/mm/yyyy")) & "</td>" &
                                                        "<td>" & Text(EDD, "dd/mm/yyyy") & "</td>" &
                                                        "<td>" & ptNames & "</td>" &
                                                        "<td>" & otNames & "</td>" &
                                                        "<td>" & spNames & "</td>" &
                                                    "</tr>"
                                                )
                                            ) &
                                        "</table>" &
                                        "<br><br>Thanks,<br>" & User().FullName &
                                        "</body></html>"
                                    );
                                    Office365Outlook.SendEmailV2(
                                        User().Email,
                                        "Patients with EDD within the next 7 days – Ward " & varWard,
                                        varEmailBody,
                                        { IsHtml: true }
                                    );
                                    Notify("Email Sent", NotificationType.Success),
                                    Notify("No patients with EDD in the next 7 days.", NotificationType.Information)
                                );
                              Text: ="EDD Summary"
                              Width: =Parent.Width
