                        FontWeight: =FontWeight.Bold
                        Height: =46 * SY
                        Icon: ="Save"
                        Layout: ='ButtonCanvas.Layout'.IconBefore
                        OnSelect: |-
                          =// ======================================
                          // SAVE WARD (any ward – handles new + existing rows)  [version 4 - no "rec" variable]
                          // ======================================
                          If(
                              IsEmpty(Filter(colWard, IsDirty)),
                              Notify(
                                  "No changes to save for Ward " & varWard & ".",
                                  NotificationType.Information
                              ),
                              // --------------------------------------
                              // There ARE dirty rows
                              // --------------------------------------
                              Set(wdIsSaving, true);
                              Clear(colWardSaveErrors);
                              Set(wdPulseOn, true);
                              Reset(Timer_Pulse_Ward);
                              // Patch each dirty row into the list for this ward
                              ForAll(
                                  Filter(colWard, IsDirty) As w,
                                  Switch(
                                      varWard,
                                      "4A",
                                          With(
                                              {
                                                  spRow:
                                                      Patch(
                                                          Ward_4A_Shared,
                                                          If(IsBlank(w.ID), Defaults(Ward_4A_Shared), LookUp(Ward_4A_Shared, ID = w.ID)),
                                                          {
                                                              Patient: w.Patient,
                                                              URN: w.URN,
                                                              DOB: w.DOB,
                                                              Diagnosis: w.Diagnosis,
                                                              PT_Users: w.PT_Users,
                                                              OT_Users: w.OT_Users,
                                                              SP_Users: w.SP_Users,
                                                              'Acuity Score': w.'Acuity Score',
                                                              Bed: w.Bed,
                                                              NDIS: w.NDIS,
                                                              Maintenance: w.Maintenance,
                                                              'Link Worker': w.'Link Worker',
                                                              'Falls Risk': w.'Falls Risk',
                                                              Contact: w.Contact,
                                                              'Admission Date': w.'Admission Date',
                                                              'AROC EDD': w.'AROC EDD',
                                                              EDD: w.EDD,
                                                              WeekStartDate: w.WeekStartDate,
                                                              'Morning Handover': w.'Morning Handover',
                                                              'CC Handover': w.'CC Handover',
                                                              Monday: w.Monday,
                                                              Tuesday: w.Tuesday,
                                                              Wednesday: w.Wednesday,
                                                              Thursday: w.Thursday,
                                                              Friday: w.Friday
                                                          }
                                                      )
                                              },
                                              If(
                                                  !IsEmpty(Errors(Ward_4A_Shared, spRow)),
                                                  Collect(
                                                      colWardSaveErrors,
                                                      {
                                                          LocalID: w.ID,
                                                          SavedID: spRow.ID,
                                                          Patient: w.Patient,
                                                          Message: First(Errors(Ward_4A_Shared, spRow)).Message
                                                      }
                                                  ),
                                                  // Success -> store the real SharePoint ID (new rows) and clear IsDirty
                                                  Patch(colWard, w, { ID: spRow.ID, IsDirty: false })
                                              )
                                          ),
                                      "4B",
                                          With(
                                              {
                                                  spRow:
                                                      Patch(
                                                          Ward_4B_Shared,
                                                          If(IsBlank(w.ID), Defaults(Ward_4B_Shared), LookUp(Ward_4B_Shared, ID = w.ID)),
                                                          {
                                                              Patient: w.Patient,
                                                              URN: w.URN,
                                                              DOB: w.DOB,
                                                              Diagnosis: w.Diagnosis,
                                                              PT_Users: w.PT_Users,
                                                              OT_Users: w.OT_Users,
                                                              SP_Users: w.SP_Users,
                                                              'Acuity Score': w.'Acuity Score',
                                                              Bed: w.Bed,
                                                              NDIS: w.NDIS,
                                                              Maintenance: w.Maintenance,
                                                              'Link Worker': w.'Link Worker',
                                                              'Falls Risk': w.'Falls Risk',
                                                              Contact: w.Contact,
                                                              'Admission Date': w.'Admission Date',
                                                              'AROC EDD': w.'AROC EDD',
                                                              EDD: w.EDD,
                                                              WeekStartDate: w.WeekStartDate,
                                                              'Morning Handover': w.'Morning Handover',
                                                              'CC Handover': w.'CC Handover',
                                                              Monday: w.Monday,
                                                              Tuesday: w.Tuesday,
                                                              Wednesday: w.Wednesday,
                                                              Thursday: w.Thursday,
                                                              Friday: w.Friday
                                                          }
                                                      )
                                              },
                                              If(
                                                  !IsEmpty(Errors(Ward_4B_Shared, spRow)),
                                                  Collect(
                                                      colWardSaveErrors,
                                                      {
                                                          LocalID: w.ID,
                                                          SavedID: spRow.ID,
                                                          Patient: w.Patient,
                                                          Message: First(Errors(Ward_4B_Shared, spRow)).Message
                                                      }
                                                  ),
                                                  // Success -> store the real SharePoint ID (new rows) and clear IsDirty
                                                  Patch(colWard, w, { ID: spRow.ID, IsDirty: false })
                                              )
                                          ),
                                      "5A",
                                          With(
                                              {
                                                  spRow:
                                                      Patch(
                                                          Ward_5A_Shared,
                                                          If(IsBlank(w.ID), Defaults(Ward_5A_Shared), LookUp(Ward_5A_Shared, ID = w.ID)),
                                                          {
                                                              Patient: w.Patient,
                                                              URN: w.URN,
                                                              DOB: w.DOB,
                                                              Diagnosis: w.Diagnosis,
                                                              PT_Users: w.PT_Users,
                                                              OT_Users: w.OT_Users,
                                                              SP_Users: w.SP_Users,
                                                              'Acuity Score': w.'Acuity Score',
                                                              Bed: w.Bed,
                                                              NDIS: w.NDIS,
                                                              Maintenance: w.Maintenance,
                                                              'Link Worker': w.'Link Worker',
                                                              'Falls Risk': w.'Falls Risk',
                                                              Contact: w.Contact,
                                                              'Admission Date': w.'Admission Date',
                                                              'AROC EDD': w.'AROC EDD',
                                                              EDD: w.EDD,
                                                              WeekStartDate: w.WeekStartDate,
                                                              'Morning Handover': w.'Morning Handover',
                                                              'CC Handover': w.'CC Handover',
                                                              Monday: w.Monday,
                                                              Tuesday: w.Tuesday,
                                                              Wednesday: w.Wednesday,
                                                              Thursday: w.Thursday,
                                                              Friday: w.Friday
                                                          }
                                                      )
                                              },
                                              If(
                                                  !IsEmpty(Errors(Ward_5A_Shared, spRow)),
                                                  Collect(
                                                      colWardSaveErrors,
                                                      {
                                                          LocalID: w.ID,
                                                          SavedID: spRow.ID,
                                                          Patient: w.Patient,
                                                          Message: First(Errors(Ward_5A_Shared, spRow)).Message
                                                      }
                                                  ),
                                                  // Success -> store the real SharePoint ID (new rows) and clear IsDirty
                                                  Patch(colWard, w, { ID: spRow.ID, IsDirty: false })
                                              )
                                          ),
                                      With(
                                          {
                                              spRow:
                                                  Patch(
                                                      Ward_6A_Shared,
                                                      If(IsBlank(w.ID), Defaults(Ward_6A_Shared), LookUp(Ward_6A_Shared, ID = w.ID)),
                                                      {
                                                          Patient: w.Patient,
                                                          URN: w.URN,
                                                          DOB: w.DOB,
                                                          Diagnosis: w.Diagnosis,
                                                          PT_Users: w.PT_Users,
                                                          OT_Users: w.OT_Users,
                                                          SP_Users: w.SP_Users,
                                                          'Acuity Score': w.'Acuity Score',
                                                          Bed: w.Bed,
                                                          NDIS: w.NDIS,
                                                          Maintenance: w.Maintenance,
                                                          'Link Worker': w.'Link Worker',
                                                          'Falls Risk': w.'Falls Risk',
                                                          Contact: w.Contact,
                                                          'Admission Date': w.'Admission Date',
                                                          'AROC EDD': w.'AROC EDD',
                                                          EDD: w.EDD,
                                                          WeekStartDate: w.WeekStartDate,
                                                          'Morning Handover': w.'Morning Handover',
                                                          'CC Handover': w.'CC Handover',
                                                          Monday: w.Monday,
                                                          Tuesday: w.Tuesday,
                                                          Wednesday: w.Wednesday,
                                                          Thursday: w.Thursday,
                                                          Friday: w.Friday
                                                      }
                                                  )
                                          },
                                          If(
                                              !IsEmpty(Errors(Ward_6A_Shared, spRow)),
                                              Collect(
                                                  colWardSaveErrors,
                                                  {
                                                      LocalID: w.ID,
                                                      SavedID: spRow.ID,
                                                      Patient: w.Patient,
                                                      Message: First(Errors(Ward_6A_Shared, spRow)).Message
                                                  }
                                              ),
                                              // Success -> store the real SharePoint ID (new rows) and clear IsDirty
                                              Patch(colWard, w, { ID: spRow.ID, IsDirty: false })
                                          )
                                      )
                                  )
                              );
                              // --------------------------------------
                              // Post-save handling
                              // --------------------------------------
                              If(
                                  CountRows(colWardSaveErrors) > 0,
                                  // Some rows failed
                                  Set(wdIsSaving, false);
                                  Set(wdPulseOn, false);
                                  Reset(Timer_Pulse_Ward);
                                  Notify(
                                      "Some rows failed to save (" &
                                      CountRows(colWardSaveErrors) &
                                      "). Unsaved changes remain.",
                                      NotificationType.Error
                                  ),
                                  // ALL rows saved -> refresh charts
                                  Select(btnRebuildCharts_Ward);
                                  Set(wdIsSaving, false);
                                  Set(wdPulseOn, false);
                                  Reset(Timer_Pulse_Ward);
                                  Notify(
                                      "Ward " & varWard & " changes saved.",
                                      NotificationType.Success
                                  )
                              )
                          )
                        Text: ="Save"
                        Width: =100 * SX
