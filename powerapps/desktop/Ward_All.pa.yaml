                Children:
                  - ButtonCanvas21:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Transparent
                        BorderColor: =RGBA(53, 61, 63, 1)
                        BorderRadius: =23 * SR
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        DisplayMode: =If(wdIsSaving, DisplayMode.Disabled, DisplayMode.Edit)
