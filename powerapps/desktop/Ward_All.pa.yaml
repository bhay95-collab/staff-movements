                      Variant: ManualLayout
                      Properties:
                        BorderColor: =RGBA(26, 90, 153, 1)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =If(IsBlank(wdMoveTargetID), RGBA(210, 218, 227, 1), RGBA(26, 90, 153, 1))
                        Height: =44 * SY
