                                    Height: =Parent.Height
                                    RadiusBottomLeft: =12 * SR
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =12 * SR
                                    RadiusTopRight: =0
                                    Width: =6 * SX
                              - lblEvTitle_Lv:
