Screens:
  PT_Leave_New:
    Properties:
      Fill: =RGBA(235, 242, 248, 1)
      ImagePosition: =ImagePosition.Fill
      OnVisible: |-
        =// Monday of the week to show (on a weekend, show next week)
        Set(
            varLeaveWeekStart,
            DateAdd(Today(), 1 - Weekday(Today(), StartOfWeek.Monday) + If(Weekday(Today(), StartOfWeek.Monday) >= 6, 7, 0))
        );
        ClearCollect(colMyCalendars, Office365Outlook.CalendarGetTables().value);
        // Find STARSPhysioLeave calendar by DisplayName AND owner address
        Set(
            varLeaveCalendar,
            LookUp(
                colMyCalendars,
                Lower(Trim(DisplayName)) = "starsphysioleave" &&
                Lower(
                    LookUp(DynamicProperties, key = "Owner").value.Address
                ) = "starsphysioleave@health.qld.gov.au"
            )
        );
        // Calendar ID
        Set(varLeaveCalendarId, varLeaveCalendar.Name);
        If(
            IsBlank(varLeaveCalendarId),
            Notify("STARSPhysioLeave calendar not found or not accessible.", NotificationType.Error),
            Select(btnRefresh_Lv)
        )
    Children:
      - btnRefresh_Lv:
          Control: Button@0.0.45
          Properties:
            Height: =10 * SY
            OnSelect: |-
              =If(
                  IsBlank(varLeaveCalendarId),
                  Notify("STARSPhysioLeave calendar not found or not accessible.", NotificationType.Error),
                  // Week end (exclusive)
                  Set(varLeaveWeekEnd, DateAdd(varLeaveWeekStart, 7));
                  // Local midnight DateTime values
                  Set(varLeaveStartDT, varLeaveWeekStart + Time(0, 0, 0));
                  Set(varLeaveEndDT,   varLeaveWeekEnd   + Time(0, 0, 0));
                  // Convert local -> UTC DateTime
                  Set(varUTCStartDT, DateAdd(varLeaveStartDT, TimeZoneOffset(varLeaveStartDT), TimeUnit.Minutes));
                  Set(varUTCEndDT,   DateAdd(varLeaveEndDT,   TimeZoneOffset(varLeaveEndDT),   TimeUnit.Minutes));
                  // Convert UTC DateTime -> ISO 8601 UTC text (this is what the connector wants)
                  Set(varUTCStartText, Text(varUTCStartDT, DateTimeFormat.UTC));
                  Set(varUTCEndText,   Text(varUTCEndDT,   DateTimeFormat.UTC));
                  // Pull events using ISO UTC strings
                  ClearCollect(
                      colLeaveEventsRaw,
                      Office365Outlook.GetEventsCalendarViewV2(
                          varLeaveCalendarId,
                          varUTCStartText,
                          varUTCEndText
                      ).value
                  );
                  // Shape for display (local start / end)
                  ClearCollect(
                      colLeaveEvents,
                      AddColumns(
                          colLeaveEventsRaw,
                          StartLocal,
                          DateAdd(DateTimeValue(ThisRecord.Start), -TimeZoneOffset(DateTimeValue(ThisRecord.Start)), TimeUnit.Minutes),
                          EndLocal,
                          DateAdd(DateTimeValue(ThisRecord.End), -TimeZoneOffset(DateTimeValue(ThisRecord.End)), TimeUnit.Minutes),
                          EventTitle,
                          Coalesce(ThisRecord.Subject, "(No title)")
                      )
                  );
                  // Mon-Fri columns. Away = entries that overlap that day (so multi-day leave shows on every day)
                  ClearCollect(
                      colLeaveDays,
                      ForAll(
                          Sequence(5),
                          With(
                              { d: DateAdd(varLeaveWeekStart, Value - 1) },
                              {
                                  DayDate: d,
                                  DayName: Text(d, "dddd"),
                                  DayNum: Text(d, "d mmmm"),
                                  IsToday: d = Today(),
                                  Away: CountRows(Filter(colLeaveEvents, StartLocal < DateAdd(d, 1) && EndLocal > d))
                              }
                          )
                      )
                  )
              )
            Text: =""
            Visible: =false
            Width: =10 * SX
      - Lv_Title:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.Regular
            Fill: =RGBA(7, 95, 115, 1)
            Height: =70 * SY
            RadiusBottomLeft: =18 * SR
