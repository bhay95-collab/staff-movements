      - Gallery_LvDays:
          Control: Gallery@2.15.0
          Variant: Horizontal
          Properties:
            Height: =658 * SY
            Items: =colLeaveDays
            TemplatePadding: =0
            TemplateSize: =268 * SX
            Width: =1340 * SX
            X: =14 * SX
            Y: =95 * SY
          Children:
            - lblDayKey_Lv:
                Control: Label@2.5.1
