                                    Text: =If(ThisItem.IsAllDay = true, "All day" & If(DateDiff(DateValue(ThisItem.StartLocal), DateValue(ThisItem.EndLocal), TimeUnit.Days) > 1, "  ·  " & Text(DateValue(ThisItem.StartLocal), "d mmm") & " – " & Text(DateAdd(DateValue(ThisItem.EndLocal), -1, TimeUnit.Days), "d mmm"), ""), Text(ThisItem.StartLocal, "h:mm am/pm") & " – " & Text(ThisItem.EndLocal, "h:mm am/pm"))
