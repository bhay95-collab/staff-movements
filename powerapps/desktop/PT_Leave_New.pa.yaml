                              Height: =76 * SY
                              RadiusBottomLeft: =12 * SR
                              RadiusBottomRight: =12 * SR
                              RadiusTopLeft: =12 * SR
                              RadiusTopRight: =12 * SR
                              Width: =Parent.TemplateWidth - 20 * SX
                              X: =10 * SX
                              Y: =4 * SY
                            Children:
