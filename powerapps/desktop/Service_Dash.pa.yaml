Screens:
  Service_Dash:
    Properties:
      Fill: =RGBA(235, 242, 248, 1)
      ImagePosition: =ImagePosition.Fill
      OnVisible: |-
        =// Service dashboard. Reads Service_Log + stock, Select(btnBuild_Sd) builds every list.
        Set(sdPreset, "365");
        Set(sdFrom, DateAdd(Today(), -364));
        Set(sdCat, "All");
        Set(sdQ, "");
        Set(sdTab, "Due");
        Set(sdShowDetail, false);
        Set(sdKpi, {Due: 0, DueOut: 0, Now: 0, AvgDays: 0, Done: 0, Condemned: 0});
        ClearCollect(colSdCats, Table({ Value: "All categories" }, { Value: "Wheelchair" }, { Value: "Cushion" }, { Value: "Backrest" }));
        Select(btnLoad_Sd)
    Children:
      - btnLoad_Sd:
          Control: ModernButton@1.0.0
          Properties:
            Align: =Align.Center
            FontWeight: =""
            Height: =10 * SY
            OnSelect: |-
              =Set(sdLoading, true);
              // episodes still at service (any date)
              ClearCollect(colSdOpen, Filter(Service_Log, ServiceStatus.Value = "In Service"));
              // finished episodes in the period
              ClearCollect(colSdDone, Filter(Service_Log, ServiceStatus.Value = "Completed" && SentDateTime >= sdFrom));
              // stock today
              ClearCollect(
                  colSdInv,
                  AddColumns(
                      Equipment_Inventory_SharePoint,
                      iCat, Coalesce(Category.Value, ""),
                      iType, If(Category.Value = "Wheelchair", Coalesce('Wheelchair Type'.Value, ""), ""),
                      iWidth, Coalesce(Width.Value, ""),
                      iStatus, Coalesce(Status.Value, ""),
                      iDays, Coalesce(TotalDaysSignedOut, 0),
                      iLoc, Coalesce(Location.Value, ""),
                      iDesc, Trim(Brand & " " & Model)
                  )
              );
              Set(sdLoading, false);
              Select(btnBuild_Sd)
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =Round(14 * SF, 0)
            Text: =""
            VerticalAlign: =VerticalAlign.Middle
            Visible: =false
            Width: =10 * SX
      - btnBuild_Sd:
          Control: ModernButton@1.0.0
          Properties:
            Align: =Align.Center
            FontWeight: =""
            Height: =10 * SY
            OnSelect: |-
              =// 1) due now: more than 100 days in use and not already at service
              ClearCollect(
                  colSdDue,
                  SortByColumns(
                      Filter(colSdInv, iDays > 100 && iStatus in ["Available", "Allocated"] && (sdCat = "All" || iCat = sdCat) && (sdQ = "" || sdQ in Lower(Title) || sdQ in Lower(iDesc))),
                      "iDays",
                      SortOrder.Descending
                  )
              );
              // 2) at service now
              ClearCollect(
                  colSdNow,
                  SortByColumns(
                      AddColumns(Filter(colSdOpen, (sdCat = "All" || Category = sdCat) && (sdQ = "" || sdQ in Lower(Title) || sdQ in Lower(Brand) || sdQ in Lower(Model))), DaysAway, DateDiff(SentDateTime, Now(), TimeUnit.Days)),
                      "SentDateTime",
                      SortOrder.Ascending
                  )
              );
              // 3) history for the period
              ClearCollect(
                  colSdHist,
                  SortByColumns(Filter(colSdDone, (sdCat = "All" || Category = sdCat) && (sdQ = "" || sdQ in Lower(Title) || sdQ in Lower(Brand) || sdQ in Lower(Model))), "ReturnedDateTime", SortOrder.Descending)
              );
              // 4) headline numbers
              Set(
                  sdKpi,
                  {
                      Due: CountRows(colSdDue),
                      DueOut: CountRows(Filter(colSdDue, iStatus = "Allocated")),
                      Now: CountRows(colSdNow),
                      AvgDays: If(
                          CountRows(Filter(colSdHist, !IsBlank(DaysAtService))) = 0,
                          0,
                          Round(Average(Filter(colSdHist, !IsBlank(DaysAtService)), DaysAtService), 1)
                      ),
                      Done: CountRows(Filter(colSdHist, !StartsWith(Coalesce(Outcome.Value, ""), "Condemned"))),
                      Condemned: CountRows(Filter(colSdHist, StartsWith(Coalesce(Outcome.Value, ""), "Condemned")))
                  }
              )
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =Round(14 * SF, 0)
            Text: =""
            VerticalAlign: =VerticalAlign.Middle
            Visible: =false
            Width: =10 * SX
