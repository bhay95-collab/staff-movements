Screens:
  Training_Sessions:
    Properties:
      Fill: =RGBA(235, 242, 248, 1)
      ImagePosition: =ImagePosition.Fill
      OnVisible: |-
        =Set(trShowAdd, false);
        Set(trShowWait, false);
        Set(trShowEmail, false);
        Set(trShowConfirm, false);
        If(IsBlank(trType), Set(trType, "Basic Life Support"));
        Select(btnLoad_Trs)
    Children:
      - btnLoad_Trs:
          Control: Button@0.0.45
          Properties:
            FontSize: =Round(14 * SF, 0)
            Height: =10 * SY
            Width: =10 * SX
            Text: =""
            Visible: =false
            OnSelect: |-
              =// everything on this screen is read once here, then worked out on the device
              Set(trLoading, true);
              Refresh(TrainingSessions);
              Refresh(TrainingBookings);
              Refresh(TrainingWaitlist);
              ClearCollect(
                  colTrBookings,
                  Filter(
                      TrainingBookings,
                      BookingStatus.Value = "Booked" && TrainingType = trType && SessionDate >= Today()
                  )
              );
              ClearCollect(colTrWait, Filter(TrainingWaitlist, WaitlistStatus.Value = "Waiting"));
              ClearCollect(
                  colTrSessions,
                  AddColumns(
                      AddColumns(
                          AddColumns(
                              SortByColumns(
                                  Filter(
                                      TrainingSessions,
                                      IsActive = true && TrainingType.Value = trType && SessionDate >= Today()
                                  ),
                                  "SessionDate",
                                  SortOrder.Ascending
                              ),
                              SesKey, Text(ID),
                              Cap, Coalesce(Capacity, If(trType = "Manual Handling", 8, 6))
                          ),
                          Booked, CountRows(Filter(colTrBookings, SessionID = SesKey)),
                          MyBookingID, LookUp(colTrBookings, SessionID = SesKey && Lower(BookedUserEmail) = MeEmail).ID,
                          MyWaitID, LookUp(colTrWait, SessionID = SesKey && Lower(WaitlistUserEmail) = MeEmail).ID,
                          MyWaitOn, LookUp(colTrWait, SessionID = SesKey && Lower(WaitlistUserEmail) = MeEmail).AddedOn,
                          WaitCount, CountRows(Filter(colTrWait, SessionID = SesKey))
                      ),
                      Free, Cap - Booked,
                      MyWaitPos, If(IsBlank(MyWaitOn), 0, CountRows(Filter(colTrWait, SessionID = SesKey && AddedOn <= MyWaitOn)))
                  )
              );

              // keep the chosen date selected (with fresh numbers), or open the one asked for from Home
              If(
                  !IsBlank(trOpen),
                  Set(trSel, LookUp(colTrSessions, ID = trOpen));
                  Set(trOpen, Blank()),

                  !IsBlank(trSel),
                  Set(trSel, LookUp(colTrSessions, ID = trSel.ID))
              );
              // on wide screens the right-hand side is never empty
              If(IsBlank(trSel), Set(trSel, First(colTrSessions)));
              Set(trLoading, false);
              Select(btnSlots_Trs)
      - btnSlots_Trs:
          Control: Button@0.0.45
          Properties:
            FontSize: =Round(14 * SF, 0)
            Height: =10 * SY
            Width: =10 * SX
            Text: =""
            Visible: =false
            OnSelect: |-
              =ClearCollect(
                  colTrSlots,
                  ForAll(
                      Sequence(Coalesce(trSel.Cap, 0)) As n,
                      {
                          SlotNo: n.Value,
                          Booking: LookUp(
                              colTrBookings,
                              SessionID = Coalesce(trSel.SesKey, "") && SlotNumber = n.Value
                          )
                      }
                  )
              )
      - btnDoBook_Trs:
          Control: Button@0.0.45
          Properties:
            FontSize: =Round(14 * SF, 0)
            Height: =10 * SY
            Width: =10 * SX
            Text: =""
            Visible: =false
            OnSelect: |-
              =With(
                  { s: trSel },
                  Refresh(TrainingBookings);
                  With(
                      { bookedNow: Filter(TrainingBookings, SessionID = s.SesKey && BookingStatus.Value = "Booked") },
                      If(
                          !IsBlank(LookUp(bookedNow, Lower(BookedUserEmail) = MeEmail)),
                          Notify("You are already booked into this session.", NotificationType.Warning);
                          Select(btnLoad_Trs),

                          CountRows(bookedNow) >= s.Cap,
                          Notify("Sorry, that session has just filled up.", NotificationType.Warning);
                          Select(btnLoad_Trs),

                          With(
                              {
                                  slot: First(
                                      Filter(
                                          ForAll(Sequence(s.Cap) As n, { SlotNo: n.Value }),
                                          IsBlank(LookUp(bookedNow, SlotNumber = SlotNo))
                                      )
                                  ).SlotNo
                              },
                              With(
                                  {
                                      rec: Patch(
                                          TrainingBookings,
                                          Defaults(TrainingBookings),
                                          {
                                              Title: trType & " - " & MeName,
                                              SessionID: s.SesKey,
                                              TrainingType: trType,
                                              SessionDate: s.SessionDate,
                                              SlotNumber: slot,
                                              BookedUserName: MeName,
                                              BookedUserEmail: MeEmail,
                                              BookingStatus: { Value: "Booked" },
                                              BookedOn: Now()
                                          }
                                      )
                                  },
                                  If(
                                      !IsEmpty(Errors(TrainingBookings)),
                                      Notify("Could not book. Please try again.", NotificationType.Error),

                                      // two people can take the same slot at the same moment: the earlier booking keeps it
                                      Refresh(TrainingBookings);
                                      If(
                                          rec.ID > Min(
                                              Filter(TrainingBookings, SessionID = s.SesKey && SlotNumber = slot && BookingStatus.Value = "Booked"),
                                              ID
                                          ),
                                          Patch(TrainingBookings, LookUp(TrainingBookings, ID = rec.ID), { BookingStatus: { Value: "Cancelled" } });
                                          Notify("Someone else just took that place. Please try again.", NotificationType.Warning),

                                          If(
                                              !IsBlank(s.MyWaitID),
                                              Patch(TrainingWaitlist, LookUp(TrainingWaitlist, ID = s.MyWaitID), { WaitlistStatus: { Value: "Removed" } })
                                          );
                                          IfError(
                                              TrainingBookingConfirmationEmail.Run("Booked", MeName, MeEmail, s.SesKey, trType, ""),
                                              Notify("You are booked, but the confirmation email could not be sent.", NotificationType.Warning)
                                          );
                                          Notify("You are booked into this session.", NotificationType.Success)
                                      );
                                      Select(btnLoad_Trs)
                                  )
                              )
                          )
                      )
                  )
              )
      - btnDoCancel_Trs:
          Control: Button@0.0.45
          Properties:
            FontSize: =Round(14 * SF, 0)
            Height: =10 * SY
            Width: =10 * SX
            Text: =""
            Visible: =false
            OnSelect: |-
              =With(
                  { s: trSel },
                  With(
                      { b: LookUp(TrainingBookings, ID = s.MyBookingID) },
                      If(
                          IsBlank(b),
                          Notify("That booking could not be found.", NotificationType.Warning);
                          Set(trShowConfirm, false);
                          Select(btnLoad_Trs),

                          Patch(TrainingBookings, b, { BookingStatus: { Value: "Cancelled" } });
                          If(
                              !IsEmpty(Errors(TrainingBookings)),
                              Notify("Could not remove the booking. Please try again.", NotificationType.Error),

                              IfError(
                                  TrainingBookingConfirmationEmail.Run("Cancelled", b.BookedUserName, b.BookedUserEmail, s.SesKey, trType, Text(b.ID)),
                                  Notify("The booking was removed, but the email could not be sent.", NotificationType.Warning)
                              );
                              IfError(TrainingWaitlistNotification.Run(s.SesKey, trType), Blank());
                              Set(trShowConfirm, false);
                              Notify("Your booking has been removed.", NotificationType.Success);
                              Select(btnLoad_Trs)
                          )
                      )
                  )
              )
      - btnDoRemove_Trs:
          Control: Button@0.0.45
          Properties:
            FontSize: =Round(14 * SF, 0)
            Height: =10 * SY
            Width: =10 * SX
            Text: =""
            Visible: =false
            OnSelect: |-
              =With(
                  { s: trSel },
                  With(
                      { b: LookUp(TrainingBookings, ID = trSlot.ID) },
                      If(
                          IsBlank(b),
                          Notify("That booking could not be found.", NotificationType.Warning);
                          Set(trShowConfirm, false);
                          Select(btnLoad_Trs),

                          Patch(TrainingBookings, b, { BookingStatus: { Value: "Cancelled" } });
                          If(
                              !IsEmpty(Errors(TrainingBookings)),
                              Notify("Could not remove the booking. Please try again.", NotificationType.Error),

                              IfError(
                                  TrainingBookingConfirmationEmail.Run("Cancelled", b.BookedUserName, b.BookedUserEmail, s.SesKey, trType, Text(b.ID)),
                                  Notify("The booking was removed, but the email could not be sent.", NotificationType.Warning)
                              );
                              IfError(TrainingWaitlistNotification.Run(s.SesKey, trType), Blank());
                              Set(trShowConfirm, false);
                              Notify("The booking has been removed.", NotificationType.Success);
                              Select(btnLoad_Trs)
                          )
                      )
                  )
              )
      - btnDoDelete_Trs:
          Control: Button@0.0.45
          Properties:
            FontSize: =Round(14 * SF, 0)
            Height: =10 * SY
            Width: =10 * SX
            Text: =""
            Visible: =false
            OnSelect: |-
              =With(
                  { s: trSel },
                  Refresh(TrainingBookings);
                  Refresh(TrainingWaitlist);
                  If(
                      CountRows(Filter(TrainingBookings, SessionID = s.SesKey && BookingStatus.Value = "Booked")) > 0 ||
                      CountRows(Filter(TrainingWaitlist, SessionID = s.SesKey && WaitlistStatus.Value = "Waiting")) > 0,
                      Notify("This date cannot be deleted while people are booked or waiting. Remove them first.", NotificationType.Warning);
                      Set(trShowConfirm, false),

                      // the date is hidden, not erased, so the history is kept
                      Patch(TrainingSessions, LookUp(TrainingSessions, ID = s.ID), { IsActive: false });
                      If(
                          !IsEmpty(Errors(TrainingSessions)),
                          Notify("Could not delete the date. Please try again.", NotificationType.Error),
                          Set(trShowConfirm, false);
                          Set(trSel, Blank());
                          Notify("Training date deleted.", NotificationType.Success);
                          Select(btnLoad_Trs)
                      )
                  )
              )
      - btnDoJoin_Trs:
          Control: Button@0.0.45
          Properties:
            FontSize: =Round(14 * SF, 0)
            Height: =10 * SY
            Width: =10 * SX
            Text: =""
            Visible: =false
            OnSelect: |-
              =With(
                  { s: trSel },
                  If(
                      !IsBlank(s.MyWaitID) || !IsBlank(s.MyBookingID),
                      Blank(),
                      Patch(
                          TrainingWaitlist,
                          Defaults(TrainingWaitlist),
                          {
                              Title: trType & " - " & MeName,
                              SessionID: s.SesKey,
                              WaitlistUserName: MeName,
                              WaitlistUserEmail: MeEmail,
                              WaitlistStatus: { Value: "Waiting" },
                              AddedOn: Now()
                          }
                      );
                      If(
                          !IsEmpty(Errors(TrainingWaitlist)),
                          Notify("Could not join the waitlist. Please try again.", NotificationType.Error),
                          Notify("You are on the waitlist. You will get an email if a place opens.", NotificationType.Success);
                          Select(btnLoad_Trs)
                      )
                  )
              )
      - btnDoLeave_Trs:
          Control: Button@0.0.45
          Properties:
            FontSize: =Round(14 * SF, 0)
            Height: =10 * SY
            Width: =10 * SX
            Text: =""
            Visible: =false
            OnSelect: |-
              =With(
                  { s: trSel },
                  Patch(TrainingWaitlist, LookUp(TrainingWaitlist, ID = s.MyWaitID), { WaitlistStatus: { Value: "Removed" } });
                  If(
                      !IsEmpty(Errors(TrainingWaitlist)),
                      Notify("Could not leave the waitlist. Please try again.", NotificationType.Error),
                      IfError(
                          TrainingBookingConfirmationEmail.Run("WaitlistRemoved", MeName, MeEmail, s.SesKey, trType, ""),
                          Blank()
                      );
                      Notify("You have been removed from the waitlist.", NotificationType.Success);
                      Select(btnLoad_Trs)
                  )
              )
      - btnDoAdd_Trs:
          Control: Button@0.0.45
          Properties:
            FontSize: =Round(14 * SF, 0)
            Height: =10 * SY
            Width: =10 * SX
            Text: =""
            Visible: =false
            OnSelect: |-
              =With(
                  {
                      t: ddType_Trs.Selected.Value,
                      d: dpDate_Trs.SelectedDate,
                      loc: Trim(txtLoc_Trs.Text)
                  },
                  With(
                      { when: d + Time(Value(ddHour_Trs.Selected.Value), Value(ddMin_Trs.Selected.Value), 0) },
                      If(
                          IsBlank(t),
                          Notify("Please select a training type.", NotificationType.Warning),

                          IsBlank(d),
                          Notify("Please select a date.", NotificationType.Warning),

                          IsBlank(loc),
                          Notify("Please enter a location.", NotificationType.Warning),

                          when < Now(),
                          Notify("That date and time has already passed.", NotificationType.Warning),

                          !IsBlank(LookUp(TrainingSessions, TrainingType.Value = t && SessionDate = when && IsActive = true)),
                          Notify("A session already exists for that date and time.", NotificationType.Warning),

                          Patch(
                              TrainingSessions,
                              Defaults(TrainingSessions),
                              {
                                  Title: t & " - " & Text(when, "dd/mm/yyyy hh:mm"),
                                  TrainingType: { Value: t },
                                  SessionDate: when,
                                  Location: loc,
                                  Capacity: If(t = "Manual Handling", 8, 6),
                                  IsActive: true
                              }
                          );
                          If(
                              !IsEmpty(Errors(TrainingSessions)),
                              Notify("Could not save the date. Please try again.", NotificationType.Error),
                              Set(trShowAdd, false);
                              Set(trType, t);
                              Set(trSel, Blank());
                              Notify("Training date added.", NotificationType.Success);
                              Select(btnLoad_Trs)
                          )
                      )
                  )
              )
      - btnDoSend_Trs:
          Control: Button@0.0.45
          Properties:
            FontSize: =Round(14 * SF, 0)
            Height: =10 * SY
            Width: =10 * SX
            Text: =""
            Visible: =false
            OnSelect: |-
              =With(
                  { to: Concat(Filter(colTrBookings, SessionID = trSel.SesKey), BookedUserEmail, ";") },
                  If(
                      IsBlank(to),
                      Notify("Nobody is booked into this date yet.", NotificationType.Warning),
                      IfError(
                          Office365Outlook.SendEmailV2(
                              to,
                              Trim(txtEmailSubject_Trs.Text),
                              Substitute(Substitute(txtEmailBody_Trs.Text, Char(13), ""), Char(10), "<br>"),
                              { IsHtml: true }
                          );
                          Set(trShowEmail, false);
                          Notify("Email sent to the booked attendees.", NotificationType.Success),
                          Notify("The email could not be sent. Please try again.", NotificationType.Error)
                      )
                  )
              )
      - btnDoSendWait_Trs:
          Control: Button@0.0.45
          Properties:
            FontSize: =Round(14 * SF, 0)
            Height: =10 * SY
            Width: =10 * SX
            Text: =""
            Visible: =false
            OnSelect: |-
              =With(
                  { to: Concat(Filter(colTrWait, SessionID = trSel.SesKey), WaitlistUserEmail, ";") },
                  If(
                      IsBlank(to),
                      Notify("There are no waitlist users to email.", NotificationType.Warning),
                      IfError(
                          Office365Outlook.SendEmailV2(
                              to,
                              trType & " training: a place may be available (" & Text(trSel.SessionDate, "dd/mm/yyyy h:mm AM/PM") & ")",
                              "Hi all,<br><br>You are on the waitlist for " & trType & " training on " &
                              Text(trSel.SessionDate, "dddd d mmmm") & " at " & Text(trSel.SessionDate, "h:mm AM/PM") & ".<br>" &
                              "A place may be available. If you would like it, please open the Training Register app and book a place.<br><br>" &
                              "Thanks,<br>" & MeName,
                              { IsHtml: true }
                          );
                          Notify("Email sent to the waitlist.", NotificationType.Success),
                          Notify("The email could not be sent. Please try again.", NotificationType.Error)
                      )
                  )
              )
