Screens:
  Physio_Data_New:
    Properties:
      Fill: =RGBA(235, 242, 248, 1)
      ImagePosition: =ImagePosition.Fill
      OnVisible: |-
        =// -------------------------------
        // 0) Cache + normalize raw data
        // -------------------------------
        Set(locShowStaffing, false);
        ClearCollect(
            colAcuityRaw,
            AddColumns(
                Acuity_Longitudinal,
                WardKey, Upper(Trim(WardCode.Value)),
                WeekStartKey, DateValue(WeekStart)
            )
        );
        // -------------------------------
        // 1) "This week" + "last week" from existing data
        //    (previous available week, not assumed -7)
        // -------------------------------
        With(
            {
                weeks: Sort(
                    Distinct(colAcuityRaw, WeekStartKey),
                    Value,
                    SortOrder.Descending
                )
            },
            Set(locThisWeekStart, If(CountRows(weeks) >= 1, First(weeks).Value, Blank()));
            Set(locLastWeekStart, If(CountRows(weeks) >= 2, Last(FirstN(weeks, 2)).Value, Blank()))
        );
        // -------------------------------
        // 2) Weekly aggregated dataset (1 row per ward + week)
        // -------------------------------
        ClearCollect(
            colAcuityWeekly,
            AddColumns(
                GroupBy(
                    Filter(colAcuityRaw, !IsBlank(WardKey) && !IsBlank(WeekStartKey)),
                    WardKey,
                    WeekStartKey,
                    WeekRows
                ),
                WeeklyAverage,
                If(CountRows(WeekRows) = 0, Blank(), Average(WeekRows, AcuityScore))
            )
        );
        // -------------------------------
        // 3) Pivot: 1 row per week, 1 column per ward (for the line chart)
        // -------------------------------
        ClearCollect(
            colAcuityWeeklyWide,
            DropColumns(
                AddColumns(
                    Sort(Distinct(colAcuityWeekly, WeekStartKey), Value, SortOrder.Ascending),
                    WeekLabel, Text(Value, "dd mmm"),
                    'Ward 4A', LookUp(colAcuityWeekly, WeekStartKey = Value && WardKey = "4A", WeeklyAverage),
                    'Ward 4B', LookUp(colAcuityWeekly, WeekStartKey = Value && WardKey = "4B", WeeklyAverage),
                    'Ward 5A', LookUp(colAcuityWeekly, WeekStartKey = Value && WardKey = "5A", WeeklyAverage),
                    'Ward 6A', LookUp(colAcuityWeekly, WeekStartKey = Value && WardKey = "6A", WeeklyAverage)
                ),
                Value
            )
        );
        // -------------------------------
        // 4) One row per ward for the cards: total acuity + this week vs last week
        // -------------------------------
        ClearCollect(
            colDdWardStats,
            ForAll(
                colWardSummaryConfig As w,
                With(
                    {
                        t: LookUp(colAcuityWeekly, WardKey = Upper(Trim(w.WardCode)) && WeekStartKey = locThisWeekStart, WeeklyAverage),
                        l: LookUp(colAcuityWeekly, WardKey = Upper(Trim(w.WardCode)) && WeekStartKey = locLastWeekStart, WeeklyAverage)
                    },
                    {
                        WardCode: w.WardCode,
                        Acuity: Switch(
                            w.WardCode,
                            "4A", Sum(Filter(Ward_4A_Shared, !IsBlank(Patient)), 'Acuity Score'),
                            "4B", Sum(Filter(Ward_4B_Shared, !IsBlank(Patient)), 'Acuity Score'),
                            "5A", Sum(Filter(Ward_5A_Shared, !IsBlank(Patient)), 'Acuity Score'),
                            "6A", Sum(Filter(Ward_6A_Shared, !IsBlank(Patient)), 'Acuity Score'),
                            0
                        ),
                        ThisAvg: t,
                        LastAvg: l,
                        Trend: If(IsBlank(t), "none", IsBlank(l), "first", t > l, "up", t < l, "down", "same")
                    }
                )
            )
        )
    Children:
      - btnCalc_Dd:
          Control: ModernButton@1.0.0
          Properties:
            Align: =Align.Center
            FontWeight: =""
            Height: =10 * SY
            OnSelect: |-
              =// 1) Normalize to Impairment + PatientCount (colStaffPie is filled by the ward card / AFRM button)
              ClearCollect(
                  colWardImpairmentCounts,
                  AddColumns(
                      GroupBy(
                          AddColumns(
                              Filter(colStaffPie, !IsBlank(City) && Value(Area) > 0),
                              Impairment,
                                  Coalesce(
                                      LookUp(colDiagnosisMap, Upper(Trim(DiagnosisLabel)) = Upper(Trim(City)), Impairment),
                                      City
                                  ),
                              Patients,
                                  Value(Area)
                          ),
                          Impairment,
                          Rows
                      ),
                      PatientCount,
                          Sum(Rows, Patients)
                  )
              );
              // 2) Recommended staffing = sum across impairments
              ClearCollect(
                  colWardStaffingRecommended,
                  With(
                      {
                          totals:
                              ForAll(
                                  colWardImpairmentCounts As d,
                                  With(
                                      {
                                          r: LookUp(colStaffRatios, Upper(Trim(Impairment)) = Upper(Trim(d.Impairment))),
                                          factor: d.PatientCount / 10
                                      },
                                      {
                                          OT: factor * Coalesce(r.OT, 0),
                                          PT: factor * Coalesce(r.PT, 0),
                                          AHA: factor * Coalesce(r.AHA, 0),
                                          SP: factor * Coalesce(r.SP, 0),
                                          ClinPsych: factor * Coalesce(r.ClinPsych, 0),
                                          NeuroPsych: factor * Coalesce(r.NeuroPsych, 0),
                                          SW: factor * Coalesce(r.SW, 0),
                                          Diet: factor * Coalesce(r.Diet, 0),
                                          SP_IsConsult: !IsBlank(r.Impairment) && IsBlank(r.SP) && d.PatientCount > 0,
                                          NeuroPsych_IsConsult: !IsBlank(r.Impairment) && IsBlank(r.NeuroPsych) && d.PatientCount > 0
                                      }
                                  )
                              )
                      },
                      Table(
                          {
                              Ward: locSelectedWard,
                              OT: Sum(totals, OT),
                              PT: Sum(totals, PT),
                              AHA: Sum(totals, AHA),
                              SP: Sum(totals, SP),
                              ClinPsych: Sum(totals, ClinPsych),
                              NeuroPsych: Sum(totals, NeuroPsych),
                              SW: Sum(totals, SW),
                              Diet: Sum(totals, Diet),
                              SP_Consult: CountIf(totals, SP_IsConsult) > 0,
                              NeuroPsych_Consult: CountIf(totals, NeuroPsych_IsConsult) > 0
                          }
                      )
                  )
              );
              // 3) Rows for the popup ("Consult" only when the total is zero)
              ClearCollect(
                  colWardStaffingLines,
                  With(
                      { s: First(colWardStaffingRecommended) },
                      Table(
                          { Sort: 1, Discipline: "Physio", Recommended: Round(s.PT, 2), Note: "" },
                          { Sort: 2, Discipline: "OT", Recommended: Round(s.OT, 2), Note: "" },
                          { Sort: 3, Discipline: "Allied Health Assistant", Recommended: Round(s.AHA, 2), Note: "" },
                          { Sort: 4, Discipline: "Speech Pathology", Recommended: Round(s.SP, 2), Note: If(s.SP = 0 && s.SP_Consult, "Consult", "") },
                          { Sort: 5, Discipline: "Clinical Psych", Recommended: Round(s.ClinPsych, 2), Note: "" },
                          { Sort: 6, Discipline: "Neuro Psych", Recommended: Round(s.NeuroPsych, 2), Note: If(s.NeuroPsych = 0 && s.NeuroPsych_Consult, "Consult", "") },
                          { Sort: 7, Discipline: "Social Work", Recommended: Round(s.SW, 2), Note: "" },
                          { Sort: 8, Discipline: "Dietitian", Recommended: Round(s.Diet, 2), Note: "" }
                      )
                  )
              );
              Set(locShowStaffing, true)
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
