          Children:
            - lblList_Av:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(14, 28, 42, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =28 * SY
                  Size: =Round(16 * SF, 0)
                  Text: ="Available now  ·  " & CountRows(Gallery_Available.AllItems)
                  Width: =500 * SX
                  X: =20 * SX
                  Y: =16 * SY
            - Gallery_Available:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  Height: =598 * SY
                  Items: |-
                    =With(
                        {
                            typeFilter:   ddType_Av.Selected.Value,
                            wcTypeFilter: ddWCType_Av.Selected.Value,
                            widthFilter:  ddWidth_Av.Selected.Value,
                            depthFilter:  ddDepth_Av.Selected.Value,
                            heightFilter: ddHeight_Av.Selected.Value,
                            codeFilter:   Lower(Trim(txtCode_Av.Text)),
                            serviceOnly:  chkService_Av.Value
                        },
                        SortByColumns(
                            AddColumns(
                                Filter(
                                    Equipment_Inventory_SharePoint,
                                    Status.Value = "Available",
                                    ( typeFilter   = "All" || Category.Value          = typeFilter ),
                                    ( wcTypeFilter = "All" || 'Wheelchair Type'.Value = wcTypeFilter ),
                                    ( widthFilter  = "All" || Width.Value             = widthFilter ),
                                    ( depthFilter  = "All" || Depth.Value             = depthFilter ),
                                    ( heightFilter = "All" || Height.Value            = heightFilter ),
                                    ( IsBlank(codeFilter)  || codeFilter in Lower(Coalesce(Title, "")) ),
                                    ( !serviceOnly         || Coalesce(TotalDaysSignedOut, 0) > 100 )
                                ),
                                // helper text columns for sorting
                                _CategoryText, Category.Value,
                                _CodeText,     Title
                            ),
                            "_CategoryText", SortOrder.Ascending,
                            "_CodeText",     SortOrder.Ascending
                        )
                    )
                  TemplatePadding: =0
                  TemplateSize: =120 * SY
                  Width: =590 * SX
                  Y: =54 * SY
                Children:
                  - Av_Row:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =If(avSelected.ID = ThisItem.ID, RGBA(26, 90, 153, 1), RGBA(14, 42, 70, 0.12))
                        BorderThickness: =If(avSelected.ID = ThisItem.ID, 2, 1)
                        DropShadow: =DropShadow.None
                        Fill: =If(avSelected.ID = ThisItem.ID, RGBA(26, 90, 153, 0.08), RGBA(244, 249, 252, 1))
                        Height: =112 * SY
                        RadiusBottomLeft: =14 * SR
                        RadiusBottomRight: =14 * SR
                        RadiusTopLeft: =14 * SR
                        RadiusTopRight: =14 * SR
                        Width: =Parent.TemplateWidth - 20 * SX
                        X: =10 * SX
                        Y: =4 * SY
                      Children:
                        - conBar_Av:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =Switch(ThisItem.Category.Value, "Wheelchair", RGBA(166, 199, 130, 1), "Cushion", RGBA(0, 144, 153, 1), "Backrest", RGBA(0, 200, 210, 1), RGBA(210, 218, 227, 1))
                              Height: =Parent.Height
                              RadiusBottomLeft: =14 * SR
                              RadiusBottomRight: =0
                              RadiusTopLeft: =14 * SR
                              RadiusTopRight: =0
                              Width: =8 * SX
                        - lblRow1_Av:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(14, 28, 42, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =46 * SY
                              Size: =Round(15 * SF, 0)
                              Text: =ThisItem.Brand & " " & ThisItem.Model
                              Width: =Parent.Width - 200 * SX
                              X: =26 * SX
                              Y: =8 * SY
                        - conChip_Av:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =Switch(ThisItem.Category.Value, "Wheelchair", RGBA(166, 199, 130, 1), "Cushion", RGBA(0, 144, 153, 1), "Backrest", RGBA(0, 200, 210, 1), RGBA(210, 218, 227, 1))
                              Height: =20 * SY
                              RadiusBottomLeft: =10 * SR
                              RadiusBottomRight: =10 * SR
                              RadiusTopLeft: =10 * SR
                              RadiusTopRight: =10 * SR
                              Width: =110 * SX
                              X: =26 * SX
                              Y: =60 * SY
                            Children:
                              - lblChip_Av:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(14, 28, 42, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =20 * SY
                                    Size: =Round(11 * SF, 0)
                                    Text: =Coalesce(ThisItem.Category.Value, "-")
                                    Width: =Parent.Width
                        - lblBar_Av:
