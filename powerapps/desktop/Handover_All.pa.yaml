            - Gallery_Handover:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  Height: =606 * SY
                  Items: =Filter(colWard, !IsBlank(Trim(Patient)))
                  TemplatePadding: =0
                  TemplateSize: =96 * SY
                  Width: =1333 * SX
                  Y: =44 * SY
                Children:
                  - Ho_Row:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =If(ThisItem.IsDirty, RGBA(245, 176, 0, 1), RGBA(14, 42, 70, 0.12))
                        BorderThickness: =If(ThisItem.IsDirty, 2, 1)
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(244, 249, 252, 1)
                        Height: =88 * SY
                        RadiusBottomLeft: =14 * SR
                        RadiusBottomRight: =14 * SR
                        RadiusTopLeft: =14 * SR
                        RadiusTopRight: =14 * SR
                        Width: =Parent.TemplateWidth - 16 * SX
                        X: =8 * SX
                        Y: =4 * SY
                      Children:
                        - lblBed_Ho:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(14, 28, 42, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =88 * SY
                              Size: =Round(20 * SF, 0)
                              Text: =ThisItem.Bed
                              Width: =64 * SX
                              X: =8 * SX
                        - lblPatient_Ho:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(18, 64, 112, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =28 * SY
                              OnSelect: |-
                                =If(
                                    ThisItem.IsDirty || !IsEmpty(Filter(colWard, IsDirty)),
                                    Notify(
                                        "Please Save (or Discard) your handover changes before opening a patient.",
                                        NotificationType.Warning
                                    ),
                                    // open the full SharePoint row for this patient
                                    If(varWard = "4A", Set(varSelectedPatient, LookUp(Ward_4A_Shared, ID = ThisItem.ID)));
                                    If(varWard = "4B", Set(varSelectedPatient, LookUp(Ward_4B_Shared, ID = ThisItem.ID)));
                                    If(varWard = "5A", Set(varSelectedPatient, LookUp(Ward_5A_Shared, ID = ThisItem.ID)));
                                    If(varWard = "6A", Set(varSelectedPatient, LookUp(Ward_6A_Shared, ID = ThisItem.ID)));
                                    Set(varSelectedList, "Ward_" & varWard & "_Shared");
                                    Set(varWardCode, varWard);
                                    Navigate(Patient_Detail_Screen, ScreenTransition.Fade)
                                )
                              Size: =Round(16 * SF, 0)
                              Text: =ThisItem.Patient
                              Width: =236 * SX
                              X: =84 * SX
                              Y: =8 * SY
