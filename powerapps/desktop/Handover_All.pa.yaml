                Properties:
                  Fill: =RGBA(244, 249, 252, 1)
                  Height: =40 * SY
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =18 * SR
                  RadiusTopRight: =18 * SR
                  Width: =1333 * SX
                Children:
                  - lblHeadBed_Ho:
                      Control: Label@2.5.1
