                        Height: =52 * SY
                        RadiusBottomLeft: =26 * SR
                        RadiusBottomRight: =26 * SR
                        RadiusTopLeft: =26 * SR
                        RadiusTopRight: =26 * SR
                        Width: =200 * SX
                        X: =326 * SX
                        Y: =190 * SY
                      Children:
                        - btnDiscardGo_Ho:
                            Control: Button@0.0.45
                            Properties:
