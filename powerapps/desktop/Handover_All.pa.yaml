Screens:
  Handover_All:
    Properties:
      Fill: =RGBA(235, 242, 248, 1)
      ImagePosition: =ImagePosition.Fill
      OnVisible: |-
        =// =======================================================
        // WARD HANDOVER – one screen for 4A / 4B / 5A / 6A
        // Opened from Ward_All (varWard is already set there).
        // Works on the SAME colWard the ward screen loaded.
        //   Morning Handover = daily     Case Conference Handover = weekly
        // =======================================================
        If(IsBlank(varWard), Set(varWard, "4A"));
        Set(hoShowDiscard, false);
        Set(hoIsSaving, false);
        Set(hoPulseOn, false);
        // Pull the latest handover notes from SharePoint (other people may have edited)
        Select(btnReload_Ho)
    Children:
      - btnReload_Ho:
          Control: Button@0.0.45
          Properties:
            FontSize: =Round(14 * SF, 0)
            Height: =10 * SY
            OnSelect: |-
              =// =======================================================
              // RELOAD HANDOVER NOTES (OnVisible + Discard)
              // Only the two note columns are refreshed into colWard.
              // =======================================================
              If(
                  varWard = "4A",
                  Refresh(Ward_4A_Shared);
                  ForAll(
                      Ward_4A_Shared As s,
                      If(
                          !IsBlank(LookUp(colWard, ID = s.ID)),
                          Patch(
                              colWard,
                              LookUp(colWard, ID = s.ID),
                              {
                                  'Morning Handover': s.'Morning Handover',
                                  'CC Handover': s.'CC Handover',
                                  IsDirty: false
                              }
                          )
                      )
                  ),
                  varWard = "4B",
                  Refresh(Ward_4B_Shared);
                  ForAll(
                      Ward_4B_Shared As s,
                      If(
                          !IsBlank(LookUp(colWard, ID = s.ID)),
                          Patch(
                              colWard,
                              LookUp(colWard, ID = s.ID),
                              {
                                  'Morning Handover': s.'Morning Handover',
                                  'CC Handover': s.'CC Handover',
                                  IsDirty: false
                              }
                          )
                      )
                  ),
                  varWard = "5A",
                  Refresh(Ward_5A_Shared);
                  ForAll(
                      Ward_5A_Shared As s,
                      If(
                          !IsBlank(LookUp(colWard, ID = s.ID)),
                          Patch(
                              colWard,
                              LookUp(colWard, ID = s.ID),
                              {
                                  'Morning Handover': s.'Morning Handover',
                                  'CC Handover': s.'CC Handover',
                                  IsDirty: false
                              }
                          )
                      )
                  ),
                  Refresh(Ward_6A_Shared);
                  ForAll(
                      Ward_6A_Shared As s,
                      If(
                          !IsBlank(LookUp(colWard, ID = s.ID)),
                          Patch(
                              colWard,
                              LookUp(colWard, ID = s.ID),
                              {
                                  'Morning Handover': s.'Morning Handover',
                                  'CC Handover': s.'CC Handover',
                                  IsDirty: false
                              }
                          )
                      )
                  )
              )
            Text: ="Reload"
            Visible: =false
            Width: =10 * SX
      - Ho_Title:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.Regular
            Fill: =RGBA(7, 95, 115, 1)
            Height: =70 * SY
            RadiusBottomLeft: =18 * SR
            RadiusBottomRight: =18 * SR
            RadiusTopLeft: =18 * SR
            RadiusTopRight: =18 * SR
            Width: =1333 * SX
            X: =18 * SX
            Y: =12 * SY
          Children:
            - imgHeaderGradient_Ho:
                Control: Image@2.2.3
                Properties:
                  Height: =Parent.Height
                  Image: ="data:image/svg+xml;utf8," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' width='1333' height='70' viewBox='0 0 1333 70' preserveAspectRatio='none'><defs><linearGradient id='a' x1='0' y1='0' x2='1' y2='0'><stop offset='0' stop-color='#001D46'/><stop offset='0.48' stop-color='#075F73'/><stop offset='1' stop-color='#00838A'/></linearGradient><linearGradient id='b' x1='0' y1='0' x2='1' y2='0'><stop offset='0' stop-color='#001B36' stop-opacity='0.46'/><stop offset='0.45' stop-color='#002036' stop-opacity='0.18'/><stop offset='1' stop-color='#002036' stop-opacity='0.06'/></linearGradient></defs><rect width='1333' height='70' rx='18' fill='url(#a)'/><rect width='1333' height='70' rx='18' fill='url(#b)'/></svg>")
                  ImagePosition: =ImagePosition.Fill
                  Width: =Parent.Width
            - TextCanvas_HoTitle:
                Control: Text@0.0.51
                Properties:
                  Y: =8 * SY
                  Font: =Font.'Segoe UI'
                  FontColor: =RGBA(255, 255, 255, 1)
                  Height: =44 * SY
                  Size: =Round(28 * SF, 0)
                  Text: ="Ward " & varWard & " Handover"
                  VerticalAlign: =VerticalAlign.Middle
                  Weight: ='TextCanvas.Weight'.Bold
                  Width: =480 * SX
                  X: =76 * SX
            - TextCanvas_HoSub:
                Control: Text@0.0.51
                Properties:
                  Font: =Font.'Segoe UI'
                  FontColor: =RGBA(255, 255, 255, 0.88)
                  Height: =20 * SY
                  Size: =Round(12 * SF, 0)
                  Text: =CountRows(Filter(colWard, !IsBlank(Trim(Patient)))) & " patients  ·  Morning Handover  ·  Case Conference"
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =480 * SX
                  X: =76 * SX
                  Y: =42 * SY
            - btnBack_Ho:
                Control: Button@0.0.45
                Properties:
                  Width: =96 * SX
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  FontColor: =RGBA(255, 255, 255, 1)
                  FontSize: =Round(50 * SF, 0)
                  Height: =70 * SY
                  Icon: ="ChevronLeft"
                  OnSelect: |-
                    =If(
                        !IsEmpty(Filter(colWard, IsDirty)),
                        Notify(
                            "You have unsaved handover changes. Please Save or Discard before leaving.",
                            NotificationType.Warning
                        ),
                        Back(ScreenTransition.Fade)
                    )
                  Text: =""
                  X: =1 * SX
            - conSave_Ho:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =If(hoPulseOn, RGBA(255, 210, 74, 1), RGBA(255, 255, 255, 0.4))
                  BorderThickness: =If(hoPulseOn, 3, 1)
                  DropShadow: =DropShadow.Regular
                  Fill: =If(hoPulseOn, RGBA(18, 150, 100, 1), RGBA(12, 122, 82, 1))
                  Height: =46 * SY
                  RadiusBottomLeft: =23 * SR
                  RadiusBottomRight: =23 * SR
                  RadiusTopLeft: =23 * SR
                  RadiusTopRight: =23 * SR
                  Visible: =!IsEmpty(Filter(colWard, IsDirty))
                  Width: =100 * SX
                  X: =570 * SX
                  Y: =12 * SY
                Children:
                  - btnSave_Ho:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Transparent
                        BorderRadius: =23 * SR
                        BorderStyle: =BorderStyle.None
                        DisplayMode: =If(hoIsSaving, DisplayMode.Disabled, DisplayMode.Edit)
                        Font: =Font.'Segoe UI'
                        FontColor: =RGBA(255, 255, 255, 1)
                        FontSize: =Round(14 * SF, 0)
                        FontWeight: =FontWeight.Bold
                        Height: =46 * SY
                        Icon: ="Save"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        Layout: ='ButtonCanvas.Layout'.IconBefore
                        OnSelect: |-
                          =// ======================================
                          // SAVE HANDOVER NOTES (any ward)
                          // Only Morning Handover + CC Handover are written.
                          // ======================================
                          If(
                              IsEmpty(Filter(colWard, IsDirty)),
                              Notify("No handover changes to save.", NotificationType.Information),
                              Set(hoIsSaving, true);
                              Clear(colWardSaveErrors);
                              Set(hoPulseOn, true);
                              Reset(Timer_Pulse_Ho);
                              ForAll(
                                  Filter(colWard, IsDirty) As w,
                                  Switch(
                                      varWard,
                                      "4A",
                                          With(
                                              {
                                                  spRow:
                                                      Patch(
                                                          Ward_4A_Shared,
                                                          LookUp(Ward_4A_Shared, ID = w.ID),
                                                          {
                                                              'Morning Handover': w.'Morning Handover',
                                                              'CC Handover': w.'CC Handover'
                                                          }
                                                      )
                                              },
                                              If(
                                                  !IsEmpty(Errors(Ward_4A_Shared, spRow)),
                                                  Collect(
                                                      colWardSaveErrors,
                                                      {
                                                          LocalID: w.ID,
                                                          SavedID: spRow.ID,
                                                          Patient: w.Patient,
                                                          Message: First(Errors(Ward_4A_Shared, spRow)).Message
                                                      }
                                                  ),
                                                  Patch(colWard, w, { IsDirty: false })
                                              )
                                          ),
                                      "4B",
                                          With(
                                              {
                                                  spRow:
                                                      Patch(
                                                          Ward_4B_Shared,
                                                          LookUp(Ward_4B_Shared, ID = w.ID),
                                                          {
                                                              'Morning Handover': w.'Morning Handover',
                                                              'CC Handover': w.'CC Handover'
                                                          }
                                                      )
                                              },
                                              If(
                                                  !IsEmpty(Errors(Ward_4B_Shared, spRow)),
                                                  Collect(
                                                      colWardSaveErrors,
                                                      {
                                                          LocalID: w.ID,
                                                          SavedID: spRow.ID,
                                                          Patient: w.Patient,
                                                          Message: First(Errors(Ward_4B_Shared, spRow)).Message
                                                      }
                                                  ),
                                                  Patch(colWard, w, { IsDirty: false })
                                              )
                                          ),
                                      "5A",
                                          With(
                                              {
                                                  spRow:
                                                      Patch(
                                                          Ward_5A_Shared,
                                                          LookUp(Ward_5A_Shared, ID = w.ID),
                                                          {
                                                              'Morning Handover': w.'Morning Handover',
                                                              'CC Handover': w.'CC Handover'
                                                          }
                                                      )
                                              },
                                              If(
                                                  !IsEmpty(Errors(Ward_5A_Shared, spRow)),
                                                  Collect(
                                                      colWardSaveErrors,
                                                      {
                                                          LocalID: w.ID,
                                                          SavedID: spRow.ID,
                                                          Patient: w.Patient,
                                                          Message: First(Errors(Ward_5A_Shared, spRow)).Message
                                                      }
                                                  ),
                                                  Patch(colWard, w, { IsDirty: false })
                                              )
                                          ),
                                      With(
                                          {
                                              spRow:
                                                  Patch(
                                                      Ward_6A_Shared,
                                                      LookUp(Ward_6A_Shared, ID = w.ID),
                                                      {
                                                          'Morning Handover': w.'Morning Handover',
                                                          'CC Handover': w.'CC Handover'
                                                      }
                                                  )
                                          },
                                          If(
                                              !IsEmpty(Errors(Ward_6A_Shared, spRow)),
                                              Collect(
                                                  colWardSaveErrors,
                                                  {
                                                      LocalID: w.ID,
                                                      SavedID: spRow.ID,
                                                      Patient: w.Patient,
                                                      Message: First(Errors(Ward_6A_Shared, spRow)).Message
                                                  }
                                              ),
                                              Patch(colWard, w, { IsDirty: false })
                                          )
                                      )
                                  )
                              );
                              If(
                                  CountRows(colWardSaveErrors) > 0,
                                  Set(hoIsSaving, false);
                                  Set(hoPulseOn, false);
                                  Reset(Timer_Pulse_Ho);
                                  Notify(
                                      "Some notes failed to save (" & CountRows(colWardSaveErrors) & "). Unsaved changes remain.",
                                      NotificationType.Error
                                  ),
                                  Set(hoIsSaving, false);
                                  Set(hoPulseOn, false);
                                  Reset(Timer_Pulse_Ho);
                                  Notify("Handover saved.", NotificationType.Success)
                              )
                          )
                        Text: ="Save"
                        Width: =100 * SX
            - conDiscard_Ho:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.Regular
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =46 * SY
                  RadiusBottomLeft: =23 * SR
                  RadiusBottomRight: =23 * SR
                  RadiusTopLeft: =23 * SR
                  RadiusTopRight: =23 * SR
                  Visible: =!IsEmpty(Filter(colWard, IsDirty))
                  Width: =120 * SX
                  X: =680 * SX
                  Y: =12 * SY
                Children:
                  - btnDiscard_Ho:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Transparent
                        BorderRadius: =23 * SR
                        Font: =Font.'Segoe UI'
                        FontColor: =RGBA(180, 26, 26, 1)
                        FontSize: =Round(14 * SF, 0)
                        FontWeight: =FontWeight.Bold
                        Height: =46 * SY
                        Icon: ="DismissCircle"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        Layout: ='ButtonCanvas.Layout'.IconBefore
                        OnSelect: =Set(hoShowDiscard, true)
                        Text: ="Discard"
                        Width: =120 * SX
      - Ho_Card:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
