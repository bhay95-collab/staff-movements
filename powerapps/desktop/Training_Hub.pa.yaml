Screens:
  Training_Hub:
    Properties:
      Fill: =RGBA(235, 242, 248, 1)
      ImagePosition: =ImagePosition.Fill
      OnVisible: =Select(btnLoad_Trh)
    Children:
      - btnLoad_Trh:
          Control: ModernButton@1.0.0
          Properties:
            Align: =Align.Center
            FontWeight: =""
            Height: =10 * SY
            OnSelect: |-
              =Set(trLoading, true);
              Refresh(TrainingSessions);
              Refresh(TrainingBookings);
              Refresh(TrainingWaitlist);
              ClearCollect(
                  colThBookings,
                  Filter(TrainingBookings, BookingStatus.Value = "Booked" && SessionDate >= Today())
              );
              ClearCollect(
                  colThWait,
                  Filter(TrainingWaitlist, WaitlistStatus.Value = "Waiting" && WaitlistUserEmail = MeEmail)
              );
              ClearCollect(
                  colThSessions,
                  AddColumns(
                      AddColumns(
                          SortByColumns(
                              Filter(TrainingSessions, IsActive = true && SessionDate >= Today()),
                              "SessionDate",
                              SortOrder.Ascending
                          ),
                          SesKey, Text(ID),
                          TypeText, TrainingType.Value,
                          CapV, Coalesce(Capacity, If(TrainingType.Value = "Manual Handling", 8, 6))
                      ),
                      Booked, CountRows(Filter(colThBookings, SessionID = SesKey)),
                      Free, CapV - CountRows(Filter(colThBookings, SessionID = SesKey)),
                      MyBookingID, LookUp(colThBookings, SessionID = SesKey && Lower(BookedUserEmail) = MeEmail).ID,
                      OnWait, CountRows(Filter(colThWait, SessionID = SesKey)) > 0
                  )
              );
              ClearCollect(
                  colThMine,
                  SortByColumns(
                      Filter(colThBookings, Lower(BookedUserEmail) = MeEmail),
                      "SessionDate",
                      SortOrder.Ascending
                  )
              );
              Set(trLoading, false)
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =Round(14 * SF, 0)
            Text: =""
            VerticalAlign: =VerticalAlign.Middle
            Visible: =false
            Width: =10 * SX
