Screens:
  Audit_Coverage:
    Properties:
      Fill: =RGBA(235, 242, 248, 1)
      ImagePosition: =ImagePosition.Fill
      OnVisible: |-
        =// Audit coverage. Loads 12 months of audits + stock, Select(btnBuild_Ac) builds every list.
        Set(acThr, 60);
        Set(acPeriod, 90);
        Set(acScope, "Allocated");
        Set(acCat, "All");
        Set(acWard, "All");
        Set(acQ, "");
        Set(acTab, "To");
        Set(acShowDetail, false);
        Set(acKpi, {Scope: 0, Covered: 0, Pct: 0, Never: 0, Overdue: 0, Pass: 0, Unesc: 0});
        ClearCollect(colAcCats, Table({ Value: "All categories" }, { Value: "Wheelchair" }, { Value: "Cushion" }, { Value: "Backrest" }));
        ClearCollect(colAcWardOpts, Table({ Value: "All wards" }));
        Collect(colAcWardOpts, SortByColumns(Choices(Equipment_Inventory_SharePoint.Ward), "Value", SortOrder.Ascending));
        Select(btnLoad_Ac)
    Children:
      - btnLoad_Ac:
          Control: ModernButton@1.0.0
          Properties:
            Align: =Align.Center
            FontWeight: =""
            Height: =10 * SY
            OnSelect: |-
              =Set(acLoading, true);
              // audits for the last 12 months, in 30-day slices so each request stays under the row limit
              Clear(colAcAud);
              ForAll(
                  Sequence(13) As c,
                  Collect(
                      colAcAud,
                      Filter(
                          Equipment_Audits,
                          AuditDateTime >= DateAdd(Today(), -(c.Value * 30) + 1, TimeUnit.Days) &&
                          AuditDateTime < DateAdd(Today(), -((c.Value - 1) * 30) + 1, TimeUnit.Days)
                      )
                  )
              );
              // stock today
              ClearCollect(
                  colAcInv,
                  AddColumns(
                      Equipment_Inventory_SharePoint,
                      iCat, Coalesce(Category.Value, ""),
                      iType, If(Category.Value = "Wheelchair", Coalesce('Wheelchair Type'.Value, ""), ""),
                      iWidth, Coalesce(Width.Value, ""),
                      iStatus, Coalesce(Status.Value, ""),
                      iWard, Coalesce(Ward.Value, ""),
                      iDesc, Trim(Brand & " " & Model)
                  )
              );
              Set(acLoading, false);
              Select(btnBuild_Ac)
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =Round(14 * SF, 0)
            Text: =""
            VerticalAlign: =VerticalAlign.Middle
            Visible: =false
            Width: =10 * SX
      - btnBuild_Ac:
          Control: ModernButton@1.0.0
          Properties:
            Align: =Align.Center
            FontWeight: =""
            Height: =10 * SY
            OnSelect: |-
              =// 1) audits tagged with the item they belong to
              ClearCollect(
                  colAcJ,
                  AddColumns(
                      colAcAud,
                      EquipId, Equipment.Id,
                      aPass, AuditOutcome.Value = "Pass",
                      aWardName, Coalesce(ActualWard.Value, "Unknown"),
                      aCat, Coalesce(LookUp(colAcInv, ID = Equipment.Id).iCat, "Unknown")
                  )
              );
              // 2) last audit per item
              ClearCollect(
                  colAcLast,
                  AddColumns(
                      GroupBy(colAcJ, EquipId, Rows),
                      LastDate, Max(Rows, AuditDateTime),
                      Times, CountRows(Rows),
                      LastOutcome, First(SortByColumns(Rows, "AuditDateTime", SortOrder.Descending)).AuditOutcome.Value
                  )
              );
              // 3) every item in scope with how long since it was last checked
              ClearCollect(
                  colAcItems,
                  AddColumns(
                      Filter(
                          colAcInv,
                          IsActive <> false && OutOfService <> true &&
                          If(acScope = "Allocated", iStatus = "Allocated", iStatus in ["Allocated", "Available"]) &&
                          (acCat = "All" || iCat = acCat) && (acWard = "All" || iWard = acWard) && (acQ = "" || acQ in Lower(Title) || acQ in Lower(iDesc))
                      ),
                      LastDate, LookUp(colAcLast, EquipId = ID).LastDate,
                      LastOutcome, LookUp(colAcLast, EquipId = ID).LastOutcome,
                      SinceDays, If(IsBlank(LookUp(colAcLast, EquipId = ID).LastDate), 9999, DateDiff(LookUp(colAcLast, EquipId = ID).LastDate, Today(), TimeUnit.Days))
                  )
              );
              ClearCollect(
                  colAcTo,
                  SortByColumns(
                      Filter(colAcItems, SinceDays > acThr),
                      "SinceDays", SortOrder.Descending
                  )
              );
              // 4) audits inside the pass-rate period
              ClearCollect(colAcP, Filter(colAcJ, AuditDateTime >= DateAdd(Today(), -(acPeriod - 1), TimeUnit.Days)));
              ClearCollect(
                  colAcByCat,
                  SortByColumns(
                      AddColumns(
                          GroupBy(AddColumns(colAcP, CatKey, aCat), CatKey, Rows),
                          Audits, CountRows(Rows),
                          Passed, CountRows(Filter(Rows, aPass)),
                          Pct, Round(100 * CountRows(Filter(Rows, aPass)) / CountRows(Rows), 0)
                      ),
                      "Audits", SortOrder.Descending
                  )
              );
              ClearCollect(
                  colAcByWard,
                  SortByColumns(
                      AddColumns(
                          GroupBy(AddColumns(colAcP, WardKey, aWardName), WardKey, Rows),
                          Audits, CountRows(Rows),
                          Passed, CountRows(Filter(Rows, aPass)),
                          Pct, Round(100 * CountRows(Filter(Rows, aPass)) / CountRows(Rows), 0)
                      ),
                      "Audits", SortOrder.Descending
                  )
              );
              // 5) failed audits nobody has been told about
              ClearCollect(
                  colAcUnesc,
                  SortByColumns(Filter(colAcP, EscalationRequired = true && EscalationSent <> true), "AuditDateTime", SortOrder.Descending)
              );
              // 6) headline numbers
              Set(
                  acKpi,
                  {
                      Scope: CountRows(colAcItems),
                      Covered: CountRows(Filter(colAcItems, SinceDays <= acThr)),
                      Pct: If(CountRows(colAcItems) = 0, 0, Round(100 * CountRows(Filter(colAcItems, SinceDays <= acThr)) / CountRows(colAcItems), 0)),
                      Never: CountRows(Filter(colAcItems, SinceDays = 9999)),
                      Overdue: CountRows(Filter(colAcItems, SinceDays > acThr && SinceDays < 9999)),
                      Pass: If(CountRows(colAcP) = 0, 0, Round(100 * CountRows(Filter(colAcP, aPass)) / CountRows(colAcP), 0)),
                      Unesc: CountRows(colAcUnesc)
                  }
              )
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =Round(14 * SF, 0)
            Text: =""
            VerticalAlign: =VerticalAlign.Middle
            Visible: =false
            Width: =10 * SX
