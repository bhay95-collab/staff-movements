Screens:
  Handover_All:
    Properties:
      Fill: =RGBA(235, 242, 248, 1)
      ImagePosition: =ImagePosition.Fill
      OnVisible: |-
        =// =======================================================
        // WARD HANDOVER – one screen for 4A / 4B / 5A / 6A
        // Opened from Ward_All (varWard is already set there).
        // Works on the SAME colWard the ward screen loaded.
        //   Morning Handover = daily     Case Conference Handover = weekly
        // =======================================================

        If(IsBlank(varWard), Set(varWard, "4A"));

        Set(hoShowDiscard, false);
        Set(hoIsSaving, false);
        Set(hoPulseOn, false);

        // Pull the latest handover notes from SharePoint (other people may have edited)
        Select(btnReload_Ho)
    Children:
      - btnReload_Ho:
          Control: Button@0.0.45
          Properties:
            Height: =10
            Visible: =false
            Width: =10
            X: =0
            Y: =0
            Text: ="Reload"
            OnSelect: |-
              =// =======================================================
              // RELOAD HANDOVER NOTES (OnVisible + Discard)
              // Only the two note columns are refreshed into colWard.
              // =======================================================
              If(
                  varWard = "4A",
                  Refresh(Ward_4A_Shared);
                  ForAll(
                      Ward_4A_Shared As s,
                      If(
                          !IsBlank(LookUp(colWard, ID = s.ID)),
                          Patch(
                              colWard,
                              LookUp(colWard, ID = s.ID),
                              {
                                  'Morning Handover': s.'Morning Handover',
                                  'CC Handover': s.'CC Handover',
                                  IsDirty: false
                              }
                          )
                      )
                  ),
                  varWard = "4B",
                  Refresh(Ward_4B_Shared);
                  ForAll(
                      Ward_4B_Shared As s,
                      If(
                          !IsBlank(LookUp(colWard, ID = s.ID)),
                          Patch(
                              colWard,
                              LookUp(colWard, ID = s.ID),
                              {
                                  'Morning Handover': s.'Morning Handover',
                                  'CC Handover': s.'CC Handover',
                                  IsDirty: false
                              }
                          )
                      )
                  ),
                  varWard = "5A",
                  Refresh(Ward_5A_Shared);
                  ForAll(
                      Ward_5A_Shared As s,
                      If(
                          !IsBlank(LookUp(colWard, ID = s.ID)),
                          Patch(
                              colWard,
                              LookUp(colWard, ID = s.ID),
                              {
                                  'Morning Handover': s.'Morning Handover',
                                  'CC Handover': s.'CC Handover',
                                  IsDirty: false
                              }
                          )
                      )
                  ),
                  Refresh(Ward_6A_Shared);
                  ForAll(
                      Ward_6A_Shared As s,
                      If(
                          !IsBlank(LookUp(colWard, ID = s.ID)),
                          Patch(
                              colWard,
                              LookUp(colWard, ID = s.ID),
                              {
                                  'Morning Handover': s.'Morning Handover',
                                  'CC Handover': s.'CC Handover',
                                  IsDirty: false
                              }
                          )
                      )
                  )
              )
      - Ho_Title:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.Regular
            Fill: =RGBA(7, 95, 115, 1)
            Height: =70
            Width: =1333
            X: =18
            Y: =12
            RadiusBottomLeft: =18
            RadiusBottomRight: =18
            RadiusTopLeft: =18
            RadiusTopRight: =18
          Children:
            - imgHeaderGradient_Ho:
                Control: Image@2.2.3
                Properties:
                  Height: =Parent.Height
                  Image: ="data:image/svg+xml;utf8," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' width='1333' height='70' viewBox='0 0 1333 70' preserveAspectRatio='none'><defs><linearGradient id='a' x1='0' y1='0' x2='1' y2='0'><stop offset='0' stop-color='#001D46'/><stop offset='0.48' stop-color='#075F73'/><stop offset='1' stop-color='#00838A'/></linearGradient><linearGradient id='b' x1='0' y1='0' x2='1' y2='0'><stop offset='0' stop-color='#001B36' stop-opacity='0.46'/><stop offset='0.45' stop-color='#002036' stop-opacity='0.18'/><stop offset='1' stop-color='#002036' stop-opacity='0.06'/></linearGradient></defs><rect width='1333' height='70' rx='18' fill='url(#a)'/><rect width='1333' height='70' rx='18' fill='url(#b)'/></svg>")
                  ImagePosition: =ImagePosition.Fill
                  Width: =Parent.Width
            - TextCanvas_HoTitle:
