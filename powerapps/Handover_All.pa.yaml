                Properties:
                  Font: =Font.'Segoe UI'
                  FontColor: =RGBA(255, 255, 255, 1)
                  Height: =36
                  Size: =28
                  Text: ="Ward " & varWard & " Handover"
                  VerticalAlign: =VerticalAlign.Middle
                  Weight: ='TextCanvas.Weight'.Bold
                  Width: =480
                  X: =76
                  Y: =8
            - TextCanvas_HoSub:
                Control: Text@0.0.51
                Properties:
                  Font: =Font.'Segoe UI'
                  FontColor: =RGBA(255, 255, 255, 0.88)
                  Height: =20
                  Size: =12
                  Text: =CountRows(Filter(colWard, !IsBlank(Trim(Patient)))) & " patients  ·  Morning handover daily  ·  Case Conference weekly"
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =480
                  X: =76
                  Y: =42
            - btnBack_Ho:
                Control: Button@0.0.45
                Properties:
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  FontColor: =RGBA(255, 255, 255, 1)
                  FontSize: =50
                  Height: =70
                  Icon: ="ChevronLeft"
                  Text: =""
                  X: =1
                  OnSelect: |-
                    =If(
                        !IsEmpty(Filter(colWard, IsDirty)),
                        Notify(
                            "You have unsaved handover changes. Please Save or Discard before leaving.",
                            NotificationType.Warning
                        ),
                        Back(ScreenTransition.Fade)
                    )
            - conSave_Ho:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =If(hoPulseOn, RGBA(255, 210, 74, 1), RGBA(255, 255, 255, 0.4))
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =If(hoPulseOn, 3, 1)
                  DropShadow: =DropShadow.Regular
                  Fill: =If(hoPulseOn, RGBA(18, 150, 100, 1), RGBA(12, 122, 82, 1))
                  Height: =46
                  Visible: =!IsEmpty(Filter(colWard, IsDirty))
                  Width: =100
                  X: =570
                  Y: =12
                  RadiusBottomLeft: =23
                  RadiusBottomRight: =23
                  RadiusTopLeft: =23
                  RadiusTopRight: =23
                Children:
                  - btnSave_Ho:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Transparent
                        BorderRadius: =23
                        BorderStyle: =BorderStyle.None
                        Font: =Font.'Segoe UI'
                        FontColor: =RGBA(255, 255, 255, 1)
                        FontSize: =14
                        FontWeight: =FontWeight.Bold
                        Height: =46
                        Icon: ="Save"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        Layout: ='ButtonCanvas.Layout'.IconBefore
                        DisplayMode: =If(hoIsSaving, DisplayMode.Disabled, DisplayMode.Edit)
                        OnSelect: |-
                          =// ======================================
                          // SAVE HANDOVER NOTES (any ward)
                          // Only Morning Handover + CC Handover are written.
                          // ======================================

                          If(
                              IsEmpty(Filter(colWard, IsDirty)),

                              Notify("No handover changes to save.", NotificationType.Information),

                              Set(hoIsSaving, true);
                              Clear(colWardSaveErrors);
                              Set(hoPulseOn, true);
                              Reset(Timer_Pulse_Ho);

                              ForAll(
                                  Filter(colWard, IsDirty) As w,
                                  Switch(
                                      varWard,
                                      "4A",
                                          With(
                                              {
                                                  spRow:
                                                      Patch(
                                                          Ward_4A_Shared,
                                                          LookUp(Ward_4A_Shared, ID = w.ID),
                                                          {
                                                              'Morning Handover': w.'Morning Handover',
                                                              'CC Handover': w.'CC Handover'
                                                          }
                                                      )
                                              },
                                              If(
                                                  !IsEmpty(Errors(Ward_4A_Shared, spRow)),
                                                  Collect(
                                                      colWardSaveErrors,
                                                      {
                                                          LocalID: w.ID,
                                                          SavedID: spRow.ID,
                                                          Patient: w.Patient,
                                                          Message: First(Errors(Ward_4A_Shared, spRow)).Message
                                                      }
                                                  ),
                                                  Patch(colWard, w, { IsDirty: false })
                                              )
                                          ),
                                      "4B",
                                          With(
                                              {
                                                  spRow:
                                                      Patch(
                                                          Ward_4B_Shared,
                                                          LookUp(Ward_4B_Shared, ID = w.ID),
                                                          {
                                                              'Morning Handover': w.'Morning Handover',
                                                              'CC Handover': w.'CC Handover'
                                                          }
                                                      )
                                              },
                                              If(
                                                  !IsEmpty(Errors(Ward_4B_Shared, spRow)),
                                                  Collect(
                                                      colWardSaveErrors,
                                                      {
                                                          LocalID: w.ID,
                                                          SavedID: spRow.ID,
                                                          Patient: w.Patient,
                                                          Message: First(Errors(Ward_4B_Shared, spRow)).Message
                                                      }
                                                  ),
                                                  Patch(colWard, w, { IsDirty: false })
                                              )
                                          ),
                                      "5A",
                                          With(
                                              {
                                                  spRow:
                                                      Patch(
                                                          Ward_5A_Shared,
                                                          LookUp(Ward_5A_Shared, ID = w.ID),
                                                          {
                                                              'Morning Handover': w.'Morning Handover',
                                                              'CC Handover': w.'CC Handover'
                                                          }
                                                      )
                                              },
                                              If(
                                                  !IsEmpty(Errors(Ward_5A_Shared, spRow)),
                                                  Collect(
                                                      colWardSaveErrors,
                                                      {
                                                          LocalID: w.ID,
                                                          SavedID: spRow.ID,
                                                          Patient: w.Patient,
                                                          Message: First(Errors(Ward_5A_Shared, spRow)).Message
                                                      }
                                                  ),
                                                  Patch(colWard, w, { IsDirty: false })
                                              )
                                          ),
                                      With(
                                          {
                                              spRow:
                                                  Patch(
                                                      Ward_6A_Shared,
                                                      LookUp(Ward_6A_Shared, ID = w.ID),
                                                      {
                                                          'Morning Handover': w.'Morning Handover',
                                                          'CC Handover': w.'CC Handover'
                                                      }
                                                  )
                                          },
                                          If(
                                              !IsEmpty(Errors(Ward_6A_Shared, spRow)),
                                              Collect(
                                                  colWardSaveErrors,
                                                  {
                                                      LocalID: w.ID,
                                                      SavedID: spRow.ID,
                                                      Patient: w.Patient,
                                                      Message: First(Errors(Ward_6A_Shared, spRow)).Message
                                                  }
                                              ),
                                              Patch(colWard, w, { IsDirty: false })
                                          )
                                      )
                                  )
                              );

                              If(
                                  CountRows(colWardSaveErrors) > 0,

                                  Set(hoIsSaving, false);
                                  Set(hoPulseOn, false);
                                  Reset(Timer_Pulse_Ho);
                                  Notify(
                                      "Some notes failed to save (" & CountRows(colWardSaveErrors) & "). Unsaved changes remain.",
                                      NotificationType.Error
                                  ),

                                  Set(hoIsSaving, false);
                                  Set(hoPulseOn, false);
                                  Reset(Timer_Pulse_Ho);
                                  Notify("Handover saved.", NotificationType.Success)
                              )
                          )
                        Text: ="Save"
                        Width: =100
            - conDiscard_Ho:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.Regular
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =46
