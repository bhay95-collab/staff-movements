                            Children:
                              - ddRowAccess_Ad:
                                  Control: Classic/DropDown@2.3.1
                                  Properties:
                                    BorderStyle: =BorderStyle.None
                                    ChevronBackground: =RGBA(26, 90, 153, 1)
                                    ChevronFill: =RGBA(255, 255, 255, 1)
                                    Color: =RGBA(14, 28, 42, 1)
