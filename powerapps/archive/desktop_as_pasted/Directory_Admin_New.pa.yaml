Screens:
  Directory_Admin_New:
    Properties:
      Fill: =RGBA(235, 242, 248, 1)
      ImagePosition: =ImagePosition.Fill
      OnVisible: |-
        =Set(
            varMeDirectory,
            LookUp(ClinicianDirectory, Lower(Person.Email) = Lower(User().Email))
        );
        If(
            IsBlank(varMeDirectory),
            Notify("Access denied: you are not in the Clinician Directory.", NotificationType.Error);
            Back(),
            !(varMeDirectory.Access.Value = "Director" || varMeDirectory.Access.Value = "Team Leader"),
            Notify("Access denied: Admin access required.", NotificationType.Error);
            Back(),
            Set(varAdminDiscipline, varMeDirectory.Discipline.Value);
            Set(varAdminAccess, varMeDirectory.Access.Value);
            Set(adShowRemove, false);
            // Cache staff for my discipline only
            ClearCollect(
                colDirectory,
                AddColumns(
                    Filter(ClinicianDirectory, Discipline.Value = varAdminDiscipline),
                    PersonName, Coalesce(Person.DisplayName, ""),
                    PersonEmail, Coalesce(Person.Email, ""),
                    AccessText, Coalesce(Access.Value, "")
                )
            );
            Select(btnPie_Ad)
        )
    Children:
      - btnPie_Ad:
          Control: Button@0.0.45
          Properties:
            Height: =10
            OnSelect: |-
              =With(
                  {
                      totalStaff:
                          CountRows(Distinct(Filter(colDirectory, !IsBlank(Access.Value)), Person.Email))
                  },
                  Clear(colAccessSummary);
                  ForAll(
                      Distinct(Filter(colDirectory, !IsBlank(Access.Value)), Access.Value) As a,
                      With(
                          {
                              staffCount:
                                  CountRows(Distinct(Filter(colDirectory, Access.Value = a.Value), Person.Email))
                          },
                          Collect(
                              colAccessSummary,
                              {
                                  Label: a.Value,
                                  Count: staffCount,
                                  Percentage: If(totalStaff = 0, 0, Round(staffCount * 100 / totalStaff, 0)),
                                  DisplayLabel:
                                      a.Value & " (" & staffCount & " | " &
                                      If(totalStaff = 0, 0, Round(staffCount * 100 / totalStaff, 0)) & "%)"
                              }
                          )
                      )
                  )
              )
            Text: =""
            Visible: =false
            Width: =10
      - Ad_Title:
