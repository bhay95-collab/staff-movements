            - conAddSave_Ad:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(26, 90, 153, 1)
                  BorderThickness: =1
                  Fill: =RGBA(26, 90, 153, 1)
                  Height: =40
                  RadiusBottomLeft: =20
                  RadiusBottomRight: =20
                  RadiusTopLeft: =20
                  RadiusTopRight: =20
                  Width: =298
                  X: =340
                  Y: =136
                Children:
                  - btnAddSave_Ad:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Transparent
                        BorderRadius: =20
                        Font: =Font.'Segoe UI'
                        FontColor: =RGBA(255, 255, 255, 1)
                        FontSize: =13
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        OnSelect: |-
                          =If(
                              IsBlank(cmbAddUser_Ad.Selected) || IsBlank(ddAddAccess_Ad.Selected.Value),
                              Notify("Select a user and access level.", NotificationType.Warning),
                              With(
                                  {
                                      newEmail: Lower(Trim(Coalesce(cmbAddUser_Ad.Selected.Mail, cmbAddUser_Ad.Selected.UserPrincipalName, ""))),
                                      newName: Coalesce(cmbAddUser_Ad.Selected.DisplayName, ""),
                                      newAccessText: ddAddAccess_Ad.Selected.Value
                                  },
                                  If(
                                      IsBlank(newEmail),
                                      Notify("A valid email address could not be found for this user.", NotificationType.Error),
                                      With(
                                          {
                                              already: LookUp(
                                                  ClinicianDirectory,
                                                  Lower(Trim(Coalesce(Person.Email, ""))) = newEmail &&
                                                  Discipline.Value = varAdminDiscipline
                                              )
                                          },
                                          If(
                                              !IsBlank(already),
                                              Notify(Coalesce(newName, "That user") & " is already listed in " & varAdminDiscipline & ".", NotificationType.Warning),
                                              Set(
                                                  varNewRow,
                                                  Patch(
                                                      ClinicianDirectory,
                                                      Defaults(ClinicianDirectory),
                                                      {
                                                          Person: {
                                                              '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                              Claims: "i:0#.f|membership|" & newEmail,
                                                              DisplayName: newName,
                                                              Email: newEmail,
                                                              Department: "",
                                                              JobTitle: "",
                                                              Picture: ""
                                                          },
                                                          Discipline: LookUp(Choices(ClinicianDirectory.Discipline), Value = varAdminDiscipline),
                                                          Access: LookUp(Choices(ClinicianDirectory.Access), Value = newAccessText)
                                                      }
                                                  )
                                              );
                                              If(
                                                  IsEmpty(Errors(ClinicianDirectory)),
                                                  Collect(
                                                      colDirectory,
                                                      Patch(
                                                          varNewRow,
                                                          {
                                                              PersonName: Coalesce(varNewRow.Person.DisplayName, newName),
                                                              PersonEmail: Coalesce(varNewRow.Person.Email, newEmail),
                                                              AccessText: Coalesce(varNewRow.Access.Value, newAccessText)
                                                          }
                                                      )
                                                  );
                                                  Select(btnPie_Ad);
                                                  Reset(cmbAddUser_Ad);
                                                  Reset(ddAddAccess_Ad);
                                                  Notify(newName & " added to " & varAdminDiscipline & ".", NotificationType.Success),
                                                  Notify("Could not add this person. Please try again.", NotificationType.Error)
                                              )
