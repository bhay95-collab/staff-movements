                        - conRetGo_Sv:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =C_Accent
                              Height: =48
                              Width: =(App.Width - 52) / 2
                              X: =(App.Width - 52) / 2 + 12
                              Y: =0
                              RadiusBottomLeft: =24
