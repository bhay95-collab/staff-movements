                            Children:
                              - conRetNo_Sv:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    BorderColor: =C_Line
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =C_White
                                    Height: =Round(60 * UI, 0)
                                    RadiusBottomLeft: =Round(30 * UI, 0)
                                    RadiusBottomRight: =Round(30 * UI, 0)
                                    RadiusTopLeft: =Round(30 * UI, 0)
                                    RadiusTopRight: =Round(30 * UI, 0)
                                    Width: =(SheetW - Round(65 * UI, 0)) / 2
                                  Children:
                                    - btnRetNo_Sv:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Align: =Align.Center
                                          Appearance: =ButtonAppearance.Transparent
                                          Color: =C_Ink2
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Bold
                                          Height: =Parent.Height
                                          OnSelect: =Set(svShowReturn, false)
                                          PaddingBottom: =5
                                          PaddingLeft: =12
                                          PaddingRight: =12
                                          PaddingTop: =5
                                          RadiusBottomLeft: =Round(30 * UI, 0)
                                          RadiusBottomRight: =Round(30 * UI, 0)
                                          RadiusTopLeft: =Round(30 * UI, 0)
                                          RadiusTopRight: =Round(30 * UI, 0)
                                          Size: =Round(18 * UI, 0)
                                          Text: ="Cancel"
                                          VerticalAlign: =VerticalAlign.Middle
                                          Width: =Parent.Width
                              - conRetGo_Sv:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    BorderColor: =C_Accent
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =C_Accent
                                    Height: =Round(60 * UI, 0)
                                    RadiusBottomLeft: =Round(30 * UI, 0)
                                    RadiusBottomRight: =Round(30 * UI, 0)
                                    RadiusTopLeft: =Round(30 * UI, 0)
                                    RadiusTopRight: =Round(30 * UI, 0)
                                    Width: =(SheetW - Round(65 * UI, 0)) / 2
                                    X: =(SheetW - Round(65 * UI, 0)) / 2 + Round(15 * UI, 0)
                                  Children:
                                    - btnRetGo_Sv:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Align: =Align.Center
                                          Appearance: =ButtonAppearance.Transparent
                                          Color: =C_White
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Bold
                                          Height: =Parent.Height
                                          OnSelect: |-
                                            =With(
                                                {
                                                    it: LookUp(Equipment_Inventory_SharePoint, ID = svItem.ID),
                                                    row: LookUp(Service_Log, EquipmentItemID = svItem.ID && ServiceStatus.Value = "In Service"),
                                                    outcome: ddOutcome_Sv.Selected.Value,
                                                    newLoc: Coalesce(ddLoc_Sv.Selected.Value, svItem.Location.Value, "")
                                                },
                                                With(
                                                    {
                                                        condemned: StartsWith(outcome, "Condemned"),
                                                        daysAway: If(IsBlank(row.SentDateTime), 0, Max(0, DateDiff(row.SentDateTime, Now(), TimeUnit.Days)))
                                                    },
                                                    With(
                                                        { resetDays: !condemned && Coalesce(row.ServiceType.Value, "Full service") = "Full service" },

                                                        // 1) the item
                                                        Patch(
                                                            Equipment_Inventory_SharePoint,
                                                            it,
                                                            {
                                                                Status: { Value: If(condemned, "Out of Service", "Available") },
                                                                OutOfService: condemned,
                                                                IsActive: !condemned,
                                                                TotalDaysSignedOut: If(resetDays, 0, Coalesce(it.TotalDaysSignedOut, 0)),
                                                                LastServiceDate: Today(),
                                                                Location: If(IsBlank(newLoc), it.Location, { Value: newLoc })
                                                            }
                                                        );

                                                        If(
                                                            !IsEmpty(Errors(Equipment_Inventory_SharePoint)),
                                                            Notify("Could not update the item. Please try again.", NotificationType.Error),

                                                            // 2) the service record (completed). If there is none (status set by hand), create a completed one.
                                                            If(
                                                                IsBlank(row),
                                                                Patch(
                                                                    Service_Log,
                                                                    Defaults(Service_Log),
                                                                    {
                                                                        Title: it.Title,
                                                                        EquipmentItemID: it.ID,
                                                                        Category: Coalesce(it.Category.Value, ""),
                                                                        Brand: Coalesce(it.Brand, ""),
                                                                        Model: Coalesce(it.Model, ""),
                                                                        Width: Coalesce(it.Width.Value, ""),
                                                                        ServiceType: { Value: "Other" },
                                                                        ServiceStatus: { Value: "Completed" },
                                                                        ReturnedDateTime: Now(),
                                                                        ReturnedByName: MeName,
                                                                        ReturnedByEmail: User().Email,
                                                                        Outcome: { Value: outcome },
                                                                        ReturnNotes: Trim(txtRetNotes_Sv.Text),
                                                                        SourceApp: { Value: "Mobile" }
                                                                    }
                                                                ),
                                                                Patch(
                                                                    Service_Log,
                                                                    row,
                                                                    {
                                                                        ServiceStatus: { Value: "Completed" },
                                                                        ReturnedDateTime: Now(),
                                                                        ReturnedByName: MeName,
                                                                        ReturnedByEmail: User().Email,
                                                                        Outcome: { Value: outcome },
                                                                        ReturnNotes: Trim(txtRetNotes_Sv.Text),
                                                                        DaysAtService: daysAway
                                                                    }
                                                                )
                                                            );
                                                            Set(svShowReturn, false);
                                                            Notify(
                                                                If(condemned, it.Title & " recorded as condemned (out of service).", it.Title & " is back in stock." & If(resetDays, " Days in use reset to 0.", "")),
                                                                If(condemned, NotificationType.Warning, NotificationType.Success)
                                                            );
                                                            Set(svItem, LookUp(Equipment_Inventory_SharePoint, ID = it.ID));
                                                            ClearCollect(colSvOpen, Filter(Service_Log, ServiceStatus.Value = "In Service"));
                                                            ClearCollect(colSvDue, Filter(Equipment_Inventory_SharePoint, Status.Value = "Available" && TotalDaysSignedOut > 100));
                                                            Reset(txtRetNotes_Sv)
                                                        )
                                                    )
                                                )
                                            )
                                          PaddingBottom: =5
                                          PaddingLeft: =12
                                          PaddingRight: =12
                                          PaddingTop: =5
                                          RadiusBottomLeft: =Round(30 * UI, 0)
                                          RadiusBottomRight: =Round(30 * UI, 0)
                                          RadiusTopLeft: =Round(30 * UI, 0)
                                          RadiusTopRight: =Round(30 * UI, 0)
                                          Size: =Round(18 * UI, 0)
                                          Text: ="Return to stock"
                                          VerticalAlign: =VerticalAlign.Middle
                                          Width: =Parent.Width
