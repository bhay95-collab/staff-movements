                        - conRetBtns_Sv:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Height: =Round(60 * UI, 0)
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =SheetW - Round(50 * UI, 0)
                              X: =Round(25 * UI, 0)
