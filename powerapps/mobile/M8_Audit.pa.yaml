                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =118
                        FillPortions: =0
                        Fill: =C_White
                        Height: =118
                        Width: =App.Width - 32
                        X: =0
                        Y: =0
                        RadiusBottomLeft: =16
                        RadiusBottomRight: =16
                        RadiusTopLeft: =16
                        RadiusTopRight: =16
                        BorderColor: =C_Line
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.Light
                        Visible: =!IsBlank(auItem)
                      Children:
                        - lblEqT_Au:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Ink
                              Size: =16
                              FontWeight: =FontWeight.Bold
                              Height: =24
                              Text: =auItem.Title & "  ·  " & Coalesce(Trim(auItem.Brand & " " & auItem.Model), "")
                              Width: =Parent.Width - 140
                              X: =16
                              Y: =12
                              Wrap: =false
                        - conEqSt_Au:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =If(Coalesce(auItem.Status.Value, "") = "Allocated", C_AccentSoft, C_Bg)
                              Height: =26
                              Width: =100
                              X: =Parent.Width - 116
                              Y: =12
                              RadiusBottomLeft: =13
                              RadiusBottomRight: =13
                              RadiusTopLeft: =13
                              RadiusTopRight: =13
                              DropShadow: =DropShadow.None
                            Children:
                              - lblEqSt_Au:
                                  Control: Label@2.5.1
                                  Properties:
                                    Font: =AppFont
                                    Color: =C_Ink2
                                    Size: =12
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    Text: =If(IsBlank(auItem.URN), "Unallocated", "Allocated")
                                    Width: =Parent.Width
                                    X: =0
                                    Y: =0
                                    Align: =Align.Center
                                    VerticalAlign: =VerticalAlign.Middle
                                    Wrap: =false
                        - capExp_Au:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Muted
                              Size: =11
                              FontWeight: =FontWeight.Bold
                              Height: =18
                              Text: ="EQUIPMENT RECORD SAYS"
                              Width: =Parent.Width - 32
                              X: =16
                              Y: =48
                              Wrap: =false
                        - lblExp_Au:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Ink2
                              Size: =15
                              FontWeight: =FontWeight.Bold
                              Height: =22
                              Text: =Coalesce(auItem.'Patient Name', "No patient")
                              Width: =Parent.Width - 32
                              X: =16
                              Y: =66
                              Wrap: =false
                        - lblExpS_Au:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Muted
                              Size: =12
                              Height: =18
                              Text: ="URN " & Coalesce(auItem.URN, "—") & "  ·  Ward " & Coalesce(auItem.Ward.Value, "—")
                              Width: =Parent.Width - 32
                              X: =16
                              Y: =88
                              Wrap: =false
                  - lblStep2_Au:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =22
                        FillPortions: =0
                        Font: =AppFont
                        Color: =C_Accent
                        Size: =12
                        FontWeight: =FontWeight.Bold
                        Height: =22
                        Text: ="2   PATIENT USING IT"
                        Width: =App.Width - 32
                        X: =0
                        Y: =0
                        VerticalAlign: =VerticalAlign.Bottom
                        Wrap: =false
                  - conPt_Au:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =48
                        FillPortions: =0
                        Fill: =C_White
                        Height: =48
