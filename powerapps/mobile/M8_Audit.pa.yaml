                              Width: =Parent.Width - 60
                              X: =16
                              Y: =0
                              VerticalAlign: =VerticalAlign.Middle
                              Wrap: =false
                        - lblTgCRisk_Au:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Danger
                              Size: =18
                              FontWeight: =FontWeight.Bold
                              Height: =Parent.Height
                              Text: =If(auRisk, "✓", "")
                              Width: =28
                              X: =Parent.Width - 44
                              Y: =0
                              Align: =Align.Right
                              VerticalAlign: =VerticalAlign.Middle
                        - btnTgRisk_Au:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Transparent
                              BorderStyle: =BorderStyle.None
                              Height: =Parent.Height
                              Width: =Parent.Width
                              X: =0
                              Y: =0
                              Text: =""
                              OnSelect: |-
                                =Set(auRisk, !auRisk);
                                Reset(ddCond_Au)
                  - conTgRem_Au:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =48
                        FillPortions: =0
                        Fill: =If(auRemoved, C_DangerBg, C_White)
                        Height: =48
                        Width: =App.Width - 32
                        X: =0
                        Y: =0
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        BorderColor: =If(auRemoved, C_Danger, C_Line)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =If(auRemoved, 2, 1)
                        DropShadow: =DropShadow.None
                      Children:
                        - lblTgRem_Au:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =If(auRemoved, C_Danger, C_Ink2)
                              Size: =15
                              FontWeight: =FontWeight.Bold
                              Height: =Parent.Height
                              Text: ="Removed from use"
                              Width: =Parent.Width - 60
                              X: =16
                              Y: =0
