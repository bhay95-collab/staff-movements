                      Children:
                        - lblMatch_Au:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =If((!IsBlank(Trim(Coalesce(auItem.URN, ""))) && Trim(Coalesce(auItem.URN, "")) = Trim(Coalesce(cmbPatient_Au.Selected.URN, ""))), C_Good, C_Danger)
                              Size: =14
                              FontWeight: =FontWeight.Bold
                              Height: =Parent.Height
