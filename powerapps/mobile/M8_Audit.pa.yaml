                  - conTgSafe_Au:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =48
                        FillPortions: =0
                        Fill: =If(auSafety, C_GoodBg, C_White)
                        Height: =48
                        Width: =App.Width - 32
                        X: =0
                        Y: =0
