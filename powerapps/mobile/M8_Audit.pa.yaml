Screens:
  Audit:
    Properties:
      Fill: =C_Bg
      OnVisible: |-
        =// Patients on all four wards (one shape for every ward)
        ClearCollect(
            colPatients,
            ForAll(
                Filter(Ward_4A_Shared, !IsBlank(Patient)) As r,
                {
                    ID: r.ID,
                    Ward: "4A",
                    Bed: r.Bed,
                    Name: r.Patient,
                    URN: r.URN,
                    DOB: r.DOB,
                    PT_Users: r.PT_Users,
                    Mine: !IsBlank(LookUp(Switch(MyDiscipline, "OT", r.OT_Users, "SP", r.SP_Users, r.PT_Users), Lower(Email) = MeEmail)),
                    DisplayText: r.Patient & "  ·  4A  ·  URN " & r.URN
                }
            )
        );
        Collect(
            colPatients,
            ForAll(
                Filter(Ward_4B_Shared, !IsBlank(Patient)) As r,
                {
                    ID: r.ID,
                    Ward: "4B",
                    Bed: r.Bed,
                    Name: r.Patient,
                    URN: r.URN,
                    DOB: r.DOB,
                    PT_Users: r.PT_Users,
                    Mine: !IsBlank(LookUp(Switch(MyDiscipline, "OT", r.OT_Users, "SP", r.SP_Users, r.PT_Users), Lower(Email) = MeEmail)),
                    DisplayText: r.Patient & "  ·  4B  ·  URN " & r.URN
                }
            )
        );
        Collect(
            colPatients,
            ForAll(
                Filter(Ward_5A_Shared, !IsBlank(Patient)) As r,
                {
                    ID: r.ID,
                    Ward: "5A",
                    Bed: r.Bed,
                    Name: r.Patient,
                    URN: r.URN,
                    DOB: r.DOB,
                    PT_Users: r.PT_Users,
                    Mine: !IsBlank(LookUp(Switch(MyDiscipline, "OT", r.OT_Users, "SP", r.SP_Users, r.PT_Users), Lower(Email) = MeEmail)),
                    DisplayText: r.Patient & "  ·  5A  ·  URN " & r.URN
                }
            )
        );
        Collect(
            colPatients,
            ForAll(
                Filter(Ward_6A_Shared, !IsBlank(Patient)) As r,
                {
                    ID: r.ID,
                    Ward: "6A",
                    Bed: r.Bed,
                    Name: r.Patient,
                    URN: r.URN,
                    DOB: r.DOB,
                    PT_Users: r.PT_Users,
                    Mine: !IsBlank(LookUp(Switch(MyDiscipline, "OT", r.OT_Users, "SP", r.SP_Users, r.PT_Users), Lower(Email) = MeEmail)),
                    DisplayText: r.Patient & "  ·  6A  ·  URN " & r.URN
                }
            )
        );

        // allocated items nobody has audited in the last 60 days, longest out first
        ClearCollect(
            colAuRecent,
            ShowColumns(Filter(Equipment_Audits, AuditDateTime >= DateAdd(Today(), -60, TimeUnit.Days)), "Barcode")
        );
        ClearCollect(
            colAuNext,
            FirstN(
                Sort(
                    Filter(Equipment_Inventory_SharePoint, Status.Value = "Allocated" && IsBlank(LookUp(colAuRecent, Barcode = Title))),
                    'Date Signed Out',
                    SortOrder.Ascending
                ),
                5
            )
        );

        Set(auItem, Blank());
        Select(btnResetChecks_Au)
    Children:
      - btnResetChecks_Au:
          Control: Button@0.0.45
          Properties:
            Height: =1
            Width: =1
            X: =0
            Y: =0
            Text: =""
            Visible: =false
            OnSelect: |-
              =Set(auPt, Blank());
              Reset(txtPt_Au);
              Reset(ddCond_Au);
              Reset(txtComments_Au);
              Reset(txtEquip_Au);
              Set(auSafety, false);
              Set(auTag, "");
              Set(auRisk, false);
              Set(auRemoved, false)
      - conRoot_Au:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =C_Bg
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutJustifyContent: =LayoutJustifyContent.Start
            LayoutGap: =0
