                  - conScan_Au:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =52
                        FillPortions: =0
                        Fill: =C_Accent
                        Height: =52
                        Width: =App.Width - 32
                        X: =0
                        Y: =0
                        RadiusBottomLeft: =26
                        RadiusBottomRight: =26
                        RadiusTopLeft: =26
                        RadiusTopRight: =26
                        DropShadow: =DropShadow.None
                      Children:
                        - icoScan_Au:
                            Control: ModernIcon@1.1.1
                            Properties:
                              Height: =24
                              Icon: ="Camera"
                              IconColor: =C_White
                              Width: =24
                              X: =18
                              Y: =14
                        - lblScan_Au:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_White
                              Size: =16
                              FontWeight: =FontWeight.Bold
                              Height: =Parent.Height
                              Text: ="Scan barcode"
                              Width: =Parent.Width - 60
                              X: =52
                              Y: =0
                              VerticalAlign: =VerticalAlign.Middle
                              Wrap: =false
                        - scnAudit_Au:
                            Control: BarcodeReader@1.0.25
                            Properties:
                              BorderStyle: =BorderStyle.None
                              FillColor: =RGBA(0, 0, 0, 0)
                              HoverFillColor: =RGBA(255, 255, 255, 0.08)
                              FontSize: =1
                              Height: =Parent.Height
                              OnScan: |-
                                =With(
                                    { it: LookUp(Equipment_Inventory_SharePoint, Title = Trim(First(scnAudit_Au.Barcodes).Value)) },
                                    If(
                                        IsBlank(it),
                                        Notify("Equipment not found. Check the barcode and do not use the equipment.", NotificationType.Error),
                                        Set(auItem, it);
                                        Select(btnResetChecks_Au);
                                        Notify("Loaded " & it.Title, NotificationType.Success)
                                    )
                                )
                              ScanningMode: ='BarcodeReader.ScanningMode'.SelectToScan
                              Text: =""
                              Width: =Parent.Width
                              X: =0
                              Y: =0
                  - conEquip_Au:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =48
                        FillPortions: =0
                        Fill: =C_White
                        Height: =48
                        Width: =App.Width - 32
                        X: =0
                        Y: =0
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        BorderColor: =RGBA(14, 42, 70, 0.22)
                        BorderStyle: =BorderStyle.Solid
