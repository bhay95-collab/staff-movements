                        LayoutMinHeight: =22
                        FillPortions: =0
                        Font: =AppFont
                        Color: =C_Accent
                        Size: =12
                        FontWeight: =FontWeight.Bold
                        Height: =22
                        Text: ="1   EQUIPMENT"
                        Width: =App.Width - 32
                        X: =0
