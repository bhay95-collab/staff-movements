Screens:
  Audit:
    Properties:
      Fill: =C_Bg
      OnVisible: |-
        =// Patients on all four wards (one shape for every ward)
        ClearCollect(
            colPatients,
            ForAll(
                Filter(Ward_4A_Shared, !IsBlank(Patient)) As r,
                {
                    ID: r.ID,
                    Ward: "4A",
                    Bed: r.Bed,
                    Name: r.Patient,
                    URN: r.URN,
                    DOB: r.DOB,
                    PT_Users: r.PT_Users,
                    Mine: !IsBlank(LookUp(Switch(MyDiscipline, "OT", r.OT_Users, "SP", r.SP_Users, r.PT_Users), Lower(Email) = MeEmail)),
                    DisplayText: r.Patient & "  ·  4A  ·  URN " & r.URN
                }
            )
        );
        Collect(
            colPatients,
            ForAll(
                Filter(Ward_4B_Shared, !IsBlank(Patient)) As r,
                {
                    ID: r.ID,
                    Ward: "4B",
                    Bed: r.Bed,
                    Name: r.Patient,
                    URN: r.URN,
                    DOB: r.DOB,
                    PT_Users: r.PT_Users,
                    Mine: !IsBlank(LookUp(Switch(MyDiscipline, "OT", r.OT_Users, "SP", r.SP_Users, r.PT_Users), Lower(Email) = MeEmail)),
                    DisplayText: r.Patient & "  ·  4B  ·  URN " & r.URN
                }
            )
        );
        Collect(
            colPatients,
            ForAll(
                Filter(Ward_5A_Shared, !IsBlank(Patient)) As r,
                {
                    ID: r.ID,
                    Ward: "5A",
                    Bed: r.Bed,
                    Name: r.Patient,
                    URN: r.URN,
                    DOB: r.DOB,
                    PT_Users: r.PT_Users,
                    Mine: !IsBlank(LookUp(Switch(MyDiscipline, "OT", r.OT_Users, "SP", r.SP_Users, r.PT_Users), Lower(Email) = MeEmail)),
                    DisplayText: r.Patient & "  ·  5A  ·  URN " & r.URN
                }
            )
        );
        Collect(
            colPatients,
            ForAll(
                Filter(Ward_6A_Shared, !IsBlank(Patient)) As r,
                {
                    ID: r.ID,
                    Ward: "6A",
                    Bed: r.Bed,
                    Name: r.Patient,
                    URN: r.URN,
                    DOB: r.DOB,
                    PT_Users: r.PT_Users,
                    Mine: !IsBlank(LookUp(Switch(MyDiscipline, "OT", r.OT_Users, "SP", r.SP_Users, r.PT_Users), Lower(Email) = MeEmail)),
                    DisplayText: r.Patient & "  ·  6A  ·  URN " & r.URN
                }
            )
        );

        Set(auItem, Blank());
        Select(btnResetChecks_Au)
    Children:
      - btnResetChecks_Au:
          Control: Button@0.0.45
          Properties:
            Height: =1
            Width: =1
            X: =0
            Y: =0
            Text: =""
            Visible: =false
            OnSelect: |-
              =Reset(cmbPatient_Au);
              Reset(ddCond_Au);
              Reset(txtComments_Au);
              Reset(txtEquip_Au);
              Set(auSafety, false);
              Set(auTag, "");
              Set(auRisk, false);
              Set(auRemoved, false)
      - conRoot_Au:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =C_Bg
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutJustifyContent: =LayoutJustifyContent.Start
            LayoutGap: =0
            PaddingTop: =0
            PaddingRight: =0
            PaddingBottom: =0
            PaddingLeft: =0
            DropShadow: =DropShadow.None
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - conHdr_Au:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  LayoutMinHeight: =76
                  FillPortions: =0
                  Fill: =RGBA(7, 95, 115, 1)
                  Height: =76
                  Width: =App.Width
                  X: =0
                  Y: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
