                              Width: =Parent.Width - 60
                              X: =16
                              Y: =0
                              VerticalAlign: =VerticalAlign.Middle
                              Wrap: =false
                        - lblTgCSafe_Au:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
