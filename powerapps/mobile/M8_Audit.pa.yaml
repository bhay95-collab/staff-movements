                  - conMatch_Au:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =44
                        FillPortions: =0
                        Fill: =If((!IsBlank(Trim(Coalesce(auItem.URN, ""))) && Trim(Coalesce(auItem.URN, "")) = Trim(Coalesce(cmbPatient_Au.Selected.URN, ""))), C_GoodBg, C_DangerBg)
                        Height: =44
                        Width: =App.Width - 32
                        X: =0
                        Y: =0
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        DropShadow: =DropShadow.None
