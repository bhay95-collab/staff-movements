                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =48
                        FillPortions: =0
                        Fill: =If(auRisk, C_DangerBg, C_White)
                        Height: =48
                        Width: =App.Width - 32
                        X: =0
                        Y: =0
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        BorderColor: =If(auRisk, C_Danger, C_Line)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =If(auRisk, 2, 1)
                        DropShadow: =DropShadow.None
                      Children:
                        - lblTgRisk_Au:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =If(auRisk, C_Danger, C_Ink2)
                              Size: =15
                              FontWeight: =FontWeight.Bold
                              Height: =Parent.Height
