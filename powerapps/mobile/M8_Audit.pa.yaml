                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                            Children:
                              - lblSugT_Au:
                                  Control: Label@2.5.1
                                  Properties:
                                    Font: =AppFont
                                    Color: =C_Ink
                                    Size: =14
                                    FontWeight: =FontWeight.Bold
                                    Height: =22
                                    Text: =ThisItem.Title
                                    Width: =Parent.Width - 28
                                    X: =14
                                    Y: =4
                                    Wrap: =false
                              - lblSugS_Au:
                                  Control: Label@2.5.1
                                  Properties:
                                    Font: =AppFont
                                    Color: =C_Muted
                                    Size: =12
                                    Height: =18
                                    Text: =Coalesce(Trim(ThisItem.Brand & " " & ThisItem.Model), "")
                                    Width: =Parent.Width - 28
                                    X: =14
                                    Y: =24
                                    Wrap: =false
                              - btnSug_Au:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderStyle: =BorderStyle.None
                                    Height: =Parent.Height
                                    Width: =Parent.Width
                                    X: =0
                                    Y: =0
                                    Text: =""
                                    OnSelect: |-
                                      =Set(auItem, ThisItem);
                                      Select(btnResetChecks_Au)
