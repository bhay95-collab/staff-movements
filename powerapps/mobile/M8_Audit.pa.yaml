                        X: =0
                        Y: =0
                  - btnBack_Au:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Transparent
                        FontColor: =C_White
                        FontSize: =28
                        Height: =48
                        Icon: ="ChevronLeft"
                        Text: =""
                        Width: =48
                        X: =4
                        Y: =14
