                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                Children:
                  - lblMsg_Au:
                      Control: Label@2.5.1
                      Properties:
                        Font: =AppFont
                        Color: =If(!(!IsBlank(auItem) && !IsBlank(cmbPatient_Au.Selected) && auSafety && auTag <> "" && !IsBlank(If(auRisk, "Unsafe – remove from use", ddCond_Au.Selected.Value)) && !((!(!IsBlank(Trim(Coalesce(auItem.URN, ""))) && Trim(Coalesce(auItem.URN, "")) = Trim(Coalesce(cmbPatient_Au.Selected.URN, ""))) || auRisk || auRemoved || If(auRisk, "Unsafe – remove from use", ddCond_Au.Selected.Value) = "Unsafe – remove from use" || (auTag <> "" && auTag <> "OK")) && IsBlank(Trim(txtComments_Au.Text)))), C_Muted, (!(!IsBlank(Trim(Coalesce(auItem.URN, ""))) && Trim(Coalesce(auItem.URN, "")) = Trim(Coalesce(cmbPatient_Au.Selected.URN, ""))) || auRisk || auRemoved || If(auRisk, "Unsafe – remove from use", ddCond_Au.Selected.Value) = "Unsafe – remove from use" || (auTag <> "" && auTag <> "OK")), C_Danger, C_Good)
                        Size: =13
                        FontWeight: =FontWeight.Bold
                        Height: =36
                        Text: |-
                          =If(IsBlank(auItem), "Scan or search for the equipment first.", IsBlank(cmbPatient_Au.Selected), "Select the patient using it.", !auSafety, "Tick Safety check completed.", auTag = "", "Choose the tag result.", (!(!IsBlank(Trim(Coalesce(auItem.URN, ""))) && Trim(Coalesce(auItem.URN, "")) = Trim(Coalesce(cmbPatient_Au.Selected.URN, ""))) || auRisk || auRemoved || If(auRisk, "Unsafe – remove from use", ddCond_Au.Selected.Value) = "Unsafe – remove from use" || (auTag <> "" && auTag <> "OK")) && IsBlank(Trim(txtComments_Au.Text)), "Add a comment: this audit will fail and be escalated.", (!(!IsBlank(Trim(Coalesce(auItem.URN, ""))) && Trim(Coalesce(auItem.URN, "")) = Trim(Coalesce(cmbPatient_Au.Selected.URN, ""))) || auRisk || auRemoved || If(auRisk, "Unsafe – remove from use", ddCond_Au.Selected.Value) = "Unsafe – remove from use" || (auTag <> "" && auTag <> "OK")), "This audit will FAIL and be escalated to the treating physio.", "Ready to submit: PASS")
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =8
                  - conSubmit_Au:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        Fill: =If((!IsBlank(auItem) && !IsBlank(cmbPatient_Au.Selected) && auSafety && auTag <> "" && !IsBlank(If(auRisk, "Unsafe – remove from use", ddCond_Au.Selected.Value)) && !((!(!IsBlank(Trim(Coalesce(auItem.URN, ""))) && Trim(Coalesce(auItem.URN, "")) = Trim(Coalesce(cmbPatient_Au.Selected.URN, ""))) || auRisk || auRemoved || If(auRisk, "Unsafe – remove from use", ddCond_Au.Selected.Value) = "Unsafe – remove from use" || (auTag <> "" && auTag <> "OK")) && IsBlank(Trim(txtComments_Au.Text)))), C_Accent, C_Muted)
                        Height: =48
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =48
                        RadiusBottomLeft: =24
                        RadiusBottomRight: =24
                        RadiusTopLeft: =24
                        RadiusTopRight: =24
                        BorderColor: =If((!IsBlank(auItem) && !IsBlank(cmbPatient_Au.Selected) && auSafety && auTag <> "" && !IsBlank(If(auRisk, "Unsafe – remove from use", ddCond_Au.Selected.Value)) && !((!(!IsBlank(Trim(Coalesce(auItem.URN, ""))) && Trim(Coalesce(auItem.URN, "")) = Trim(Coalesce(cmbPatient_Au.Selected.URN, ""))) || auRisk || auRemoved || If(auRisk, "Unsafe – remove from use", ddCond_Au.Selected.Value) = "Unsafe – remove from use" || (auTag <> "" && auTag <> "OK")) && IsBlank(Trim(txtComments_Au.Text)))), C_Accent, C_Muted)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                      Children:
                        - btnSubmit_Au:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Transparent
                              BorderRadius: =24
                              Font: =Font.'Segoe UI'
                              FontColor: =C_White
                              FontSize: =16
                              FontWeight: =FontWeight.Bold
                              Height: =Parent.Height
                              Width: =Parent.Width
                              Text: ="Submit audit"
                              OnSelect: |-
                                =With(
                                    {
                                        eq: auItem,
                                        pt: cmbPatient_Au.Selected,
                                        cond: If(auRisk, "Unsafe – remove from use", ddCond_Au.Selected.Value),
                                        comments: Trim(txtComments_Au.Text)
                                    },
                                    With(
                                        { match: !IsBlank(Trim(Coalesce(eq.URN, ""))) && Trim(Coalesce(eq.URN, "")) = Trim(Coalesce(pt.URN, "")) },
                                        With(
                                            {
                                                reasons: Filter(
                                                    Table(
                                                        { Reason: "Allocation Mismatch", Hit: !match },
                                                        { Reason: "Failed Safety Check", Hit: !auSafety },
                                                        { Reason: "Tag issue: " & auTag, Hit: auTag <> "OK" },
                                                        { Reason: "Equipment Unsafe", Hit: cond = "Unsafe – remove from use" },
                                                        { Reason: "Immediate Risk Identified", Hit: auRisk },
                                                        { Reason: "Removed From Use", Hit: auRemoved }
                                                    ),
                                                    Hit
                                                ),
                                                // treating physios on the ward list = who gets the escalation
                                                pts: ForAll(
                                                    pt.PT_Users As p,
                                                    With(
                                                        { fromClaims: Lower(Coalesce(Last(Split(Coalesce(Text(p.Claims), ""), "|")).Value, "")) },
                                                        {
                                                            '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                            Claims: Coalesce(p.Claims, If(!IsBlank(p.Email), "i:0#.f|membership|" & Lower(p.Email))),
                                                            DisplayName: Coalesce(p.DisplayName, p.Email, fromClaims),
                                                            Email: Lower(Coalesce(p.Email, fromClaims)),
                                                            Department: Coalesce(p.Department, ""),
                                                            JobTitle: Coalesce(p.JobTitle, ""),
                                                            Picture: Coalesce(p.Picture, "")
                                                        }
                                                    )
                                                )
                                            },
                                            With(
                                                {
                                                    outcome: If(
                                                        CountRows(reasons) = 0, "Pass",
                                                        CountRows(reasons) > 1, "Fail - Multiple",
                                                        !match, "Fail - Allocation",
                                                        !auSafety || cond = "Unsafe – remove from use" || auRisk || auRemoved, "Fail - Safety",
                                                        auTag <> "OK", "Fail - Tag",
                                                        "Fail - Multiple"
                                                    ),
                                                    unsafe: cond = "Unsafe – remove from use" || auRisk || auRemoved,
                                                    toEmails: Concat(Distinct(Filter(pts, !IsBlank(Email)), Lower(Email)), Value, ";")
                                                },
                                                If(
                                                    outcome <> "Pass" && IsBlank(comments),
                                                    Notify("Comments are required when an audit fails.", NotificationType.Error),

                                                    Set(
                                                        auRow,
                                                        Patch(
                                                            Equipment_Audits,
                                                            Defaults(Equipment_Audits),
                                                            {
                                                                Title: eq.Title & " - " & Text(Now(), "yyyy-mm-dd hh:mm"),
                                                                Equipment: { Id: eq.ID, Value: eq.Title },
                                                                Barcode: eq.Title,
                                                                AuditDateTime: Now(),
                                                                AuditedBy: {
                                                                    '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                                    Claims: "i:0#.f|membership|" & MeEmail,
                                                                    DisplayName: MeName,
                                                                    Email: MeEmail,
                                                                    Department: "",
                                                                    JobTitle: "",
                                                                    Picture: ""
                                                                },
                                                                ExpectedPatientName: Coalesce(eq.'Patient Name', ""),
                                                                ExpectedURN: Coalesce(eq.URN, ""),
                                                                ExpectedWard: If(IsBlank(eq.Ward.Value), Blank(), { Value: eq.Ward.Value }),
                                                                ActualPatientName: pt.Name,
                                                                ActualURN: pt.URN,
                                                                ActualWard: { Value: pt.Ward },
                                                                AllocationMatch: match,
                                                                SafetyCheckCompleted: auSafety,
                                                                TagChecked: true,
                                                                TagResult: { Value: auTag },
                                                                EquipmentCondition: { Value: cond },
                                                                ImmediateRisk: auRisk,
                                                                RemovedFromUse: auRemoved,
                                                                Comments: comments,
                                                                TreatingPTs: pts,
                                                                TreatingPTEmails: Concat(pts, Email, ";"),
                                                                TreatingPTNames: Concat(pts, DisplayName, "; "),
                                                                EscalationRequired: outcome <> "Pass",
                                                                EscalationSent: false,
                                                                AuditOutcome: { Value: outcome }
                                                            }
                                                        )
                                                    );

                                                    If(
                                                        !IsEmpty(Errors(Equipment_Audits)),
                                                        Notify("Could not save the audit. Please try again.", NotificationType.Error),

                                                        If(
                                                            outcome = "Pass",
                                                            Notify("Audit saved: PASS. Scan the next item.", NotificationType.Success),

                                                            IsBlank(toEmails),
                                                            Notify("Audit saved (" & outcome & "). No treating physio email is recorded, so no escalation was sent.", NotificationType.Warning),

                                                            Office365Outlook.SendEmailV2(
                                                                toEmails,
                                                                If(unsafe, "URGENT: Equipment audit FAIL – safety risk (" & outcome & ")", "Equipment audit FAIL – action required (" & outcome & ")"),
                                                                "<div style='font-family:Segoe UI, Arial, sans-serif;font-size:14px;color:#111;line-height:1.35;max-width:760px;'>" &
                                                                "<div style='font-size:24px;font-weight:700;margin:0 0 6px 0;'>Equipment Audit FAILED</div>" &
                                                                "<div style='margin:0 0 16px 0;color:#333;'>An equipment audit has failed and needs review.</div>" &
                                                                "<div style='font-size:16px;font-weight:700;margin:16px 0 8px 0;'>Summary</div>" &
                                                                "<table cellpadding='0' cellspacing='0' style='border-collapse:collapse;width:100%;border:1px solid #d9d9d9;margin:0 0 16px 0;'>" & "<tr><td style='width:200px;padding:8px 10px;border:1px solid #d9d9d9;background:#f7f7f7;font-weight:600;'>Audit outcome</td><td style='padding:8px 10px;border:1px solid #d9d9d9;'>" & outcome & "</td></tr>" & "<tr><td style='width:200px;padding:8px 10px;border:1px solid #d9d9d9;background:#f7f7f7;font-weight:600;'>Escalation reason</td><td style='padding:8px 10px;border:1px solid #d9d9d9;'>" & If(unsafe, "Equipment Unsafe", "Audit failure") & "</td></tr>" & "<tr><td style='width:200px;padding:8px 10px;border:1px solid #d9d9d9;background:#f7f7f7;font-weight:600;'>Fail reasons</td><td style='padding:8px 10px;border:1px solid #d9d9d9;'>" & Concat(reasons, Reason, "; ") & "</td></tr>" & "<tr><td style='width:200px;padding:8px 10px;border:1px solid #d9d9d9;background:#f7f7f7;font-weight:600;'>Condition</td><td style='padding:8px 10px;border:1px solid #d9d9d9;'>" & Coalesce(cond, "—") & "</td></tr>" & "<tr><td style='width:200px;padding:8px 10px;border:1px solid #d9d9d9;background:#f7f7f7;font-weight:600;'>Immediate risk</td><td style='padding:8px 10px;border:1px solid #d9d9d9;'>" & If(auRisk, "Yes", "No") & "</td></tr>" & "<tr><td style='width:200px;padding:8px 10px;border:1px solid #d9d9d9;background:#f7f7f7;font-weight:600;'>Removed from use</td><td style='padding:8px 10px;border:1px solid #d9d9d9;'>" & If(auRemoved, "Yes", "No") & "</td></tr>" & "</table>" &
                                                                "<div style='font-size:16px;font-weight:700;margin:16px 0 8px 0;'>Patient</div>" &
                                                                "<table cellpadding='0' cellspacing='0' style='border-collapse:collapse;width:100%;border:1px solid #d9d9d9;margin:0 0 16px 0;'>" & "<tr><td style='width:200px;padding:8px 10px;border:1px solid #d9d9d9;background:#f7f7f7;font-weight:600;'>Name</td><td style='padding:8px 10px;border:1px solid #d9d9d9;'>" & Coalesce(pt.Name, "—") & "</td></tr>" & "<tr><td style='width:200px;padding:8px 10px;border:1px solid #d9d9d9;background:#f7f7f7;font-weight:600;'>URN</td><td style='padding:8px 10px;border:1px solid #d9d9d9;'>" & Coalesce(pt.URN, "—") & "</td></tr>" & "<tr><td style='width:200px;padding:8px 10px;border:1px solid #d9d9d9;background:#f7f7f7;font-weight:600;'>DOB</td><td style='padding:8px 10px;border:1px solid #d9d9d9;'>" & If(IsBlank(pt.DOB), "—", Text(pt.DOB, "dd/mm/yyyy")) & "</td></tr>" & "<tr><td style='width:200px;padding:8px 10px;border:1px solid #d9d9d9;background:#f7f7f7;font-weight:600;'>Ward</td><td style='padding:8px 10px;border:1px solid #d9d9d9;'>" & Coalesce(pt.Ward, "—") & "</td></tr>" & "</table>" &
