                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =64
                        Width: =Parent.Width
                        X: =0
                        Y: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        DropShadow: =DropShadow.None
                      Children:
                        - capOut_Al:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Muted
                              Size: =11
                              FontWeight: =FontWeight.Bold
                              Height: =18
                              Text: ="DATE SIGNED OUT"
                              Width: =Parent.Width
                              X: =0
