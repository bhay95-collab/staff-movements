Screens:
  Allocate:
    Properties:
      Fill: =C_Bg
      OnVisible: |-
        =// Patients on all four wards (one shape for every ward)
        // loaded once and shared by Allocate and Audit; refreshed when older than 10 minutes
        If(
            IsEmpty(colPatients) || IsBlank(varPatientsLoaded) || DateDiff(varPatientsLoaded, Now(), TimeUnit.Minutes) >= 10,
            ClearCollect(
                colPatients,
                ForAll(
                    Filter(Ward_4A_Shared, !IsBlank(Patient)) As r,
                    {
                        ID: r.ID,
                        Ward: "4A",
                        Bed: r.Bed,
                        Name: r.Patient,
                        URN: r.URN,
                        DOB: r.DOB,
                        PT_Users: r.PT_Users,
                        Mine: !IsBlank(LookUp(Switch(MyDiscipline, "OT", r.OT_Users, "SP", r.SP_Users, r.PT_Users), Lower(Email) = MeEmail)),
                        DisplayText: r.Patient & "  ·  4A  ·  URN " & r.URN
                    }
                )
            );
            Collect(
                colPatients,
                ForAll(
                    Filter(Ward_4B_Shared, !IsBlank(Patient)) As r,
                    {
                        ID: r.ID,
                        Ward: "4B",
                        Bed: r.Bed,
                        Name: r.Patient,
                        URN: r.URN,
                        DOB: r.DOB,
                        PT_Users: r.PT_Users,
                        Mine: !IsBlank(LookUp(Switch(MyDiscipline, "OT", r.OT_Users, "SP", r.SP_Users, r.PT_Users), Lower(Email) = MeEmail)),
                        DisplayText: r.Patient & "  ·  4B  ·  URN " & r.URN
                    }
                )
            );
            Collect(
                colPatients,
                ForAll(
                    Filter(Ward_5A_Shared, !IsBlank(Patient)) As r,
                    {
                        ID: r.ID,
                        Ward: "5A",
                        Bed: r.Bed,
                        Name: r.Patient,
                        URN: r.URN,
                        DOB: r.DOB,
                        PT_Users: r.PT_Users,
                        Mine: !IsBlank(LookUp(Switch(MyDiscipline, "OT", r.OT_Users, "SP", r.SP_Users, r.PT_Users), Lower(Email) = MeEmail)),
                        DisplayText: r.Patient & "  ·  5A  ·  URN " & r.URN
                    }
                )
            );
            Collect(
                colPatients,
                ForAll(
                    Filter(Ward_6A_Shared, !IsBlank(Patient)) As r,
                    {
                        ID: r.ID,
                        Ward: "6A",
                        Bed: r.Bed,
                        Name: r.Patient,
                        URN: r.URN,
                        DOB: r.DOB,
                        PT_Users: r.PT_Users,
                        Mine: !IsBlank(LookUp(Switch(MyDiscipline, "OT", r.OT_Users, "SP", r.SP_Users, r.PT_Users), Lower(Email) = MeEmail)),
                        DisplayText: r.Patient & "  ·  6A  ·  URN " & r.URN
                    }
                )
            );
            Set(varPatientsLoaded, Now())
        );

        // Start on "My patients" when you have any
        Set(alView, If(IsEmpty(Filter(colPatients, Mine)), "All", "Mine"));
        Set(alShowForm, false);
        Set(alPatient, Blank());
        Set(alItem, LookUp(Equipment_Inventory_SharePoint, ID = varItemID));
        Reset(txtSearch_Al)
    Children:
      - btnOpenForm_Al:
          Control: ModernButton@1.0.0
          Properties:
            Align: =Align.Center
            FontWeight: =""
            Height: =1
            OnSelect: |-
              =Reset(txtName_Al);
              Reset(txtURN_Al);
              Reset(dpDOB_Al);
              Reset(ddWard_Al);
              Reset(txtPhysio_Al);
              Reset(dpOut_Al);
              Set(alShowForm, true)
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =0
            Text: =""
            VerticalAlign: =VerticalAlign.Middle
            Visible: =false
            Width: =1
      - conRoot_Al:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =C_Bg
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conHdr_Al:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(7, 95, 115, 1)
                  FillPortions: =0
                  Height: =Round(95 * UI, 0)
                  LayoutMinHeight: =Round(95 * UI, 0)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =App.Width
                Children:
                  - imgHdr_Al:
                      Control: Image@2.2.3
                      Properties:
                        Height: =Parent.Height
                        Image: =HeaderImage
                        ImagePosition: =ImagePosition.Fill
                        Width: =Parent.Width
                  - btnBack_Al:
                      Control: ModernButton@1.0.0
                      Properties:
                        Align: =Align.Center
                        Appearance: =ButtonAppearance.Transparent
                        Color: =C_White
                        FontWeight: =""
                        Height: =Round(60 * UI, 0)
                        Icon: ="ChevronLeft"
                        OnSelect: =Back(ScreenTransition.UnCoverRight)
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =5
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Size: =Round(32 * UI, 0)
                        Text: =""
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =Round(60 * UI, 0)
                        X: =Gutter + Round(5 * UI, 0)
                        Y: =Round(18 * UI, 0)
                  - lblHdrT_Al:
                      Control: Label@2.5.1
                      Properties:
                        Color: =C_White
                        Font: =AppFont
                        FontWeight: =FontWeight.Bold
                        Height: =Round(42 * UI, 0)
                        Size: =Round(24 * UI, 0)
                        Text: ="Allocate"
                        Width: =PageW - Round(85 * UI, 0)
                        Wrap: =false
                        X: =Gutter + Round(65 * UI, 0)
                        Y: =Round(12 * UI, 0)
                  - lblHdrS_Al:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.85)
                        Font: =AppFont
                        Height: =Round(25 * UI, 0)
                        Size: =Round(15 * UI, 0)
                        Text: ="Choose a Patient"
                        Width: =PageW - Round(85 * UI, 0)
                        Wrap: =false
                        X: =Gutter + Round(65 * UI, 0)
                        Y: =Round(53 * UI, 0)
            - conBody_Al:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =Round(13 * UI, 0)
                  LayoutMinHeight: =Round(250 * UI, 0)
                  PaddingBottom: =Round(10 * UI, 0)
                  PaddingLeft: =Gutter + Round(20 * UI, 0)
                  PaddingRight: =Gutter + Round(20 * UI, 0)
                  PaddingTop: =Round(15 * UI, 0)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =App.Width
                Children:
                  - conItem_Al:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderColor: =C_Line
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =C_White
                        FillPortions: =0
                        Height: =Round(73 * UI, 0)
                        LayoutMinHeight: =Round(73 * UI, 0)
                        RadiusBottomLeft: =Round(18 * UI, 0)
                        RadiusBottomRight: =Round(18 * UI, 0)
                        RadiusTopLeft: =Round(18 * UI, 0)
                        RadiusTopRight: =Round(18 * UI, 0)
                        Width: =PageW - Round(40 * UI, 0)
                      Children:
                        - conItemBar_Al:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Switch(alItem.Category.Value, "Wheelchair", RGBA(166, 199, 130, 1), "Cushion", RGBA(0, 144, 153, 1), "Backrest", RGBA(0, 200, 210, 1), RGBA(210, 218, 227, 1))
                              Height: =Parent.Height
                              RadiusBottomLeft: =Round(18 * UI, 0)
                              RadiusBottomRight: =0
                              RadiusTopLeft: =Round(18 * UI, 0)
                              RadiusTopRight: =0
                              Width: =Round(8 * UI, 0)
                        - capItem_Al:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_Muted
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Round(23 * UI, 0)
                              Size: =Round(14 * UI, 0)
                              Text: ="ALLOCATING"
                              Width: =Parent.Width - Round(45 * UI, 0)
                              Wrap: =false
                              X: =Round(23 * UI, 0)
                              Y: =Round(10 * UI, 0)
                        - lblItem_Al:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_Ink
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Round(30 * UI, 0)
                              Size: =Round(18 * UI, 0)
                              Text: =alItem.Title & "  ·  " & Coalesce(Trim(alItem.Brand & " " & alItem.Model), "")
                              Width: =Parent.Width - Round(45 * UI, 0)
                              Wrap: =false
                              X: =Round(23 * UI, 0)
                              Y: =Round(33 * UI, 0)
                  - conSearch_Al:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderColor: =RGBA(14, 42, 70, 0.22)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =C_White
                        FillPortions: =0
                        Height: =Round(60 * UI, 0)
                        LayoutMinHeight: =Round(60 * UI, 0)
                        RadiusBottomLeft: =Round(15 * UI, 0)
                        RadiusBottomRight: =Round(15 * UI, 0)
                        RadiusTopLeft: =Round(15 * UI, 0)
                        RadiusTopRight: =Round(15 * UI, 0)
                        Width: =PageW - Round(40 * UI, 0)
                      Children:
                        - icoSearch_Al:
                            Control: ModernIcon@1.1.1
                            Properties:
                              Height: =Round(30 * UI, 0)
                              Icon: ="Search"
                              IconColor: =C_Muted
                              Width: =Round(30 * UI, 0)
                              X: =Round(15 * UI, 0)
                              Y: =Round(15 * UI, 0)
                        - txtSearch_Al:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              BorderStyle: =BorderStyle.None
                              Color: =C_Ink
                              Default: =""
                              DelayOutput: =true
                              Fill: =RGBA(0, 0, 0, 0)
                              Font: =AppFont
                              Height: =Parent.Height
                              HintText: ="Search name or URN"
                              Size: =Round(18 * UI, 0)
                              Width: =Parent.Width - Round(55 * UI, 0)
                              X: =Round(50 * UI, 0)
                  - conViews_Al:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =Round(50 * UI, 0)
                        LayoutMinHeight: =Round(50 * UI, 0)
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =PageW - Round(40 * UI, 0)
                      Children:
                        - conViewMine_Al:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =If(alView = "Mine", C_Accent, C_Line)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =If(alView = "Mine", C_Accent, C_White)
                              Height: =Round(50 * UI, 0)
                              RadiusBottomLeft: =Round(25 * UI, 0)
                              RadiusBottomRight: =Round(25 * UI, 0)
                              RadiusTopLeft: =Round(25 * UI, 0)
                              RadiusTopRight: =Round(25 * UI, 0)
                              Width: =(PageW - Round(180 * UI, 0)) / 2
                            Children:
                              - btnViewMine_Al:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Appearance: =ButtonAppearance.Transparent
                                    Color: =If(alView = "Mine", C_White, C_Ink2)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =63
                                    OnSelect: =Set(alView, "Mine")
                                    PaddingBottom: =5
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =5
                                    RadiusBottomLeft: =Round(25 * UI, 0)
                                    RadiusBottomRight: =Round(25 * UI, 0)
                                    RadiusTopLeft: =Round(25 * UI, 0)
                                    RadiusTopRight: =Round(25 * UI, 0)
                                    Size: =Round(16 * UI, 0)
                                    Text: ="My patients  ·  " & CountRows(Filter(colPatients, Mine))
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =207.5
                        - conViewAll_Al:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =If(alView = "All", C_Accent, C_Line)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =If(alView = "All", C_Accent, C_White)
                              Height: =Round(50 * UI, 0)
                              RadiusBottomLeft: =Round(25 * UI, 0)
                              RadiusBottomRight: =Round(25 * UI, 0)
                              RadiusTopLeft: =Round(25 * UI, 0)
                              RadiusTopRight: =Round(25 * UI, 0)
                              Width: =(PageW - Round(180 * UI, 0)) / 2
                              X: =(PageW - Round(180 * UI, 0)) / 2 + Round(10 * UI, 0)
                            Children:
                              - btnViewAll_Al:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Appearance: =ButtonAppearance.Transparent
                                    Color: =If(alView = "All", C_White, C_Ink2)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =63
                                    OnSelect: =Set(alView, "All")
                                    PaddingBottom: =5
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =5
                                    RadiusBottomLeft: =Round(25 * UI, 0)
                                    RadiusBottomRight: =Round(25 * UI, 0)
                                    RadiusTopLeft: =Round(25 * UI, 0)
                                    RadiusTopRight: =Round(25 * UI, 0)
                                    Size: =Round(16 * UI, 0)
                                    Text: ="All  ·  " & CountRows(colPatients)
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =207.5
                        - conOther_Al:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =C_Accent
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =C_White
                              Height: =Round(50 * UI, 0)
                              RadiusBottomLeft: =Round(25 * UI, 0)
                              RadiusBottomRight: =Round(25 * UI, 0)
                              RadiusTopLeft: =Round(25 * UI, 0)
                              RadiusTopRight: =Round(25 * UI, 0)
                              Width: =Round(120 * UI, 0)
                              X: =PageW - Round(40 * UI, 0) - Round(120 * UI, 0)
                            Children:
                              - btnOther_Al:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Appearance: =ButtonAppearance.Transparent
                                    Color: =C_Accent
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =63
                                    OnSelect: |-
                                      =Set(alPatient, Blank());
                                      Select(btnOpenForm_Al)
                                    PaddingBottom: =5
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =5
                                    RadiusBottomLeft: =Round(25 * UI, 0)
                                    RadiusBottomRight: =Round(25 * UI, 0)
                                    RadiusTopLeft: =Round(25 * UI, 0)
                                    RadiusTopRight: =Round(25 * UI, 0)
                                    Size: =Round(16 * UI, 0)
                                    Text: ="+ Other"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =150
                  - galPts_Al:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        Items: =SortByColumns(Filter(colPatients, (alView = "All" || Mine) && (IsBlank(Trim(txtSearch_Al.Text)) || Lower(Trim(txtSearch_Al.Text)) in Lower(Name) || Trim(txtSearch_Al.Text) in URN)), "Ward", SortOrder.Ascending, "Bed", SortOrder.Ascending)
                        LayoutMinHeight: =Round(150 * UI, 0)
                        TemplatePadding: =0
                        TemplateSize: =Round(88 * UI, 0)
                        Width: =PageW - Round(40 * UI, 0)
                      Children:
                        - conPt_Al:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =C_Line
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =C_White
                              Height: =Round(78 * UI, 0)
                              RadiusBottomLeft: =Round(18 * UI, 0)
                              RadiusBottomRight: =Round(18 * UI, 0)
                              RadiusTopLeft: =Round(18 * UI, 0)
                              RadiusTopRight: =Round(18 * UI, 0)
                              Width: =Parent.TemplateWidth - Round(5 * UI, 0)
                              X: =1
                              Y: =Round(5 * UI, 0)
                            Children:
                              - conPtWard_Al:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Switch(ThisItem.Ward, "4A", RGBA(166, 199, 130, 1), "4B", RGBA(35, 100, 153, 1), "5A", RGBA(0, 144, 153, 1), "6A", RGBA(0, 200, 210, 1), RGBA(210, 218, 227, 1))
                                    Height: =Round(53 * UI, 0)
                                    RadiusBottomLeft: =Round(15 * UI, 0)
                                    RadiusBottomRight: =Round(15 * UI, 0)
                                    RadiusTopLeft: =Round(15 * UI, 0)
                                    RadiusTopRight: =Round(15 * UI, 0)
                                    Width: =Round(53 * UI, 0)
                                    X: =Round(15 * UI, 0)
                                    Y: =Round(13 * UI, 0)
                                  Children:
                                    - lblPtWard_Al:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          Color: =If(ThisItem.Ward = "4A" || ThisItem.Ward = "6A", C_Ink, C_White)
                                          Font: =AppFont
                                          FontWeight: =FontWeight.Bold
                                          Height: =Parent.Height
                                          Size: =Round(16 * UI, 0)
                                          Text: =ThisItem.Ward
                                          Width: =Parent.Width
                                          Wrap: =false
                              - lblPtName_Al:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =C_Ink
                                    Font: =AppFont
                                    FontWeight: =FontWeight.Bold
                                    Height: =Round(30 * UI, 0)
                                    Size: =Round(18 * UI, 0)
                                    Text: =ThisItem.Name
                                    Width: =Parent.Width - Round(130 * UI, 0)
                                    Wrap: =false
                                    X: =Round(83 * UI, 0)
                                    Y: =Round(13 * UI, 0)
                              - lblPtSub_Al:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =C_Muted
                                    Font: =AppFont
                                    Height: =Round(23 * UI, 0)
                                    Size: =Round(15 * UI, 0)
                                    Text: ="Bed " & ThisItem.Bed & "  ·  URN " & Coalesce(ThisItem.URN, "—")
                                    Width: =Parent.Width - Round(130 * UI, 0)
                                    Wrap: =false
                                    X: =Round(83 * UI, 0)
                                    Y: =Round(43 * UI, 0)
                              - icoPtGo_Al:
                                  Control: ModernIcon@1.1.1
                                  Properties:
                                    Height: =Round(30 * UI, 0)
                                    Icon: ="ChevronRight"
                                    IconColor: =C_Muted
                                    Width: =Round(30 * UI, 0)
                                    X: =Parent.Width - Round(43 * UI, 0)
                                    Y: =Round(24 * UI, 0)
                              - btnPt_Al:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Appearance: =ButtonAppearance.Transparent
                                    BorderStyle: =BorderStyle.None
                                    FontWeight: =""
                                    Height: =Parent.Height
                                    OnSelect: |-
                                      =Set(alPatient, ThisItem);
                                      Select(btnOpenForm_Al)
                                    PaddingBottom: =5
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =5
                                    RadiusBottomLeft: =4
                                    RadiusBottomRight: =4
                                    RadiusTopLeft: =4
                                    RadiusTopRight: =4
                                    Size: =0
                                    Text: =""
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =Parent.Width
                  - lblEmpty_Al:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =C_Muted
                        Font: =AppFont
                        Height: =Round(50 * UI, 0)
                        LayoutMinHeight: =Round(50 * UI, 0)
                        Size: =Round(16 * UI, 0)
                        Text: =If(alView = "Mine" && IsEmpty(Filter(colPatients, Mine)), "No patients are allocated to you. Tap All.", "No patients found.")
                        Visible: =IsEmpty(galPts_Al.AllItems)
                        Width: =PageW - Round(40 * UI, 0)
      - conOverlay_Al:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(14, 28, 42, 0.45)
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =alShowForm
            Width: =Parent.Width
          Children:
            - btnScrim_Al:
                Control: ModernButton@1.0.0
                Properties:
                  Align: =Align.Center
                  Appearance: =ButtonAppearance.Transparent
                  BorderStyle: =BorderStyle.None
                  FontWeight: =""
                  Height: =Parent.Height
                  OnSelect: =Set(alShowForm, false)
                  PaddingBottom: =5
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =5
                  RadiusBottomLeft: =4
                  RadiusBottomRight: =4
                  RadiusTopLeft: =4
                  RadiusTopRight: =4
                  Size: =0
                  Text: =""
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =Parent.Width
            - conSheet_Al:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =C_White
                  Height: =Min(Parent.Height - Round(50 * UI, 0), Round(738 * UI, 0))
                  RadiusBottomLeft: =If(App.Width >= 720, 22, 0)
                  RadiusBottomRight: =If(App.Width >= 720, 22, 0)
                  RadiusTopLeft: =Round(28 * UI, 0)
                  RadiusTopRight: =Round(28 * UI, 0)
                  Width: =Min(Parent.Width, SheetW)
                  X: =(Parent.Width - Min(Parent.Width, SheetW)) / 2
                  Y: =If(App.Width >= 720, (Parent.Height - Self.Height) / 2, Parent.Height - Self.Height)
                Children:
                  - conHandle_Al:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(14, 42, 70, 0.18)
                        Height: =Round(6 * UI, 0)
                        RadiusBottomLeft: =Round(4 * UI, 0)
                        RadiusBottomRight: =Round(4 * UI, 0)
                        RadiusTopLeft: =Round(4 * UI, 0)
                        RadiusTopRight: =Round(4 * UI, 0)
                        Width: =Round(50 * UI, 0)
                        X: =(Parent.Width - Round(50 * UI, 0)) / 2
                        Y: =Round(10 * UI, 0)
                  - lblSheetT_Al:
                      Control: Label@2.5.1
                      Properties:
                        Color: =C_Ink
                        Font: =AppFont
                        FontWeight: =FontWeight.Bold
                        Height: =Round(38 * UI, 0)
                        Size: =Round(22 * UI, 0)
                        Text: =If(IsBlank(alPatient), "Other patient", "Allocate to " & alPatient.Name)
                        Width: =Parent.Width - Round(50 * UI, 0)
                        Wrap: =false
                        X: =Round(25 * UI, 0)
                        Y: =Round(25 * UI, 0)
                  - conSheetBody_Al:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =Parent.Height - Round(65 * UI, 0) - Round(95 * UI, 0)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =Round(13 * UI, 0)
