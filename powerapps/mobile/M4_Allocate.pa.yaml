                                    Width: =Parent.Width
                                    X: =0
                                    Y: =0
                  - conFormBtns_Al:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =48
                        Height: =48
                        FillPortions: =0
                        Fill: =RGBA(0, 0, 0, 0)
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        LayoutGap: =12
                        PaddingTop: =0
                        PaddingRight: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        DropShadow: =DropShadow.None
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - conFormNo_Al:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutMinWidth: =40
                              FillPortions: =1
                              Fill: =C_White
                              Height: =48
                              Width: =Parent.Width
                              X: =0
                              Y: =0
                              RadiusBottomLeft: =24
                              RadiusBottomRight: =24
                              RadiusTopLeft: =24
                              RadiusTopRight: =24
                              BorderColor: =C_Line
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                            Children:
                              - btnFormNo_Al:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderRadius: =24
                                    Font: =AppFont
                                    FontColor: =C_Ink2
                                    FontSize: =15
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    Width: =Parent.Width
                                    Text: ="Cancel"
                                    OnSelect: =Set(alShowForm, false)
                        - conFormGo_Al:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutMinWidth: =40
                              FillPortions: =1
                              Fill: =C_Accent
                              Height: =48
                              Width: =Parent.Width
                              X: =0
                              Y: =0
                              RadiusBottomLeft: =24
                              RadiusBottomRight: =24
                              RadiusTopLeft: =24
                              RadiusTopRight: =24
                              BorderColor: =C_Accent
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                            Children:
                              - btnFormGo_Al:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderRadius: =24
                                    Font: =AppFont
                                    FontColor: =C_White
                                    FontSize: =15
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    Width: =Parent.Width
                                    Text: ="Allocate"
                                    OnSelect: |-
                                      =With(
                                          { it: LookUp(Equipment_Inventory_SharePoint, ID = varItemID) },
                                          If(
                                              IsBlank(it) || Coalesce(it.Status.Value, "") <> "Available",
                                              Notify("This item is no longer available (someone may have just allocated it).", NotificationType.Error),

                                              IsBlank(Trim(txtName_Al.Text)) || IsBlank(Trim(txtURN_Al.Text)) || IsBlank(ddWard_Al.Selected.Value) ||
                                              IsBlank(Trim(txtPhysio_Al.Text)) || IsBlank(dpOut_Al.SelectedDate),
                                              Notify("Please complete patient, URN, ward, physio and date.", NotificationType.Warning),

                                              With(
                                                  {
                                                      episodeKey: "EQ-" & Text(it.ID) & "-" & Text(Now(), "yyyymmddhhmmss") & "-" & Left(Text(GUID()), 8),
                                                      actionTime: Now(),
                                                      ptName: Trim(txtName_Al.Text),
                                                      ptURN: Trim(txtURN_Al.Text),
                                                      ptDOB: dpDOB_Al.SelectedDate,
                                                      ward: ddWard_Al.Selected.Value,
                                                      physio: Trim(txtPhysio_Al.Text),
                                                      outDate: dpOut_Al.SelectedDate
                                                  },

                                                  // 1) inventory -> Allocated
                                                  Patch(
                                                      Equipment_Inventory_SharePoint,
                                                      it,
                                                      {
                                                          'Patient Name': ptName,
                                                          URN: ptURN,
                                                          DOB: ptDOB,
                                                          Physiotherapist: physio,
                                                          'Date Signed Out': outDate,
                                                          Ward: { Value: ward },
                                                          Status: { Value: "Allocated" },
                                                          CurrentEpisodeKey: episodeKey
                                                      }
                                                  );

                                                  If(
                                                      !IsEmpty(Errors(Equipment_Inventory_SharePoint)),
                                                      Notify("Could not save the allocation. Please try again.", NotificationType.Error),

                                                      // 2) usage log: sign-out row
                                                      Patch(
                                                          Equipment_Usage_Log,
                                                          Defaults(Equipment_Usage_Log),
                                                          {
                                                              Title: episodeKey & " - Sign Out",
                                                              EpisodeKey: episodeKey,
                                                              EventType: { Value: "Sign Out" },
                                                              EpisodeStatus: { Value: "Open" },
                                                              EventDateTime: actionTime,
                                                              EquipmentItemID: it.ID,
                                                              EquipmentTitle: it.Title,
                                                              Category: Coalesce(it.Category.Value, ""),
                                                              Brand: Coalesce(it.Brand, ""),
                                                              Model: Coalesce(it.Model, ""),
                                                              Width: Coalesce(it.Width.Value, ""),
                                                              Depth: Coalesce(it.Depth.Value, ""),
                                                              Height: Coalesce(it.Height.Value, ""),
                                                              SWL: Coalesce(it.SWL, ""),
                                                              WheelchairType: Coalesce(it.'Wheelchair Type'.Value, ""),
                                                              LocationAtEvent: Coalesce(it.Location.Value, ""),
                                                              Ward: ward,
                                                              PatientName: ptName,
                                                              URN: ptURN,
                                                              DOB: ptDOB,
                                                              Physiotherapist: physio,
                                                              DateSignedOut: outDate,
                                                              DateReturned: Blank(),
                                                              DaysSignedOutThisEpisode: Blank(),
                                                              TotalDaysSignedOutAfterEvent: Coalesce(it.TotalDaysSignedOut, 0),
                                                              Over100DaysAfterEvent: Coalesce(it.TotalDaysSignedOut, 0) > 100,
                                                              ServiceRequired: Coalesce(it.TotalDaysSignedOut, 0) > 100,
                                                              IsHighRiskEquipment: Coalesce(it.IsHighRiskEquipment, false),
                                                              OutOfService: Coalesce(it.OutOfService, false),
                                                              IsActive: Coalesce(it.IsActive, true),
                                                              StatusAfterEvent: "Allocated",
                                                              ActionedByName: MeName,
                                                              ActionedByEmail: User().Email,
                                                              SourceApp: { Value: "Mobile" },
                                                              Notes: ""
                                                          }
                                                      );
                                                      Set(alShowForm, false);
                                                      Notify(it.Title & " allocated to " & ptName & ".", NotificationType.Success);
                                                      Set(meTab, "Today");
                                                      Navigate(MyEquipment, ScreenTransition.UnCover)
                                                  )
                                              )
                                          )
                                      )
