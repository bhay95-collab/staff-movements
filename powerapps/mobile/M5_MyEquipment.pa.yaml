Screens:
  MyEquipment:
    Properties:
      Fill: =C_Bg
      OnVisible: |-
        =ClearCollect(
            colMine,
            Filter(Equipment_Inventory_SharePoint, Status.Value = "Allocated" && Physiotherapist = MeName)
        );
        If(IsBlank(meTab), Set(meTab, "All"))
    Children:
      - conRoot_Me:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =C_Bg
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutJustifyContent: =LayoutJustifyContent.Start
            LayoutGap: =0
            PaddingTop: =0
            PaddingRight: =0
            PaddingBottom: =0
            PaddingLeft: =0
            DropShadow: =DropShadow.None
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - conHdr_Me:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  LayoutMinHeight: =95
                  FillPortions: =0
                  Fill: =RGBA(7, 95, 115, 1)
                  Height: =95
                  Width: =App.Width
                  X: =0
                  Y: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  DropShadow: =DropShadow.None
                Children:
                  - imgHdr_Me:
                      Control: Image@2.2.3
                      Properties:
                        Height: =Parent.Height
                        Image: =HeaderImage
                        ImagePosition: =ImagePosition.Fill
                        Width: =Parent.Width
                        X: =0
                        Y: =0
                  - btnBack_Me:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Transparent
                        FontColor: =C_White
                        FontSize: =32
                        Height: =60
                        Icon: ="ChevronLeft"
                        Text: =""
                        Width: =60
                        X: =5
                        Y: =18
                        OnSelect: =Back(ScreenTransition.UnCoverRight)
                  - lblHdrT_Me:
                      Control: Label@2.5.1
                      Properties:
                        Font: =AppFont
                        Color: =C_White
                        Size: =24
                        FontWeight: =FontWeight.Bold
                        Height: =35
                        Text: ="My equipment"
                        Width: =Parent.Width - 85
                        X: =65
                        Y: =20
                        Wrap: =false
                  - lblHdrS_Me:
                      Control: Label@2.5.1
                      Properties:
                        Font: =AppFont
                        Color: =RGBA(255, 255, 255, 0.85)
                        Size: =15
                        Height: =25
                        Text: ="Signed out by " & MeName
                        Width: =Parent.Width - 85
                        X: =65
                        Y: =53
                        Wrap: =false
            - conBody_Me:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  LayoutMinHeight: =250
                  FillPortions: =1
                  Width: =App.Width
                  Fill: =RGBA(0, 0, 0, 0)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutGap: =13
                  PaddingTop: =15
                  PaddingRight: =20
                  PaddingBottom: =10
                  PaddingLeft: =20
                  DropShadow: =DropShadow.None
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - conSegTab_Me:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =50
                        FillPortions: =0
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =50
                        Width: =App.Width - 40
                        X: =0
                        Y: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        DropShadow: =DropShadow.None
                      Children:
                        - conSegTabAll_Me:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =If(meTab = "All", C_Accent, C_White)
                              Height: =50
                              Width: =(App.Width - 40 - 20) / 3
                              X: =0 * ((App.Width - 40 - 20) / 3 + 10)
                              Y: =0
                              RadiusBottomLeft: =25
                              RadiusBottomRight: =25
                              RadiusTopLeft: =25
                              RadiusTopRight: =25
                              BorderColor: =If(meTab = "All", C_Accent, C_Line)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                            Children:
                              - btnSegTabAll_Me:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderRadius: =25
                                    Font: =Font.'Segoe UI'
                                    FontColor: =If(meTab = "All", C_White, C_Ink2)
                                    FontSize: =16
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    Width: =Parent.Width
                                    Text: ="All  ·  " & CountRows(colMine)
                                    OnSelect: =Set(meTab, "All")
                        - conSegTabToday_Me:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =If(meTab = "Today", C_Accent, C_White)
                              Height: =50
                              Width: =(App.Width - 40 - 20) / 3
                              X: =1 * ((App.Width - 40 - 20) / 3 + 10)
                              Y: =0
                              RadiusBottomLeft: =25
                              RadiusBottomRight: =25
                              RadiusTopLeft: =25
                              RadiusTopRight: =25
                              BorderColor: =If(meTab = "Today", C_Accent, C_Line)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                            Children:
                              - btnSegTabToday_Me:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderRadius: =25
                                    Font: =Font.'Segoe UI'
                                    FontColor: =If(meTab = "Today", C_White, C_Ink2)
                                    FontSize: =16
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    Width: =Parent.Width
                                    Text: ="Today  ·  " & CountRows(Filter(colMine, 'Date Signed Out' = Today()))
                                    OnSelect: =Set(meTab, "Today")
                        - conSegTabOld_Me:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =If(meTab = "Old", C_Accent, C_White)
                              Height: =50
                              Width: =(App.Width - 40 - 20) / 3
                              X: =2 * ((App.Width - 40 - 20) / 3 + 10)
                              Y: =0
                              RadiusBottomLeft: =25
                              RadiusBottomRight: =25
                              RadiusTopLeft: =25
                              RadiusTopRight: =25
                              BorderColor: =If(meTab = "Old", C_Accent, C_Line)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                            Children:
                              - btnSegTabOld_Me:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderRadius: =25
                                    Font: =Font.'Segoe UI'
                                    FontColor: =If(meTab = "Old", C_White, C_Ink2)
                                    FontSize: =16
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    Width: =Parent.Width
                                    Text: ="6+ wks  ·  " & CountRows(Filter(colMine, 'Date Signed Out' <= DateAdd(Today(), -42)))
                                    OnSelect: =Set(meTab, "Old")
                  - galMine_Me:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =150
                        FillPortions: =1
                        Items: =Sort(Switch(meTab, "Today", Filter(colMine, 'Date Signed Out' = Today()), "Old", Filter(colMine, 'Date Signed Out' <= DateAdd(Today(), -42)), colMine), 'Date Signed Out', SortOrder.Descending)
                        TemplatePadding: =0
                        TemplateSize: =135
                        Width: =App.Width - 40
                      Children:
                        - conRow_Me:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =C_White
                              Height: =125
                              Width: =Parent.TemplateWidth - 5
                              X: =3
                              Y: =5
                              RadiusBottomLeft: =18
                              RadiusBottomRight: =18
                              RadiusTopLeft: =18
                              RadiusTopRight: =18
                              BorderColor: =C_Line
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                            Children:
                              - conRowBar_Me:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    Fill: =Switch(ThisItem.Category.Value, "Wheelchair", RGBA(166, 199, 130, 1), "Cushion", RGBA(0, 144, 153, 1), "Backrest", RGBA(0, 200, 210, 1), RGBA(210, 218, 227, 1))
                                    Height: =Parent.Height
                                    Width: =8
                                    X: =0
                                    Y: =0
                                    RadiusBottomLeft: =18
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =18
                                    RadiusTopRight: =0
                                    DropShadow: =DropShadow.None
                              - lblRowT_Me:
                                  Control: Label@2.5.1
                                  Properties:
                                    Font: =AppFont
                                    Color: =C_Ink
                                    Size: =18
                                    FontWeight: =FontWeight.Bold
                                    Height: =30
                                    Text: =Coalesce(Trim(ThisItem.Brand & " " & ThisItem.Model), ThisItem.Title)
                                    Width: =Parent.Width - 125
                                    X: =23
                                    Y: =10
                                    Wrap: =false
                              - lblRow0_Me:
                                  Control: Label@2.5.1
                                  Properties:
                                    Font: =AppFont
                                    Color: =C_Muted
                                    Size: =15
                                    Height: =23
                                    Text: =ThisItem.Title & "  ·  " & Coalesce(ThisItem.Category.Value, "")
                                    Width: =Parent.Width - 125
                                    X: =23
                                    Y: =40
                                    Wrap: =false
                              - lblRow1_Me:
                                  Control: Label@2.5.1
                                  Properties:
                                    Font: =AppFont
                                    Color: =C_Ink2
                                    Size: =15
                                    Height: =23
                                    Text: =ThisItem.'Patient Name' & "  ·  Ward " & Coalesce(ThisItem.Ward.Value, "—")
                                    Width: =Parent.Width - 125
                                    X: =23
                                    Y: =63
                                    Wrap: =false
                              - lblRow2_Me:
                                  Control: Label@2.5.1
                                  Properties:
                                    Font: =AppFont
                                    Color: =C_Muted
                                    Size: =15
                                    Height: =23
                                    Text: ="Signed out " & Text(ThisItem.'Date Signed Out', "d mmm yyyy")
                                    Width: =Parent.Width - 125
                                    X: =23
                                    Y: =85
                                    Wrap: =false
                              - conDays_Me:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    Fill: =If(DateDiff(ThisItem.'Date Signed Out', Today(), TimeUnit.Days) >= 42, C_DangerBg, C_Bg)
                                    Height: =33
                                    Width: =75
                                    X: =Parent.Width - 93
                                    Y: =13
                                    RadiusBottomLeft: =16
                                    RadiusBottomRight: =16
                                    RadiusTopLeft: =16
                                    RadiusTopRight: =16
                                    DropShadow: =DropShadow.None
                                  Children:
                                    - lblDays_Me:
                                        Control: Label@2.5.1
                                        Properties:
                                          Font: =AppFont
                                          Color: =If(DateDiff(ThisItem.'Date Signed Out', Today(), TimeUnit.Days) >= 42, C_Danger, C_Ink2)
                                          Size: =15
                                          FontWeight: =FontWeight.Bold
                                          Height: =Parent.Height
                                          Text: =DateDiff(ThisItem.'Date Signed Out', Today(), TimeUnit.Days) & "d"
                                          Width: =Parent.Width
                                          X: =0
                                          Y: =0
                                          Align: =Align.Center
                                          VerticalAlign: =VerticalAlign.Middle
                                          Wrap: =false
                              - btnRow_Me:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderStyle: =BorderStyle.None
                                    Height: =Parent.Height
                                    Width: =Parent.Width
                                    X: =0
                                    Y: =0
                                    Text: =""
                                    OnSelect: |-
                                      =Set(varItemID, ThisItem.ID);
                                      Navigate(Item, ScreenTransition.Cover)
                  - lblEmpty_Me:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =50
                        FillPortions: =0
                        Font: =AppFont
                        Color: =C_Muted
                        Size: =16
                        Height: =50
                        Text: =Switch(meTab, "Today", "Nothing allocated by you today.", "Old", "Nothing signed out for 6 weeks or more.", "You have no equipment signed out.")
                        Width: =App.Width - 40
                        X: =0
                        Y: =0
                        Align: =Align.Center
                        Visible: =IsEmpty(galMine_Me.AllItems)
            - conFoot_Me:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  LayoutMinHeight: =100
                  FillPortions: =0
                  Fill: =C_White
                  Height: =100
                  Width: =App.Width
                  X: =0
                  Y: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  BorderColor: =C_Line
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Visible: =meTab = "Today" && !IsEmpty(Filter(colMine, 'Date Signed Out' = Today()))
                Children:
                  - conEmail_Me:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        Fill: =C_Accent
                        Height: =60
                        Width: =Parent.Width - 40
                        X: =20
                        Y: =20
                        RadiusBottomLeft: =30
                        RadiusBottomRight: =30
                        RadiusTopLeft: =30
                        RadiusTopRight: =30
                        BorderColor: =C_Accent
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                      Children:
                        - btnEmail_Me:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Transparent
                              BorderRadius: =30
                              Font: =Font.'Segoe UI'
                              FontColor: =C_White
                              FontSize: =18
                              FontWeight: =FontWeight.Bold
                              Height: =Parent.Height
                              Width: =Parent.Width
                              Text: ="Email today's list to me"
                              OnSelect: |-
                                =With(
                                    { rows: Sort(Filter(colMine, 'Date Signed Out' = Today()), 'Patient Name') },
                                    If(
                                        IsEmpty(rows),
                                        Notify("You have not allocated anything today.", NotificationType.Information),
                                        Office365Outlook.SendEmailV2(
                                            User().Email,
                                            "Equipment you allocated today (" & Text(Today(), "d mmm yyyy") & ")",
                                            "<p>Equipment you allocated today:</p><ul>" &
                                            Concat(
                                                rows,
                                                "<li><strong>" & 'Patient Name' & "</strong> (URN " & URN & ", Ward " & Ward.Value & "): " &
                                                Category.Value & " " & Title & ", " & Brand & " " & Model & "</li>"
                                            ) &
                                            "</ul><p>Please add these to your patients' Interactive View in ieMR.</p>",
                                            { IsHtml: true }
                                        );
                                        Notify("Email sent to " & User().Email & ".", NotificationType.Success)
                                    )
                                )
                              Icon: ="Mail"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              Layout: ='ButtonCanvas.Layout'.IconBefore
