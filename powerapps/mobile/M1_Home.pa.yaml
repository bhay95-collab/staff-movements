Screens:
  Home:
    Properties:
      Fill: =C_Bg
      OnVisible: |-
        =// Equipment you have had signed out for 6 weeks or more (shown as a reminder card)
        ClearCollect(
            colOldAllocations,
            Filter(
                Equipment_Inventory_SharePoint,
                Status.Value = "Allocated" &&
                Physiotherapist = MeName &&
                'Date Signed Out' <= DateAdd(Today(), -42)
            )
        )
    Children:
      - conRoot_Hm:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =C_Bg
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conHdr_Hm:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(7, 95, 115, 1)
                  FillPortions: =0
                  Height: =Round(165 * UI, 0)
                  LayoutMinHeight: =Round(165 * UI, 0)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =App.Width
                Children:
                  - imgHdr_Hm:
                      Control: Image@2.2.3
                      Properties:
                        Height: =Parent.Height
                        Image: =HeaderImage
                        ImagePosition: =ImagePosition.Fill
                        Width: =Parent.Width
                  - lblKicker_Hm:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.8)
                        Font: =AppFont
                        FontWeight: =FontWeight.Bold
                        Height: =Round(23 * UI, 0)
                        Size: =Round(14 * UI, 0)
                        Text: ="STARS PHYSIOTHERAPY"
                        Width: =PageW - Round(50 * UI, 0)
                        Wrap: =false
                        X: =Gutter + Round(25 * UI, 0)
                        Y: =Round(33 * UI, 0)
                  - lblTitle_Hm:
                      Control: Label@2.5.1
                      Properties:
                        Color: =C_White
                        Font: =AppFont
                        FontWeight: =FontWeight.Bold
                        Height: =Round(70 * UI, 0)
                        Size: =Round(36 * UI, 0)
                        Text: ="Equipment"
                        Width: =PageW - Round(50 * UI, 0)
                        Wrap: =false
                        X: =Gutter + Round(25 * UI, 0)
                        Y: =Round(45 * UI, 0)
                  - lblHello_Hm:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.9)
                        Font: =AppFont
                        Height: =Round(28 * UI, 0)
                        Size: =Round(16 * UI, 0)
                        Text: ="Hi " & First(Split(MeName, " ")).Value & "  ·  " & Text(Today(), "dddd d mmmm")
                        Width: =PageW - Round(50 * UI, 0)
                        Wrap: =false
                        X: =Gutter + Round(25 * UI, 0)
                        Y: =Round(110 * UI, 0)
            - conBody_Hm:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =Round(15 * UI, 0)
                  LayoutMinHeight: =Round(250 * UI, 0)
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =Round(30 * UI, 0)
                  PaddingLeft: =Gutter + Round(20 * UI, 0)
                  PaddingRight: =Gutter + Round(20 * UI, 0)
                  PaddingTop: =Round(20 * UI, 0)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =App.Width
                Children:
                  - conScan_Hm:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        Fill: =C_Accent
                        FillPortions: =0
                        Height: =Round(140 * UI, 0)
                        LayoutMinHeight: =Round(140 * UI, 0)
                        RadiusBottomLeft: =Round(25 * UI, 0)
                        RadiusBottomRight: =Round(25 * UI, 0)
                        RadiusTopLeft: =Round(25 * UI, 0)
                        RadiusTopRight: =Round(25 * UI, 0)
                        Width: =PageW - Round(40 * UI, 0)
                      Children:
                        - conScanIc_Hm:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(255, 255, 255, 0.16)
                              Height: =Round(70 * UI, 0)
                              RadiusBottomLeft: =Round(35 * UI, 0)
                              RadiusBottomRight: =Round(35 * UI, 0)
                              RadiusTopLeft: =Round(35 * UI, 0)
                              RadiusTopRight: =Round(35 * UI, 0)
                              Width: =Round(70 * UI, 0)
                              X: =Round(25 * UI, 0)
                              Y: =Round(35 * UI, 0)
                            Children:
                              - icoScan_Hm:
                                  Control: ModernIcon@1.1.1
                                  Properties:
                                    Height: =Round(35 * UI, 0)
                                    Icon: ="Camera"
                                    IconColor: =C_White
                                    Width: =Round(35 * UI, 0)
                                    X: =Round(18 * UI, 0)
                                    Y: =Round(18 * UI, 0)
                        - lblScanT_Hm:
                            Control: Label@2.5.1
                            Properties:
                              Color: =C_White
                              Font: =AppFont
                              FontWeight: =FontWeight.Bold
                              Height: =Round(35 * UI, 0)
                              Size: =Round(24 * UI, 0)
                              Text: ="Scan Equipment"
                              Width: =Parent.Width - Round(135 * UI, 0)
                              Wrap: =false
                              X: =Round(115 * UI, 0)
                              Y: =Round(38 * UI, 0)
                        - lblScanS_Hm:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(255, 255, 255, 0.85)
                              Font: =AppFont
                              Height: =Round(25 * UI, 0)
                              Size: =Round(15 * UI, 0)
                              Text: ="Allocate, Return or Check an Item"
                              Width: =Parent.Width - Round(135 * UI, 0)
                              Wrap: =false
                              X: =Round(115 * UI, 0)
                              Y: =Round(75 * UI, 0)
                        - scnHome_Hm:
                            Control: BarcodeReader@1.0.25
                            Properties:
                              BorderStyle: =BorderStyle.None
                              FillColor: =RGBA(0, 0, 0, 0)
                              FontSize: =1
                              Height: =Parent.Height
                              HoverFillColor: =RGBA(255, 255, 255, 0.08)
                              OnScan: |-
                                =With(
                                    { code: Trim(First(scnHome_Hm.Barcodes).Value) },
                                    With(
                                        { it: LookUp(Equipment_Inventory_SharePoint, Title = code) },
                                        If(
                                            IsBlank(it),
                                            Notify("Equipment " & code & " was not found. Check the barcode and do not use the equipment.", NotificationType.Error),
                                            Set(varItemID, it.ID);
                                            Navigate(Item, ScreenTransition.Cover)
                                        )
                                    )
                                )
                              ScanningMode: ='BarcodeReader.ScanningMode'.SelectToScan
                              Text: =""
                              Width: =Parent.Width
