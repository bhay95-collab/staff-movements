Screens:
  Allocated:
    Properties:
      Fill: =C_Bg
      OnVisible: |-
        =ClearCollect(colAllocated, Filter(Equipment_Inventory_SharePoint, Status.Value = "Allocated"));
        Set(acWard, "All");
        Reset(txtSearch_Ac)
    Children:
      - conRoot_Ac:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =C_Bg
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conHdr_Ac:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(7, 95, 115, 1)
                  FillPortions: =0
                  Height: =Round(95 * UI, 0)
                  LayoutMinHeight: =Round(95 * UI, 0)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =App.Width
                Children:
                  - imgHdr_Ac:
                      Control: Image@2.2.3
                      Properties:
                        Height: =Parent.Height
                        Image: =HeaderImage
                        ImagePosition: =ImagePosition.Fill
                        Width: =Parent.Width
                  - btnBack_Ac:
                      Control: ModernButton@1.0.0
                      Properties:
                        Align: =Align.Center
                        Appearance: =ButtonAppearance.Transparent
                        Color: =C_White
                        FontWeight: =""
                        Height: =Round(60 * UI, 0)
                        Icon: ="ChevronLeft"
                        OnSelect: =Back(ScreenTransition.UnCoverRight)
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =5
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Size: =Round(32 * UI, 0)
                        Text: =""
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =Round(60 * UI, 0)
                        X: =Gutter + Round(5 * UI, 0)
                        Y: =Round(18 * UI, 0)
                  - lblHdrT_Ac:
                      Control: Label@2.5.1
                      Properties:
                        Color: =C_White
                        Font: =AppFont
                        FontWeight: =FontWeight.Bold
                        Height: =Round(42 * UI, 0)
                        Size: =Round(24 * UI, 0)
                        Text: ="All Allocated"
                        Width: =PageW - Round(85 * UI, 0)
                        Wrap: =false
                        X: =Gutter + Round(65 * UI, 0)
                        Y: =Round(12 * UI, 0)
                  - lblHdrS_Ac:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255, 255, 255, 0.85)
                        Font: =AppFont
                        Height: =Round(25 * UI, 0)
                        Size: =Round(15 * UI, 0)
                        Text: ="Everything signed out  ·  tap for details"
                        Width: =PageW - Round(85 * UI, 0)
                        Wrap: =false
                        X: =Gutter + Round(65 * UI, 0)
                        Y: =Round(53 * UI, 0)
            - conBody_Ac:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =Round(13 * UI, 0)
                  LayoutMinHeight: =Round(250 * UI, 0)
                  PaddingBottom: =Round(10 * UI, 0)
                  PaddingLeft: =Gutter + Round(20 * UI, 0)
                  PaddingRight: =Gutter + Round(20 * UI, 0)
                  PaddingTop: =Round(15 * UI, 0)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =App.Width
                Children:
                  - conSearch_Ac:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderColor: =RGBA(14, 42, 70, 0.22)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =C_White
                        FillPortions: =0
                        Height: =Round(60 * UI, 0)
                        LayoutMinHeight: =Round(60 * UI, 0)
                        RadiusBottomLeft: =Round(15 * UI, 0)
                        RadiusBottomRight: =Round(15 * UI, 0)
                        RadiusTopLeft: =Round(15 * UI, 0)
                        RadiusTopRight: =Round(15 * UI, 0)
                        Width: =PageW - Round(40 * UI, 0)
                      Children:
                        - icoSearch_Ac:
                            Control: ModernIcon@1.1.1
                            Properties:
                              Height: =Round(30 * UI, 0)
                              Icon: ="Search"
                              IconColor: =C_Muted
                              Width: =Round(30 * UI, 0)
                              X: =Round(15 * UI, 0)
                              Y: =Round(15 * UI, 0)
                        - txtSearch_Ac:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              BorderStyle: =BorderStyle.None
                              Color: =C_Ink
                              Default: =""
                              DelayOutput: =true
                              Fill: =RGBA(0, 0, 0, 0)
                              Font: =AppFont
                              Height: =Parent.Height
                              HintText: ="Code, patient, physio, URN or width"
                              Size: =Round(18 * UI, 0)
                              Width: =Parent.Width - Round(55 * UI, 0)
                              X: =Round(50 * UI, 0)
                  - conSegWard_Ac:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =Round(50 * UI, 0)
                        LayoutMinHeight: =Round(50 * UI, 0)
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =PageW - Round(40 * UI, 0)
                      Children:
                        - conSegWardAll_Ac:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =If(acWard = "All", C_Accent, C_Line)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =If(acWard = "All", C_Accent, C_White)
                              Height: =Round(50 * UI, 0)
                              RadiusBottomLeft: =Round(25 * UI, 0)
                              RadiusBottomRight: =Round(25 * UI, 0)
                              RadiusTopLeft: =Round(25 * UI, 0)
                              RadiusTopRight: =Round(25 * UI, 0)
                              Width: =(PageW - Round(40 * UI, 0) - Round(40 * UI, 0)) / 5
                              X: =0 * ((PageW - Round(40 * UI, 0) - Round(40 * UI, 0)) / 5 + Round(10 * UI, 0))
                            Children:
                              - btnSegWardAll_Ac:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Appearance: =ButtonAppearance.Transparent
                                    Color: =If(acWard = "All", C_White, C_Ink2)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =63
                                    OnSelect: =Set(acWard, "All")
                                    PaddingBottom: =5
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =5
                                    RadiusBottomLeft: =Round(25 * UI, 0)
                                    RadiusBottomRight: =Round(25 * UI, 0)
                                    RadiusTopLeft: =Round(25 * UI, 0)
                                    RadiusTopRight: =Round(25 * UI, 0)
                                    Size: =Round(16 * UI, 0)
                                    Text: ="All"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =108
                        - conSegWard4A_Ac:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =If(acWard = "4A", C_Accent, C_Line)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =If(acWard = "4A", C_Accent, C_White)
                              Height: =Round(50 * UI, 0)
                              RadiusBottomLeft: =Round(25 * UI, 0)
                              RadiusBottomRight: =Round(25 * UI, 0)
                              RadiusTopLeft: =Round(25 * UI, 0)
                              RadiusTopRight: =Round(25 * UI, 0)
                              Width: =(PageW - Round(40 * UI, 0) - Round(40 * UI, 0)) / 5
                              X: =1 * ((PageW - Round(40 * UI, 0) - Round(40 * UI, 0)) / 5 + Round(10 * UI, 0))
                            Children:
                              - btnSegWard4A_Ac:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Appearance: =ButtonAppearance.Transparent
                                    Color: =If(acWard = "4A", C_White, C_Ink2)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =63
                                    OnSelect: =Set(acWard, "4A")
                                    PaddingBottom: =5
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =5
                                    RadiusBottomLeft: =Round(25 * UI, 0)
                                    RadiusBottomRight: =Round(25 * UI, 0)
                                    RadiusTopLeft: =Round(25 * UI, 0)
                                    RadiusTopRight: =Round(25 * UI, 0)
                                    Size: =Round(16 * UI, 0)
                                    Text: ="4A"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =108
                        - conSegWard4B_Ac:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =If(acWard = "4B", C_Accent, C_Line)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =If(acWard = "4B", C_Accent, C_White)
                              Height: =Round(50 * UI, 0)
                              RadiusBottomLeft: =Round(25 * UI, 0)
                              RadiusBottomRight: =Round(25 * UI, 0)
                              RadiusTopLeft: =Round(25 * UI, 0)
                              RadiusTopRight: =Round(25 * UI, 0)
                              Width: =(PageW - Round(40 * UI, 0) - Round(40 * UI, 0)) / 5
                              X: =2 * ((PageW - Round(40 * UI, 0) - Round(40 * UI, 0)) / 5 + Round(10 * UI, 0))
                            Children:
                              - btnSegWard4B_Ac:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Appearance: =ButtonAppearance.Transparent
                                    Color: =If(acWard = "4B", C_White, C_Ink2)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =63
                                    OnSelect: =Set(acWard, "4B")
                                    PaddingBottom: =5
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =5
                                    RadiusBottomLeft: =Round(25 * UI, 0)
                                    RadiusBottomRight: =Round(25 * UI, 0)
                                    RadiusTopLeft: =Round(25 * UI, 0)
                                    RadiusTopRight: =Round(25 * UI, 0)
                                    Size: =Round(16 * UI, 0)
                                    Text: ="4B"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =108
                        - conSegWard5A_Ac:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =If(acWard = "5A", C_Accent, C_Line)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =If(acWard = "5A", C_Accent, C_White)
                              Height: =Round(50 * UI, 0)
                              RadiusBottomLeft: =Round(25 * UI, 0)
                              RadiusBottomRight: =Round(25 * UI, 0)
                              RadiusTopLeft: =Round(25 * UI, 0)
                              RadiusTopRight: =Round(25 * UI, 0)
                              Width: =(PageW - Round(40 * UI, 0) - Round(40 * UI, 0)) / 5
                              X: =3 * ((PageW - Round(40 * UI, 0) - Round(40 * UI, 0)) / 5 + Round(10 * UI, 0))
                            Children:
                              - btnSegWard5A_Ac:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Appearance: =ButtonAppearance.Transparent
                                    Color: =If(acWard = "5A", C_White, C_Ink2)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =63
                                    OnSelect: =Set(acWard, "5A")
                                    PaddingBottom: =5
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =5
                                    RadiusBottomLeft: =Round(25 * UI, 0)
                                    RadiusBottomRight: =Round(25 * UI, 0)
                                    RadiusTopLeft: =Round(25 * UI, 0)
                                    RadiusTopRight: =Round(25 * UI, 0)
                                    Size: =Round(16 * UI, 0)
                                    Text: ="5A"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =108
                        - conSegWard6A_Ac:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =If(acWard = "6A", C_Accent, C_Line)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =If(acWard = "6A", C_Accent, C_White)
                              Height: =Round(50 * UI, 0)
                              RadiusBottomLeft: =Round(25 * UI, 0)
                              RadiusBottomRight: =Round(25 * UI, 0)
                              RadiusTopLeft: =Round(25 * UI, 0)
                              RadiusTopRight: =Round(25 * UI, 0)
                              Width: =(PageW - Round(40 * UI, 0) - Round(40 * UI, 0)) / 5
                              X: =4 * ((PageW - Round(40 * UI, 0) - Round(40 * UI, 0)) / 5 + Round(10 * UI, 0))
                            Children:
                              - btnSegWard6A_Ac:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Appearance: =ButtonAppearance.Transparent
                                    Color: =If(acWard = "6A", C_White, C_Ink2)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =63
                                    OnSelect: =Set(acWard, "6A")
                                    PaddingBottom: =5
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =5
                                    RadiusBottomLeft: =Round(25 * UI, 0)
                                    RadiusBottomRight: =Round(25 * UI, 0)
                                    RadiusTopLeft: =Round(25 * UI, 0)
                                    RadiusTopRight: =Round(25 * UI, 0)
                                    Size: =Round(16 * UI, 0)
                                    Text: ="6A"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =108
                  - lblCount_Ac:
                      Control: Label@2.5.1
                      Properties:
                        Color: =C_Ink
                        Font: =AppFont
                        FontWeight: =FontWeight.Bold
                        Height: =Round(28 * UI, 0)
                        LayoutMinHeight: =Round(28 * UI, 0)
                        Size: =Round(16 * UI, 0)
                        Text: =CountRows(galAlloc_Ac.AllItems) & " Signed Out" & If(acWard = "All", "", " on " & acWard)
                        Width: =PageW - Round(40 * UI, 0)
                        Wrap: =false
                  - galAlloc_Ac:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        Items: |-
                          =With({ q: Lower(Trim(txtSearch_Ac.Text)) }, SortByColumns(Filter(colAllocated, (acWard = "All" || Ward.Value = acWard) && (IsBlank(q) || q in Lower(Title) || q in Lower('Patient Name') || q in Lower(Physiotherapist) || q in Lower(URN) || q in Lower(Width.Value))), "Title", SortOrder.Ascending))
                        LayoutMinHeight: =Round(150 * UI, 0)
                        TemplatePadding: =0
                        TemplateSize: =Round(135 * UI, 0)
                        Width: =PageW - Round(40 * UI, 0)
                      Children:
                        - conRow_Ac:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =C_Line
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =C_White
                              Height: =Round(125 * UI, 0)
                              RadiusBottomLeft: =Round(18 * UI, 0)
                              RadiusBottomRight: =Round(18 * UI, 0)
                              RadiusTopLeft: =Round(18 * UI, 0)
                              RadiusTopRight: =Round(18 * UI, 0)
                              Width: =Parent.TemplateWidth - Round(5 * UI, 0)
                              X: =1
                              Y: =Round(5 * UI, 0)
                            Children:
                              - conRowBar_Ac:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Switch(ThisItem.Category.Value, "Wheelchair", RGBA(166, 199, 130, 1), "Cushion", RGBA(0, 144, 153, 1), "Backrest", RGBA(0, 200, 210, 1), RGBA(210, 218, 227, 1))
                                    Height: =Parent.Height
                                    RadiusBottomLeft: =Round(18 * UI, 0)
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =Round(18 * UI, 0)
                                    RadiusTopRight: =0
                                    Width: =Round(8 * UI, 0)
                              - lblRowT_Ac:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =C_Ink
                                    Font: =AppFont
                                    FontWeight: =FontWeight.Bold
                                    Height: =Round(30 * UI, 0)
                                    Size: =Round(18 * UI, 0)
                                    Text: =Coalesce(Trim(ThisItem.Brand & " " & ThisItem.Model), ThisItem.Title)
                                    Width: =Parent.Width - Round(125 * UI, 0)
                                    Wrap: =false
                                    X: =Round(23 * UI, 0)
                                    Y: =Round(10 * UI, 0)
                              - lblRow0_Ac:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =C_Muted
                                    Font: =AppFont
                                    Height: =Round(23 * UI, 0)
                                    Size: =Round(15 * UI, 0)
                                    Text: =ThisItem.Title & "  ·  " & Coalesce(ThisItem.Category.Value, "")
                                    Width: =Parent.Width - Round(125 * UI, 0)
                                    Wrap: =false
                                    X: =Round(23 * UI, 0)
                                    Y: =Round(40 * UI, 0)
                              - lblRow1_Ac:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =C_Ink2
                                    Font: =AppFont
                                    Height: =Round(23 * UI, 0)
                                    Size: =Round(15 * UI, 0)
                                    Text: =ThisItem.'Patient Name' & "  ·  Ward " & Coalesce(ThisItem.Ward.Value, "—")
                                    Width: =Parent.Width - Round(125 * UI, 0)
                                    Wrap: =false
                                    X: =Round(23 * UI, 0)
                                    Y: =Round(63 * UI, 0)
                              - lblRow2_Ac:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =C_Muted
                                    Font: =AppFont
                                    Height: =Round(23 * UI, 0)
                                    Size: =Round(15 * UI, 0)
                                    Text: =Coalesce(ThisItem.Physiotherapist, "—") & "  ·  " & Text(ThisItem.'Date Signed Out', "d mmm")
                                    Width: =Parent.Width - Round(125 * UI, 0)
                                    Wrap: =false
                                    X: =Round(23 * UI, 0)
                                    Y: =Round(85 * UI, 0)
                              - conDays_Ac:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =If(DateDiff(ThisItem.'Date Signed Out', Today(), TimeUnit.Days) >= 42, C_DangerBg, C_Bg)
                                    Height: =Round(33 * UI, 0)
                                    RadiusBottomLeft: =Round(16 * UI, 0)
                                    RadiusBottomRight: =Round(16 * UI, 0)
                                    RadiusTopLeft: =Round(16 * UI, 0)
                                    RadiusTopRight: =Round(16 * UI, 0)
                                    Width: =Round(75 * UI, 0)
                                    X: =Parent.Width - Round(93 * UI, 0)
                                    Y: =Round(13 * UI, 0)
                                  Children:
                                    - lblDays_Ac:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          Color: =If(DateDiff(ThisItem.'Date Signed Out', Today(), TimeUnit.Days) >= 42, C_Danger, C_Ink2)
                                          Font: =AppFont
                                          FontWeight: =FontWeight.Bold
                                          Height: =Parent.Height
                                          Size: =Round(15 * UI, 0)
                                          Text: =DateDiff(ThisItem.'Date Signed Out', Today(), TimeUnit.Days) & "d"
                                          Width: =Parent.Width
                                          Wrap: =false
                              - btnRow_Ac:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Appearance: =ButtonAppearance.Transparent
                                    BorderStyle: =BorderStyle.None
                                    FontWeight: =""
                                    Height: =Parent.Height
                                    OnSelect: |-
                                      =Set(varItemID, ThisItem.ID);
                                      Navigate(Item, ScreenTransition.Cover)
                                    PaddingBottom: =5
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =5
                                    RadiusBottomLeft: =4
                                    RadiusBottomRight: =4
                                    RadiusTopLeft: =4
                                    RadiusTopRight: =4
                                    Size: =0
                                    Text: =""
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =Parent.Width
                  - lblEmpty_Ac:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =C_Muted
                        Font: =AppFont
                        Height: =Round(50 * UI, 0)
                        LayoutMinHeight: =Round(50 * UI, 0)
                        Size: =Round(16 * UI, 0)
                        Text: ="Nothing matches."
                        Visible: =IsEmpty(galAlloc_Ac.AllItems)
                        Width: =PageW - Round(40 * UI, 0)
