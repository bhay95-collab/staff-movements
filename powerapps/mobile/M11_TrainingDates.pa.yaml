Screens:
  TrainingDates:
    Properties:
      Fill: =C_Bg
      OnVisible: |-
        =Set(trShowAdd, false);
        Set(trShowWait, false);
        Set(trShowEmail, false);
        Set(trShowConfirm, false);
        If(IsBlank(trType), Set(trType, "Basic Life Support"));
        Select(btnLoad_Tds)
    Children:
      - btnLoad_Tds:
          Control: ModernButton@1.0.0
          Properties:
            Align: =Align.Center
            FontWeight: =""
            Height: =1
            OnSelect: |-
              =// everything on this screen is read once here, then worked out on the device
              Set(trLoading, true);
              Refresh(TrainingSessions);
              Refresh(TrainingBookings);
              Refresh(TrainingWaitlist);
              ClearCollect(
                  colTrBookings,
                  Filter(
                      TrainingBookings,
                      BookingStatus.Value = "Booked" && TrainingType = trType && SessionDate >= Today()
                  )
              );
              ClearCollect(colTrWait, Filter(TrainingWaitlist, WaitlistStatus.Value = "Waiting"));
              ClearCollect(
                  colTrSessions,
                  AddColumns(
                      AddColumns(
                          AddColumns(
                              SortByColumns(
                                  Filter(
                                      TrainingSessions,
                                      IsActive = true && TrainingType.Value = trType && SessionDate >= Today()
                                  ),
                                  "SessionDate",
                                  SortOrder.Ascending
                              ),
                              SesKey, Text(ID),
                              Cap, Coalesce(Capacity, If(trType = "Manual Handling", 8, 6))
                          ),
                          Booked, CountRows(Filter(colTrBookings, SessionID = SesKey)),
                          MyBookingID, LookUp(colTrBookings, SessionID = SesKey && Lower(BookedUserEmail) = MeEmail).ID,
                          MyWaitID, LookUp(colTrWait, SessionID = SesKey && Lower(WaitlistUserEmail) = MeEmail).ID,
                          MyWaitOn, LookUp(colTrWait, SessionID = SesKey && Lower(WaitlistUserEmail) = MeEmail).AddedOn,
                          WaitCount, CountRows(Filter(colTrWait, SessionID = SesKey))
                      ),
                      Free, Cap - Booked,
                      MyWaitPos, If(IsBlank(MyWaitOn), 0, CountRows(Filter(colTrWait, SessionID = SesKey && AddedOn <= MyWaitOn)))
                  )
              );

              // keep the chosen date selected (with fresh numbers), or open the one asked for from Home
              If(
                  !IsBlank(trOpen),
                  Set(trSel, LookUp(colTrSessions, ID = trOpen));
                  Set(trOpen, Blank()),

                  !IsBlank(trSel),
                  Set(trSel, LookUp(colTrSessions, ID = trSel.ID))
              );
              Set(trLoading, false);
              Select(btnSlots_Tds)
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =0
            Text: =""
            VerticalAlign: =VerticalAlign.Middle
            Visible: =false
            Width: =1
      - btnSlots_Tds:
          Control: ModernButton@1.0.0
          Properties:
            Align: =Align.Center
            FontWeight: =""
            Height: =1
            OnSelect: |-
              =ClearCollect(
                  colTrSlots,
                  ForAll(
                      Sequence(Coalesce(trSel.Cap, 0)) As n,
                      {
                          SlotNo: n.Value,
                          Booking: LookUp(
                              colTrBookings,
                              SessionID = Coalesce(trSel.SesKey, "") && SlotNumber = n.Value
                          )
                      }
                  )
              )
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =0
            Text: =""
            VerticalAlign: =VerticalAlign.Middle
            Visible: =false
            Width: =1
      - btnDoBook_Tds:
          Control: ModernButton@1.0.0
          Properties:
            Align: =Align.Center
            FontWeight: =""
            Height: =1
            OnSelect: |-
              =With(
                  { s: trSel },
                  Refresh(TrainingBookings);
                  With(
                      { bookedNow: Filter(TrainingBookings, SessionID = s.SesKey && BookingStatus.Value = "Booked") },
                      If(
                          !IsBlank(LookUp(bookedNow, Lower(BookedUserEmail) = MeEmail)),
                          Notify("You are already booked into this session.", NotificationType.Warning);
                          Select(btnLoad_Tds),

                          CountRows(bookedNow) >= s.Cap,
                          Notify("Sorry, that session has just filled up.", NotificationType.Warning);
                          Select(btnLoad_Tds),

                          With(
                              {
                                  slot: First(
                                      Filter(
                                          ForAll(Sequence(s.Cap) As n, { SlotNo: n.Value }),
                                          IsBlank(LookUp(bookedNow, SlotNumber = SlotNo))
                                      )
                                  ).SlotNo
                              },
                              With(
                                  {
                                      rec: Patch(
                                          TrainingBookings,
                                          Defaults(TrainingBookings),
                                          {
                                              Title: trType & " - " & MeName,
                                              SessionID: s.SesKey,
                                              TrainingType: trType,
                                              SessionDate: s.SessionDate,
                                              SlotNumber: slot,
                                              BookedUserName: MeName,
                                              BookedUserEmail: MeEmail,
                                              BookingStatus: { Value: "Booked" },
                                              BookedOn: Now()
                                          }
                                      )
                                  },
                                  If(
                                      !IsEmpty(Errors(TrainingBookings)),
                                      Notify("Could not book. Please try again.", NotificationType.Error),

                                      // two people can take the same slot at the same moment: the earlier booking keeps it
                                      Refresh(TrainingBookings);
                                      If(
                                          rec.ID > Min(
                                              Filter(TrainingBookings, SessionID = s.SesKey && SlotNumber = slot && BookingStatus.Value = "Booked"),
                                              ID
                                          ),
                                          Patch(TrainingBookings, LookUp(TrainingBookings, ID = rec.ID), { BookingStatus: { Value: "Cancelled" } });
                                          Notify("Someone else just took that place. Please try again.", NotificationType.Warning),

                                          If(
                                              !IsBlank(s.MyWaitID),
                                              Patch(TrainingWaitlist, LookUp(TrainingWaitlist, ID = s.MyWaitID), { WaitlistStatus: { Value: "Removed" } })
                                          );
                                          IfError(
                                              TrainingBookingConfirmationEmail.Run("Booked", MeName, MeEmail, s.SesKey, trType, ""),
                                              Notify("You are booked, but the confirmation email could not be sent.", NotificationType.Warning)
                                          );
                                          Notify("You are booked into this session.", NotificationType.Success)
                                      );
                                      Select(btnLoad_Tds)
                                  )
                              )
                          )
                      )
                  )
              )
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =0
            Text: =""
            VerticalAlign: =VerticalAlign.Middle
            Visible: =false
            Width: =1
      - btnDoCancel_Tds:
          Control: ModernButton@1.0.0
          Properties:
            Align: =Align.Center
            FontWeight: =""
            Height: =1
            OnSelect: |-
              =With(
                  { s: trSel },
                  With(
                      { b: LookUp(TrainingBookings, ID = s.MyBookingID) },
                      If(
                          IsBlank(b),
                          Notify("That booking could not be found.", NotificationType.Warning);
                          Set(trShowConfirm, false);
                          Select(btnLoad_Tds),

                          Patch(TrainingBookings, b, { BookingStatus: { Value: "Cancelled" } });
                          If(
                              !IsEmpty(Errors(TrainingBookings)),
                              Notify("Could not remove the booking. Please try again.", NotificationType.Error),

                              IfError(
                                  TrainingBookingConfirmationEmail.Run("Cancelled", b.BookedUserName, b.BookedUserEmail, s.SesKey, trType, Text(b.ID)),
                                  Notify("The booking was removed, but the email could not be sent.", NotificationType.Warning)
                              );
                              IfError(TrainingWaitlistNotification.Run(s.SesKey, trType), Blank());
                              Set(trShowConfirm, false);
                              Notify("Your booking has been removed.", NotificationType.Success);
                              Select(btnLoad_Tds)
                          )
                      )
                  )
              )
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =0
            Text: =""
            VerticalAlign: =VerticalAlign.Middle
            Visible: =false
            Width: =1
      - btnDoRemove_Tds:
          Control: ModernButton@1.0.0
          Properties:
            Align: =Align.Center
            FontWeight: =""
            Height: =1
            OnSelect: |-
              =With(
                  { s: trSel },
                  With(
                      { b: LookUp(TrainingBookings, ID = trSlot.ID) },
                      If(
                          IsBlank(b),
                          Notify("That booking could not be found.", NotificationType.Warning);
                          Set(trShowConfirm, false);
                          Select(btnLoad_Tds),

                          Patch(TrainingBookings, b, { BookingStatus: { Value: "Cancelled" } });
                          If(
                              !IsEmpty(Errors(TrainingBookings)),
                              Notify("Could not remove the booking. Please try again.", NotificationType.Error),

                              IfError(
                                  TrainingBookingConfirmationEmail.Run("Cancelled", b.BookedUserName, b.BookedUserEmail, s.SesKey, trType, Text(b.ID)),
                                  Notify("The booking was removed, but the email could not be sent.", NotificationType.Warning)
                              );
                              IfError(TrainingWaitlistNotification.Run(s.SesKey, trType), Blank());
                              Set(trShowConfirm, false);
                              Notify("The booking has been removed.", NotificationType.Success);
                              Select(btnLoad_Tds)
                          )
                      )
                  )
              )
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =0
            Text: =""
            VerticalAlign: =VerticalAlign.Middle
            Visible: =false
            Width: =1
      - btnDoDelete_Tds:
          Control: ModernButton@1.0.0
          Properties:
            Align: =Align.Center
            FontWeight: =""
            Height: =1
            OnSelect: |-
              =With(
                  { s: trSel },
                  Refresh(TrainingBookings);
                  Refresh(TrainingWaitlist);
                  If(
                      CountRows(Filter(TrainingBookings, SessionID = s.SesKey && BookingStatus.Value = "Booked")) > 0 ||
                      CountRows(Filter(TrainingWaitlist, SessionID = s.SesKey && WaitlistStatus.Value = "Waiting")) > 0,
                      Notify("This date cannot be deleted while people are booked or waiting. Remove them first.", NotificationType.Warning);
                      Set(trShowConfirm, false),

                      // the date is hidden, not erased, so the history is kept
                      Patch(TrainingSessions, LookUp(TrainingSessions, ID = s.ID), { IsActive: false });
                      If(
                          !IsEmpty(Errors(TrainingSessions)),
                          Notify("Could not delete the date. Please try again.", NotificationType.Error),
                          Set(trShowConfirm, false);
                          Set(trSel, Blank());
                          Notify("Training date deleted.", NotificationType.Success);
                          Select(btnLoad_Tds)
                      )
                  )
              )
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =0
            Text: =""
            VerticalAlign: =VerticalAlign.Middle
            Visible: =false
            Width: =1
      - btnDoJoin_Tds:
          Control: ModernButton@1.0.0
          Properties:
            Align: =Align.Center
            FontWeight: =""
            Height: =1
            OnSelect: |-
              =With(
                  { s: trSel },
                  If(
                      !IsBlank(s.MyWaitID) || !IsBlank(s.MyBookingID),
                      Blank(),
                      Patch(
                          TrainingWaitlist,
                          Defaults(TrainingWaitlist),
                          {
                              Title: trType & " - " & MeName,
                              SessionID: s.SesKey,
                              WaitlistUserName: MeName,
                              WaitlistUserEmail: MeEmail,
                              WaitlistStatus: { Value: "Waiting" },
                              AddedOn: Now()
                          }
                      );
                      If(
                          !IsEmpty(Errors(TrainingWaitlist)),
                          Notify("Could not join the waitlist. Please try again.", NotificationType.Error),
                          IfError(
                              TrainingBookingConfirmationEmail.Run("Waitlisted", MeName, MeEmail, s.SesKey, trType, ""),
                              Blank()
                          );
                          Notify("You are on the waitlist. You will get an email if a place opens.", NotificationType.Success);
                          Select(btnLoad_Tds)
                      )
                  )
              )
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =0
            Text: =""
            VerticalAlign: =VerticalAlign.Middle
            Visible: =false
            Width: =1
      - btnDoLeave_Tds:
          Control: ModernButton@1.0.0
          Properties:
            Align: =Align.Center
            FontWeight: =""
            Height: =1
            OnSelect: |-
              =With(
                  { s: trSel },
                  Patch(TrainingWaitlist, LookUp(TrainingWaitlist, ID = s.MyWaitID), { WaitlistStatus: { Value: "Removed" } });
                  If(
                      !IsEmpty(Errors(TrainingWaitlist)),
                      Notify("Could not leave the waitlist. Please try again.", NotificationType.Error),
                      IfError(
                          TrainingBookingConfirmationEmail.Run("WaitlistRemoved", MeName, MeEmail, s.SesKey, trType, ""),
                          Blank()
                      );
                      Notify("You have been removed from the waitlist.", NotificationType.Success);
                      Select(btnLoad_Tds)
                  )
              )
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =0
            Text: =""
            VerticalAlign: =VerticalAlign.Middle
            Visible: =false
            Width: =1
      - btnDoAdd_Tds:
          Control: ModernButton@1.0.0
          Properties:
            Align: =Align.Center
            FontWeight: =""
            Height: =1
            OnSelect: |-
              =With(
                  {
                      t: ddType_Tds.Selected.Value,
                      d: dpDate_Tds.SelectedDate,
                      loc: Trim(txtLoc_Tds.Text)
                  },
                  With(
                      { when: d + Time(Value(ddHour_Tds.Selected.Value), Value(ddMin_Tds.Selected.Value), 0) },
                      If(
                          IsBlank(t),
                          Notify("Please select a training type.", NotificationType.Warning),

                          IsBlank(d),
                          Notify("Please select a date.", NotificationType.Warning),

                          IsBlank(loc),
                          Notify("Please enter a location.", NotificationType.Warning),

                          when < Now(),
                          Notify("That date and time has already passed.", NotificationType.Warning),

                          !IsBlank(LookUp(TrainingSessions, TrainingType.Value = t && SessionDate = when && IsActive = true)),
                          Notify("A session already exists for that date and time.", NotificationType.Warning),

                          Patch(
                              TrainingSessions,
                              Defaults(TrainingSessions),
                              {
                                  Title: t & " - " & Text(when, "dd/mm/yyyy hh:mm"),
                                  TrainingType: { Value: t },
                                  SessionDate: when,
                                  Location: loc,
                                  Capacity: If(t = "Manual Handling", 8, 6),
                                  IsActive: true
                              }
                          );
                          If(
                              !IsEmpty(Errors(TrainingSessions)),
                              Notify("Could not save the date. Please try again.", NotificationType.Error),
                              Set(trShowAdd, false);
                              Set(trType, t);
                              Set(trSel, Blank());
                              Notify("Training date added.", NotificationType.Success);
                              Select(btnLoad_Tds)
                          )
                      )
                  )
              )
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =0
            Text: =""
            VerticalAlign: =VerticalAlign.Middle
            Visible: =false
            Width: =1
      - btnDoSend_Tds:
          Control: ModernButton@1.0.0
          Properties:
            Align: =Align.Center
            FontWeight: =""
            Height: =1
            OnSelect: |-
              =With(
                  { to: Concat(Filter(colTrBookings, SessionID = trSel.SesKey), BookedUserEmail, ";") },
                  If(
                      IsBlank(to),
                      Notify("Nobody is booked into this date yet.", NotificationType.Warning),
                      IfError(
                          With(
                              {
                                  subj: Trim(txtEmailSubject_Tds.Text),
                                  msg: Substitute(Substitute(Substitute(Substitute(txtEmailBody_Tds.Text, "&", "&amp;"), "<", "&lt;"), Char(13), ""), Char(10), "<br>")
                              },
                              Office365Outlook.SendEmailV2(
                                  to,
                                  subj,
                                  Substitute(Substitute(EmailHead, "{{TITLE}}", Substitute(Substitute(subj, "&", "&amp;"), "<", "&lt;")), "{{SUB}}", trType & "&nbsp;&nbsp;|&nbsp;&nbsp;" & Text(trSel.SessionDate, "ddd d mmm yyyy") & "&nbsp;&nbsp;|&nbsp;&nbsp;" & Text(trSel.SessionDate, "h:mm AM/PM")) &
                                  "<tr><td style='padding:28px 32px 0 32px;font-size:15px;line-height:23px;color:#3A5068;'>" & msg & "</td></tr>" &
                                  "<tr><td style='padding:20px 32px 0 32px;'><div style='font-size:11px;font-weight:700;letter-spacing:1px;color:#8C9BAE;padding:0 0 8px 2px;'>SESSION</div><table role='presentation' width='100%' cellpadding='0' cellspacing='0' border='0' style='border-collapse:separate;border-spacing:0;width:100%;border:1px solid #E3EAF1;border-radius:14px;overflow:hidden;'>" & "<tr><td style='width:190px;padding:10px 14px;background-color:#F7FAFC;font-size:11px;font-weight:600;letter-spacing:1px;color:#8C9BAE;'>COURSE</td><td style='padding:10px 14px;font-size:14px;color:#0E1C2A;'>" & trType & "</td></tr>" & "<tr><td style='width:190px;padding:10px 14px;background-color:#F7FAFC;font-size:11px;font-weight:600;letter-spacing:1px;color:#8C9BAE;border-top:1px solid #E3EAF1;'>DATE</td><td style='padding:10px 14px;font-size:14px;color:#0E1C2A;border-top:1px solid #E3EAF1;'>" & Text(trSel.SessionDate, "dddd d mmmm yyyy") & "</td></tr>" & "<tr><td style='width:190px;padding:10px 14px;background-color:#F7FAFC;font-size:11px;font-weight:600;letter-spacing:1px;color:#8C9BAE;border-top:1px solid #E3EAF1;'>TIME</td><td style='padding:10px 14px;font-size:14px;color:#0E1C2A;border-top:1px solid #E3EAF1;'>" & Text(trSel.SessionDate, "h:mm AM/PM") & "</td></tr>" & "<tr><td style='width:190px;padding:10px 14px;background-color:#F7FAFC;font-size:11px;font-weight:600;letter-spacing:1px;color:#8C9BAE;border-top:1px solid #E3EAF1;'>LOCATION</td><td style='padding:10px 14px;font-size:14px;color:#0E1C2A;border-top:1px solid #E3EAF1;'>" & Coalesce(trSel.Location, "To be confirmed") & "</td></tr>" & "</table></td></tr>" &
                                  "<tr><td style='padding:8px 32px 20px 32px;'>&nbsp;</td></tr>" &
                                  Substitute(EmailFoot, "{{NOTE}}", "You are receiving this because you are booked into this session."),
                                  { IsHtml: true }
                              )
                          );
                          Set(trShowEmail, false);
                          Notify("Email sent to the booked attendees.", NotificationType.Success),
                          Notify("The email could not be sent. Please try again.", NotificationType.Error)
                      )
                  )
              )
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =0
            Text: =""
            VerticalAlign: =VerticalAlign.Middle
            Visible: =false
            Width: =1
      - btnDoSendWait_Tds:
          Control: ModernButton@1.0.0
          Properties:
            Align: =Align.Center
            FontWeight: =""
            Height: =1
            OnSelect: |-
              =With(
                  { to: Concat(Filter(colTrWait, SessionID = trSel.SesKey), WaitlistUserEmail, ";") },
                  If(
                      IsBlank(to),
                      Notify("There are no waitlist users to email.", NotificationType.Warning),
                      IfError(
                          Office365Outlook.SendEmailV2(
                              to,
                              trType & " training: a place may be available (" & Text(trSel.SessionDate, "dd/mm/yyyy h:mm AM/PM") & ")",
                              Substitute(Substitute(EmailHead, "{{TITLE}}", "A place may be available"), "{{SUB}}", trType & "&nbsp;&nbsp;|&nbsp;&nbsp;" & Text(trSel.SessionDate, "ddd d mmm yyyy") & "&nbsp;&nbsp;|&nbsp;&nbsp;" & Text(trSel.SessionDate, "h:mm AM/PM")) &
                              "<tr><td style='padding:28px 32px 0 32px;font-size:15px;line-height:23px;color:#3A5068;'>Hi all,<br><br>A place may have opened up for the <b style='color:#0E1C2A;'>" & trType & "</b> session below. " &
                              "If you would like it, open the STARS Physiotherapy app, go to <b style='color:#0E1C2A;'>Training</b> and book a place. " &
                              "Places are given to whoever books first.</td></tr>" &
                              "<tr><td style='padding:20px 32px 0 32px;'><div style='font-size:11px;font-weight:700;letter-spacing:1px;color:#8C9BAE;padding:0 0 8px 2px;'>SESSION</div><table role='presentation' width='100%' cellpadding='0' cellspacing='0' border='0' style='border-collapse:separate;border-spacing:0;width:100%;border:1px solid #E3EAF1;border-radius:14px;overflow:hidden;'>" & "<tr><td style='width:190px;padding:10px 14px;background-color:#F7FAFC;font-size:11px;font-weight:600;letter-spacing:1px;color:#8C9BAE;'>COURSE</td><td style='padding:10px 14px;font-size:14px;color:#0E1C2A;'>" & trType & "</td></tr>" & "<tr><td style='width:190px;padding:10px 14px;background-color:#F7FAFC;font-size:11px;font-weight:600;letter-spacing:1px;color:#8C9BAE;border-top:1px solid #E3EAF1;'>DATE</td><td style='padding:10px 14px;font-size:14px;color:#0E1C2A;border-top:1px solid #E3EAF1;'>" & Text(trSel.SessionDate, "dddd d mmmm yyyy") & "</td></tr>" & "<tr><td style='width:190px;padding:10px 14px;background-color:#F7FAFC;font-size:11px;font-weight:600;letter-spacing:1px;color:#8C9BAE;border-top:1px solid #E3EAF1;'>TIME</td><td style='padding:10px 14px;font-size:14px;color:#0E1C2A;border-top:1px solid #E3EAF1;'>" & Text(trSel.SessionDate, "h:mm AM/PM") & "</td></tr>" & "<tr><td style='width:190px;padding:10px 14px;background-color:#F7FAFC;font-size:11px;font-weight:600;letter-spacing:1px;color:#8C9BAE;border-top:1px solid #E3EAF1;'>LOCATION</td><td style='padding:10px 14px;font-size:14px;color:#0E1C2A;border-top:1px solid #E3EAF1;'>" & Coalesce(trSel.Location, "To be confirmed") & "</td></tr>" & "</table></td></tr>" &
                              "<tr><td style='padding:24px 32px 28px 32px;font-size:15px;line-height:22px;color:#3A5068;'>Thanks,<br><b style='color:#0E1C2A;'>" & MeName & "</b></td></tr>" &
                              Substitute(EmailFoot, "{{NOTE}}", "You are receiving this because you are on the waitlist for this session."),
                              { IsHtml: true }
                          );
                          Notify("Email sent to the waitlist.", NotificationType.Success),
                          Notify("The email could not be sent. Please try again.", NotificationType.Error)
                      )
                  )
              )
            PaddingBottom: =5
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =5
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =0
            Text: =""
            VerticalAlign: =VerticalAlign.Middle
            Visible: =false
            Width: =1
      - conRoot_Td:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =C_Bg
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conHdr_Td:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(7, 95, 115, 1)
                  FillPortions: =0
                  Height: =Round(95 * UI, 0)
                  LayoutMinHeight: =Round(95 * UI, 0)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
