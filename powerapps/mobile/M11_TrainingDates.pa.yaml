Screens:
  TrainingDates:
    Properties:
      Fill: =C_Bg
      OnVisible: |-
        =Set(trShowAdd, false);
        Set(trShowWait, false);
        Set(trShowEmail, false);
        Set(trShowConfirm, false);
        If(IsBlank(trType), Set(trType, "Basic Life Support"));
        Select(btnLoad_Tds)
    Children:
      - btnLoad_Tds:
          Control: Button@0.0.45
          Properties:
            Height: =1
            Width: =1
            X: =0
            Y: =0
            Text: =""
            Visible: =false
            OnSelect: |-
              =// everything on this screen is read once here, then worked out on the device
              Set(trLoading, true);
              Refresh(TrainingSessions);
              Refresh(TrainingBookings);
              Refresh(TrainingWaitlist);
              ClearCollect(
                  colTrBookings,
                  Filter(
                      TrainingBookings,
                      BookingStatus.Value = "Booked" && TrainingType = trType && SessionDate >= Today()
                  )
              );
              ClearCollect(colTrWait, Filter(TrainingWaitlist, WaitlistStatus.Value = "Waiting"));
              ClearCollect(
                  colTrSessions,
                  AddColumns(
                      AddColumns(
                          AddColumns(
                              SortByColumns(
                                  Filter(
                                      TrainingSessions,
                                      IsActive = true && TrainingType.Value = trType && SessionDate >= Today()
                                  ),
                                  "SessionDate",
                                  SortOrder.Ascending
                              ),
                              SesKey, Text(ID),
                              Cap, Coalesce(Capacity, If(trType = "Manual Handling", 8, 6))
                          ),
                          Booked, CountRows(Filter(colTrBookings, SessionID = SesKey)),
                          MyBookingID, LookUp(colTrBookings, SessionID = SesKey && Lower(BookedUserEmail) = MeEmail).ID,
                          MyWaitID, LookUp(colTrWait, SessionID = SesKey && Lower(WaitlistUserEmail) = MeEmail).ID,
                          MyWaitOn, LookUp(colTrWait, SessionID = SesKey && Lower(WaitlistUserEmail) = MeEmail).AddedOn,
                          WaitCount, CountRows(Filter(colTrWait, SessionID = SesKey))
                      ),
                      Free, Cap - Booked,
                      MyWaitPos, If(IsBlank(MyWaitOn), 0, CountRows(Filter(colTrWait, SessionID = SesKey && AddedOn <= MyWaitOn)))
                  )
              );

              // keep the chosen date selected (with fresh numbers), or open the one asked for from Home
              If(
                  !IsBlank(trOpen),
                  Set(trSel, LookUp(colTrSessions, ID = trOpen));
                  Set(trOpen, Blank()),

                  !IsBlank(trSel),
                  Set(trSel, LookUp(colTrSessions, ID = trSel.ID))
              );
              Set(trLoading, false);
              Select(btnSlots_Tds)
      - btnSlots_Tds:
          Control: Button@0.0.45
          Properties:
            Height: =1
            Width: =1
            X: =0
            Y: =0
            Text: =""
            Visible: =false
            OnSelect: |-
              =ClearCollect(
                  colTrSlots,
                  ForAll(
                      Sequence(Coalesce(trSel.Cap, 0)) As n,
                      {
                          SlotNo: n.Value,
                          Booking: LookUp(
                              colTrBookings,
                              SessionID = Coalesce(trSel.SesKey, "") && SlotNumber = n.Value
                          )
                      }
                  )
              )
      - btnDoBook_Tds:
          Control: Button@0.0.45
          Properties:
            Height: =1
            Width: =1
            X: =0
            Y: =0
            Text: =""
            Visible: =false
            OnSelect: |-
              =With(
                  { s: trSel },
                  Refresh(TrainingBookings);
                  With(
                      { bookedNow: Filter(TrainingBookings, SessionID = s.SesKey && BookingStatus.Value = "Booked") },
                      If(
                          !IsBlank(LookUp(bookedNow, Lower(BookedUserEmail) = MeEmail)),
                          Notify("You are already booked into this session.", NotificationType.Warning);
                          Select(btnLoad_Tds),

                          CountRows(bookedNow) >= s.Cap,
                          Notify("Sorry, that session has just filled up.", NotificationType.Warning);
                          Select(btnLoad_Tds),

                          With(
                              {
                                  slot: First(
                                      Filter(
                                          ForAll(Sequence(s.Cap) As n, { SlotNo: n.Value }),
                                          IsBlank(LookUp(bookedNow, SlotNumber = SlotNo))
                                      )
                                  ).SlotNo
                              },
                              With(
                                  {
                                      rec: Patch(
                                          TrainingBookings,
                                          Defaults(TrainingBookings),
                                          {
                                              Title: trType & " - " & MeName,
                                              SessionID: s.SesKey,
                                              TrainingType: trType,
                                              SessionDate: s.SessionDate,
                                              SlotNumber: slot,
                                              BookedUserName: MeName,
                                              BookedUserEmail: MeEmail,
                                              BookingStatus: { Value: "Booked" },
                                              BookedOn: Now()
                                          }
                                      )
                                  },
                                  If(
                                      !IsEmpty(Errors(TrainingBookings)),
                                      Notify("Could not book. Please try again.", NotificationType.Error),

                                      // two people can take the same slot at the same moment: the earlier booking keeps it
                                      Refresh(TrainingBookings);
                                      If(
                                          rec.ID > Min(
                                              Filter(TrainingBookings, SessionID = s.SesKey && SlotNumber = slot && BookingStatus.Value = "Booked"),
                                              ID
                                          ),
                                          Patch(TrainingBookings, LookUp(TrainingBookings, ID = rec.ID), { BookingStatus: { Value: "Cancelled" } });
                                          Notify("Someone else just took that place. Please try again.", NotificationType.Warning),

                                          If(
                                              !IsBlank(s.MyWaitID),
                                              Patch(TrainingWaitlist, LookUp(TrainingWaitlist, ID = s.MyWaitID), { WaitlistStatus: { Value: "Removed" } })
                                          );
                                          IfError(
                                              TrainingBookingConfirmationEmail.Run("Booked", MeName, MeEmail, s.SesKey, trType, ""),
                                              Notify("You are booked, but the confirmation email could not be sent.", NotificationType.Warning)
                                          );
                                          Notify("You are booked into this session.", NotificationType.Success)
                                      );
                                      Select(btnLoad_Tds)
                                  )
                              )
                          )
                      )
                  )
              )
      - btnDoCancel_Tds:
          Control: Button@0.0.45
          Properties:
            Height: =1
            Width: =1
            X: =0
            Y: =0
            Text: =""
            Visible: =false
            OnSelect: |-
              =With(
                  { s: trSel },
                  With(
                      { b: LookUp(TrainingBookings, ID = s.MyBookingID) },
                      If(
                          IsBlank(b),
                          Notify("That booking could not be found.", NotificationType.Warning);
                          Set(trShowConfirm, false);
                          Select(btnLoad_Tds),

                          Patch(TrainingBookings, b, { BookingStatus: { Value: "Cancelled" } });
                          If(
                              !IsEmpty(Errors(TrainingBookings)),
                              Notify("Could not remove the booking. Please try again.", NotificationType.Error),

                              IfError(
                                  TrainingBookingConfirmationEmail.Run("Cancelled", b.BookedUserName, b.BookedUserEmail, s.SesKey, trType, Text(b.ID)),
                                  Notify("The booking was removed, but the email could not be sent.", NotificationType.Warning)
                              );
                              IfError(TrainingWaitlistNotification.Run(s.SesKey, trType), Blank());
                              Set(trShowConfirm, false);
                              Notify("Your booking has been removed.", NotificationType.Success);
                              Select(btnLoad_Tds)
                          )
                      )
                  )
              )
      - btnDoRemove_Tds:
          Control: Button@0.0.45
          Properties:
            Height: =1
            Width: =1
            X: =0
            Y: =0
            Text: =""
            Visible: =false
            OnSelect: |-
              =With(
                  { s: trSel },
                  With(
                      { b: LookUp(TrainingBookings, ID = trSlot.ID) },
                      If(
                          IsBlank(b),
                          Notify("That booking could not be found.", NotificationType.Warning);
                          Set(trShowConfirm, false);
                          Select(btnLoad_Tds),

                          Patch(TrainingBookings, b, { BookingStatus: { Value: "Cancelled" } });
                          If(
                              !IsEmpty(Errors(TrainingBookings)),
                              Notify("Could not remove the booking. Please try again.", NotificationType.Error),

                              IfError(
                                  TrainingBookingConfirmationEmail.Run("Cancelled", b.BookedUserName, b.BookedUserEmail, s.SesKey, trType, Text(b.ID)),
                                  Notify("The booking was removed, but the email could not be sent.", NotificationType.Warning)
                              );
                              IfError(TrainingWaitlistNotification.Run(s.SesKey, trType), Blank());
                              Set(trShowConfirm, false);
                              Notify("The booking has been removed.", NotificationType.Success);
                              Select(btnLoad_Tds)
                          )
                      )
                  )
              )
      - btnDoDelete_Tds:
          Control: Button@0.0.45
          Properties:
            Height: =1
            Width: =1
            X: =0
            Y: =0
            Text: =""
            Visible: =false
            OnSelect: |-
              =With(
                  { s: trSel },
                  Refresh(TrainingBookings);
                  Refresh(TrainingWaitlist);
                  If(
                      CountRows(Filter(TrainingBookings, SessionID = s.SesKey && BookingStatus.Value = "Booked")) > 0 ||
                      CountRows(Filter(TrainingWaitlist, SessionID = s.SesKey && WaitlistStatus.Value = "Waiting")) > 0,
                      Notify("This date cannot be deleted while people are booked or waiting. Remove them first.", NotificationType.Warning);
                      Set(trShowConfirm, false),

                      // the date is hidden, not erased, so the history is kept
                      Patch(TrainingSessions, LookUp(TrainingSessions, ID = s.ID), { IsActive: false });
                      If(
                          !IsEmpty(Errors(TrainingSessions)),
                          Notify("Could not delete the date. Please try again.", NotificationType.Error),
                          Set(trShowConfirm, false);
                          Set(trSel, Blank());
                          Notify("Training date deleted.", NotificationType.Success);
                          Select(btnLoad_Tds)
                      )
                  )
              )
      - btnDoJoin_Tds:
          Control: Button@0.0.45
          Properties:
            Height: =1
            Width: =1
            X: =0
            Y: =0
            Text: =""
            Visible: =false
            OnSelect: |-
              =With(
                  { s: trSel },
                  If(
                      !IsBlank(s.MyWaitID) || !IsBlank(s.MyBookingID),
                      Blank(),
                      Patch(
                          TrainingWaitlist,
                          Defaults(TrainingWaitlist),
                          {
                              Title: trType & " - " & MeName,
                              SessionID: s.SesKey,
                              WaitlistUserName: MeName,
                              WaitlistUserEmail: MeEmail,
                              WaitlistStatus: { Value: "Waiting" },
                              AddedOn: Now()
                          }
                      );
                      If(
                          !IsEmpty(Errors(TrainingWaitlist)),
                          Notify("Could not join the waitlist. Please try again.", NotificationType.Error),
                          Notify("You are on the waitlist. You will get an email if a place opens.", NotificationType.Success);
                          Select(btnLoad_Tds)
                      )
                  )
              )
      - btnDoLeave_Tds:
          Control: Button@0.0.45
          Properties:
            Height: =1
            Width: =1
            X: =0
            Y: =0
            Text: =""
            Visible: =false
            OnSelect: |-
              =With(
                  { s: trSel },
                  Patch(TrainingWaitlist, LookUp(TrainingWaitlist, ID = s.MyWaitID), { WaitlistStatus: { Value: "Removed" } });
                  If(
                      !IsEmpty(Errors(TrainingWaitlist)),
                      Notify("Could not leave the waitlist. Please try again.", NotificationType.Error),
                      IfError(
                          TrainingBookingConfirmationEmail.Run("WaitlistRemoved", MeName, MeEmail, s.SesKey, trType, ""),
                          Blank()
                      );
                      Notify("You have been removed from the waitlist.", NotificationType.Success);
                      Select(btnLoad_Tds)
                  )
              )
      - btnDoAdd_Tds:
          Control: Button@0.0.45
          Properties:
            Height: =1
            Width: =1
            X: =0
            Y: =0
            Text: =""
            Visible: =false
            OnSelect: |-
              =With(
                  {
                      t: ddType_Tds.Selected.Value,
                      d: dpDate_Tds.SelectedDate,
                      loc: Trim(txtLoc_Tds.Text)
                  },
                  With(
                      { when: d + Time(Value(ddHour_Tds.Selected.Value), Value(ddMin_Tds.Selected.Value), 0) },
                      If(
                          IsBlank(t),
                          Notify("Please select a training type.", NotificationType.Warning),

                          IsBlank(d),
                          Notify("Please select a date.", NotificationType.Warning),

                          IsBlank(loc),
                          Notify("Please enter a location.", NotificationType.Warning),

                          when < Now(),
                          Notify("That date and time has already passed.", NotificationType.Warning),

                          !IsBlank(LookUp(TrainingSessions, TrainingType.Value = t && SessionDate = when && IsActive = true)),
                          Notify("A session already exists for that date and time.", NotificationType.Warning),

                          Patch(
                              TrainingSessions,
                              Defaults(TrainingSessions),
                              {
                                  Title: t & " - " & Text(when, "dd/mm/yyyy hh:mm"),
                                  TrainingType: { Value: t },
                                  SessionDate: when,
                                  Location: loc,
                                  Capacity: If(t = "Manual Handling", 8, 6),
                                  IsActive: true
                              }
                          );
                          If(
                              !IsEmpty(Errors(TrainingSessions)),
                              Notify("Could not save the date. Please try again.", NotificationType.Error),
                              Set(trShowAdd, false);
                              Set(trType, t);
                              Set(trSel, Blank());
                              Notify("Training date added.", NotificationType.Success);
                              Select(btnLoad_Tds)
                          )
                      )
                  )
              )
      - btnDoSend_Tds:
          Control: Button@0.0.45
          Properties:
            Height: =1
            Width: =1
            X: =0
            Y: =0
            Text: =""
            Visible: =false
            OnSelect: |-
              =With(
                  { to: Concat(Filter(colTrBookings, SessionID = trSel.SesKey), BookedUserEmail, ";") },
                  If(
                      IsBlank(to),
                      Notify("Nobody is booked into this date yet.", NotificationType.Warning),
                      IfError(
                          Office365Outlook.SendEmailV2(
                              to,
                              Trim(txtEmailSubject_Tds.Text),
                              Substitute(Substitute(txtEmailBody_Tds.Text, Char(13), ""), Char(10), "<br>"),
                              { IsHtml: true }
                          );
                          Set(trShowEmail, false);
                          Notify("Email sent to the booked attendees.", NotificationType.Success),
                          Notify("The email could not be sent. Please try again.", NotificationType.Error)
                      )
                  )
              )
      - btnDoSendWait_Tds:
          Control: Button@0.0.45
          Properties:
            Height: =1
            Width: =1
            X: =0
            Y: =0
            Text: =""
            Visible: =false
            OnSelect: |-
              =With(
                  { to: Concat(Filter(colTrWait, SessionID = trSel.SesKey), WaitlistUserEmail, ";") },
                  If(
                      IsBlank(to),
                      Notify("There are no waitlist users to email.", NotificationType.Warning),
                      IfError(
                          Office365Outlook.SendEmailV2(
                              to,
                              trType & " training: a place may be available (" & Text(trSel.SessionDate, "dd/mm/yyyy h:mm AM/PM") & ")",
                              "Hi all,<br><br>You are on the waitlist for " & trType & " training on " &
                              Text(trSel.SessionDate, "dddd d mmmm") & " at " & Text(trSel.SessionDate, "h:mm AM/PM") & ".<br>" &
                              "A place may be available. If you would like it, please open the Training Register app and book a place.<br><br>" &
                              "Thanks,<br>" & MeName,
                              { IsHtml: true }
                          );
                          Notify("Email sent to the waitlist.", NotificationType.Success),
                          Notify("The email could not be sent. Please try again.", NotificationType.Error)
                      )
                  )
              )
      - conRoot_Td:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =C_Bg
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutJustifyContent: =LayoutJustifyContent.Start
            LayoutGap: =0
            PaddingTop: =0
            PaddingRight: =0
            PaddingBottom: =0
            PaddingLeft: =0
            DropShadow: =DropShadow.None
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - conHdr_Td:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  LayoutMinHeight: =Round(95 * UI, 0)
                  FillPortions: =0
                  Fill: =RGBA(7, 95, 115, 1)
                  Height: =Round(95 * UI, 0)
                  Width: =App.Width
                  X: =0
                  Y: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  DropShadow: =DropShadow.None
                Children:
                  - imgHdr_Td:
                      Control: Image@2.2.3
                      Properties:
                        Height: =Parent.Height
                        Image: =HeaderImage
                        ImagePosition: =ImagePosition.Fill
                        Width: =Parent.Width
                        X: =0
                        Y: =0
                  - btnBack_Td:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Transparent
                        FontColor: =C_White
                        FontSize: =Round(32 * UI, 0)
                        Height: =Round(60 * UI, 0)
                        Icon: ="ChevronLeft"
                        Text: =""
                        Width: =Round(60 * UI, 0)
                        X: =Gutter + Round(5 * UI, 0)
                        Y: =Round(18 * UI, 0)
                        OnSelect: =If(!IsBlank(trSel), Set(trSel, Blank()), Back(ScreenTransition.UnCoverRight))
                  - lblHdrT_Td:
                      Control: Label@2.5.1
                      Properties:
                        Font: =AppFont
                        Color: =C_White
                        Size: =Round(24 * UI, 0)
                        FontWeight: =FontWeight.Bold
                        Height: =Round(35 * UI, 0)
                        Text: =trType & " training"
                        Width: =PageW - Round(85 * UI, 0)
                        X: =Gutter + Round(65 * UI, 0)
                        Y: =Round(20 * UI, 0)
                        Wrap: =false
                  - lblHdrS_Td:
                      Control: Label@2.5.1
                      Properties:
                        Font: =AppFont
                        Color: =RGBA(255, 255, 255, 0.85)
                        Size: =Round(15 * UI, 0)
                        Height: =Round(25 * UI, 0)
                        Text: =If(IsBlank(trSel), CountRows(colTrSessions) & If(CountRows(colTrSessions) = 1, " upcoming date", " upcoming dates"), Text(trSel.SessionDate, "dddd d mmmm"))
                        Width: =PageW - Round(85 * UI, 0)
                        X: =Gutter + Round(65 * UI, 0)
                        Y: =Round(53 * UI, 0)
                        Wrap: =false
            - conBody_Td:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  LayoutMinHeight: =Round(250 * UI, 0)
                  FillPortions: =1
                  Width: =App.Width
                  Fill: =RGBA(0, 0, 0, 0)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutGap: =Round(15 * UI, 0)
                  PaddingTop: =Round(15 * UI, 0)
                  PaddingRight: =Gutter + Round(20 * UI, 0)
                  PaddingBottom: =Round(20 * UI, 0)
                  PaddingLeft: =Gutter + Round(20 * UI, 0)
                  DropShadow: =DropShadow.None
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                Children:
                  - conSegTy_Td:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        Visible: =IsBlank(trSel)
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =Round(50 * UI, 0)
                        FillPortions: =0
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =Round(50 * UI, 0)
                        Width: =PageW - Round(40 * UI, 0)
                        X: =0
                        Y: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        DropShadow: =DropShadow.None
                      Children:
                        - conSegTyBasicLifeSupport_Td:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =If(trType = "Basic Life Support", C_Accent, C_White)
                              Height: =Round(50 * UI, 0)
                              Width: =(PageW - Round(40 * UI, 0) - Round(10 * UI, 0)) / 2
                              X: =0 * ((PageW - Round(40 * UI, 0) - Round(10 * UI, 0)) / 2 + Round(10 * UI, 0))
                              Y: =0
                              RadiusBottomLeft: =Round(25 * UI, 0)
                              RadiusBottomRight: =Round(25 * UI, 0)
                              RadiusTopLeft: =Round(25 * UI, 0)
                              RadiusTopRight: =Round(25 * UI, 0)
                              BorderColor: =If(trType = "Basic Life Support", C_Accent, C_Line)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                            Children:
                              - btnSegTyBasicLifeSupport_Td:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderRadius: =Round(25 * UI, 0)
                                    Font: =Font.'Segoe UI'
                                    FontColor: =If(trType = "Basic Life Support", C_White, C_Ink2)
                                    FontSize: =Round(16 * UI, 0)
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    Width: =Parent.Width
                                    Text: ="Basic Life Support"
                                    OnSelect: |-
                                      =Set(trType, "Basic Life Support");
                                      Set(trSel, Blank());
                                      Select(btnLoad_Tds)
                        - conSegTyManualHandling_Td:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =If(trType = "Manual Handling", C_Accent, C_White)
                              Height: =Round(50 * UI, 0)
                              Width: =(PageW - Round(40 * UI, 0) - Round(10 * UI, 0)) / 2
                              X: =1 * ((PageW - Round(40 * UI, 0) - Round(10 * UI, 0)) / 2 + Round(10 * UI, 0))
                              Y: =0
                              RadiusBottomLeft: =Round(25 * UI, 0)
                              RadiusBottomRight: =Round(25 * UI, 0)
                              RadiusTopLeft: =Round(25 * UI, 0)
                              RadiusTopRight: =Round(25 * UI, 0)
                              BorderColor: =If(trType = "Manual Handling", C_Accent, C_Line)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                            Children:
                              - btnSegTyManualHandling_Td:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderRadius: =Round(25 * UI, 0)
                                    Font: =Font.'Segoe UI'
                                    FontColor: =If(trType = "Manual Handling", C_White, C_Ink2)
                                    FontSize: =Round(16 * UI, 0)
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    Width: =Parent.Width
                                    Text: ="Manual Handling"
                                    OnSelect: |-
                                      =Set(trType, "Manual Handling");
                                      Set(trSel, Blank());
                                      Select(btnLoad_Tds)
                  - conAdd_Td:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =Round(60 * UI, 0)
                        FillPortions: =0
                        Fill: =C_White
                        Height: =Round(60 * UI, 0)
                        Width: =PageW - Round(40 * UI, 0)
                        X: =0
                        Y: =0
                        RadiusBottomLeft: =Round(30 * UI, 0)
                        RadiusBottomRight: =Round(30 * UI, 0)
                        RadiusTopLeft: =Round(30 * UI, 0)
                        RadiusTopRight: =Round(30 * UI, 0)
                        BorderColor: =C_Accent
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Visible: =IsBlank(trSel) && CanManageTraining
                      Children:
                        - btnAdd_Td:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Transparent
                              BorderRadius: =Round(30 * UI, 0)
                              Font: =Font.'Segoe UI'
                              FontColor: =C_Accent
                              FontSize: =Round(18 * UI, 0)
                              FontWeight: =FontWeight.Bold
                              Height: =Parent.Height
                              Width: =Parent.Width
                              Text: ="+ Add a date"
                              OnSelect: |-
                                =Set(trShowAdd, true);
                                Reset(ddType_Tds);
                                Reset(dpDate_Tds);
                                Reset(ddHour_Tds);
                                Reset(ddMin_Tds);
                                Reset(txtLoc_Tds)
                  - galDates_Td:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =0
                        Height: =CountRows(colTrSessions) * Round(105 * UI, 0)
                        FillPortions: =0
                        Items: =colTrSessions
                        TemplatePadding: =0
                        TemplateSize: =Round(105 * UI, 0)
                        Width: =PageW - Round(40 * UI, 0)
                        ShowScrollbar: =false
