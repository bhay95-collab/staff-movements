Screens:
  Find:
    Properties:
      Fill: =C_Bg
      OnVisible: |-
        =If(IsBlank(fdCat), Set(fdCat, "Wheelchair"));
        Reset(txtCode_Fd);
        Select(btnLoad_Fd)
    Children:
      - btnLoad_Fd:
          Control: Button@0.0.45
          Properties:
            Height: =1
            Width: =1
            X: =0
            Y: =0
            Text: =""
            Visible: =false
            OnSelect: |-
              =// Available equipment in the chosen category (filtered on the phone after this)
              ClearCollect(
                  colFind,
                  AddColumns(
                      Filter(Equipment_Inventory_SharePoint, Status.Value = "Available" && Category.Value = fdCat),
                      cType, 'Wheelchair Type'.Value,
                      cWidth, Width.Value,
                      cDepth, Depth.Value,
                      cHeight, Height.Value
                  )
              )
      - conRoot_Fd:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =C_Bg
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutJustifyContent: =LayoutJustifyContent.Start
            LayoutGap: =0
            PaddingTop: =0
            PaddingRight: =0
            PaddingBottom: =0
            PaddingLeft: =0
            DropShadow: =DropShadow.None
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
