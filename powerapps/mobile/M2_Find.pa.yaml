Screens:
  Find:
    Properties:
      Fill: =C_Bg
      OnVisible: |-
        =If(IsBlank(fdCat), Set(fdCat, "Wheelchair"));
        Set(fdShowFilter, false);
        Reset(txtCode_Fd);
        Select(btnLoad_Fd)
    Children:
      - btnLoad_Fd:
          Control: Button@0.0.45
          Properties:
            Height: =1
            Width: =1
            X: =0
            Y: =0
            Text: =""
            Visible: =false
            OnSelect: |-
              =// Available equipment in the chosen category (filtered on the phone after this)
              ClearCollect(
                  colFind,
                  AddColumns(
                      Filter(Equipment_Inventory_SharePoint, Status.Value = "Available" && Category.Value = fdCat),
                      cType, 'Wheelchair Type'.Value,
                      cWidth, Width.Value,
                      cDepth, Depth.Value,
                      cHeight, Height.Value
                  )
              )
      - conRoot_Fd:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =C_Bg
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutJustifyContent: =LayoutJustifyContent.Start
            LayoutGap: =0
            PaddingTop: =0
            PaddingRight: =0
            PaddingBottom: =0
            PaddingLeft: =0
            DropShadow: =DropShadow.None
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - conHdr_Fd:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  LayoutMinHeight: =Round(95 * UI, 0)
                  FillPortions: =0
                  Fill: =RGBA(7, 95, 115, 1)
                  Height: =Round(95 * UI, 0)
                  Width: =App.Width
                  X: =0
                  Y: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  DropShadow: =DropShadow.None
                Children:
                  - imgHdr_Fd:
                      Control: Image@2.2.3
                      Properties:
                        Height: =Parent.Height
                        Image: =HeaderImage
                        ImagePosition: =ImagePosition.Fill
                        Width: =Parent.Width
                        X: =0
                        Y: =0
                  - btnBack_Fd:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Transparent
                        FontColor: =C_White
                        FontSize: =Round(32 * UI, 0)
                        Height: =Round(60 * UI, 0)
                        Icon: ="ChevronLeft"
                        Text: =""
                        Width: =Round(60 * UI, 0)
                        X: =Gutter + Round(5 * UI, 0)
                        Y: =Round(18 * UI, 0)
                        OnSelect: =Back(ScreenTransition.UnCoverRight)
                  - lblHdrT_Fd:
                      Control: Label@2.5.1
                      Properties:
                        Font: =AppFont
                        Color: =C_White
                        Size: =Round(24 * UI, 0)
                        FontWeight: =FontWeight.Bold
                        Height: =Round(35 * UI, 0)
                        Text: ="Find equipment"
                        Width: =PageW - Round(85 * UI, 0)
                        X: =Gutter + Round(65 * UI, 0)
                        Y: =Round(20 * UI, 0)
                        Wrap: =false
                  - lblHdrS_Fd:
                      Control: Label@2.5.1
                      Properties:
                        Font: =AppFont
                        Color: =RGBA(255, 255, 255, 0.85)
                        Size: =Round(15 * UI, 0)
                        Height: =Round(25 * UI, 0)
                        Text: ="Available " & Lower(fdCat) & "s"
                        Width: =PageW - Round(85 * UI, 0)
                        X: =Gutter + Round(65 * UI, 0)
                        Y: =Round(53 * UI, 0)
                        Wrap: =false
            - conBody_Fd:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  LayoutMinHeight: =Round(250 * UI, 0)
                  FillPortions: =1
                  Width: =App.Width
                  Fill: =RGBA(0, 0, 0, 0)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutGap: =Round(13 * UI, 0)
                  PaddingTop: =Round(15 * UI, 0)
                  PaddingRight: =Gutter + Round(20 * UI, 0)
                  PaddingBottom: =Round(10 * UI, 0)
                  PaddingLeft: =Gutter + Round(20 * UI, 0)
                  DropShadow: =DropShadow.None
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - conCode_Fd:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =Round(60 * UI, 0)
                        FillPortions: =0
                        Fill: =C_White
                        Height: =Round(60 * UI, 0)
                        Width: =PageW - Round(40 * UI, 0)
                        X: =0
                        Y: =0
                        RadiusBottomLeft: =Round(15 * UI, 0)
                        RadiusBottomRight: =Round(15 * UI, 0)
                        RadiusTopLeft: =Round(15 * UI, 0)
                        RadiusTopRight: =Round(15 * UI, 0)
                        BorderColor: =RGBA(14, 42, 70, 0.22)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                      Children:
                        - icoCode_Fd:
                            Control: ModernIcon@1.1.1
                            Properties:
                              Height: =Round(30 * UI, 0)
                              Icon: ="Search"
                              IconColor: =C_Muted
                              Width: =Round(30 * UI, 0)
                              X: =Round(15 * UI, 0)
                              Y: =Round(15 * UI, 0)
                        - txtCode_Fd:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              BorderStyle: =BorderStyle.None
                              Color: =C_Ink
                              Default: =""
                              DelayOutput: =true
                              Fill: =RGBA(0, 0, 0, 0)
                              Font: =AppFont
                              Height: =Parent.Height
                              HintText: ="Search by barcode"
                              Size: =Round(18 * UI, 0)
                              Width: =Parent.Width - Round(55 * UI, 0)
                              X: =Round(50 * UI, 0)
                              Y: =0
                  - conSegCat_Fd:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        Visible: =IsBlank(Trim(txtCode_Fd.Text))
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =Round(50 * UI, 0)
                        FillPortions: =0
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =Round(50 * UI, 0)
                        Width: =PageW - Round(40 * UI, 0)
                        X: =0
                        Y: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        DropShadow: =DropShadow.None
                      Children:
                        - conSegCatWheelchair_Fd:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =If(fdCat = "Wheelchair", C_Accent, C_White)
                              Height: =Round(50 * UI, 0)
                              Width: =(PageW - Round(40 * UI, 0) - Round(20 * UI, 0)) / 3
                              X: =0 * ((PageW - Round(40 * UI, 0) - Round(20 * UI, 0)) / 3 + Round(10 * UI, 0))
                              Y: =0
                              RadiusBottomLeft: =Round(25 * UI, 0)
                              RadiusBottomRight: =Round(25 * UI, 0)
                              RadiusTopLeft: =Round(25 * UI, 0)
                              RadiusTopRight: =Round(25 * UI, 0)
                              BorderColor: =If(fdCat = "Wheelchair", C_Accent, C_Line)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                            Children:
                              - btnSegCatWheelchair_Fd:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderRadius: =Round(25 * UI, 0)
                                    Font: =Font.'Segoe UI'
                                    FontColor: =If(fdCat = "Wheelchair", C_White, C_Ink2)
                                    FontSize: =Round(16 * UI, 0)
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    Width: =Parent.Width
                                    Text: ="Wheelchairs"
                                    OnSelect: |-
                                      =Set(fdCat, "Wheelchair");
                                      Set(fdType, Blank()); Set(fdBrand, Blank()); Set(fdModel, Blank()); Set(fdWidth, Blank()); Set(fdDepth, Blank()); Set(fdHeight, Blank());
                                      Select(btnLoad_Fd)
                        - conSegCatCushion_Fd:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =If(fdCat = "Cushion", C_Accent, C_White)
                              Height: =Round(50 * UI, 0)
                              Width: =(PageW - Round(40 * UI, 0) - Round(20 * UI, 0)) / 3
                              X: =1 * ((PageW - Round(40 * UI, 0) - Round(20 * UI, 0)) / 3 + Round(10 * UI, 0))
                              Y: =0
                              RadiusBottomLeft: =Round(25 * UI, 0)
                              RadiusBottomRight: =Round(25 * UI, 0)
                              RadiusTopLeft: =Round(25 * UI, 0)
                              RadiusTopRight: =Round(25 * UI, 0)
                              BorderColor: =If(fdCat = "Cushion", C_Accent, C_Line)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                            Children:
                              - btnSegCatCushion_Fd:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderRadius: =Round(25 * UI, 0)
                                    Font: =Font.'Segoe UI'
                                    FontColor: =If(fdCat = "Cushion", C_White, C_Ink2)
                                    FontSize: =Round(16 * UI, 0)
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    Width: =Parent.Width
                                    Text: ="Cushions"
                                    OnSelect: |-
                                      =Set(fdCat, "Cushion");
                                      Set(fdType, Blank()); Set(fdBrand, Blank()); Set(fdModel, Blank()); Set(fdWidth, Blank()); Set(fdDepth, Blank()); Set(fdHeight, Blank());
                                      Select(btnLoad_Fd)
                        - conSegCatBackrest_Fd:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =If(fdCat = "Backrest", C_Accent, C_White)
                              Height: =Round(50 * UI, 0)
                              Width: =(PageW - Round(40 * UI, 0) - Round(20 * UI, 0)) / 3
                              X: =2 * ((PageW - Round(40 * UI, 0) - Round(20 * UI, 0)) / 3 + Round(10 * UI, 0))
                              Y: =0
                              RadiusBottomLeft: =Round(25 * UI, 0)
                              RadiusBottomRight: =Round(25 * UI, 0)
                              RadiusTopLeft: =Round(25 * UI, 0)
                              RadiusTopRight: =Round(25 * UI, 0)
                              BorderColor: =If(fdCat = "Backrest", C_Accent, C_Line)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                            Children:
                              - btnSegCatBackrest_Fd:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderRadius: =Round(25 * UI, 0)
                                    Font: =Font.'Segoe UI'
                                    FontColor: =If(fdCat = "Backrest", C_White, C_Ink2)
                                    FontSize: =Round(16 * UI, 0)
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    Width: =Parent.Width
                                    Text: ="Backrests"
                                    OnSelect: |-
                                      =Set(fdCat, "Backrest");
                                      Set(fdType, Blank()); Set(fdBrand, Blank()); Set(fdModel, Blank()); Set(fdWidth, Blank()); Set(fdDepth, Blank()); Set(fdHeight, Blank());
                                      Select(btnLoad_Fd)
                  - conBar_Fd:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =Round(50 * UI, 0)
                        FillPortions: =0
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =Round(50 * UI, 0)
                        Width: =PageW - Round(40 * UI, 0)
                        X: =0
                        Y: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        DropShadow: =DropShadow.None
                        Visible: =IsBlank(Trim(txtCode_Fd.Text))
                      Children:
                        - conFilterBtn_Fd:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =If((If(IsBlank(fdType), 0, 1) + If(IsBlank(fdBrand), 0, 1) + If(IsBlank(fdModel), 0, 1) + If(IsBlank(fdWidth), 0, 1) + If(IsBlank(fdDepth), 0, 1) + If(IsBlank(fdHeight), 0, 1)) > 0, C_Accent, C_White)
                              Height: =Round(50 * UI, 0)
                              Width: =Round(163 * UI, 0)
                              X: =0
                              Y: =0
                              RadiusBottomLeft: =Round(25 * UI, 0)
                              RadiusBottomRight: =Round(25 * UI, 0)
                              RadiusTopLeft: =Round(25 * UI, 0)
                              RadiusTopRight: =Round(25 * UI, 0)
                              BorderColor: =If((If(IsBlank(fdType), 0, 1) + If(IsBlank(fdBrand), 0, 1) + If(IsBlank(fdModel), 0, 1) + If(IsBlank(fdWidth), 0, 1) + If(IsBlank(fdDepth), 0, 1) + If(IsBlank(fdHeight), 0, 1)) > 0, C_Accent, C_Line)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                            Children:
                              - btnFilterBtn_Fd:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderRadius: =Round(25 * UI, 0)
                                    Font: =Font.'Segoe UI'
                                    FontColor: =If((If(IsBlank(fdType), 0, 1) + If(IsBlank(fdBrand), 0, 1) + If(IsBlank(fdModel), 0, 1) + If(IsBlank(fdWidth), 0, 1) + If(IsBlank(fdDepth), 0, 1) + If(IsBlank(fdHeight), 0, 1)) > 0, C_White, C_Ink2)
                                    FontSize: =Round(17 * UI, 0)
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    Width: =Parent.Width
                                    Text: ="Filters" & If((If(IsBlank(fdType), 0, 1) + If(IsBlank(fdBrand), 0, 1) + If(IsBlank(fdModel), 0, 1) + If(IsBlank(fdWidth), 0, 1) + If(IsBlank(fdDepth), 0, 1) + If(IsBlank(fdHeight), 0, 1)) > 0, "  ·  " & (If(IsBlank(fdType), 0, 1) + If(IsBlank(fdBrand), 0, 1) + If(IsBlank(fdModel), 0, 1) + If(IsBlank(fdWidth), 0, 1) + If(IsBlank(fdDepth), 0, 1) + If(IsBlank(fdHeight), 0, 1)), "")
                                    OnSelect: =Set(fdShowFilter, true)
                                    Icon: ="Filter"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                    Layout: ='ButtonCanvas.Layout'.IconBefore
                        - lblCount_Fd:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Ink
                              Size: =Round(17 * UI, 0)
                              FontWeight: =FontWeight.Bold
                              Height: =Round(50 * UI, 0)
                              Text: =If(IsBlank(Trim(txtCode_Fd.Text)), CountRows(galResF_Fd.AllItems), CountRows(galResC_Fd.AllItems)) & " available"
                              Width: =Parent.Width - Round(183 * UI, 0)
                              X: =Round(183 * UI, 0)
                              Y: =0
                              VerticalAlign: =VerticalAlign.Middle
                              Wrap: =false
                  - lblActive_Fd:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =Round(23 * UI, 0)
                        FillPortions: =0
                        Font: =AppFont
                        Color: =C_Accent
                        Size: =Round(15 * UI, 0)
                        FontWeight: =FontWeight.Bold
                        Height: =Round(23 * UI, 0)
                        Text: =Concatenate(If(IsBlank(fdType), "", fdType & "  ·  "), If(IsBlank(fdBrand), "", fdBrand & "  ·  "), If(IsBlank(fdModel), "", fdModel & "  ·  "), If(IsBlank(fdWidth), "", "W " & fdWidth & "  ·  "), If(IsBlank(fdDepth), "", "D " & fdDepth & "  ·  "), If(IsBlank(fdHeight), "", "H " & fdHeight))
                        Width: =PageW - Round(40 * UI, 0)
                        X: =0
                        Y: =0
                        Wrap: =false
                        Visible: =IsBlank(Trim(txtCode_Fd.Text)) && (!IsBlank(fdType) || !IsBlank(fdBrand) || !IsBlank(fdModel) || !IsBlank(fdWidth) || !IsBlank(fdDepth) || !IsBlank(fdHeight))
                  - galResF_Fd:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =Round(150 * UI, 0)
                        FillPortions: =1
                        Items: =Sort(Sort(Filter(colFind, (IsBlank(fdType) || cType = fdType) && (IsBlank(fdBrand) || Brand = fdBrand) && (IsBlank(fdModel) || Model = fdModel) && (IsBlank(fdWidth) || cWidth = fdWidth) && (IsBlank(fdDepth) || cDepth = fdDepth) && (IsBlank(fdHeight) || cHeight = fdHeight)), Model), Brand)
                        TemplatePadding: =0
                        TemplateSize: =Round(103 * UI, 0)
                        Visible: =IsBlank(Trim(txtCode_Fd.Text))
                        Width: =PageW - Round(40 * UI, 0)
                      Children:
                        - conResF_Fd:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =C_White
                              Height: =Round(93 * UI, 0)
                              Width: =Parent.TemplateWidth - Round(5 * UI, 0)
                              X: =Round(3 * UI, 0)
                              Y: =Round(5 * UI, 0)
                              RadiusBottomLeft: =Round(18 * UI, 0)
                              RadiusBottomRight: =Round(18 * UI, 0)
                              RadiusTopLeft: =Round(18 * UI, 0)
                              RadiusTopRight: =Round(18 * UI, 0)
                              BorderColor: =C_Line
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                            Children:
                              - conResBarF_Fd:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    Fill: =Switch(ThisItem.Category.Value, "Wheelchair", RGBA(166, 199, 130, 1), "Cushion", RGBA(0, 144, 153, 1), "Backrest", RGBA(0, 200, 210, 1), RGBA(210, 218, 227, 1))
                                    Height: =Parent.Height
                                    Width: =Round(8 * UI, 0)
                                    X: =0
                                    Y: =0
                                    RadiusBottomLeft: =Round(18 * UI, 0)
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =Round(18 * UI, 0)
                                    RadiusTopRight: =0
                                    DropShadow: =DropShadow.None
                              - lblResTF_Fd:
                                  Control: Label@2.5.1
                                  Properties:
                                    Font: =AppFont
                                    Color: =C_Ink
                                    Size: =Round(18 * UI, 0)
                                    FontWeight: =FontWeight.Bold
                                    Height: =Round(30 * UI, 0)
                                    Text: =Coalesce(Trim(ThisItem.Brand & " " & ThisItem.Model), ThisItem.Title)
                                    Width: =Parent.Width - Round(70 * UI, 0)
                                    X: =Round(23 * UI, 0)
                                    Y: =Round(10 * UI, 0)
                                    Wrap: =false
                              - lblResSF_Fd:
                                  Control: Label@2.5.1
                                  Properties:
                                    Font: =AppFont
                                    Color: =C_Ink2
                                    Size: =Round(15 * UI, 0)
                                    Height: =Round(23 * UI, 0)
                                    Text: =ThisItem.Title & If(IsBlank(ThisItem.Width.Value), "", "  ·  W " & ThisItem.Width.Value) & If(IsBlank(ThisItem.Depth.Value), "", "  ·  D " & ThisItem.Depth.Value) & If(IsBlank(ThisItem.Height.Value), "", "  ·  H " & ThisItem.Height.Value)
                                    Width: =Parent.Width - Round(70 * UI, 0)
                                    X: =Round(23 * UI, 0)
                                    Y: =Round(40 * UI, 0)
                                    Wrap: =false
                              - lblResLF_Fd:
                                  Control: Label@2.5.1
                                  Properties:
                                    Font: =AppFont
                                    Color: =C_Muted
                                    Size: =Round(15 * UI, 0)
                                    Height: =Round(23 * UI, 0)
                                    Text: |-
                                      ="Location: " & Coalesce(ThisItem.Location.Value, "—")
                                    Width: =Parent.Width - Round(70 * UI, 0)
                                    X: =Round(23 * UI, 0)
                                    Y: =Round(63 * UI, 0)
                                    Wrap: =false
                              - icoResGoF_Fd:
                                  Control: ModernIcon@1.1.1
                                  Properties:
                                    Height: =Round(30 * UI, 0)
                                    Icon: ="ChevronRight"
                                    IconColor: =C_Muted
                                    Width: =Round(30 * UI, 0)
                                    X: =Parent.Width - Round(43 * UI, 0)
                                    Y: =Round(33 * UI, 0)
                              - btnResF_Fd:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderStyle: =BorderStyle.None
                                    Height: =Parent.Height
                                    Width: =Parent.Width
                                    X: =0
                                    Y: =0
                                    Text: =""
                                    OnSelect: |-
                                      =Set(varItemID, ThisItem.ID);
                                      Navigate(Item, ScreenTransition.Cover)
                  - galResC_Fd:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =Round(150 * UI, 0)
                        FillPortions: =1
                        Items: =Filter(Equipment_Inventory_SharePoint, Status.Value = "Available" && StartsWith(Title, Trim(txtCode_Fd.Text)))
                        TemplatePadding: =0
                        TemplateSize: =Round(103 * UI, 0)
                        Visible: =!IsBlank(Trim(txtCode_Fd.Text))
                        Width: =PageW - Round(40 * UI, 0)
                      Children:
                        - conResC_Fd:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =C_White
                              Height: =Round(93 * UI, 0)
                              Width: =Parent.TemplateWidth - Round(5 * UI, 0)
                              X: =Round(3 * UI, 0)
                              Y: =Round(5 * UI, 0)
                              RadiusBottomLeft: =Round(18 * UI, 0)
                              RadiusBottomRight: =Round(18 * UI, 0)
                              RadiusTopLeft: =Round(18 * UI, 0)
                              RadiusTopRight: =Round(18 * UI, 0)
                              BorderColor: =C_Line
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                            Children:
                              - conResBarC_Fd:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    Fill: =Switch(ThisItem.Category.Value, "Wheelchair", RGBA(166, 199, 130, 1), "Cushion", RGBA(0, 144, 153, 1), "Backrest", RGBA(0, 200, 210, 1), RGBA(210, 218, 227, 1))
                                    Height: =Parent.Height
                                    Width: =Round(8 * UI, 0)
                                    X: =0
                                    Y: =0
                                    RadiusBottomLeft: =Round(18 * UI, 0)
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =Round(18 * UI, 0)
                                    RadiusTopRight: =0
                                    DropShadow: =DropShadow.None
                              - lblResTC_Fd:
                                  Control: Label@2.5.1
                                  Properties:
                                    Font: =AppFont
                                    Color: =C_Ink
                                    Size: =Round(18 * UI, 0)
                                    FontWeight: =FontWeight.Bold
                                    Height: =Round(30 * UI, 0)
                                    Text: =Coalesce(Trim(ThisItem.Brand & " " & ThisItem.Model), ThisItem.Title)
                                    Width: =Parent.Width - Round(70 * UI, 0)
                                    X: =Round(23 * UI, 0)
                                    Y: =Round(10 * UI, 0)
                                    Wrap: =false
                              - lblResSC_Fd:
                                  Control: Label@2.5.1
                                  Properties:
                                    Font: =AppFont
                                    Color: =C_Ink2
                                    Size: =Round(15 * UI, 0)
                                    Height: =Round(23 * UI, 0)
                                    Text: =ThisItem.Title & If(IsBlank(ThisItem.Width.Value), "", "  ·  W " & ThisItem.Width.Value) & If(IsBlank(ThisItem.Depth.Value), "", "  ·  D " & ThisItem.Depth.Value) & If(IsBlank(ThisItem.Height.Value), "", "  ·  H " & ThisItem.Height.Value)
                                    Width: =Parent.Width - Round(70 * UI, 0)
                                    X: =Round(23 * UI, 0)
