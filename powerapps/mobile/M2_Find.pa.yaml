Screens:
  Find:
    Properties:
      Fill: =C_Bg
      OnVisible: |-
        =If(IsBlank(fdCat), Set(fdCat, "Wheelchair"));
        Set(fdShowFilter, false);
        Reset(txtCode_Fd);
        Select(btnLoad_Fd)
    Children:
      - btnLoad_Fd:
          Control: Button@0.0.45
          Properties:
            Height: =1
            Width: =1
            X: =0
            Y: =0
            Text: =""
            Visible: =false
            OnSelect: |-
              =// Available equipment in the chosen category (filtered on the phone after this)
              ClearCollect(
                  colFind,
                  AddColumns(
                      Filter(Equipment_Inventory_SharePoint, Status.Value = "Available" && Category.Value = fdCat),
                      cType, 'Wheelchair Type'.Value,
                      cWidth, Width.Value,
                      cDepth, Depth.Value,
                      cHeight, Height.Value
                  )
              )
      - conRoot_Fd:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =C_Bg
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutJustifyContent: =LayoutJustifyContent.Start
            LayoutGap: =0
            PaddingTop: =0
            PaddingRight: =0
            PaddingBottom: =0
            PaddingLeft: =0
            DropShadow: =DropShadow.None
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - conHdr_Fd:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  LayoutMinHeight: =76
                  FillPortions: =0
                  Fill: =RGBA(7, 95, 115, 1)
                  Height: =76
                  Width: =App.Width
                  X: =0
                  Y: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  DropShadow: =DropShadow.None
                Children:
                  - imgHdr_Fd:
                      Control: Image@2.2.3
                      Properties:
                        Height: =Parent.Height
                        Image: =HeaderImage
                        ImagePosition: =ImagePosition.Fill
                        Width: =Parent.Width
                        X: =0
                        Y: =0
                  - btnBack_Fd:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Transparent
                        FontColor: =C_White
                        FontSize: =28
                        Height: =48
                        Icon: ="ChevronLeft"
                        Text: =""
                        Width: =48
                        X: =4
                        Y: =14
                        OnSelect: =Back(ScreenTransition.UnCoverRight)
                  - lblHdrT_Fd:
                      Control: Label@2.5.1
                      Properties:
                        Font: =AppFont
                        Color: =C_White
                        Size: =20
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        Text: ="Find equipment"
                        Width: =Parent.Width - 68
                        X: =52
                        Y: =16
                        Wrap: =false
                  - lblHdrS_Fd:
                      Control: Label@2.5.1
                      Properties:
                        Font: =AppFont
                        Color: =RGBA(255, 255, 255, 0.85)
                        Size: =12
                        Height: =20
                        Text: ="Available " & Lower(fdCat) & "s"
                        Width: =Parent.Width - 68
                        X: =52
                        Y: =42
                        Wrap: =false
            - conBody_Fd:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  LayoutMinHeight: =200
                  FillPortions: =1
                  Width: =App.Width
                  Fill: =RGBA(0, 0, 0, 0)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutGap: =10
                  PaddingTop: =12
                  PaddingRight: =16
                  PaddingBottom: =8
                  PaddingLeft: =16
                  DropShadow: =DropShadow.None
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - conCode_Fd:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =48
                        FillPortions: =0
                        Fill: =C_White
                        Height: =48
                        Width: =App.Width - 32
                        X: =0
                        Y: =0
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        BorderColor: =RGBA(14, 42, 70, 0.22)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                      Children:
                        - icoCode_Fd:
                            Control: ModernIcon@1.1.1
                            Properties:
                              Height: =24
                              Icon: ="Search"
                              IconColor: =C_Muted
                              Width: =24
                              X: =12
                              Y: =12
                        - txtCode_Fd:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              BorderStyle: =BorderStyle.None
                              Color: =C_Ink
                              Default: =""
                              DelayOutput: =true
                              Fill: =RGBA(0, 0, 0, 0)
                              Font: =AppFont
                              Height: =Parent.Height
                              HintText: ="Search by barcode"
                              Size: =15
                              Width: =Parent.Width - 44
                              X: =40
                              Y: =0
                  - conSegCat_Fd:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        Visible: =IsBlank(Trim(txtCode_Fd.Text))
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =40
                        FillPortions: =0
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =40
                        Width: =App.Width - 32
                        X: =0
                        Y: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        DropShadow: =DropShadow.None
                      Children:
                        - conSegCatWheelchair_Fd:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =If(fdCat = "Wheelchair", C_Accent, C_White)
                              Height: =40
                              Width: =(App.Width - 32 - 16) / 3
                              X: =0 * ((App.Width - 32 - 16) / 3 + 8)
                              Y: =0
                              RadiusBottomLeft: =20
                              RadiusBottomRight: =20
                              RadiusTopLeft: =20
                              RadiusTopRight: =20
                              BorderColor: =If(fdCat = "Wheelchair", C_Accent, C_Line)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                            Children:
                              - btnSegCatWheelchair_Fd:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderRadius: =20
                                    Font: =Font.'Segoe UI'
                                    FontColor: =If(fdCat = "Wheelchair", C_White, C_Ink2)
                                    FontSize: =13
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    Width: =Parent.Width
                                    Text: ="Wheelchairs"
                                    OnSelect: |-
                                      =Set(fdCat, "Wheelchair");
                                      Set(fdType, Blank()); Set(fdBrand, Blank()); Set(fdModel, Blank()); Set(fdWidth, Blank()); Set(fdDepth, Blank()); Set(fdHeight, Blank());
                                      Select(btnLoad_Fd)
                        - conSegCatCushion_Fd:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =If(fdCat = "Cushion", C_Accent, C_White)
                              Height: =40
                              Width: =(App.Width - 32 - 16) / 3
                              X: =1 * ((App.Width - 32 - 16) / 3 + 8)
                              Y: =0
                              RadiusBottomLeft: =20
                              RadiusBottomRight: =20
                              RadiusTopLeft: =20
                              RadiusTopRight: =20
                              BorderColor: =If(fdCat = "Cushion", C_Accent, C_Line)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                            Children:
                              - btnSegCatCushion_Fd:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderRadius: =20
                                    Font: =Font.'Segoe UI'
                                    FontColor: =If(fdCat = "Cushion", C_White, C_Ink2)
                                    FontSize: =13
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    Width: =Parent.Width
                                    Text: ="Cushions"
                                    OnSelect: |-
                                      =Set(fdCat, "Cushion");
                                      Set(fdType, Blank()); Set(fdBrand, Blank()); Set(fdModel, Blank()); Set(fdWidth, Blank()); Set(fdDepth, Blank()); Set(fdHeight, Blank());
                                      Select(btnLoad_Fd)
                        - conSegCatBackrest_Fd:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =If(fdCat = "Backrest", C_Accent, C_White)
                              Height: =40
                              Width: =(App.Width - 32 - 16) / 3
                              X: =2 * ((App.Width - 32 - 16) / 3 + 8)
                              Y: =0
                              RadiusBottomLeft: =20
                              RadiusBottomRight: =20
                              RadiusTopLeft: =20
                              RadiusTopRight: =20
                              BorderColor: =If(fdCat = "Backrest", C_Accent, C_Line)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                            Children:
                              - btnSegCatBackrest_Fd:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderRadius: =20
                                    Font: =Font.'Segoe UI'
                                    FontColor: =If(fdCat = "Backrest", C_White, C_Ink2)
                                    FontSize: =13
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    Width: =Parent.Width
                                    Text: ="Backrests"
                                    OnSelect: |-
                                      =Set(fdCat, "Backrest");
                                      Set(fdType, Blank()); Set(fdBrand, Blank()); Set(fdModel, Blank()); Set(fdWidth, Blank()); Set(fdDepth, Blank()); Set(fdHeight, Blank());
                                      Select(btnLoad_Fd)
                  - conBar_Fd:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =40
                        FillPortions: =0
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =40
                        Width: =App.Width - 32
                        X: =0
                        Y: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        DropShadow: =DropShadow.None
                        Visible: =IsBlank(Trim(txtCode_Fd.Text))
                      Children:
                        - conFilterBtn_Fd:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =If((If(IsBlank(fdType), 0, 1) + If(IsBlank(fdBrand), 0, 1) + If(IsBlank(fdModel), 0, 1) + If(IsBlank(fdWidth), 0, 1) + If(IsBlank(fdDepth), 0, 1) + If(IsBlank(fdHeight), 0, 1)) > 0, C_Accent, C_White)
                              Height: =40
                              Width: =130
                              X: =0
                              Y: =0
                              RadiusBottomLeft: =20
                              RadiusBottomRight: =20
                              RadiusTopLeft: =20
                              RadiusTopRight: =20
                              BorderColor: =If((If(IsBlank(fdType), 0, 1) + If(IsBlank(fdBrand), 0, 1) + If(IsBlank(fdModel), 0, 1) + If(IsBlank(fdWidth), 0, 1) + If(IsBlank(fdDepth), 0, 1) + If(IsBlank(fdHeight), 0, 1)) > 0, C_Accent, C_Line)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                            Children:
                              - btnFilterBtn_Fd:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderRadius: =20
                                    Font: =Font.'Segoe UI'
                                    FontColor: =If((If(IsBlank(fdType), 0, 1) + If(IsBlank(fdBrand), 0, 1) + If(IsBlank(fdModel), 0, 1) + If(IsBlank(fdWidth), 0, 1) + If(IsBlank(fdDepth), 0, 1) + If(IsBlank(fdHeight), 0, 1)) > 0, C_White, C_Ink2)
                                    FontSize: =14
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    Width: =Parent.Width
                                    Text: ="Filters" & If((If(IsBlank(fdType), 0, 1) + If(IsBlank(fdBrand), 0, 1) + If(IsBlank(fdModel), 0, 1) + If(IsBlank(fdWidth), 0, 1) + If(IsBlank(fdDepth), 0, 1) + If(IsBlank(fdHeight), 0, 1)) > 0, "  ·  " & (If(IsBlank(fdType), 0, 1) + If(IsBlank(fdBrand), 0, 1) + If(IsBlank(fdModel), 0, 1) + If(IsBlank(fdWidth), 0, 1) + If(IsBlank(fdDepth), 0, 1) + If(IsBlank(fdHeight), 0, 1)), "")
                                    OnSelect: =Set(fdShowFilter, true)
                                    Icon: ="Filter"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                    Layout: ='ButtonCanvas.Layout'.IconBefore
                        - lblCount_Fd:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Ink
                              Size: =14
                              FontWeight: =FontWeight.Bold
                              Height: =40
                              Text: =If(IsBlank(Trim(txtCode_Fd.Text)), CountRows(galResF_Fd.AllItems), CountRows(galResC_Fd.AllItems)) & " available"
                              Width: =Parent.Width - 146
                              X: =146
                              Y: =0
                              VerticalAlign: =VerticalAlign.Middle
                              Wrap: =false
                  - lblActive_Fd:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =18
                        FillPortions: =0
                        Font: =AppFont
                        Color: =C_Accent
                        Size: =12
                        FontWeight: =FontWeight.Bold
                        Height: =18
                        Text: =Concatenate(If(IsBlank(fdType), "", fdType & "  ·  "), If(IsBlank(fdBrand), "", fdBrand & "  ·  "), If(IsBlank(fdModel), "", fdModel & "  ·  "), If(IsBlank(fdWidth), "", "W " & fdWidth & "  ·  "), If(IsBlank(fdDepth), "", "D " & fdDepth & "  ·  "), If(IsBlank(fdHeight), "", "H " & fdHeight))
                        Width: =App.Width - 32
                        X: =0
                        Y: =0
                        Wrap: =false
                        Visible: =IsBlank(Trim(txtCode_Fd.Text)) && (!IsBlank(fdType) || !IsBlank(fdBrand) || !IsBlank(fdModel) || !IsBlank(fdWidth) || !IsBlank(fdDepth) || !IsBlank(fdHeight))
                  - galResF_Fd:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =120
                        FillPortions: =1
                        Items: =Sort(Sort(Filter(colFind, (IsBlank(fdType) || cType = fdType) && (IsBlank(fdBrand) || Brand = fdBrand) && (IsBlank(fdModel) || Model = fdModel) && (IsBlank(fdWidth) || cWidth = fdWidth) && (IsBlank(fdDepth) || cDepth = fdDepth) && (IsBlank(fdHeight) || cHeight = fdHeight)), Model), Brand)
                        TemplatePadding: =0
                        TemplateSize: =82
                        Visible: =IsBlank(Trim(txtCode_Fd.Text))
                        Width: =App.Width - 32
                      Children:
                        - conResF_Fd:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =C_White
                              Height: =74
                              Width: =Parent.TemplateWidth - 4
                              X: =2
                              Y: =4
                              RadiusBottomLeft: =14
                              RadiusBottomRight: =14
                              RadiusTopLeft: =14
                              RadiusTopRight: =14
                              BorderColor: =C_Line
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                            Children:
                              - conResBarF_Fd:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    Fill: =Switch(ThisItem.Category.Value, "Wheelchair", RGBA(166, 199, 130, 1), "Cushion", RGBA(0, 144, 153, 1), "Backrest", RGBA(0, 200, 210, 1), RGBA(210, 218, 227, 1))
                                    Height: =Parent.Height
                                    Width: =6
                                    X: =0
                                    Y: =0
                                    RadiusBottomLeft: =14
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =14
                                    RadiusTopRight: =0
                                    DropShadow: =DropShadow.None
                              - lblResTF_Fd:
                                  Control: Label@2.5.1
                                  Properties:
                                    Font: =AppFont
                                    Color: =C_Ink
                                    Size: =15
                                    FontWeight: =FontWeight.Bold
                                    Height: =24
                                    Text: =Coalesce(Trim(ThisItem.Brand & " " & ThisItem.Model), ThisItem.Title)
                                    Width: =Parent.Width - 56
                                    X: =18
                                    Y: =8
                                    Wrap: =false
                              - lblResSF_Fd:
                                  Control: Label@2.5.1
                                  Properties:
                                    Font: =AppFont
                                    Color: =C_Ink2
                                    Size: =12
                                    Height: =18
                                    Text: =ThisItem.Title & If(IsBlank(ThisItem.Width.Value), "", "  ·  W " & ThisItem.Width.Value) & If(IsBlank(ThisItem.Depth.Value), "", "  ·  D " & ThisItem.Depth.Value) & If(IsBlank(ThisItem.Height.Value), "", "  ·  H " & ThisItem.Height.Value)
                                    Width: =Parent.Width - 56
                                    X: =18
                                    Y: =32
                                    Wrap: =false
                              - lblResLF_Fd:
                                  Control: Label@2.5.1
                                  Properties:
                                    Font: =AppFont
                                    Color: =C_Muted
                                    Size: =12
                                    Height: =18
                                    Text: |-
                                      ="Location: " & Coalesce(ThisItem.Location.Value, "—")
                                    Width: =Parent.Width - 56
                                    X: =18
                                    Y: =50
                                    Wrap: =false
                              - icoResGoF_Fd:
                                  Control: ModernIcon@1.1.1
                                  Properties:
                                    Height: =24
                                    Icon: ="ChevronRight"
                                    IconColor: =C_Muted
                                    Width: =24
                                    X: =Parent.Width - 34
                                    Y: =26
                              - btnResF_Fd:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderStyle: =BorderStyle.None
                                    Height: =Parent.Height
                                    Width: =Parent.Width
                                    X: =0
                                    Y: =0
                                    Text: =""
                                    OnSelect: |-
                                      =Set(varItemID, ThisItem.ID);
                                      Navigate(Item, ScreenTransition.Cover)
                  - galResC_Fd:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =120
                        FillPortions: =1
                        Items: =Filter(Equipment_Inventory_SharePoint, Status.Value = "Available" && StartsWith(Title, Trim(txtCode_Fd.Text)))
                        TemplatePadding: =0
                        TemplateSize: =82
                        Visible: =!IsBlank(Trim(txtCode_Fd.Text))
                        Width: =App.Width - 32
                      Children:
                        - conResC_Fd:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =C_White
                              Height: =74
                              Width: =Parent.TemplateWidth - 4
                              X: =2
                              Y: =4
                              RadiusBottomLeft: =14
                              RadiusBottomRight: =14
                              RadiusTopLeft: =14
                              RadiusTopRight: =14
                              BorderColor: =C_Line
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                            Children:
                              - conResBarC_Fd:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    Fill: =Switch(ThisItem.Category.Value, "Wheelchair", RGBA(166, 199, 130, 1), "Cushion", RGBA(0, 144, 153, 1), "Backrest", RGBA(0, 200, 210, 1), RGBA(210, 218, 227, 1))
                                    Height: =Parent.Height
                                    Width: =6
                                    X: =0
                                    Y: =0
                                    RadiusBottomLeft: =14
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =14
                                    RadiusTopRight: =0
                                    DropShadow: =DropShadow.None
                              - lblResTC_Fd:
                                  Control: Label@2.5.1
                                  Properties:
                                    Font: =AppFont
                                    Color: =C_Ink
                                    Size: =15
                                    FontWeight: =FontWeight.Bold
                                    Height: =24
                                    Text: =Coalesce(Trim(ThisItem.Brand & " " & ThisItem.Model), ThisItem.Title)
                                    Width: =Parent.Width - 56
                                    X: =18
                                    Y: =8
                                    Wrap: =false
                              - lblResSC_Fd:
                                  Control: Label@2.5.1
                                  Properties:
                                    Font: =AppFont
                                    Color: =C_Ink2
                                    Size: =12
                                    Height: =18
                                    Text: =ThisItem.Title & If(IsBlank(ThisItem.Width.Value), "", "  ·  W " & ThisItem.Width.Value) & If(IsBlank(ThisItem.Depth.Value), "", "  ·  D " & ThisItem.Depth.Value) & If(IsBlank(ThisItem.Height.Value), "", "  ·  H " & ThisItem.Height.Value)
                                    Width: =Parent.Width - 56
                                    X: =18
                                    Y: =32
                                    Wrap: =false
                              - lblResLC_Fd:
                                  Control: Label@2.5.1
                                  Properties:
                                    Font: =AppFont
                                    Color: =C_Muted
                                    Size: =12
                                    Height: =18
                                    Text: |-
                                      ="Location: " & Coalesce(ThisItem.Location.Value, "—")
                                    Width: =Parent.Width - 56
                                    X: =18
                                    Y: =50
                                    Wrap: =false
                              - icoResGoC_Fd:
                                  Control: ModernIcon@1.1.1
                                  Properties:
                                    Height: =24
                                    Icon: ="ChevronRight"
                                    IconColor: =C_Muted
                                    Width: =24
                                    X: =Parent.Width - 34
                                    Y: =26
                              - btnResC_Fd:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderStyle: =BorderStyle.None
                                    Height: =Parent.Height
                                    Width: =Parent.Width
                                    X: =0
                                    Y: =0
                                    Text: =""
                                    OnSelect: |-
                                      =Set(varItemID, ThisItem.ID);
                                      Navigate(Item, ScreenTransition.Cover)
                  - lblEmpty_Fd:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =40
                        FillPortions: =0
                        Font: =AppFont
                        Color: =C_Muted
                        Size: =13
                        Height: =40
                        Text: ="No available equipment matches. Try clearing a filter."
                        Width: =App.Width - 32
                        X: =0
                        Y: =0
                        Align: =Align.Center
                        Visible: =If(IsBlank(Trim(txtCode_Fd.Text)), IsEmpty(galResF_Fd.AllItems), IsEmpty(galResC_Fd.AllItems))
      - conOverlay_Fd:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(14, 28, 42, 0.45)
            Height: =Parent.Height
            Width: =Parent.Width
            X: =0
            Y: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            DropShadow: =DropShadow.None
            Visible: =fdShowFilter
          Children:
            - btnScrim_Fd:
                Control: Button@0.0.45
                Properties:
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  BorderStyle: =BorderStyle.None
                  Height: =Parent.Height
                  Width: =Parent.Width
                  X: =0
                  Y: =0
                  Text: =""
                  OnSelect: =Set(fdShowFilter, false)
            - conSheet_Fd:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =C_White
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutGap: =10
                  PaddingTop: =20
                  PaddingRight: =20
                  PaddingBottom: =24
                  PaddingLeft: =20
                  DropShadow: =DropShadow.None
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =22
                  RadiusTopRight: =22
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  X: =0
                  Width: =Parent.Width
                  Height: =Min(Parent.Height - 40, 450)
