Screens:
  Availability:
    Properties:
      Fill: =C_Bg
      OnVisible: |-
        =ClearCollect(
            colAvail,
            AddColumns(
                Filter(Equipment_Inventory_SharePoint, Category.Value in ["Wheelchair", "Cushion", "Backrest"]),
                cCat, Category.Value,
                cType, 'Wheelchair Type'.Value,
                cWidth, Width.Value,
                cStatus, Status.Value
            )
        );
        If(IsBlank(avCat), Set(avCat, "Wheelchair"));
        If(IsBlank(avType), Set(avType, "Manual Wheelchair"))
    Children:
      - conRoot_Av:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =C_Bg
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutJustifyContent: =LayoutJustifyContent.Start
            LayoutGap: =0
            PaddingTop: =0
            PaddingRight: =0
            PaddingBottom: =0
            PaddingLeft: =0
            DropShadow: =DropShadow.None
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - conHdr_Av:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  LayoutMinHeight: =76
                  FillPortions: =0
                  Fill: =RGBA(7, 95, 115, 1)
                  Height: =76
                  Width: =App.Width
                  X: =0
                  Y: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  DropShadow: =DropShadow.None
                Children:
                  - imgHdr_Av:
                      Control: Image@2.2.3
                      Properties:
                        Height: =Parent.Height
                        Image: =HeaderImage
                        ImagePosition: =ImagePosition.Fill
                        Width: =Parent.Width
                        X: =0
                        Y: =0
                  - btnBack_Av:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Transparent
                        FontColor: =C_White
                        FontSize: =28
                        Height: =48
                        Icon: ="ChevronLeft"
                        Text: =""
                        Width: =48
                        X: =4
                        Y: =14
                        OnSelect: =Back(ScreenTransition.UnCoverRight)
                  - lblHdrT_Av:
                      Control: Label@2.5.1
                      Properties:
                        Font: =AppFont
                        Color: =C_White
                        Size: =20
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        Text: ="Availability"
                        Width: =Parent.Width - 68
                        X: =52
                        Y: =16
                        Wrap: =false
                  - lblHdrS_Av:
                      Control: Label@2.5.1
                      Properties:
                        Font: =AppFont
                        Color: =RGBA(255, 255, 255, 0.85)
                        Size: =12
                        Height: =20
                        Text: ="Free equipment by width"
                        Width: =Parent.Width - 68
                        X: =52
                        Y: =42
                        Wrap: =false
            - conBody_Av:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  LayoutMinHeight: =200
                  FillPortions: =1
                  Width: =App.Width
                  Fill: =RGBA(0, 0, 0, 0)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutGap: =10
                  PaddingTop: =12
                  PaddingRight: =16
                  PaddingBottom: =12
                  PaddingLeft: =16
                  DropShadow: =DropShadow.None
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - conSegCat_Av:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =40
                        FillPortions: =0
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =40
                        Width: =App.Width - 32
                        X: =0
                        Y: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        DropShadow: =DropShadow.None
                      Children:
                        - conSegCatWheelchair_Av:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =If(avCat = "Wheelchair", C_Accent, C_White)
                              Height: =40
                              Width: =(App.Width - 32 - 16) / 3
                              X: =0 * ((App.Width - 32 - 16) / 3 + 8)
                              Y: =0
                              RadiusBottomLeft: =20
                              RadiusBottomRight: =20
                              RadiusTopLeft: =20
                              RadiusTopRight: =20
                              BorderColor: =If(avCat = "Wheelchair", C_Accent, C_Line)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                            Children:
                              - btnSegCatWheelchair_Av:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderRadius: =20
                                    Font: =Font.'Segoe UI'
                                    FontColor: =If(avCat = "Wheelchair", C_White, C_Ink2)
                                    FontSize: =13
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    Width: =Parent.Width
                                    Text: ="Wheelchairs"
                                    OnSelect: =Set(avCat, "Wheelchair")
                        - conSegCatCushion_Av:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =If(avCat = "Cushion", C_Accent, C_White)
                              Height: =40
                              Width: =(App.Width - 32 - 16) / 3
                              X: =1 * ((App.Width - 32 - 16) / 3 + 8)
                              Y: =0
                              RadiusBottomLeft: =20
                              RadiusBottomRight: =20
                              RadiusTopLeft: =20
                              RadiusTopRight: =20
                              BorderColor: =If(avCat = "Cushion", C_Accent, C_Line)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                            Children:
                              - btnSegCatCushion_Av:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderRadius: =20
                                    Font: =Font.'Segoe UI'
                                    FontColor: =If(avCat = "Cushion", C_White, C_Ink2)
                                    FontSize: =13
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    Width: =Parent.Width
                                    Text: ="Cushions"
                                    OnSelect: =Set(avCat, "Cushion")
                        - conSegCatBackrest_Av:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =If(avCat = "Backrest", C_Accent, C_White)
                              Height: =40
                              Width: =(App.Width - 32 - 16) / 3
                              X: =2 * ((App.Width - 32 - 16) / 3 + 8)
                              Y: =0
                              RadiusBottomLeft: =20
                              RadiusBottomRight: =20
                              RadiusTopLeft: =20
                              RadiusTopRight: =20
                              BorderColor: =If(avCat = "Backrest", C_Accent, C_Line)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                            Children:
                              - btnSegCatBackrest_Av:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderRadius: =20
                                    Font: =Font.'Segoe UI'
                                    FontColor: =If(avCat = "Backrest", C_White, C_Ink2)
                                    FontSize: =13
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    Width: =Parent.Width
                                    Text: ="Backrests"
                                    OnSelect: =Set(avCat, "Backrest")
                  - conSegType_Av:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        Visible: =avCat = "Wheelchair"
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =40
                        FillPortions: =0
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =40
                        Width: =App.Width - 32
                        X: =0
                        Y: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        DropShadow: =DropShadow.None
                      Children:
                        - conSegTypeManualWheelchair_Av:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =If(avType = "Manual Wheelchair", C_Accent, C_White)
                              Height: =40
                              Width: =(App.Width - 32 - 16) / 3
                              X: =0 * ((App.Width - 32 - 16) / 3 + 8)
                              Y: =0
                              RadiusBottomLeft: =20
                              RadiusBottomRight: =20
                              RadiusTopLeft: =20
                              RadiusTopRight: =20
                              BorderColor: =If(avType = "Manual Wheelchair", C_Accent, C_Line)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                            Children:
                              - btnSegTypeManualWheelchair_Av:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderRadius: =20
                                    Font: =Font.'Segoe UI'
                                    FontColor: =If(avType = "Manual Wheelchair", C_White, C_Ink2)
                                    FontSize: =13
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    Width: =Parent.Width
                                    Text: ="Manual"
                                    OnSelect: =Set(avType, "Manual Wheelchair")
                        - conSegTypeTiltinSpace_Av:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =If(avType = "Tilt in Space", C_Accent, C_White)
                              Height: =40
                              Width: =(App.Width - 32 - 16) / 3
                              X: =1 * ((App.Width - 32 - 16) / 3 + 8)
                              Y: =0
                              RadiusBottomLeft: =20
                              RadiusBottomRight: =20
                              RadiusTopLeft: =20
                              RadiusTopRight: =20
                              BorderColor: =If(avType = "Tilt in Space", C_Accent, C_Line)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                            Children:
                              - btnSegTypeTiltinSpace_Av:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderRadius: =20
                                    Font: =Font.'Segoe UI'
                                    FontColor: =If(avType = "Tilt in Space", C_White, C_Ink2)
                                    FontSize: =13
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    Width: =Parent.Width
                                    Text: ="Tilt in space"
                                    OnSelect: =Set(avType, "Tilt in Space")
                        - conSegTypePowerWheelchair_Av:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =If(avType = "Power Wheelchair", C_Accent, C_White)
                              Height: =40
                              Width: =(App.Width - 32 - 16) / 3
                              X: =2 * ((App.Width - 32 - 16) / 3 + 8)
                              Y: =0
                              RadiusBottomLeft: =20
                              RadiusBottomRight: =20
                              RadiusTopLeft: =20
                              RadiusTopRight: =20
                              BorderColor: =If(avType = "Power Wheelchair", C_Accent, C_Line)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                            Children:
                              - btnSegTypePowerWheelchair_Av:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderRadius: =20
                                    Font: =Font.'Segoe UI'
                                    FontColor: =If(avType = "Power Wheelchair", C_White, C_Ink2)
                                    FontSize: =13
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    Width: =Parent.Width
                                    Text: ="Power"
                                    OnSelect: =Set(avType, "Power Wheelchair")
                  - conSum_Av:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =76
                        FillPortions: =0
                        Fill: =C_White
                        Height: =76
                        Width: =App.Width - 32
                        X: =0
                        Y: =0
                        RadiusBottomLeft: =16
                        RadiusBottomRight: =16
                        RadiusTopLeft: =16
                        RadiusTopRight: =16
                        BorderColor: =C_Line
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.Light
                      Children:
                        - lblSumN_Av:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Ink
                              Size: =26
                              FontWeight: =FontWeight.Bold
                              Height: =34
                              Text: =CountRows(Filter(Filter(colAvail, cCat = avCat && (avCat <> "Wheelchair" || cType = avType) && !IsBlank(cWidth)), cStatus = "Available")) & " of " & CountRows(Filter(colAvail, cCat = avCat && (avCat <> "Wheelchair" || cType = avType) && !IsBlank(cWidth)))
                              Width: =Parent.Width - 32
                              X: =16
                              Y: =10
                              Wrap: =false
                        - lblSumS_Av:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Muted
                              Size: =12
                              Height: =20
                              Text: ="available right now  ·  " & If(avCat = "Wheelchair", avType, avCat & "s")
                              Width: =Parent.Width - 32
                              X: =16
                              Y: =46
                              Wrap: =false
                  - galWidths_Av:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =120
                        FillPortions: =1
                        Items: =SortByColumns(AddColumns(GroupBy(Filter(colAvail, cCat = avCat && (avCat <> "Wheelchair" || cType = avType) && !IsBlank(cWidth)), cWidth, Rows), Total, CountRows(Rows), Free, CountRows(Filter(Rows, cStatus = "Available"))), "cWidth", SortOrder.Ascending)
                        TemplatePadding: =0
                        TemplateSize: =70
                        Width: =App.Width - 32
                      Children:
                        - conRow_Av:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =C_White
                              Height: =62
                              Width: =Parent.TemplateWidth - 4
                              X: =2
                              Y: =4
                              RadiusBottomLeft: =14
                              RadiusBottomRight: =14
                              RadiusTopLeft: =14
                              RadiusTopRight: =14
                              BorderColor: =C_Line
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                            Children:
                              - lblW_Av:
                                  Control: Label@2.5.1
                                  Properties:
                                    Font: =AppFont
                                    Color: =C_Ink
                                    Size: =18
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    Text: =ThisItem.cWidth
                                    Width: =70
                                    X: =16
                                    Y: =0
                                    VerticalAlign: =VerticalAlign.Middle
                                    Wrap: =false
                              - conBarBg_Av:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    Fill: =C_Bg
                                    Height: =14
                                    Width: =(Parent.Width - 180)
                                    X: =90
                                    Y: =24
                                    RadiusBottomLeft: =7
                                    RadiusBottomRight: =7
                                    RadiusTopLeft: =7
                                    RadiusTopRight: =7
                                    DropShadow: =DropShadow.None
                              - conBar_Av:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    Fill: =If(ThisItem.Free = 0, C_Danger, ThisItem.Free / Max(1, ThisItem.Total) < 0.3, C_Amber, C_Good)
                                    Height: =14
                                    Width: =(Parent.Width - 180) * ThisItem.Free / Max(1, ThisItem.Total)
                                    X: =90
                                    Y: =24
                                    RadiusBottomLeft: =7
                                    RadiusBottomRight: =7
                                    RadiusTopLeft: =7
                                    RadiusTopRight: =7
                                    DropShadow: =DropShadow.None
                              - lblN_Av:
                                  Control: Label@2.5.1
                                  Properties:
                                    Font: =AppFont
                                    Color: =C_Ink2
                                    Size: =14
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    Text: =ThisItem.Free & " / " & ThisItem.Total
                                    Width: =50
                                    X: =Parent.Width - 82
                                    Y: =0
                                    Align: =Align.Right
                                    VerticalAlign: =VerticalAlign.Middle
                                    Wrap: =false
                              - icoGo_Av:
                                  Control: ModernIcon@1.1.1
                                  Properties:
                                    Height: =24
                                    Icon: ="ChevronRight"
                                    IconColor: =C_Muted
                                    Width: =24
                                    X: =Parent.Width - 30
                                    Y: =19
                              - btnRow_Av:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderStyle: =BorderStyle.None
                                    Height: =Parent.Height
                                    Width: =Parent.Width
                                    X: =0
                                    Y: =0
                                    Text: =""
                                    OnSelect: |-
                                      =Set(fdCat, avCat); Set(fdType, If(avCat = "Wheelchair", avType, Blank())); Set(fdBrand, Blank()); Set(fdModel, Blank()); Set(fdWidth, ThisItem.cWidth); Set(fdDepth, Blank()); Set(fdHeight, Blank());
                                      Navigate(Find, ScreenTransition.Cover)
                  - lblHint_Av:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =20
                        FillPortions: =0
                        Font: =AppFont
                        Color: =C_Muted
                        Size: =12
                        Height: =20
                        Text: =Concatenate("Tap a width to see the available ", Lower(avCat), "s.")
                        Width: =App.Width - 32
                        X: =0
                        Y: =0
                        Align: =Align.Center
