Screens:
  Item:
    Properties:
      Fill: =C_Bg
      OnVisible: |-
        =// Always read the item fresh (someone else may have changed it)
        Set(itItem, LookUp(Equipment_Inventory_SharePoint, ID = varItemID));
        Set(itShowReturn, false)
    Children:
      - conRoot_It:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =C_Bg
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutJustifyContent: =LayoutJustifyContent.Start
            LayoutGap: =0
            PaddingTop: =0
            PaddingRight: =0
            PaddingBottom: =0
            PaddingLeft: =0
            DropShadow: =DropShadow.None
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - conHdr_It:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  LayoutMinHeight: =76
                  FillPortions: =0
                  Fill: =RGBA(7, 95, 115, 1)
                  Height: =76
                  Width: =Parent.Width
                  X: =0
                  Y: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  DropShadow: =DropShadow.None
                Children:
                  - imgHdr_It:
                      Control: Image@2.2.3
                      Properties:
                        Height: =Parent.Height
                        Image: =HeaderImage
                        ImagePosition: =ImagePosition.Fill
                        Width: =Parent.Width
                        X: =0
                        Y: =0
                  - btnBack_It:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Transparent
                        FontColor: =C_White
                        FontSize: =28
                        Height: =48
                        Icon: ="ChevronLeft"
                        Text: =""
                        Width: =48
                        X: =4
                        Y: =14
                        OnSelect: =Back(ScreenTransition.UnCoverRight)
                  - lblHdrT_It:
                      Control: Label@2.5.1
                      Properties:
                        Font: =AppFont
                        Color: =C_White
                        Size: =20
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        Text: =Coalesce(itItem.Title, "Equipment")
                        Width: =Parent.Width - 68
                        X: =52
                        Y: =16
                        Wrap: =false
                  - lblHdrS_It:
                      Control: Label@2.5.1
                      Properties:
                        Font: =AppFont
                        Color: =RGBA(255, 255, 255, 0.85)
                        Size: =12
                        Height: =20
                        Text: =Coalesce(itItem.Category.Value, "") & "  ·  " & Coalesce(itItem.Status.Value, "")
                        Width: =Parent.Width - 68
                        X: =52
                        Y: =42
                        Wrap: =false
            - conBody_It:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  LayoutMinHeight: =120
                  FillPortions: =1
                  Fill: =RGBA(0, 0, 0, 0)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutGap: =12
                  PaddingTop: =16
                  PaddingRight: =16
                  PaddingBottom: =16
                  PaddingLeft: =16
                  DropShadow: =DropShadow.None
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                Children:
                  - conDetail_It:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =262
                        FillPortions: =0
                        Fill: =C_White
                        Height: =262
                        Width: =Parent.Width
                        X: =0
                        Y: =0
                        RadiusBottomLeft: =18
                        RadiusBottomRight: =18
                        RadiusTopLeft: =18
                        RadiusTopRight: =18
                        BorderColor: =C_Line
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.Light
                      Children:
                        - lblName_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Ink
                              Size: =20
                              FontWeight: =FontWeight.Bold
                              Height: =28
                              Text: =Coalesce(Trim(itItem.Brand & " " & itItem.Model), itItem.Title)
                              Width: =Parent.Width - 32
                              X: =16
                              Y: =14
                              Wrap: =false
                        - conCat_It:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =Switch(itItem.Category.Value, "Wheelchair", RGBA(166, 199, 130, 1), "Cushion", RGBA(0, 144, 153, 1), "Backrest", RGBA(0, 200, 210, 1), RGBA(210, 218, 227, 1))
