                              BorderRadius: =24
                              Font: =AppFont
                              FontColor: =C_White
                              FontSize: =16
                              FontWeight: =FontWeight.Bold
                              Height: =Parent.Height
                              Width: =Parent.Width
                              Text: =If(Coalesce(itItem.Status.Value, "") = "Available", "Allocate to a patient", Coalesce(itItem.Status.Value, "") = "Allocated", "Return equipment", "Not available  ·  " & Coalesce(itItem.Status.Value, ""))
