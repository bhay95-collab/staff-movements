                Children:
                  - lblSheetT_It:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =32
                        FillPortions: =0
                        Font: =AppFont
                        Color: =C_Ink
                        Size: =19
                        FontWeight: =FontWeight.Bold
                        Height: =32
                        Text: ="Return " & itItem.Title & "?"
                        Width: =Parent.Width
                        X: =0
                        Y: =0
                        Wrap: =false
                  - lblRetBody_It:
