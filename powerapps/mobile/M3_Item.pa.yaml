                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =48
                        Height: =48
                        FillPortions: =0
                        Fill: =RGBA(0, 0, 0, 0)
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        LayoutGap: =12
                        PaddingTop: =0
                        PaddingRight: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        DropShadow: =DropShadow.None
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - conRetNo_It:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutMinWidth: =40
                              FillPortions: =1
                              Fill: =C_White
                              Height: =48
                              Width: =Parent.Width
                              X: =0
                              Y: =0
                              RadiusBottomLeft: =24
                              RadiusBottomRight: =24
                              RadiusTopLeft: =24
                              RadiusTopRight: =24
                              BorderColor: =C_Line
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                            Children:
                              - btnRetNo_It:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderRadius: =24
                                    Font: =AppFont
                                    FontColor: =C_Ink2
                                    FontSize: =15
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    Width: =Parent.Width
                                    Text: ="Cancel"
                                    OnSelect: =Set(itShowReturn, false)
                        - conRetGo_It:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutMinWidth: =40
                              FillPortions: =1
                              Fill: =C_Accent
                              Height: =48
                              Width: =Parent.Width
                              X: =0
                              Y: =0
                              RadiusBottomLeft: =24
                              RadiusBottomRight: =24
                              RadiusTopLeft: =24
                              RadiusTopRight: =24
                              BorderColor: =C_Accent
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                            Children:
                              - btnRetGo_It:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderRadius: =24
                                    Font: =AppFont
                                    FontColor: =C_White
                                    FontSize: =15
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    Width: =Parent.Width
                                    Text: ="Return"
                                    OnSelect: |-
                                      =If(
                                          IsBlank(itItem) || Coalesce(itItem.Status.Value, "") <> "Allocated" || IsBlank(itItem.'Date Signed Out'),
                                          Notify("This item is not signed out, so it cannot be returned.", NotificationType.Error),
                                          With(
                                              {
                                                  returnDate: Today(),
                                                  actionTime: Now(),
                                                  episodeKey: Coalesce(
                                                      itItem.CurrentEpisodeKey,
                                                      "LEGACY-RETURN-" & Text(itItem.ID) & "-" & Text(Now(), "yyyymmddhhmmss") & "-" & Left(Text(GUID()), 8)
                                                  ),
                                                  daysThisEpisode: Max(0, DateDiff(itItem.'Date Signed Out', Today(), TimeUnit.Days))
                                              },
                                              With(
                                                  { newTotalDays: Coalesce(itItem.TotalDaysSignedOut, 0) + daysThisEpisode },

                                                  // 1) inventory -> Available
                                                  Patch(
                                                      Equipment_Inventory_SharePoint,
                                                      itItem,
                                                      {
                                                          Status: { Value: "Available" },
                                                          'Patient Name': "",
                                                          URN: "",
                                                          Physiotherapist: "",
                                                          DOB: Blank(),
                                                          'Date Returned': returnDate,
                                                          Ward: Blank(),
                                                          'Signed In By': MeName,
                                                          CurrentEpisodeKey: Blank(),
                                                          TotalDaysSignedOut: newTotalDays
                                                      }
                                                  );

                                                  // 2) usage log: sign-in row
                                                  Patch(
                                                      Equipment_Usage_Log,
                                                      Defaults(Equipment_Usage_Log),
                                                      {
                                                          Title: episodeKey & " - Sign In",
                                                          EpisodeKey: episodeKey,
                                                          EventType: { Value: "Sign In" },
                                                          EpisodeStatus: { Value: If(IsBlank(itItem.CurrentEpisodeKey), "Legacy unmatched", "Closed") },
                                                          EventDateTime: actionTime,
                                                          EquipmentItemID: itItem.ID,
                                                          EquipmentTitle: itItem.Title,
                                                          Category: Coalesce(itItem.Category.Value, ""),
                                                          Brand: Coalesce(itItem.Brand, ""),
                                                          Model: Coalesce(itItem.Model, ""),
                                                          Width: Coalesce(itItem.Width.Value, ""),
                                                          Depth: Coalesce(itItem.Depth.Value, ""),
                                                          Height: Coalesce(itItem.Height.Value, ""),
                                                          SWL: Coalesce(itItem.SWL, ""),
                                                          WheelchairType: Coalesce(itItem.'Wheelchair Type'.Value, ""),
                                                          LocationAtEvent: Coalesce(itItem.Location.Value, ""),
                                                          Ward: Coalesce(itItem.Ward.Value, ""),
                                                          PatientName: Coalesce(itItem.'Patient Name', ""),
                                                          URN: Coalesce(itItem.URN, ""),
                                                          DOB: itItem.DOB,
                                                          Physiotherapist: Coalesce(itItem.Physiotherapist, ""),
                                                          DateSignedOut: itItem.'Date Signed Out',
                                                          DateReturned: returnDate,
                                                          DaysSignedOutThisEpisode: daysThisEpisode,
                                                          TotalDaysSignedOutAfterEvent: newTotalDays,
                                                          Over100DaysAfterEvent: newTotalDays > 100,
                                                          ServiceRequired: newTotalDays > 100,
                                                          IsHighRiskEquipment: Coalesce(itItem.IsHighRiskEquipment, false),
                                                          OutOfService: Coalesce(itItem.OutOfService, false),
                                                          IsActive: Coalesce(itItem.IsActive, true),
                                                          StatusAfterEvent: "Available",
                                                          ActionedByName: MeName,
                                                          ActionedByEmail: User().Email,
                                                          SourceApp: { Value: "Mobile" },
                                                          Notes: If(IsBlank(itItem.CurrentEpisodeKey), "Return completed without an existing CurrentEpisodeKey. This is likely a pre-log allocation.", "")
                                                      }
                                                  );

                                                  // 3) close the matching sign-out row
                                                  With(
                                                      { signOutRow: LookUp(Equipment_Usage_Log, EpisodeKey = episodeKey && EventType.Value = "Sign Out") },
                                                      If(
                                                          !IsBlank(signOutRow.ID),
                                                          Patch(
                                                              Equipment_Usage_Log,
                                                              signOutRow,
                                                              {
                                                                  EpisodeStatus: { Value: "Closed" },
                                                                  DateReturned: returnDate,
                                                                  DaysSignedOutThisEpisode: daysThisEpisode,
                                                                  TotalDaysSignedOutAfterEvent: newTotalDays,
                                                                  Over100DaysAfterEvent: newTotalDays > 100,
                                                                  ServiceRequired: newTotalDays > 100
                                                              }
                                                          )
                                                      )
                                                  );

                                                  Notify("Equipment returned.", NotificationType.Success);
                                                  If(
                                                      newTotalDays > 100,
                                                      Notify("Used for over 100 days this year: needs a Full Service. Set it aside and contact CA.", NotificationType.Warning)
                                                  );

                                                  // show the item again, now Available
                                                  Set(itShowReturn, false);
                                                  Set(itItem, LookUp(Equipment_Inventory_SharePoint, ID = varItemID))
                                              )
                                          )
                                      )
