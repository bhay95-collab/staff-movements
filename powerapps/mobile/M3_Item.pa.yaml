                              Width: =110
                              X: =16
                              Y: =48
                              RadiusBottomLeft: =13
                              RadiusBottomRight: =13
                              RadiusTopLeft: =13
                              RadiusTopRight: =13
                              DropShadow: =DropShadow.None
                            Children:
                              - lblCat_It:
                                  Control: Label@2.5.1
                                  Properties:
                                    Font: =AppFont
                                    Color: =C_Ink
                                    Size: =12
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    Text: =Coalesce(itItem.Category.Value, "—")
                                    Width: =Parent.Width
                                    X: =0
                                    Y: =0
                                    Align: =Align.Center
                                    VerticalAlign: =VerticalAlign.Middle
                                    Wrap: =false
                        - conStatus_It:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =Switch(Coalesce(itItem.Status.Value, ""), "Available", C_GoodBg, "Allocated", C_AccentSoft, C_DangerBg)
                              Height: =26
                              Width: =116
                              X: =134
                              Y: =48
                              RadiusBottomLeft: =13
                              RadiusBottomRight: =13
                              RadiusTopLeft: =13
                              RadiusTopRight: =13
                              DropShadow: =DropShadow.None
                            Children:
                              - lblStatus_It:
                                  Control: Label@2.5.1
                                  Properties:
                                    Font: =AppFont
                                    Color: =Switch(Coalesce(itItem.Status.Value, ""), "Available", C_Good, "Allocated", C_Accent, C_Danger)
                                    Size: =12
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    Text: =Coalesce(itItem.Status.Value, "Unknown")
                                    Width: =Parent.Width
                                    X: =0
                                    Y: =0
                                    Align: =Align.Center
                                    VerticalAlign: =VerticalAlign.Middle
                                    Wrap: =false
                        - capKType_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Muted
                              Size: =11
                              FontWeight: =FontWeight.Bold
                              Height: =18
                              Text: ="TYPE"
                              Width: =Parent.Width / 2 - 20
                              X: =16
                              Y: =88
                              Wrap: =false
                        - lblVType_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Ink
                              Size: =15
                              FontWeight: =FontWeight.Bold
                              Height: =22
                              Text: =Coalesce(itItem.'Wheelchair Type'.Value, "—")
                              Width: =Parent.Width / 2 - 20
                              X: =16
                              Y: =104
                              Wrap: =false
                        - capKWidth_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Muted
                              Size: =11
                              FontWeight: =FontWeight.Bold
                              Height: =18
                              Text: ="WIDTH"
                              Width: =Parent.Width / 2 - 20
                              X: =Parent.Width / 2 + 4
                              Y: =88
                              Wrap: =false
                        - lblVWidth_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Ink
                              Size: =15
                              FontWeight: =FontWeight.Bold
                              Height: =22
                              Text: =Coalesce(itItem.Width.Value, "—")
                              Width: =Parent.Width / 2 - 20
                              X: =Parent.Width / 2 + 4
                              Y: =104
                              Wrap: =false
                        - capKDepth_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Muted
                              Size: =11
                              FontWeight: =FontWeight.Bold
                              Height: =18
                              Text: ="DEPTH"
                              Width: =Parent.Width / 2 - 20
                              X: =16
                              Y: =136
                              Wrap: =false
                        - lblVDepth_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Ink
                              Size: =15
                              FontWeight: =FontWeight.Bold
                              Height: =22
                              Text: =Coalesce(itItem.Depth.Value, "—")
                              Width: =Parent.Width / 2 - 20
                              X: =16
                              Y: =152
                              Wrap: =false
                        - capKHeight_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Muted
                              Size: =11
                              FontWeight: =FontWeight.Bold
                              Height: =18
                              Text: ="HEIGHT"
                              Width: =Parent.Width / 2 - 20
                              X: =Parent.Width / 2 + 4
                              Y: =136
                              Wrap: =false
                        - lblVHeight_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Ink
                              Size: =15
                              FontWeight: =FontWeight.Bold
                              Height: =22
                              Text: =Coalesce(itItem.Height.Value, "—")
                              Width: =Parent.Width / 2 - 20
                              X: =Parent.Width / 2 + 4
                              Y: =152
                              Wrap: =false
                        - capKLoc_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Muted
                              Size: =11
                              FontWeight: =FontWeight.Bold
                              Height: =18
                              Text: ="LOCATION"
                              Width: =Parent.Width / 2 - 20
                              X: =16
                              Y: =184
                              Wrap: =false
                        - lblVLoc_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Ink
                              Size: =15
                              FontWeight: =FontWeight.Bold
                              Height: =22
                              Text: =Coalesce(itItem.Location.Value, "—")
                              Width: =Parent.Width / 2 - 20
                              X: =16
                              Y: =200
                              Wrap: =false
                        - capKSwl_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Muted
                              Size: =11
                              FontWeight: =FontWeight.Bold
                              Height: =18
                              Text: ="SWL"
                              Width: =Parent.Width / 2 - 20
                              X: =Parent.Width / 2 + 4
                              Y: =184
                              Wrap: =false
                        - lblVSwl_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Ink
                              Size: =15
                              FontWeight: =FontWeight.Bold
                              Height: =22
                              Text: =Coalesce(Text(itItem.SWL), "—")
                              Width: =Parent.Width / 2 - 20
                              X: =Parent.Width / 2 + 4
                              Y: =200
                              Wrap: =false
                        - lblDays_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Muted
                              Size: =12
                              Height: =20
                              Text: ="In use " & Coalesce(itItem.TotalDaysSignedOut, 0) & " days this year"
                              Width: =Parent.Width - 32
                              X: =16
                              Y: =230
                              Wrap: =false
                  - conService_It:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =64
                        FillPortions: =0
                        Fill: =C_DangerBg
                        Height: =64
                        Width: =Parent.Width
                        X: =0
                        Y: =0
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        BorderColor: =RGBA(180, 26, 26, 0.35)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Visible: =Coalesce(itItem.TotalDaysSignedOut, 0) > 100
                      Children:
                        - lblService_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Danger
                              Size: =13
                              FontWeight: =FontWeight.Bold
                              Height: =48
                              Text: |-
                                ="Over 100 days in use this year. Needs a Full Service: set it aside and contact CA."
                              Width: =Parent.Width - 28
                              X: =14
                              Y: =8
                  - conAlloc_It:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =196
                        FillPortions: =0
                        Fill: =C_White
                        Height: =196
                        Width: =Parent.Width
                        X: =0
                        Y: =0
                        RadiusBottomLeft: =18
                        RadiusBottomRight: =18
                        RadiusTopLeft: =18
                        RadiusTopRight: =18
                        BorderColor: =C_Line
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.Light
                        Visible: =Coalesce(itItem.Status.Value, "") = "Allocated"
                      Children:
                        - capAlloc_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Muted
                              Size: =11
                              FontWeight: =FontWeight.Bold
                              Height: =18
                              Text: ="SIGNED OUT TO"
                              Width: =Parent.Width
                              X: =16
                              Y: =14
                              Wrap: =false
                        - lblPt_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Ink
                              Size: =20
                              FontWeight: =FontWeight.Bold
                              Height: =28
                              Text: =Coalesce(itItem.'Patient Name', "—")
                              Width: =Parent.Width - 32
                              X: =16
                              Y: =32
                              Wrap: =false
                        - lblPtSub_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Muted
                              Size: =12
                              Height: =20
                              Text: ="URN " & Coalesce(itItem.URN, "—") & If(IsBlank(itItem.DOB), "", "  ·  DOB " & Text(itItem.DOB, "dd/mm/yyyy"))
                              Width: =Parent.Width - 32
                              X: =16
                              Y: =60
                              Wrap: =false
                        - capKWard_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Muted
                              Size: =11
                              FontWeight: =FontWeight.Bold
                              Height: =18
                              Text: ="WARD"
                              Width: =Parent.Width / 2 - 20
                              X: =16
                              Y: =90
                              Wrap: =false
                        - lblVWard_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Ink
                              Size: =15
                              FontWeight: =FontWeight.Bold
                              Height: =22
                              Text: =Coalesce(itItem.Ward.Value, "—")
                              Width: =Parent.Width / 2 - 20
                              X: =16
                              Y: =106
                              Wrap: =false
                        - capKPhysio_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Muted
                              Size: =11
                              FontWeight: =FontWeight.Bold
                              Height: =18
                              Text: ="PHYSIO"
                              Width: =Parent.Width / 2 - 20
                              X: =Parent.Width / 2 + 4
                              Y: =90
                              Wrap: =false
                        - lblVPhysio_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Ink
                              Size: =15
                              FontWeight: =FontWeight.Bold
                              Height: =22
                              Text: =Coalesce(itItem.Physiotherapist, "—")
                              Width: =Parent.Width / 2 - 20
                              X: =Parent.Width / 2 + 4
                              Y: =106
                              Wrap: =false
                        - capKOut_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Muted
                              Size: =11
                              FontWeight: =FontWeight.Bold
                              Height: =18
                              Text: ="SIGNED OUT"
                              Width: =Parent.Width / 2 - 20
                              X: =16
                              Y: =140
                              Wrap: =false
                        - lblVOut_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Ink
                              Size: =15
                              FontWeight: =FontWeight.Bold
                              Height: =22
                              Text: =Coalesce(Text(itItem.'Date Signed Out', "d mmm yyyy"), "—")
                              Width: =Parent.Width / 2 - 20
                              X: =16
                              Y: =156
                              Wrap: =false
                        - capKDays_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Muted
                              Size: =11
                              FontWeight: =FontWeight.Bold
                              Height: =18
                              Text: ="DAYS OUT"
                              Width: =Parent.Width / 2 - 20
                              X: =Parent.Width / 2 + 4
                              Y: =140
                              Wrap: =false
                        - lblVDays_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Ink
                              Size: =15
                              FontWeight: =FontWeight.Bold
                              Height: =22
                              Text: =Coalesce(If(IsBlank(itItem.'Date Signed Out'), Blank(), DateDiff(itItem.'Date Signed Out', Today(), TimeUnit.Days) & If(DateDiff(itItem.'Date Signed Out', Today(), TimeUnit.Days) = 1, " day", " days")), "—")
                              Width: =Parent.Width / 2 - 20
                              X: =Parent.Width / 2 + 4
                              Y: =156
                              Wrap: =false
            - conFoot_It:
