Screens:
  Item:
    Properties:
      Fill: =C_Bg
      OnVisible: |-
        =// Always read the item fresh (someone else may have changed it)
        Set(itItem, LookUp(Equipment_Inventory_SharePoint, ID = varItemID));
        Set(itShowReturn, false);
        Reset(ddRetLoc_It)
    Children:
      - conRoot_It:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =C_Bg
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutJustifyContent: =LayoutJustifyContent.Start
            LayoutGap: =0
            PaddingTop: =0
            PaddingRight: =0
            PaddingBottom: =0
            PaddingLeft: =0
            DropShadow: =DropShadow.None
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - conHdr_It:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  LayoutMinHeight: =95
                  FillPortions: =0
                  Fill: =RGBA(7, 95, 115, 1)
                  Height: =95
                  Width: =App.Width
                  X: =0
                  Y: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  DropShadow: =DropShadow.None
                Children:
                  - imgHdr_It:
                      Control: Image@2.2.3
                      Properties:
                        Height: =Parent.Height
                        Image: =HeaderImage
                        ImagePosition: =ImagePosition.Fill
                        Width: =Parent.Width
                        X: =0
                        Y: =0
                  - btnBack_It:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Transparent
                        FontColor: =C_White
                        FontSize: =32
                        Height: =60
                        Icon: ="ChevronLeft"
                        Text: =""
                        Width: =60
                        X: =5
                        Y: =18
                        OnSelect: =Back(ScreenTransition.UnCoverRight)
                  - lblHdrT_It:
                      Control: Label@2.5.1
                      Properties:
                        Font: =AppFont
                        Color: =C_White
                        Size: =24
                        FontWeight: =FontWeight.Bold
                        Height: =35
                        Text: =Coalesce(itItem.Title, "Equipment")
                        Width: =Parent.Width - 85
                        X: =65
                        Y: =20
                        Wrap: =false
                  - lblHdrS_It:
                      Control: Label@2.5.1
                      Properties:
                        Font: =AppFont
                        Color: =RGBA(255, 255, 255, 0.85)
                        Size: =15
                        Height: =25
                        Text: =Coalesce(itItem.Category.Value, "") & "  ·  " & Coalesce(itItem.Status.Value, "")
                        Width: =Parent.Width - 85
                        X: =65
                        Y: =53
                        Wrap: =false
            - conBody_It:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  LayoutMinHeight: =150
                  FillPortions: =1
                  Width: =App.Width
                  Fill: =RGBA(0, 0, 0, 0)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutGap: =15
                  PaddingTop: =20
                  PaddingRight: =20
                  PaddingBottom: =20
                  PaddingLeft: =20
                  DropShadow: =DropShadow.None
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                Children:
                  - conDetail_It:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =328
                        FillPortions: =0
                        Fill: =C_White
                        Height: =328
                        Width: =App.Width - 40
                        X: =0
                        Y: =0
                        RadiusBottomLeft: =23
                        RadiusBottomRight: =23
                        RadiusTopLeft: =23
                        RadiusTopRight: =23
                        BorderColor: =C_Line
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.Light
                      Children:
                        - lblName_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Ink
                              Size: =24
                              FontWeight: =FontWeight.Bold
                              Height: =35
                              Text: =Coalesce(Trim(itItem.Brand & " " & itItem.Model), itItem.Title)
                              Width: =Parent.Width - 40
                              X: =20
                              Y: =18
                              Wrap: =false
                        - conCat_It:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =Switch(itItem.Category.Value, "Wheelchair", RGBA(166, 199, 130, 1), "Cushion", RGBA(0, 144, 153, 1), "Backrest", RGBA(0, 200, 210, 1), RGBA(210, 218, 227, 1))
                              Height: =33
                              Width: =138
                              X: =20
                              Y: =60
                              RadiusBottomLeft: =16
                              RadiusBottomRight: =16
                              RadiusTopLeft: =16
                              RadiusTopRight: =16
                              DropShadow: =DropShadow.None
                            Children:
                              - lblCat_It:
                                  Control: Label@2.5.1
                                  Properties:
                                    Font: =AppFont
                                    Color: =C_Ink
                                    Size: =15
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    Text: =Coalesce(itItem.Category.Value, "—")
                                    Width: =Parent.Width
                                    X: =0
                                    Y: =0
                                    Align: =Align.Center
                                    VerticalAlign: =VerticalAlign.Middle
                                    Wrap: =false
                        - conStatus_It:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =Switch(Coalesce(itItem.Status.Value, ""), "Available", C_GoodBg, "Allocated", C_AccentSoft, C_DangerBg)
                              Height: =33
                              Width: =145
                              X: =168
                              Y: =60
                              RadiusBottomLeft: =16
                              RadiusBottomRight: =16
                              RadiusTopLeft: =16
                              RadiusTopRight: =16
                              DropShadow: =DropShadow.None
                            Children:
                              - lblStatus_It:
                                  Control: Label@2.5.1
                                  Properties:
                                    Font: =AppFont
                                    Color: =Switch(Coalesce(itItem.Status.Value, ""), "Available", C_Good, "Allocated", C_Accent, C_Danger)
                                    Size: =15
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    Text: =Coalesce(itItem.Status.Value, "Unknown")
                                    Width: =Parent.Width
                                    X: =0
                                    Y: =0
                                    Align: =Align.Center
                                    VerticalAlign: =VerticalAlign.Middle
                                    Wrap: =false
                        - capKType_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Muted
                              Size: =14
                              FontWeight: =FontWeight.Bold
                              Height: =23
                              Text: ="TYPE"
                              Width: =Parent.Width / 2 - 25
                              X: =20
                              Y: =110
                              Wrap: =false
                        - lblVType_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Ink
                              Size: =18
                              FontWeight: =FontWeight.Bold
                              Height: =28
                              Text: =Coalesce(itItem.'Wheelchair Type'.Value, "—")
                              Width: =Parent.Width / 2 - 25
                              X: =20
                              Y: =130
                              Wrap: =false
                        - capKWidth_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Muted
                              Size: =14
                              FontWeight: =FontWeight.Bold
                              Height: =23
                              Text: ="WIDTH"
                              Width: =Parent.Width / 2 - 25
                              X: =Parent.Width / 2 + 5
                              Y: =110
                              Wrap: =false
                        - lblVWidth_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Ink
                              Size: =18
                              FontWeight: =FontWeight.Bold
                              Height: =28
                              Text: =Coalesce(itItem.Width.Value, "—")
                              Width: =Parent.Width / 2 - 25
                              X: =Parent.Width / 2 + 5
                              Y: =130
                              Wrap: =false
                        - capKDepth_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Muted
                              Size: =14
                              FontWeight: =FontWeight.Bold
                              Height: =23
                              Text: ="DEPTH"
                              Width: =Parent.Width / 2 - 25
                              X: =20
                              Y: =170
                              Wrap: =false
                        - lblVDepth_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Ink
                              Size: =18
                              FontWeight: =FontWeight.Bold
                              Height: =28
                              Text: =Coalesce(itItem.Depth.Value, "—")
                              Width: =Parent.Width / 2 - 25
                              X: =20
                              Y: =190
                              Wrap: =false
                        - capKHeight_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Muted
                              Size: =14
                              FontWeight: =FontWeight.Bold
                              Height: =23
                              Text: ="HEIGHT"
                              Width: =Parent.Width / 2 - 25
                              X: =Parent.Width / 2 + 5
                              Y: =170
                              Wrap: =false
                        - lblVHeight_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Ink
                              Size: =18
                              FontWeight: =FontWeight.Bold
                              Height: =28
                              Text: =Coalesce(itItem.Height.Value, "—")
                              Width: =Parent.Width / 2 - 25
                              X: =Parent.Width / 2 + 5
                              Y: =190
                              Wrap: =false
                        - capKLoc_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Muted
                              Size: =14
                              FontWeight: =FontWeight.Bold
                              Height: =23
                              Text: ="LOCATION"
                              Width: =Parent.Width / 2 - 25
                              X: =20
                              Y: =230
                              Wrap: =false
                        - lblVLoc_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Ink
                              Size: =18
                              FontWeight: =FontWeight.Bold
                              Height: =28
                              Text: =Coalesce(itItem.Location.Value, "—")
                              Width: =Parent.Width / 2 - 25
                              X: =20
                              Y: =250
                              Wrap: =false
                        - capKSwl_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Muted
                              Size: =14
                              FontWeight: =FontWeight.Bold
                              Height: =23
                              Text: ="SWL"
                              Width: =Parent.Width / 2 - 25
                              X: =Parent.Width / 2 + 5
                              Y: =230
                              Wrap: =false
                        - lblVSwl_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Ink
                              Size: =18
                              FontWeight: =FontWeight.Bold
                              Height: =28
                              Text: =Coalesce(Text(itItem.SWL), "—")
                              Width: =Parent.Width / 2 - 25
                              X: =Parent.Width / 2 + 5
                              Y: =250
                              Wrap: =false
                        - lblDays_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Muted
                              Size: =15
                              Height: =25
                              Text: ="In use " & Coalesce(itItem.TotalDaysSignedOut, 0) & " days this year"
                              Width: =Parent.Width - 40
                              X: =20
                              Y: =288
                              Wrap: =false
                  - conService_It:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =80
                        FillPortions: =0
                        Fill: =C_DangerBg
                        Height: =80
                        Width: =App.Width - 40
                        X: =0
                        Y: =0
                        RadiusBottomLeft: =18
                        RadiusBottomRight: =18
                        RadiusTopLeft: =18
                        RadiusTopRight: =18
                        BorderColor: =RGBA(180, 26, 26, 0.35)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Visible: =Coalesce(itItem.TotalDaysSignedOut, 0) > 100
                      Children:
                        - lblService_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Danger
                              Size: =16
                              FontWeight: =FontWeight.Bold
                              Height: =60
                              Text: |-
                                ="Over 100 days in use this year. Needs a Full Service: set it aside and contact CA."
                              Width: =Parent.Width - 35
                              X: =18
                              Y: =10
                  - conSvcGo_It:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =60
                        FillPortions: =0
                        Fill: =C_White
                        Height: =60
                        Width: =App.Width - 40
                        X: =0
                        Y: =0
                        RadiusBottomLeft: =30
                        RadiusBottomRight: =30
                        RadiusTopLeft: =30
                        RadiusTopRight: =30
                        BorderColor: =C_Danger
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Visible: =Coalesce(itItem.TotalDaysSignedOut, 0) > 100 && Coalesce(itItem.Status.Value, "") = "Available" || Coalesce(itItem.Status.Value, "") = "In Service"
                      Children:
                        - btnSvcGo_It:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Transparent
                              BorderRadius: =30
                              Font: =Font.'Segoe UI'
                              FontColor: =C_Danger
                              FontSize: =18
                              FontWeight: =FontWeight.Bold
                              Height: =Parent.Height
                              Width: =Parent.Width
                              Text: =If(Coalesce(itItem.Status.Value, "") = "In Service", "Return from service", "Record a service")
                              OnSelect: |-
                                =Set(varServiceItemID, itItem.ID);
                                Navigate(Servicing, ScreenTransition.Cover)
                  - conAlloc_It:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =245
                        FillPortions: =0
                        Fill: =C_White
                        Height: =245
                        Width: =App.Width - 40
                        X: =0
                        Y: =0
                        RadiusBottomLeft: =23
                        RadiusBottomRight: =23
                        RadiusTopLeft: =23
                        RadiusTopRight: =23
                        BorderColor: =C_Line
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.Light
                        Visible: =Coalesce(itItem.Status.Value, "") = "Allocated"
                      Children:
                        - capAlloc_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Muted
                              Size: =14
                              FontWeight: =FontWeight.Bold
                              Height: =23
                              Text: ="SIGNED OUT TO"
                              Width: =Parent.Width
                              X: =20
                              Y: =18
                              Wrap: =false
                        - lblPt_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Ink
                              Size: =24
                              FontWeight: =FontWeight.Bold
                              Height: =35
                              Text: =Coalesce(itItem.'Patient Name', "—")
                              Width: =Parent.Width - 40
                              X: =20
                              Y: =40
                              Wrap: =false
                        - lblPtSub_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Muted
                              Size: =15
                              Height: =25
                              Text: ="URN " & Coalesce(itItem.URN, "—") & If(IsBlank(itItem.DOB), "", "  ·  DOB " & Text(itItem.DOB, "dd/mm/yyyy"))
                              Width: =Parent.Width - 40
                              X: =20
                              Y: =75
                              Wrap: =false
                        - capKWard_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Muted
                              Size: =14
                              FontWeight: =FontWeight.Bold
                              Height: =23
                              Text: ="WARD"
                              Width: =Parent.Width / 2 - 25
                              X: =20
                              Y: =113
                              Wrap: =false
                        - lblVWard_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Ink
                              Size: =18
                              FontWeight: =FontWeight.Bold
                              Height: =28
                              Text: =Coalesce(itItem.Ward.Value, "—")
                              Width: =Parent.Width / 2 - 25
                              X: =20
                              Y: =133
                              Wrap: =false
                        - capKPhysio_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Muted
                              Size: =14
                              FontWeight: =FontWeight.Bold
                              Height: =23
                              Text: ="PHYSIO"
                              Width: =Parent.Width / 2 - 25
                              X: =Parent.Width / 2 + 5
                              Y: =113
                              Wrap: =false
                        - lblVPhysio_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Ink
                              Size: =18
                              FontWeight: =FontWeight.Bold
                              Height: =28
                              Text: =Coalesce(itItem.Physiotherapist, "—")
                              Width: =Parent.Width / 2 - 25
                              X: =Parent.Width / 2 + 5
                              Y: =133
                              Wrap: =false
                        - capKOut_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Muted
                              Size: =14
                              FontWeight: =FontWeight.Bold
                              Height: =23
                              Text: ="SIGNED OUT"
                              Width: =Parent.Width / 2 - 25
                              X: =20
                              Y: =175
                              Wrap: =false
                        - lblVOut_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Ink
                              Size: =18
                              FontWeight: =FontWeight.Bold
                              Height: =28
                              Text: =Coalesce(Text(itItem.'Date Signed Out', "d mmm yyyy"), "—")
                              Width: =Parent.Width / 2 - 25
                              X: =20
                              Y: =195
                              Wrap: =false
                        - capKDays_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Muted
                              Size: =14
                              FontWeight: =FontWeight.Bold
                              Height: =23
                              Text: ="DAYS OUT"
                              Width: =Parent.Width / 2 - 25
                              X: =Parent.Width / 2 + 5
                              Y: =175
                              Wrap: =false
                        - lblVDays_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Ink
                              Size: =18
                              FontWeight: =FontWeight.Bold
                              Height: =28
                              Text: =Coalesce(If(IsBlank(itItem.'Date Signed Out'), Blank(), DateDiff(itItem.'Date Signed Out', Today(), TimeUnit.Days) & If(DateDiff(itItem.'Date Signed Out', Today(), TimeUnit.Days) = 1, " day", " days")), "—")
                              Width: =Parent.Width / 2 - 25
                              X: =Parent.Width / 2 + 5
                              Y: =195
                              Wrap: =false
            - conFoot_It:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  LayoutMinHeight: =100
                  FillPortions: =0
                  Fill: =C_White
                  Height: =100
                  Width: =App.Width
                  X: =0
                  Y: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  BorderColor: =C_Line
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                Children:
                  - conMain_It:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        Fill: =If(Coalesce(itItem.Status.Value, "") = "Available" || Coalesce(itItem.Status.Value, "") = "Allocated", C_Accent, C_Muted)
                        Height: =60
                        Width: =Parent.Width - 40
                        X: =20
                        Y: =20
                        RadiusBottomLeft: =30
                        RadiusBottomRight: =30
                        RadiusTopLeft: =30
                        RadiusTopRight: =30
                        BorderColor: =If(Coalesce(itItem.Status.Value, "") = "Available" || Coalesce(itItem.Status.Value, "") = "Allocated", C_Accent, C_Muted)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                      Children:
                        - btnMain_It:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Transparent
                              BorderRadius: =30
                              Font: =Font.'Segoe UI'
                              FontColor: =C_White
                              FontSize: =19
                              FontWeight: =FontWeight.Bold
                              Height: =Parent.Height
                              Width: =Parent.Width
                              Text: =If(Coalesce(itItem.Status.Value, "") = "Available", "Allocate to a patient", Coalesce(itItem.Status.Value, "") = "Allocated", "Return equipment", "Not available  ·  " & Coalesce(itItem.Status.Value, ""))
                              OnSelect: =If(Coalesce(itItem.Status.Value, "") = "Available", Navigate(Allocate, ScreenTransition.Cover), Coalesce(itItem.Status.Value, "") = "Allocated", Set(itShowReturn, true))
                              DisplayMode: =If(Coalesce(itItem.Status.Value, "") = "Available" || Coalesce(itItem.Status.Value, "") = "Allocated", DisplayMode.Edit, DisplayMode.Disabled)
      - conOverlay_It:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(14, 28, 42, 0.45)
            Height: =Parent.Height
            Width: =Parent.Width
            X: =0
            Y: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            DropShadow: =DropShadow.None
            Visible: =itShowReturn
          Children:
            - btnScrim_It:
                Control: Button@0.0.45
                Properties:
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  BorderStyle: =BorderStyle.None
                  Height: =Parent.Height
                  Width: =Parent.Width
                  X: =0
                  Y: =0
                  Text: =""
                  OnSelect: =Set(itShowReturn, false)
            - conSheet_It:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =C_White
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutGap: =13
                  PaddingTop: =25
                  PaddingRight: =25
                  PaddingBottom: =30
                  PaddingLeft: =25
                  DropShadow: =DropShadow.None
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =28
                  RadiusTopRight: =28
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  X: =0
                  Width: =Parent.Width
                  Height: =Min(Parent.Height - 50, 425)
                  Y: =Parent.Height - Min(Parent.Height - 50, 425)
                Children:
                  - lblSheetT_It:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =40
                        FillPortions: =0
                        Font: =AppFont
                        Color: =C_Ink
                        Size: =22
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        Text: ="Return " & itItem.Title & "?"
                        Width: =App.Width - 50
                        X: =0
                        Y: =0
                        Wrap: =false
                  - fldLoc_It:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =80
                        FillPortions: =0
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =80
                        Width: =App.Width - 50
                        X: =0
                        Y: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        DropShadow: =DropShadow.None
                      Children:
                        - capLoc_It:
                            Control: Label@2.5.1
                            Properties:
                              Font: =AppFont
                              Color: =C_Muted
                              Size: =14
                              FontWeight: =FontWeight.Bold
                              Height: =23
                              Text: ="WHERE IS IT GOING BACK TO?"
                              Width: =Parent.Width
                              X: =0
                              Y: =0
                              Wrap: =false
                        - boxLoc_It:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =C_White
                              Height: =55
                              Width: =Parent.Width
                              X: =0
                              Y: =25
                              RadiusBottomLeft: =13
                              RadiusBottomRight: =13
                              RadiusTopLeft: =13
                              RadiusTopRight: =13
                              BorderColor: =RGBA(14, 42, 70, 0.22)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                            Children:
                              - ddRetLoc_It:
                                  Control: Classic/DropDown@2.3.1
                                  Properties:
                                    BorderStyle: =BorderStyle.None
                                    ChevronBackground: =C_Accent
                                    ChevronFill: =C_White
                                    Color: =C_Ink
                                    Default: =Coalesce(itItem.Location.Value, "")
                                    Font: =AppFont
                                    Height: =Parent.Height
                                    Items: =Choices(Equipment_Inventory_SharePoint.Location)
                                    Items.Value: =Value
                                    Size: =18
                                    Width: =Parent.Width
                                    X: =0
                                    Y: =0
                  - lblRetBody_It:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =75
                        FillPortions: =0
                        Font: =AppFont
                        Color: =C_Ink2
                        Size: =17
                        Height: =75
                        Text: ="It will be marked Available and signed in by you." & Char(10) & "Out for " & DateDiff(itItem.'Date Signed Out', Today(), TimeUnit.Days) & " days with " & Coalesce(itItem.'Patient Name', "the patient") & ". Confirm it has been cleaned."
                        Width: =App.Width - 50
                        X: =0
                        Y: =0
                  - conRetBtns_It:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        LayoutMinHeight: =60
                        FillPortions: =0
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =60
                        Width: =App.Width - 50
                        X: =0
                        Y: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        DropShadow: =DropShadow.None
                      Children:
                        - conRetNo_It:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =C_White
                              Height: =60
                              Width: =(App.Width - 65) / 2
                              X: =0
                              Y: =0
                              RadiusBottomLeft: =30
                              RadiusBottomRight: =30
                              RadiusTopLeft: =30
                              RadiusTopRight: =30
                              BorderColor: =C_Line
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                            Children:
                              - btnRetNo_It:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderRadius: =30
                                    Font: =Font.'Segoe UI'
                                    FontColor: =C_Ink2
                                    FontSize: =18
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    Width: =Parent.Width
                                    Text: ="Cancel"
                                    OnSelect: =Set(itShowReturn, false)
                        - conRetGo_It:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =C_Accent
                              Height: =60
                              Width: =(App.Width - 65) / 2
                              X: =(App.Width - 65) / 2 + 15
                              Y: =0
                              RadiusBottomLeft: =30
                              RadiusBottomRight: =30
                              RadiusTopLeft: =30
                              RadiusTopRight: =30
                              BorderColor: =C_Accent
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                            Children:
                              - btnRetGo_It:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderRadius: =30
                                    Font: =Font.'Segoe UI'
                                    FontColor: =C_White
                                    FontSize: =18
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height
                                    Width: =Parent.Width
                                    Text: ="Return"
                                    OnSelect: |-
                                      =If(
                                          IsBlank(itItem) || Coalesce(itItem.Status.Value, "") <> "Allocated" || IsBlank(itItem.'Date Signed Out'),
                                          Notify("This item is not signed out, so it cannot be returned.", NotificationType.Error),
                                          With(
                                              {
                                                  returnDate: Today(),
                                                  actionTime: Now(),
                                                  episodeKey: Coalesce(
                                                      itItem.CurrentEpisodeKey,
                                                      "LEGACY-RETURN-" & Text(itItem.ID) & "-" & Text(Now(), "yyyymmddhhmmss") & "-" & Left(Text(GUID()), 8)
                                                  ),
                                                  daysThisEpisode: Max(0, DateDiff(itItem.'Date Signed Out', Today(), TimeUnit.Days)),
                                                  newLoc: Coalesce(ddRetLoc_It.Selected.Value, itItem.Location.Value, "")
                                              },
                                              With(
                                                  { newTotalDays: Coalesce(itItem.TotalDaysSignedOut, 0) + daysThisEpisode },

                                                  // 1) inventory -> Available
                                                  Patch(
                                                      Equipment_Inventory_SharePoint,
                                                      itItem,
                                                      {
                                                          Status: { Value: "Available" },
                                                          'Patient Name': "",
                                                          URN: "",
                                                          Physiotherapist: "",
                                                          DOB: Blank(),
                                                          'Date Returned': returnDate,
                                                          Ward: Blank(),
                                                          Location: If(IsBlank(newLoc), itItem.Location, { Value: newLoc }),
                                                          'Signed In By': MeName,
                                                          CurrentEpisodeKey: Blank(),
                                                          TotalDaysSignedOut: newTotalDays
                                                      }
                                                  );

                                                  // 2) usage log: sign-in row
                                                  Patch(
                                                      Equipment_Usage_Log,
                                                      Defaults(Equipment_Usage_Log),
                                                      {
                                                          Title: episodeKey & " - Sign In",
                                                          EpisodeKey: episodeKey,
                                                          EventType: { Value: "Sign In" },
                                                          EpisodeStatus: { Value: If(IsBlank(itItem.CurrentEpisodeKey), "Legacy unmatched", "Closed") },
                                                          EventDateTime: actionTime,
                                                          EquipmentItemID: itItem.ID,
                                                          EquipmentTitle: itItem.Title,
                                                          Category: Coalesce(itItem.Category.Value, ""),
                                                          Brand: Coalesce(itItem.Brand, ""),
                                                          Model: Coalesce(itItem.Model, ""),
                                                          Width: Coalesce(itItem.Width.Value, ""),
                                                          Depth: Coalesce(itItem.Depth.Value, ""),
                                                          Height: Coalesce(itItem.Height.Value, ""),
                                                          SWL: Coalesce(itItem.SWL, ""),
                                                          WheelchairType: Coalesce(itItem.'Wheelchair Type'.Value, ""),
                                                          LocationAtEvent: newLoc,
                                                          Ward: Coalesce(itItem.Ward.Value, ""),
                                                          PatientName: Coalesce(itItem.'Patient Name', ""),
                                                          URN: Coalesce(itItem.URN, ""),
                                                          DOB: itItem.DOB,
                                                          Physiotherapist: Coalesce(itItem.Physiotherapist, ""),
                                                          DateSignedOut: itItem.'Date Signed Out',
                                                          DateReturned: returnDate,
                                                          DaysSignedOutThisEpisode: daysThisEpisode,
                                                          TotalDaysSignedOutAfterEvent: newTotalDays,
                                                          Over100DaysAfterEvent: newTotalDays > 100,
                                                          ServiceRequired: newTotalDays > 100,
                                                          IsHighRiskEquipment: Coalesce(itItem.IsHighRiskEquipment, false),
                                                          OutOfService: Coalesce(itItem.OutOfService, false),
                                                          IsActive: Coalesce(itItem.IsActive, true),
                                                          StatusAfterEvent: "Available",
                                                          ActionedByName: MeName,
                                                          ActionedByEmail: User().Email,
                                                          SourceApp: { Value: "Mobile" },
                                                          Notes: If(IsBlank(itItem.CurrentEpisodeKey), "Return completed without an existing CurrentEpisodeKey. This is likely a pre-log allocation.", "")
                                                      }
                                                  );

                                                  // 3) close the matching sign-out row
                                                  With(
                                                      { signOutRow: LookUp(Equipment_Usage_Log, EpisodeKey = episodeKey && EventType.Value = "Sign Out") },
                                                      If(
                                                          !IsBlank(signOutRow.ID),
                                                          Patch(
                                                              Equipment_Usage_Log,
                                                              signOutRow,
                                                              {
                                                                  EpisodeStatus: { Value: "Closed" },
                                                                  DateReturned: returnDate,
                                                                  DaysSignedOutThisEpisode: daysThisEpisode,
                                                                  TotalDaysSignedOutAfterEvent: newTotalDays,
                                                                  Over100DaysAfterEvent: newTotalDays > 100,
                                                                  ServiceRequired: newTotalDays > 100
                                                              }
                                                          )
                                                      )
                                                  );

                                                  Notify("Equipment returned.", NotificationType.Success);
                                                  If(
                                                      newTotalDays > 100,
                                                      Notify("Used for over 100 days this year: needs a Full Service. Set it aside and contact CA.", NotificationType.Warning)
                                                  );

                                                  // show the item again, now Available
                                                  Set(itShowReturn, false);
                                                  Set(itItem, LookUp(Equipment_Inventory_SharePoint, ID = varItemID))
                                              )
                                          )
                                      )
