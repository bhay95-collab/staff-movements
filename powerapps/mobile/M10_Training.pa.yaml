Screens:
  Training:
    Properties:
      Fill: =C_Bg
      OnVisible: =Select(btnLoad_Tm)
    Children:
      - btnLoad_Tm:
          Control: Button@0.0.45
          Properties:
            Height: =1
            Width: =1
            X: =0
            Y: =0
            Text: =""
            Visible: =false
            OnSelect: |-
              =Set(trLoading, true);
              Refresh(TrainingSessions);
              Refresh(TrainingBookings);
              Refresh(TrainingWaitlist);
              ClearCollect(
                  colThBookings,
                  Filter(TrainingBookings, BookingStatus.Value = "Booked" && SessionDate >= Today())
              );
              ClearCollect(
                  colThWait,
                  Filter(TrainingWaitlist, WaitlistStatus.Value = "Waiting" && Lower(WaitlistUserEmail) = MeEmail)
              );
              ClearCollect(
                  colThSessions,
                  AddColumns(
                      AddColumns(
                          SortByColumns(
                              Filter(TrainingSessions, IsActive = true && SessionDate >= Today()),
                              "SessionDate",
                              SortOrder.Ascending
                          ),
                          SesKey, Text(ID),
                          TypeText, TrainingType.Value,
                          CapV, Coalesce(Capacity, If(TrainingType.Value = "Manual Handling", 8, 6))
                      ),
                      Booked, CountRows(Filter(colThBookings, SessionID = SesKey)),
                      Free, CapV - CountRows(Filter(colThBookings, SessionID = SesKey)),
                      MyBookingID, LookUp(colThBookings, SessionID = SesKey && Lower(BookedUserEmail) = MeEmail).ID,
                      OnWait, CountRows(Filter(colThWait, SessionID = SesKey)) > 0
                  )
              );
              ClearCollect(
                  colThMine,
                  SortByColumns(
                      Filter(colThBookings, Lower(BookedUserEmail) = MeEmail),
                      "SessionDate",
                      SortOrder.Ascending
                  )
              );
              Set(trLoading, false)
      - conRoot_Tm:
          Control: GroupContainer@1.5.0
