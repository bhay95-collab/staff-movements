Screens:
  My_Day:
    Properties:
      Fill: =RGBA(235, 242, 248, 1)
      ImagePosition: =ImagePosition.Fill
      OnVisible: |-
        =// My day. My patients, my equipment out, and who is away.
        If(IsBlank(varMeDirectory), Set(varMeDirectory, LookUp(ClinicianDirectory, Lower(Person.Email) = Lower(User().Email))));
        Set(mdCalOK, true);
        Set(mdKpi, {Patients: 0, Soon: 0, Equip: 0, Old: 0});
        Select(btnLoad_Md)
    Children:
      - btnLoad_Md:
          Control: Button@0.0.45
          Properties:
            Height: =10
            Width: =10
            Text: =""
            Visible: =false
            OnSelect: |-
              =Set(mdLoading, true);

              // my patients on every ward
              ClearCollect(colMdW, ForAll(
                      Filter(
                          Ward_4A_Shared,
                          !IsBlank(Patient) && (
                              !IsBlank(LookUp(PT_Users, Lower(Email) = Lower(User().Email))) ||
                              !IsBlank(LookUp(OT_Users, Lower(Email) = Lower(User().Email))) ||
                              !IsBlank(LookUp(SP_Users, Lower(Email) = Lower(User().Email)))
                          )
                      ) As w,
                      {
                          ID: w.ID, Ward: "4A", Patient: Trim(w.Patient), UrnT: Trim(Text(w.URN)), BedT: Trim(Text(w.Bed)),
                          EDD: w.EDD, Falls: Coalesce(w.'Falls Risk', false), NDIS: Coalesce(w.NDIS, false), Maint: Coalesce(w.Maintenance, false), Link: Coalesce(w.'Link Worker', false)
                      }
                  ));
              Collect(colMdW, ForAll(
                      Filter(
                          Ward_4B_Shared,
                          !IsBlank(Patient) && (
                              !IsBlank(LookUp(PT_Users, Lower(Email) = Lower(User().Email))) ||
                              !IsBlank(LookUp(OT_Users, Lower(Email) = Lower(User().Email))) ||
                              !IsBlank(LookUp(SP_Users, Lower(Email) = Lower(User().Email)))
                          )
                      ) As w,
                      {
                          ID: w.ID, Ward: "4B", Patient: Trim(w.Patient), UrnT: Trim(Text(w.URN)), BedT: Trim(Text(w.Bed)),
                          EDD: w.EDD, Falls: Coalesce(w.'Falls Risk', false), NDIS: Coalesce(w.NDIS, false), Maint: Coalesce(w.Maintenance, false), Link: Coalesce(w.'Link Worker', false)
                      }
                  ));
              Collect(colMdW, ForAll(
                      Filter(
                          Ward_5A_Shared,
                          !IsBlank(Patient) && (
                              !IsBlank(LookUp(PT_Users, Lower(Email) = Lower(User().Email))) ||
                              !IsBlank(LookUp(OT_Users, Lower(Email) = Lower(User().Email))) ||
                              !IsBlank(LookUp(SP_Users, Lower(Email) = Lower(User().Email)))
                          )
                      ) As w,
                      {
                          ID: w.ID, Ward: "5A", Patient: Trim(w.Patient), UrnT: Trim(Text(w.URN)), BedT: Trim(Text(w.Bed)),
                          EDD: w.EDD, Falls: Coalesce(w.'Falls Risk', false), NDIS: Coalesce(w.NDIS, false), Maint: Coalesce(w.Maintenance, false), Link: Coalesce(w.'Link Worker', false)
                      }
                  ));
              Collect(colMdW, ForAll(
                      Filter(
                          Ward_6A_Shared,
                          !IsBlank(Patient) && (
                              !IsBlank(LookUp(PT_Users, Lower(Email) = Lower(User().Email))) ||
                              !IsBlank(LookUp(OT_Users, Lower(Email) = Lower(User().Email))) ||
                              !IsBlank(LookUp(SP_Users, Lower(Email) = Lower(User().Email)))
                          )
                      ) As w,
                      {
                          ID: w.ID, Ward: "6A", Patient: Trim(w.Patient), UrnT: Trim(Text(w.URN)), BedT: Trim(Text(w.Bed)),
                          EDD: w.EDD, Falls: Coalesce(w.'Falls Risk', false), NDIS: Coalesce(w.NDIS, false), Maint: Coalesce(w.Maintenance, false), Link: Coalesce(w.'Link Worker', false)
                      }
                  ));

              // equipment signed out to me
              ClearCollect(
                  colMdEq,
                  SortByColumns(
                      AddColumns(
                          Filter(Equipment_Inventory_SharePoint, Status.Value = "Allocated" && Physiotherapist = User().FullName),
                          DaysOut, If(IsBlank('Date Signed Out'), 0, DateDiff('Date Signed Out', Today(), TimeUnit.Days)),
                          Desc, Trim(Brand & " " & Model),
                          Cat, Coalesce(Category.Value, ""),
                          WardName, Coalesce(Ward.Value, "")
                      ),
                      "DaysOut", SortOrder.Descending
                  )
              );

              // who is away today and tomorrow
              Clear(colMdLeave);
              IfError(
                  ClearCollect(colMdCals, Office365Outlook.CalendarGetTables().value);
                  Set(
                      mdCal,
                      LookUp(
                          colMdCals,
                          Lower(Trim(DisplayName)) = "starsphysioleave" &&
                          Lower(LookUp(DynamicProperties, key = "Owner").value.Address) = "starsphysioleave@health.qld.gov.au"
                      )
                  );
                  If(
                      IsBlank(mdCal.Name),
                      Set(mdCalOK, false),
                      Set(mdCalOK, true);
                      With(
                          {
                              s: Today() + Time(0, 0, 0),
                              e: DateAdd(Today(), 2) + Time(0, 0, 0)
                          },
                          ClearCollect(
                              colMdLeaveRaw,
                              Office365Outlook.GetEventsCalendarViewV2(
                                  mdCal.Name,
                                  Text(DateAdd(s, TimeZoneOffset(s), TimeUnit.Minutes), DateTimeFormat.UTC),
                                  Text(DateAdd(e, TimeZoneOffset(e), TimeUnit.Minutes), DateTimeFormat.UTC)
                              ).value
                          )
                      );
                      ClearCollect(
                          colMdLeave,
                          SortByColumns(
                              AddColumns(
                                  colMdLeaveRaw,
                                  StartLocal, DateAdd(DateTimeValue(ThisRecord.Start), -TimeZoneOffset(DateTimeValue(ThisRecord.Start)), TimeUnit.Minutes),
                                  EndLocal, DateAdd(DateTimeValue(ThisRecord.End), -TimeZoneOffset(DateTimeValue(ThisRecord.End)), TimeUnit.Minutes),
                                  EventTitle, Coalesce(ThisRecord.Subject, "(No title)")
                              ),
                              "StartLocal", SortOrder.Ascending
                          )
                      )
                  ),
                  Set(mdCalOK, false)
              );

              Set(mdLoading, false);
              Select(btnBuild_Md)
      - btnBuild_Md:
          Control: Button@0.0.45
          Properties:
            Height: =10
            Width: =10
            Text: =""
            Visible: =false
            OnSelect: |-
              =ClearCollect(
                  colMdPts,
                  SortByColumns(
                      AddColumns(
                          colMdW,
                          EquipN, If(UrnT = "", 0, CountRows(Filter(colMdEq, Coalesce(URN, "") = UrnT))),
                          EddSort, If(IsBlank(EDD), Date(2999, 1, 1), EDD)
                      ),
                      "EddSort", SortOrder.Ascending
                  )
              );
              Set(
                  mdKpi,
                  {
                      Patients: CountRows(colMdPts),
                      Soon: CountRows(Filter(colMdPts, !IsBlank(EDD) && EDD <= DateAdd(Today(), 3))),
                      Equip: CountRows(colMdEq),
                      Old: CountRows(Filter(colMdEq, DaysOut > 42))
                  }
              )
