Screens:
  Ward 4A:
    Properties:
      ImagePosition: =ImagePosition.Fill
      OnVisible: |+
        =// =======================================================
        // WARD 4A – SCREEN OnVisible (PERSON AWARE + combo support + CHARTS)
        // Stable key = Claims
        // =======================================================

        Set(var4A_Loading, true);

        // --------------------------------------
        // Typed empty People table (keeps schema so DisplayName/Email are recognised)
        // --------------------------------------
        Set(
            varEmptyPeople,
            FirstN(
                Table(
                    {
                        Claims: "",
                        DisplayName: "",
                        Email: "",
                        Department: "",
                        JobTitle: "",
                        Picture: ""
                    }
                ),
                0
            )
        );

        // --------------------------------------
        // 0) Rebuild ward cache
        //    + local typed Key tables used by ComboBox defaults
        // --------------------------------------
        ClearCollect(
            colWard4A,
            AddColumns(
                SortByColumns(Ward_4A_Shared, "field_1", SortOrder.Ascending),
                IsDirty, false,

                PTKeys,
                If(
                    IsBlank(PT_Users) || CountRows(PT_Users) = 0,
                    FirstN(Table({ Key: "" }), 0),
                    ForAll(PT_Users, { Key: Lower(Trim(Claims)) })
                ),

                OTKeys,
                If(
                    IsBlank(OT_Users) || CountRows(OT_Users) = 0,
                    FirstN(Table({ Key: "" }), 0),
                    ForAll(OT_Users, { Key: Lower(Trim(Claims)) })
                ),

                SPKeys,
                If(
                    IsBlank(SP_Users) || CountRows(SP_Users) = 0,
                    FirstN(Table({ Key: "" }), 0),
                    ForAll(SP_Users, { Key: Lower(Trim(Claims)) })
                )
            )
        );

        // --------------------------------------
        // 0a) Clinician option collections (flat schema)
        //     These MUST use same key: Person.Claims
        // --------------------------------------

        // Physio options
        ClearCollect(
            colClinicians_Physio,
            AddColumns(
                Filter(ClinicianDirectory, Discipline.Value = "Physio" && !IsBlank(Person)),
                DisplayNameFlat, Coalesce(Person.DisplayName, Person.Email, ""),
                DisplayKey, Lower(Trim(Person.Claims)),
                PersonRec, Person
            )
        );

        // OT options
        ClearCollect(
            colClinicians_OT,
            AddColumns(
                Filter(ClinicianDirectory, Discipline.Value = "OT" && !IsBlank(Person)),
                DisplayNameFlat, Coalesce(Person.DisplayName, Person.Email, ""),
                DisplayKey, Lower(Trim(Person.Claims)),
                PersonRec, Person
            )
        );

        // SP options
        ClearCollect(
            colClinicians_SP,
            AddColumns(
                Filter(ClinicianDirectory, Discipline.Value = "SP" && !IsBlank(Person)),
                DisplayNameFlat, Coalesce(Person.DisplayName, Person.Email, ""),
                DisplayKey, Lower(Trim(Person.Claims)),
                PersonRec, Person
            )
        );

        // --------------------------------------
        // 0b) Who am I? (optional)
        // --------------------------------------
        Set(
            varMeDirectory,
            LookUp(ClinicianDirectory, Lower(Person.Email) = Lower(User().Email))
        );

        // --------------------------------------
        // Base set of real patients on 4A
        // --------------------------------------
        Set(var4ABasePatients, Filter(colWard4A, !IsBlank(Patient)));

        // =======================================================
        // CHART BUILD (Diagnosis + Patients per clinician + Acuity per clinician)
        // =======================================================
        // =======================================================
        // REBUILD 4A CHARTS (call after load + after successful save)
        // Source of truth: colWard4A
        // =======================================================

        // Base set of real patients on 4A
        Set(var4ABasePatients, Filter(colWard4A, !IsBlank(Patient)));

        // ------------------------------
        // 1) Diagnosis Summary (Pie)
        // ------------------------------
        Set(var4A_DiagTotal, CountRows(var4ABasePatients));
        Clear(col4A_DiagnosisSummary);

        ForAll(
            Table(
                {Diag: "Ortho"},
                {Diag: "Recon"},
                {Diag: "TBI"},
                {Diag: "Amp"},
                {Diag: "SCI"},
                {Diag: "Trauma"},
                {Diag: "Stroke"},
                {Diag: "Neuro"}
            ) As d,
            With(
                {
                    thisCount:
                        CountRows(
                            Filter(
                                var4ABasePatients,
                                !IsBlank(Diagnosis) && Diagnosis.Value = d.Diag
                            )
                        )
                },
                With(
                    {
                        thisPercent:
                            If(
                                var4A_DiagTotal = 0,
                                0,
                                Round(thisCount * 100 / var4A_DiagTotal, 0)
                            )
                    },
                    Collect(
                        col4A_DiagnosisSummary,
                        {
                            Label: d.Diag,
                            Count: thisCount,
                            DisplayLabel: d.Diag & " (" & thisPercent & "%)"
                        }
                    )
                )
            )
        );

        // ------------------------------
        // 2) Flatten assignments (PT / OT / SP)
        // ------------------------------
        Clear(col4A_PT_Assign);
        Clear(col4A_OT_Assign);
        Clear(col4A_SP_Assign);

        ForAll(
            var4ABasePatients As p,

            ForAll(
                If(IsBlank(p.PT_Users) || CountRows(p.PT_Users)=0, varEmptyPeople, p.PT_Users) As u,
                If(!IsBlank(u.Claims),
                    Collect(
                        col4A_PT_Assign,
                        {
                            PatientID: p.ID,
                            ClinicianClaims: Lower(Trim(u.Claims)),
                            ClinicianName: Coalesce(u.DisplayName, u.Email, "<unknown>"),
                            Acuity: Coalesce(p.'Acuity Score', 0)
                        }
                    )
                )
            );

            ForAll(
                If(IsBlank(p.OT_Users) || CountRows(p.OT_Users)=0, varEmptyPeople, p.OT_Users) As u,
                If(!IsBlank(u.Claims),
                    Collect(
                        col4A_OT_Assign,
                        {
                            PatientID: p.ID,
                            ClinicianClaims: Lower(Trim(u.Claims)),
                            ClinicianName: Coalesce(u.DisplayName, u.Email, "<unknown>"),
                            Acuity: Coalesce(p.'Acuity Score', 0)
                        }
                    )
                )
            );

            ForAll(
                If(IsBlank(p.SP_Users) || CountRows(p.SP_Users)=0, varEmptyPeople, p.SP_Users) As u,
                If(!IsBlank(u.Claims),
                    Collect(
                        col4A_SP_Assign,
                        {
                            PatientID: p.ID,
                            ClinicianClaims: Lower(Trim(u.Claims)),
                            ClinicianName: Coalesce(u.DisplayName, u.Email, "<unknown>"),
                            Acuity: Coalesce(p.'Acuity Score', 0)
                        }
                    )
                )
            )
        );

        // ------------------------------
        // 3) Pie charts: Patients per clinician
        // (OPTIONAL improvement: count distinct patients per clinician)
        // ------------------------------
        Clear(col4A_PatientsPerPT);
        ForAll(
            GroupBy(col4A_PT_Assign, ClinicianName, Rows) As g,
            Collect(
                col4A_PatientsPerPT,
                {
                    Label: g.ClinicianName,
                    Count: CountRows(Distinct(g.Rows, PatientID)),
                    DisplayLabel: g.ClinicianName & " (" & CountRows(Distinct(g.Rows, PatientID)) & ")"
                }
            )
        );

        Clear(col4A_PatientsPerOT);
        ForAll(
            GroupBy(col4A_OT_Assign, ClinicianName, Rows) As g,
            Collect(
                col4A_PatientsPerOT,
                {
                    Label: g.ClinicianName,
                    Count: CountRows(Distinct(g.Rows, PatientID)),
                    DisplayLabel: g.ClinicianName & " (" & CountRows(Distinct(g.Rows, PatientID)) & ")"
                }
            )
        );

        Clear(col4A_PatientsPerSP);
        ForAll(
            GroupBy(col4A_SP_Assign, ClinicianName, Rows) As g,
            Collect(
                col4A_PatientsPerSP,
                {
                    Label: g.ClinicianName,
                    Count: CountRows(Distinct(g.Rows, PatientID)),
                    DisplayLabel: g.ClinicianName & " (" & CountRows(Distinct(g.Rows, PatientID)) & ")"
                }
            )
        );

        // ------------------------------
        // 4) Bar charts: Total acuity per clinician (PT + OT)
        // ------------------------------
        Clear(col4A_AcuityPerPT);
        ForAll(
            GroupBy(col4A_PT_Assign, ClinicianName, Rows) As g,
            Collect(
                col4A_AcuityPerPT,
                {
                    Label: g.ClinicianName,
                    TotalAcuity: Sum(g.Rows, Acuity)
                }
            )
        );

        Clear(col4A_AcuityPerOT);
        ForAll(
            GroupBy(col4A_OT_Assign, ClinicianName, Rows) As g,
            Collect(
                col4A_AcuityPerOT,
                {
                    Label: g.ClinicianName,
                    TotalAcuity: Sum(g.Rows, Acuity)
                }
            )
        );

        Set(var4A_Loading, false);
