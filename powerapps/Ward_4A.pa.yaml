            - Container62:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: |
                    =If(
                        varHasUnsavedChanges_4A && varPulseOn_4A,
                        RGBA(255, 255, 0, 1),          // bright yellow glow
                        RGBA(122, 138, 143, 1)         // subtle neutral when off
                    )
                  BorderStyle: =BorderStyle.None
                  BorderThickness: |
                    =If(
                        varHasUnsavedChanges_4A && varPulseOn_4A,
                        3,
                        1
                    )
                  DropShadow: =DropShadow.Bold
                  Fill: |
                    =If(
                        // No unsaved changes → normal green
                        !varHasUnsavedChanges_4A,
                        RGBA(152, 208, 70, 1),

                        // Unsaved changes → pulse between two greens
                        If(
                            varPulseOn_4A,
                            RGBA(152, 208, 70, 1),      // base green
                            RGBA(192, 228, 110, 1)      // lighter green for pulse
                        )
                    )
                  Height: =53
                  RadiusBottomLeft: =20
                  RadiusBottomRight: =20
                  RadiusTopLeft: =20
                  RadiusTopRight: =20
                  Visible: |+
                    =CountRows(Filter(colWard4A, IsDirty)) > 0
                  Width: =64
                  X: =301
                  Y: =8
                Children:
                  - Icon_Save_4A:
                      Control: Icon@0.0.7
                      Properties:
                        Height: =53
                        Icon: ="Save"
                        IconColor: =RGBA(255, 255, 255, 1)
                        Width: =64
                  - ButtonCanvas21:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Transparent
                        BorderColor: =RGBA(53, 61, 63, 1)
                        BorderRadius: =20
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        FontColor: =RGBA(255, 255, 255, 1)
                        FontSize: =40
                        Height: =53
                        Icon: ="Save"
                        Layout: ='ButtonCanvas.Layout'.TextOnly
                        OnSelect: |
                          =// ======================================
                          // SAVE WARD 4A (handles new + existing rows)
                          // ======================================

                          If(
                              CountRows(Filter(colWard4A, IsDirty)) = 0,

                              Notify(
                                  "No changes to save for Ward 4A.",
                                  NotificationType.Information
                              ),

                              // --------------------------------------
                              // There ARE dirty rows
                              // --------------------------------------
                              Set(locIsSaving, true);
                              Clear(colSaveErrors4A);

                              // Optional: pulse / spinner on
                              Set(varPulseOn_4A, true);
                              Reset(Timer_Pulse_4A);

                              // --------------------------------------
                              // Patch each dirty row
                              // - If ID blank -> create new SP item
                              // - If ID present -> update existing SP item
                              // - On success: write SP ID back + clear IsDirty
                              // --------------------------------------
                              ForAll(
                                  Filter(colWard4A, IsDirty) As w,
                                  With(
                                      {
                                          spRow:
                                              Patch(
                                                  Ward_4A_Shared,
                                                  If(
                                                      IsBlank(w.ID),
                                                      Defaults(Ward_4A_Shared),
                                                      LookUp(Ward_4A_Shared, ID = w.ID)
                                                  ),
                                                  {
                                                      // -------------------------------
                                                      // Core patient data
                                                      // -------------------------------
                                                      Patient: w.Patient,
                                                      URN: w.URN,
                                                      DOB: w.DOB,
                                                      Diagnosis: w.Diagnosis,

                                                      // -------------------------------
                                                      // PERSON COLUMNS (source of truth)
                                                      // -------------------------------
                                                      PT_Users: w.PT_Users,
                                                      OT_Users: w.OT_Users,
                                                      SP_Users: w.SP_Users,

                                                      // -------------------------------
                                                      // Other clinical/admin fields
                                                      // -------------------------------
                                                      'Acuity Score': w.'Acuity Score',
                                                      Bed: w.Bed,
                                                      NDIS: w.NDIS,
                                                      Maintenance: w.Maintenance,
                                                      'Link Worker': w.'Link Worker',
                                                      'Falls Risk': w.'Falls Risk',
                                                      Contact: w.Contact,
                                                      'Admission Date': w.'Admission Date',
                                                      'AROC EDD': w.'AROC EDD',
                                                      EDD: w.EDD,
                                                      WeekStartDate: w.WeekStartDate,
                                                      'Morning Handover': w.'Morning Handover',
                                                      'CC Handover': w.'CC Handover',
                                                      Monday: w.Monday,
                                                      Tuesday: w.Tuesday,
                                                      Wednesday: w.Wednesday,
                                                      Thursday: w.Thursday,
                                                      Friday: w.Friday
                                                  }
                                              )
                                      },
                                      // -------------------------------
                                      // Capture SharePoint errors
                                      // -------------------------------
                                      If(
                                          !IsEmpty(Errors(Ward_4A_Shared, spRow)),
                                          Collect(
                                              colSaveErrors4A,
                                              {
                                                  LocalID: w.ID,
                                                  SavedID: spRow.ID,
                                                  Patient: w.Patient,
                                                  Message: First(Errors(Ward_4A_Shared, spRow)).Message
                                              }
                                          ),

                                          // ✅ Success → update local row:
                                          // - store the real SharePoint ID (for brand new items)
                                          // - clear IsDirty
                                          Patch(
                                              colWard4A,
                                              w,
                                              {
                                                  ID: spRow.ID,
                                                  IsDirty: false
                                              }
                                          )
                                      )
                                  )
                              );

                              // --------------------------------------
                              // Post-save handling
                              // --------------------------------------
                              If(
                                  CountRows(colSaveErrors4A) > 0,

                                  // ❌ Some rows failed
                                  Set(locIsSaving, false);
                                  Set(varPulseOn_4A, false);
                                  Reset(Timer_Pulse_4A);

                                  // keep this TRUE because there are still dirty rows
                                  Set(varHasUnsavedChanges_4A, CountRows(Filter(colWard4A, IsDirty)) > 0);

                                  Notify(
                                      "Some rows failed to save (" &
                                      CountRows(colSaveErrors4A) &
                                      "). Unsaved changes remain.",
                                      NotificationType.Error
                                  ),

                                  // ✅ ALL rows saved successfully
                                  Set(varHasUnsavedChanges_4A, false);

                                  // =======================================================
                                  // REBUILD 4A CHARTS (call after load + after successful save)
                                  // Source of truth: colWard4A
                                  // =======================================================

                                  // Base set of real patients on 4A
                                  Set(var4ABasePatients, Filter(colWard4A, !IsBlank(Patient)));

                                  // ------------------------------
                                  // 1) Diagnosis Summary (Pie)
                                  // ------------------------------
                                  Set(var4A_DiagTotal, CountRows(var4ABasePatients));
                                  Clear(col4A_DiagnosisSummary);

                                  ForAll(
                                      Table(
                                          {Diag: "Ortho"},
                                          {Diag: "Recon"},
                                          {Diag: "TBI"},
                                          {Diag: "Amp"},
                                          {Diag: "SCI"},
                                          {Diag: "Trauma"},
                                          {Diag: "Stroke"},
                                          {Diag: "Neuro"}
                                      ) As d,
                                      With(
                                          {
                                              thisCount:
                                                  CountRows(
                                                      Filter(
                                                          var4ABasePatients,
                                                          !IsBlank(Diagnosis) && Diagnosis.Value = d.Diag
                                                      )
                                                  )
                                          },
                                          With(
                                              {
                                                  thisPercent:
                                                      If(
                                                          var4A_DiagTotal = 0,
                                                          0,
                                                          Round(thisCount * 100 / var4A_DiagTotal, 0)
                                                      )
                                              },
                                              Collect(
                                                  col4A_DiagnosisSummary,
                                                  {
                                                      Label: d.Diag,
                                                      Count: thisCount,
                                                      DisplayLabel: d.Diag & " (" & thisPercent & "%)"
                                                  }
                                              )
                                          )
                                      )
                                  );

                                  // ------------------------------
                                  // 2) Flatten assignments (PT / OT / SP)
                                  // ------------------------------
                                  Clear(col4A_PT_Assign);
                                  Clear(col4A_OT_Assign);
                                  Clear(col4A_SP_Assign);

                                  ForAll(
                                      var4ABasePatients As p,

                                      ForAll(
                                          If(IsBlank(p.PT_Users) || CountRows(p.PT_Users)=0, varEmptyPeople, p.PT_Users) As u,
                                          If(
                                              !IsBlank(u.Claims),
                                              Collect(
                                                  col4A_PT_Assign,
                                                  {
                                                      PatientID: p.ID,
                                                      ClinicianClaims: Lower(Trim(u.Claims)),
                                                      ClinicianName: Coalesce(u.DisplayName, u.Email, "<unknown>"),
                                                      Acuity: Coalesce(p.'Acuity Score', 0)
                                                  }
                                              )
                                          )
                                      );

                                      ForAll(
                                          If(IsBlank(p.OT_Users) || CountRows(p.OT_Users)=0, varEmptyPeople, p.OT_Users) As u,
                                          If(
                                              !IsBlank(u.Claims),
                                              Collect(
                                                  col4A_OT_Assign,
                                                  {
                                                      PatientID: p.ID,
                                                      ClinicianClaims: Lower(Trim(u.Claims)),
                                                      ClinicianName: Coalesce(u.DisplayName, u.Email, "<unknown>"),
                                                      Acuity: Coalesce(p.'Acuity Score', 0)
                                                  }
                                              )
                                          )
                                      );

                                      ForAll(
                                          If(IsBlank(p.SP_Users) || CountRows(p.SP_Users)=0, varEmptyPeople, p.SP_Users) As u,
                                          If(
                                              !IsBlank(u.Claims),
                                              Collect(
                                                  col4A_SP_Assign,
                                                  {
                                                      PatientID: p.ID,
                                                      ClinicianClaims: Lower(Trim(u.Claims)),
                                                      ClinicianName: Coalesce(u.DisplayName, u.Email, "<unknown>"),
                                                      Acuity: Coalesce(p.'Acuity Score', 0)
                                                  }
                                              )
                                          )
                                      )
                                  );

                                  // ------------------------------
                                  // 3) Pie charts: Patients per clinician
                                  // ------------------------------
                                  Clear(col4A_PatientsPerPT);
                                  ForAll(
                                      GroupBy(col4A_PT_Assign, ClinicianName, Rows) As g,
                                      Collect(
                                          col4A_PatientsPerPT,
                                          {
                                              Label: g.ClinicianName,
                                              Count: CountRows(Distinct(g.Rows, PatientID)),
                                              DisplayLabel: g.ClinicianName & " (" & CountRows(Distinct(g.Rows, PatientID)) & ")"
                                          }
                                      )
                                  );

                                  Clear(col4A_PatientsPerOT);
                                  ForAll(
                                      GroupBy(col4A_OT_Assign, ClinicianName, Rows) As g,
                                      Collect(
                                          col4A_PatientsPerOT,
                                          {
                                              Label: g.ClinicianName,
                                              Count: CountRows(Distinct(g.Rows, PatientID)),
                                              DisplayLabel: g.ClinicianName & " (" & CountRows(Distinct(g.Rows, PatientID)) & ")"
                                          }
                                      )
                                  );

                                  Clear(col4A_PatientsPerSP);
                                  ForAll(
                                      GroupBy(col4A_SP_Assign, ClinicianName, Rows) As g,
                                      Collect(
                                          col4A_PatientsPerSP,
                                          {
                                              Label: g.ClinicianName,
                                              Count: CountRows(Distinct(g.Rows, PatientID)),
                                              DisplayLabel: g.ClinicianName & " (" & CountRows(Distinct(g.Rows, PatientID)) & ")"
                                          }
                                      )
                                  );

                                  // ------------------------------
                                  // 4) Bar charts: Total acuity per clinician (PT + OT)
                                  // ------------------------------
                                  Clear(col4A_AcuityPerPT);
                                  ForAll(
                                      GroupBy(col4A_PT_Assign, ClinicianName, Rows) As g,
                                      Collect(
                                          col4A_AcuityPerPT,
                                          {
                                              Label: g.ClinicianName,
                                              TotalAcuity: Sum(g.Rows, Acuity)
                                          }
                                      )
                                  );

                                  Clear(col4A_AcuityPerOT);
                                  ForAll(
                                      GroupBy(col4A_OT_Assign, ClinicianName, Rows) As g,
                                      Collect(
                                          col4A_AcuityPerOT,
                                          {
                                              Label: g.ClinicianName,
                                              TotalAcuity: Sum(g.Rows, Acuity)
                                          }
                                      )
                                  );

                                  // --------------------------------------
                                  // Wrap up UI state
                                  // --------------------------------------
                                  Set(locIsSaving, false);
                                  Set(varPulseOn_4A, false);
                                  Reset(Timer_Pulse_4A);

                                  Notify(
                                      "Ward 4A changes saved.",
                                      NotificationType.Success
                                  )
                              )
                          );
