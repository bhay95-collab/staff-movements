                  - lblMvSum_WB:
                      Control: Label@2.5.1
                      Properties:
                        Font: =Font.'Segoe UI'
                        Color: =RGBA(26, 90, 153, 1)
                        Size: =13
                        FontWeight: =FontWeight.Bold
                        Height: =32
                        Text: |-
                          =With({s: LookUp(colWard, ID = wdMoveFromID), t: LookUp(colWard, ID = wdMoveTargetID)}, If(IsBlank(t), "Select a bed above.", IsBlank(Trim(t.Patient)), s.Patient & " moves to bed " & t.Bed & ".", s.Patient & " and " & t.Patient & " swap beds (" & s.Bed & " and " & t.Bed & ")."))
                        Width: =480
                        X: =20
                        Y: =458
                  - conMvCancel_WB:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =RGBA(14, 42, 70, 0.12)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =44
                        Width: =230
                        X: =20
                        Y: =500
                        RadiusBottomLeft: =22
                        RadiusBottomRight: =22
                        RadiusTopLeft: =22
                        RadiusTopRight: =22
                      Children:
                        - btnMvCancel_WB:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Transparent
                              BorderRadius: =22
                              Font: =Font.'Segoe UI'
                              FontColor: =RGBA(58, 80, 104, 1)
                              FontSize: =15
                              FontWeight: =FontWeight.Bold
                              Height: =44
                              Width: =230
                              Text: ="Cancel"
                              OnSelect: =Set(wdShowMove, false)
                  - conMvGo_WB:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =RGBA(26, 90, 153, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =If(IsBlank(wdMoveTargetID), RGBA(210, 218, 227, 1), RGBA(26, 90, 153, 1))
                        Height: =44
                        Width: =230
                        X: =270
                        Y: =500
                        RadiusBottomLeft: =22
                        RadiusBottomRight: =22
                        RadiusTopLeft: =22
                        RadiusTopRight: =22
                      Children:
                        - btnMvGo_WB:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Transparent
                              BorderRadius: =22
                              DisplayMode: =If(IsBlank(wdMoveTargetID), DisplayMode.Disabled, DisplayMode.Edit)
                              Font: =Font.'Segoe UI'
                              FontColor: =RGBA(255, 255, 255, 1)
                              FontSize: =15
                              FontWeight: =FontWeight.Bold
                              Height: =44
                              Width: =230
                              Text: =If(IsBlank(LookUp(colWard, ID = wdMoveTargetID).Patient), "Move here", "Swap beds")
                              OnSelect: |-
                                =With(
                                    { s: LookUp(colWard, ID = wdMoveFromID), t: LookUp(colWard, ID = wdMoveTargetID) },
                                    If(
                                        IsBlank(s) || IsBlank(t) || s.ID = t.ID,
                                        Notify("Pick a bed to move to.", NotificationType.Warning),

                                        // the two beds trade numbers (an empty bed just takes the old number)
                                        Patch(colWard, t, { Bed: s.Bed, IsDirty: true });
                                        Patch(colWard, s, { Bed: t.Bed, IsDirty: true });

                                        Set(wdSelID, s.ID);
                                        Set(wdShowMove, false);
                                        Set(wdMoveTargetID, Blank());
                                        Notify(
                                            If(
                                                IsBlank(Trim(t.Patient)),
                                                s.Patient & " moved to bed " & t.Bed & ". Press Save to keep the change.",
                                                s.Patient & " and " & t.Patient & " swapped beds. Press Save to keep the change."
                                            ),
                                            NotificationType.Success
                                        )
                                    )
                                )
