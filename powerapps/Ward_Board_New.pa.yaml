                                                  }
                                              ),

                                              // Success -> store the real SharePoint ID (new rows) and clear IsDirty
                                              Patch(colWard, w, { ID: spRow.ID, IsDirty: false })
                                          )
                                      )
                                  )
                              );

                              // --------------------------------------
                              // Post-save handling
                              // --------------------------------------
                              If(
                                  CountRows(colWardSaveErrors) > 0,

                                  // Some rows failed
                                  Set(wdIsSaving, false);
                                  Set(wdPulseOn, false);
                                  Reset(Timer_Pulse_Ward);

                                  Notify(
                                      "Some rows failed to save (" &
                                      CountRows(colWardSaveErrors) &
                                      "). Unsaved changes remain.",
                                      NotificationType.Error
                                  ),

                                  // ALL rows saved -> refresh charts
                                  Select(btnRebuildCharts_Ward);

                                  Set(wdIsSaving, false);
                                  Set(wdPulseOn, false);
                                  Reset(Timer_Pulse_Ward);

